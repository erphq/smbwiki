id: texture-application
name: Texture application
kind: skill
department: operations
summary: >-
  Approves a sample, controls mix and equipment, masks adjacent work,
  maintains pattern, blends breaks, and protects curing surfaces. Texture
  application leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - punch-list
steps:
  - name: Confirm the work basis
    note: >-
      Before texture application, read the current scope and revisions, then
      verify dry and enclosed space, accepted framing and rough work, board
      type and thickness, backing, control joints, access panels, and finish
      level.
  - name: Set the field controls
    note: >-
      Translate texture application into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During texture application, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept texture application, check the completed work against board
      orientation, fastening, joints, corners, finish level, surface
      tolerance, texture, protection, and punch closure, then close correction
      and issue the resulting record.
tension: >-
  Texture application has to remain inside its acceptance basis while
  production moves. Defects hidden during hanging or finishing reappear under
  paint and finished lighting when correction is most disruptive.
failure_modes:
  - name: Texture application starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      texture application is settled.
    signal: >-
      The texture application work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Texture application closes without evidence
    cost: >-
      A concealed condition or required result from texture application cannot
      be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Texture application is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Texture application is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Texture application starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Texture application uses field evidence, production variance, defects,
      and closeout results to improve the next estimate, work package, and
      control point.
competencies:
  - name: Gypsum board finishing sequence
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of texture application.
  - name: Evidence control
    note: >-
      Acceptance checks for texture application have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Texture application can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting texture application remain
    human.
questions:
  - >-
    Which unresolved condition can stop texture application before work
    begins?
  - >-
    Which record proves texture application was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The texture application process is the last finishing operation a drywall
    contractor performs before paint: a sample is approved, the mix and spray
    equipment are set, adjacent work is masked, the texture is applied at a
    consistent pattern across each room, breaks are blended, and curing
    surfaces are protected. It starts when the finished board has been
    accepted at the specified finish level and the sample is signed off, and
    ends with a punch list closed and the textured surfaces released to the
    painter. The finishing foreman owns it in a drywall contractor, with the
    estimator or owner approving the sample with the customer.
  why: >
    Texture is where every earlier defect becomes visible. A joint that was
    slightly proud, a fastener that was never set, or a room that was too cold
    for the mud all show up as a pattern change under finished lighting, when
    correction means refinishing whole walls in a nearly complete space.
    Overspray onto windows, cabinets, and finished floors is a cost the
    contractor carries, and a texture that drifts from the approved sample
    between rooms leads to a rejected house and a dispute over what was
    agreed.
  how: >
    The foreman confirms the work basis by reading the current scope and
    revisions and verifying that the space is dry and enclosed, framing and
    rough work are accepted, board type and thickness, backing, control
    joints, and access panels match the plan, and the finish level under the
    texture is complete. Field controls are then set: the approved sample
    posted, the mix ratio and equipment settings recorded, the sequence of
    rooms, who masks and who sprays, and the hold point after the first room.
    During application the operator records batches, rooms completed, pattern
    checks, weather and temperature, and any concealed repair, and stops when
    the surface, the mix, or the space changes the planned method. Acceptance
    checks board orientation, fastening, joints, corners, finish level,
    surface tolerance, texture match, protection, and punch closure,
    corrections are closed, and the punch list is issued.
  controls:
    - name: Sample approved before the first room
      note: A texture sample on the actual board and finish level is approved and signed by the customer or general contractor before production spraying begins.
    - name: Mix and equipment settings recorded per batch
      note: Material, water ratio, tip, and pressure are written on the daily record for every batch so a pattern change can be traced.
    - name: First-room hold point
      note: The first room sprayed is compared with the approved sample under working light and accepted before the crew moves on.
    - name: Masking checked before spraying
      note: Windows, cabinets, floors, and adjacent finishes are masked and inspected by the foreman before the gun is started in that space.
    - name: Punch list closed against the sample
      note: Every texture defect on the punch list is corrected and rechecked against the approved sample before the surface is released to paint.
