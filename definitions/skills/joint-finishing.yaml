id: joint-finishing
name: Joint finishing
kind: skill
department: operations
summary: >-
  Beds tape, builds successive coats, treats fasteners and corners, controls
  drying, sands safely, and meets the specified finish level. Joint finishing
  leaves a current work basis, a field record, and acceptance evidence that
  another operator can trace.
inputs:
  - construction-plan
outputs:
  - punch-list
steps:
  - name: Confirm the work basis
    note: >-
      Before joint finishing, read the current scope and revisions, then
      verify dry and enclosed space, accepted framing and rough work, board
      type and thickness, backing, control joints, access panels, and finish
      level.
  - name: Set the field controls
    note: >-
      Translate joint finishing into work limits, sequence, responsibilities,
      hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During joint finishing, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept joint finishing, check the completed work against board
      orientation, fastening, joints, corners, finish level, surface
      tolerance, texture, protection, and punch closure, then close correction
      and issue the resulting record.
tension: >-
  Joint finishing has to remain inside its acceptance basis while production
  moves. Defects hidden during hanging or finishing reappear under paint and
  finished lighting when correction is most disruptive.
failure_modes:
  - name: Joint finishing starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for joint
      finishing is settled.
    signal: >-
      The joint finishing work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Joint finishing closes without evidence
    cost: >-
      A concealed condition or required result from joint finishing cannot be
      verified without opening, repeat work, delay, or a disputed exception.
    signal: >-
      Joint finishing is released while its required check, location record,
      test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Joint finishing is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Joint finishing starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Joint finishing uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Gypsum board finishing sequence
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of joint finishing.
  - name: Evidence control
    note: >-
      Acceptance checks for joint finishing have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Joint finishing can use digital revisions, checklists, hold points, photo
    capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting joint finishing remain
    human.
questions:
  - Which unresolved condition can stop joint finishing before work begins?
  - >-
    Which record proves joint finishing was accepted before it was covered,
    loaded, energized, occupied, or handed over?
