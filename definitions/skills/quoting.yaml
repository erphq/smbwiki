id: quoting
name: Quoting
kind: skill
department: sales
summary: >
  Quoting converts a qualified request and site requirements into a
  priced scope with assumptions, exclusions, schedule, payment terms,
  and acceptance conditions. Specialized measurements and calculations
  can support the quote while the shared skill keeps the commercial
  promise complete.
inputs: [job-request]
outputs: [quote]
steps:
  - name: Define the requested outcome
    consumes: [job-request]
    note: >
      Site condition, existing system, access, constraints, responsibility,
      and acceptance criteria are confirmed before price is built.
  - name: Build the scope and cost
    note: >
      Labor, material, equipment, permits, outside work, disposal,
      uncertainty, and schedule exposure are included under the job owner.
  - name: Check assumptions and choices
    note: >
      Alternatives have distinct outcomes and every exclusion or
      customer-supplied dependency is visible.
  - name: Issue the quote
    produces: [quote]
    note: >
      Price, scope, tax, payment, validity, schedule basis, warranty, and
      acceptance route travel in one versioned offer.
tension: >
  Quote speed competes with scope and margin certainty. A quick offer
  keeps the customer's decision moving; missing site or supply exposure
  becomes an unpriced obligation after acceptance.
failure_modes:
  - name: Existing condition becomes an assumption
    cost: >
      The crew discovers access, capacity, code, damage, or compatibility
      that changes the required work.
    signal: >
      A site-dependent quote has no recorded survey, measurement, or
      assumption.
  - name: Exclusion is implied
    cost: >
      Customer and contractor assign the same permit, repair, disposal, or
      restoration work to each other.
    signal: >
      The quote omits a known adjacent task and never names who owns it.
  - name: Supplier promise stays unconfirmed
    cost: >
      The accepted price or schedule depends on material that changes
      cost, availability, or specification.
    signal: >
      A major quoted item has no current source, lead time, or validity
      date.
maturity:
  - level: run badly
    looks_like: >
      Price comes from a similar prior job and exclusions are explained
      after acceptance.
  - level: run well
    looks_like: >
      Site facts, scope, cost, assumptions, exclusions, schedule, terms,
      and acceptance use one controlled quote version.
  - level: run excellently
    looks_like: >
      Actual labor, material, changes, and margin correct future scopes,
      while recurring uncertainty becomes an explicit allowance or survey.
competencies:
  - name: Scope definition
    note: >
      The estimator identifies the boundary between the promised result,
      existing condition, customer responsibility, and likely change.
  - name: Cost and risk judgment
    note: >
      Known quantities and uncertain exposure require different treatment
      inside a price the business can honor.
automation:
  now: >
    Templates, price books, supplier cost lookup, tax and margin
    calculation, versioning, digital presentation, and acceptance capture.
  human: >
    Site interpretation, technical design, uncertainty pricing,
    alternatives, exclusions, and the conversation that confirms scope.
questions:
  - What site assumption can most change the current quote after acceptance?
  - Can the crew tell exactly where quoted scope ends?
article:
  what: >
    The quoting process turns a qualified job request into a written
    offer the business can honor and the customer can accept. It begins
    when a request has been confirmed as real, with the site, existing
    system, access, and acceptance criteria understood, and it ends when
    a versioned quote carrying price, scope, tax, payment terms,
    validity, schedule basis, warranty, and acceptance route is issued.
    In a plumbing contractor, a moving company, or a sign shop it is
    owned by the estimator or the owner, with the person who will run the
    job checking that the scope boundary is one they can work to.
  why: >
    The quote is the promise the whole job is measured against. A price
    built without a site survey turns access, capacity, code, or damage
    into work the crew discovers after acceptance and cannot bill. An
    exclusion left implied leaves the customer and the contractor each
    assuming the other owns the permit, the disposal, or the restoration.
    A major item quoted without a confirmed source or lead time makes the
    accepted schedule depend on supply nobody promised. The process makes
    those exposures explicit while there is still time to price or
    exclude them.
  how: >
    The estimator defines the requested outcome from the job request,
    confirming site condition, existing system, access, constraints,
    responsibility, and acceptance criteria before any price is built.
    Scope and cost are then assembled under the job owner: labor,
    material, equipment, permits, outside work, disposal, uncertainty,
    and schedule exposure, with supplier cost and lead time checked for
    major items. Assumptions and choices are reviewed so alternatives
    have distinct outcomes and every exclusion and customer-supplied
    dependency is written down. The quote is issued as one versioned
    offer carrying price, scope, tax, payment terms, validity, schedule
    basis, warranty, and acceptance route, and each later revision
    replaces the prior version on the record.
  controls:
    - name: Site survey or recorded assumption
      note: A site-dependent quote carries the measurement, survey, or written assumption it rests on, so the crew knows what was and was not seen.
    - name: Exclusions and customer duties listed by name
      note: Every adjacent task the quote does not cover is named with its owner, so no permit, repair, or disposal is assigned to both parties.
    - name: Supplier cost and lead time confirmed for major items
      note: A quoted item that drives price or schedule has a current source, cost, and lead time recorded before the quote goes out.
    - name: One versioned quote
      note: Revisions supersede the prior version on the same record so the accepted price, scope, and terms can be shown without a search.
    - name: Estimate reviewed against actuals
      note: Closed jobs feed labor, material, and change actuals back to the estimator so recurring uncertainty becomes an allowance or a survey.
