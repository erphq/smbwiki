id: patient-intake
name: Patient intake
kind: skill
department: operations
summary: >
  Patient intake prepares a scheduled person and their record for care.
  Identity, contact details, current concerns, history, medications,
  consent, and payer information are confirmed before the clinical team
  relies on the chart.
inputs: [appointment-record, patient-registration]
outputs: [patient-chart]
steps:
  - name: Match person to appointment
    consumes: [appointment-record, patient-registration]
    note: >
      Identity and visit purpose are confirmed before information is
      added to a clinical record.
  - name: Update current facts
    note: >
      Changes in symptoms, history, medications, allergies, contact, and
      payer details are collected for this visit.
  - name: Complete required consent
    note: >
      Missing signatures and acknowledgements are resolved while the
      patient can ask what they cover.
  - name: Prepare the chart
    produces: [patient-chart]
    note: >
      The clinical team sees the current concern and any safety or
      communication issue before beginning care.
tension: >
  Room and chair utilization compete with record reliability. Moving a
  patient through intake quickly protects the schedule; stale identity,
  history, or consent creates risk that follows the entire visit.
failure_modes:
  - name: Wrong-record update
    cost: >
      One patient's information or treatment is attached to another
      person's chart.
    signal: >
      Staff search by name alone or open multiple similar records during
      intake.
  - name: History carried forward without confirmation
    cost: >
      The clinician acts on medications, allergies, conditions, or
      contact details that have changed.
    signal: >
      Required history fields show an old review date for today's visit.
  - name: Clinical concern buried
    cost: >
      The clinician enters the room without the reason for the visit or a
      newly reported safety issue.
    signal: >
      Free-text intake notes exist while the visit summary remains blank.
maturity:
  - level: run badly
    looks_like: >
      Forms are collected as paperwork and the clinical team discovers
      missing or conflicting information in the room.
  - level: run well
    looks_like: >
      Identity, current facts, consent, and visit purpose are confirmed
      against one chart before care begins.
  - level: run excellently
    looks_like: >
      Intake exceptions reach the right clinical or billing owner early,
      and changes remain attributable to the person who confirmed them.
competencies:
  - name: Identity discipline
    note: >
      Similar names, family contact details, and returning records require
      a consistent match procedure.
  - name: Sensitive interviewing
    note: >
      Patients disclose useful history when questions are clear, private,
      and connected to the care being prepared.
automation:
  now: >
    Digital forms, demographic comparison, eligibility prompts, consent
    capture, required-field checks, and chart preparation.
  human: >
    Resolving identity conflicts, recognizing an urgent clinical concern,
    supporting accessibility, and answering consent questions.
questions:
  - Which facts in the chart were reconfirmed for this visit?
  - What intake exception can still delay or change today's care?
article:
  what: >
    The patient intake process gets a scheduled person and their chart
    ready for the clinician, so that identity, contact details, the
    reason for the visit, history, medications, allergies, consent, and
    payer information are all confirmed for today before care begins. It
    starts when the person arrives or checks in ahead of the appointment
    and ends when the clinical team opens a chart they can rely on, with
    the current concern and any safety issue at the top. The front-desk
    or intake coordinator owns it in a dental clinic, a primary care
    practice, or a physical therapy clinic; in a veterinary clinic it
    belongs to the receptionist working with the animal's owner.
  why: >
    It protects the patient from being treated on someone else's
    information or on their own outdated information. Two records with
    similar names opened side by side is how one person's medication
    list ends up on another's chart. A history carried forward from the
    last visit without asking means the clinician acts on an allergy or
    a drug list that changed months ago. Consent signed as paperwork
    without a chance to ask what it covers is consent the practice
    cannot defend. And a new concern written in a free-text note while
    the visit summary stays blank sends the clinician into the room
    without the reason the patient came.
  how: >
    The intake coordinator matches the person to the appointment record
    and the patient registration using more than a name, and confirms
    the visit purpose, before anything is added to the chart. Current
    facts are then updated for this visit: changes in symptoms, history,
    medications, allergies, contact details, and payer information are
    asked about and entered with the date they were confirmed. Required
    consents and acknowledgements that are missing or expired are
    completed while the patient can ask what they cover. Finally the
    chart is prepared: the current concern, any newly reported safety or
    communication issue, and open intake exceptions are placed where the
    clinician sees them first, and billing exceptions are routed to
    their owner.
  controls:
    - name: Two-identifier match
      note: The person is matched to the appointment and registration by at least two identifiers, and staff do not work from a name search with multiple similar results.
    - name: Dated reconfirmation of history
      note: Medications, allergies, and conditions carry the date they were last confirmed, and today's visit updates that date or records the change.
    - name: Consent completed with explanation
      note: Missing or expired consents are listed at check-in and completed with the patient present and able to ask what each one covers.
    - name: Visit reason visible on the chart
      note: The reason for the visit and any new safety concern are entered in the summary field, and a chart with only free-text notes is flagged.
    - name: Intake exceptions routed
      note: Identity conflicts, urgent clinical concerns, and eligibility problems go to a named clinical or billing owner before the patient is roomed.
