article:
  operating_model: >
    A driveway paving contractor's week is set by weather, plant
    schedules, and truck timing. The estimator quotes from a site visit
    and measurement, the project manager orders asphalt from the plant
    and aggregate from the supplier for a specific day, and the crew of
    trade foreperson and installers removes failed pavement, prepares
    subgrade, places and compacts base, lays the mat while it is hot,
    rolls it to density, and seals or stripes on a later visit. Test
    reports and job photos record what the finished surface hides. The
    load-bearing skills are paving subgrade preparation, asphalt
    placement, and pavement compaction, because a weak base or a cold
    mat fails within a season and comes back as a callback. The tension
    is between production and conditions: a truck of hot mix has a
    short life, rain or cold shuts the day down, and the crew is paid
    whether the plant delivers on time or not.
  starting: >
    A driveway paving contractor starts with a paver, rollers, a skid
    steer or small excavator, dump trucks or a hauling arrangement, and
    an account with an asphalt plant. Most states license paving under
    a general or specialty contractor license with a bond, some cities
    require a separate right-of-way permit for work at the street edge,
    and driving trucks above the weight threshold brings commercial
    driver licensing and vehicle registration. The universal paperwork
    is the business registration, employer registration once the crew
    is hired, workers' compensation, general liability, commercial auto
    insurance, and sales tax handling for materials that varies by
    state. The minimum team is an owner-operator who estimates and runs
    the crew, an office manager for scheduling and invoicing, and a
    crew of a trade foreperson and installers large enough to place a
    load before it cools; the project manager and site superintendent
    roles are held by the owner until there are concurrent jobs. The
    first records are the job request, the quote, the site plan with
    measurements, the work order, the purchase order to the plant, the
    test report for density and thickness, job photos, and the
    customer invoice. Lead intake, quoting, paving subgrade
    preparation, aggregate base placement, asphalt placement, pavement
    compaction, and invoicing must work on the first job.
  economics: >
    Revenue is quoted projects made of installed paving quantity plus
    base repair, mobilization, sealcoating, striping, drainage
    correction, and maintenance work. Pricing is per square foot or per
    ton with a mobilization charge, and material is bought by the ton
    from the plant on the day of the job, so the estimate has to
    predict tonnage and truck cycles closely. Gross margin is material
    and crew time against the quoted price, and the largest margin
    risks are thin lifts that need rework, a wasted load when the crew
    cannot place it, and a day lost to weather with the crew on
    payroll. The metrics that decide profit are project gross margin,
    rework rate, on-time completion, schedule variance, and quote win
    rate, because callbacks on a small driveway job cost more than the
    job earned and a schedule that slips into the cold season loses
    weeks of production. Sealcoating and maintenance visits are the
    recurring, higher-margin work that fills the shoulder seasons. The
    business is capital-intensive in equipment that sits idle in
    winter, and margins are judged after equipment financing and
    seasonal cash flow.
