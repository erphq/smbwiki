catalog_group: construction-property
extends: project-services-base
revenue_model:
  - id: tile-material-preparation-and-pattern
    note: installed tile area plus substrate correction, waterproofing, setting material, pattern complexity, trim, grout, seal, and repair
summary: >-
  A tile contractor prepares substrates, waterproofs wet areas, lays out
  patterns, sets tile, grouts joints, installs movement sealant, and protects
  the finish. The visible grid depends on substrate flatness, drainage, room
  geometry, tile variation, transitions, fixtures, and approved focal lines.


  Bond and water control are largely concealed after setting. Mixing, open
  time, coverage checks, membrane transitions, movement joints, and flood
  tests carry more risk than the final wipe-down suggests. The crew uses
  samples and dry layout to settle appearance before committing expensive
  material to mortar.
