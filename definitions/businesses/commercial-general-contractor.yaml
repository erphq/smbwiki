id: commercial-general-contractor
name: Commercial General Contractor
codes:
  naics: '236220'
catalog_group: construction-property
extends: project-services-base
summary: >-
  A commercial general contractor holds the contract that joins an owner's
  design, permits, subcontractors, schedule, cost, safety, quality, and
  turnover. Work is bought in trade packages, then managed through RFIs,
  submittals, coordination, inspections, changes, pay applications, and daily
  site decisions.


  The contractor rarely performs every trade, but remains responsible for how
  the pieces meet. Missing scope and late information become field delay or
  rework unless contract boundaries and technical decisions are controlled.
  Closeout is a second production sequence involving tests, training, records,
  releases, punch work, and owner acceptance.
skills:
  - ref: project-delivery
    roles: [project-manager, site-superintendent, trade-foreperson]
    documents: [quote, work-order, job-photos]
    metrics: [project-gross-margin, schedule-variance]
    software: [project-operations]
  - ref: bid-package-management
    roles:
      - project-manager
      - trade-foreperson
      - installer
    documents:
      - construction-plan
      - material-takeoff
      - closeout-package
    metrics:
