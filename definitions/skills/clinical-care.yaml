id: clinical-care
name: Clinical care
kind: skill
department: operations
summary: >
  Clinical care assesses the patient's current condition, reaches and
  explains clinical decisions, delivers appropriate treatment, and
  records what occurred. The signed note supports continuity, follow-up,
  and billing after the patient leaves.
inputs: [appointment-record, patient-chart]
outputs: [clinical-note, treatment-plan]
steps:
  - name: Establish the current concern
    role: clinician
    consumes: [appointment-record, patient-chart]
    note: >
      The visit begins with the patient's report and relevant changes
      since the prior record.
  - name: Examine and assess
    role: clinician
    note: >
      Findings are recorded with enough specificity to support the
      decision and later comparison.
  - name: Decide and deliver care
    role: clinician
    note: >
      Options, risks, expected result, and follow-up are discussed at the
      point where the plan can still change.
  - name: Sign the clinical record
    role: clinician
    produces: [clinical-note, treatment-plan]
    note: >
      Care delivered and care proposed remain distinct in the record.
tension: >
  Patient throughput competes with attention and record completeness.
  Schedule pressure is real; a rushed history, examination, explanation,
  or note moves clinical uncertainty into later care.
failure_modes:
  - name: Carried-forward finding
    cost: >
      The record presents an old observation as current and distorts the
      next clinical decision.
    signal: >
      Repeated notes contain identical findings despite a changed visit
      purpose.
  - name: Delivered care and planned care mixed
    cost: >
      The patient, billing team, and next clinician cannot tell what
      happened and what remains proposed.
    signal: >
      Procedures appear in the plan and note without completion status.
  - name: Note closed after memory fades
    cost: >
      Specific findings, materials, instructions, or exceptions are lost
      and later reconstructed from incomplete cues.
    signal: >
      Unsigned notes remain open after the clinical day.
maturity:
  - level: run badly
    looks_like: >
      The schedule drives the visit, documentation is finished later, and
      the patient leaves unsure about the next decision.
  - level: run well
    looks_like: >
      Current concern, findings, delivered care, proposed care, and
      follow-up are complete and signed together.
  - level: run excellently
    looks_like: >
      The record supports another clinician's continuation, recurring
      documentation defects are corrected, and patient questions shape
      the final plan.
competencies:
  - name: Clinical reasoning
    note: >
      Findings, history, risk, and patient preference have to become a
      defensible decision under uncertainty.
  - name: Patient explanation
    note: >
      A plan is usable only when the patient understands the condition,
      choices, expected course, and next action.
automation:
  now: >
    History summarization, documentation templates, medication and
    interaction checks, coding prompts, follow-up tasks, and unsigned-note
    queues.
  human: >
    Examination, diagnosis, consent, treatment judgment, physical care,
    and responsibility for the signed clinical decision.
questions:
  - Could another clinician continue care from this record without guessing?
  - Which unsigned note is currently delaying follow-up or billing?
article:
  what: >
    The clinical care process is the visit itself: the clinician
    establishes the current concern, examines and assesses, decides and
    delivers care with the patient's understanding, and signs a note
    that separates what was done from what is proposed. It starts when
    the patient is roomed with the appointment record and chart open and
    ends when the clinical note and treatment plan are signed. In a
    primary care practice, a dental clinic, or a veterinary clinic the
    clinician owns it personally; no one else can sign it.
  why: >
    It protects the patient's next decision and everything downstream of
    the record. An old finding carried forward as current distorts the
    next clinician's judgment. A note that blurs delivered and planned
    procedures leaves the patient, the biller, and the next provider
    unable to say what happened. A note closed after the day ends is
    reconstructed from cues, and the specific instruction or exception
    that mattered is the part that goes missing. Continuity, follow-up,
    and the claim all depend on the same signed record.
  how: >
    The clinician opens the visit with the patient's report and the
    relevant changes since the prior record in the patient chart, framed
    by the appointment record's stated reason. Examination follows, and
    findings are recorded with enough specificity to support the
    decision and to be compared at the next visit. Options, risks,
    expected result, and follow-up are discussed with the patient at the
    point where the plan can still change, and care is delivered. The
    clinician then signs the clinical note and the treatment plan,
    keeping care delivered and care proposed distinct so billing,
    follow-up, and another clinician can each read it without guessing.
  controls:
    - name: Current concern documented in the patient's words
      note: >
        The reason for today's visit and the changes since the last
        record are entered before examination findings are written.
    - name: Findings written fresh each visit
      note: >
        Carried-forward text is reviewed against today's examination
        and edited, so identical findings across changed visit
        purposes are caught.
    - name: Delivered and proposed care separated
      note: >
        Each procedure in the record carries a completion status,
        and proposed items sit in the treatment plan instead of the
        note.
    - name: Note signed on the clinical day
      note: >
        Unsigned notes are listed at the close of the day and
        cleared before the clinician leaves, so billing and follow-
        up never wait on memory.
