id: lead-intake
name: Lead intake
kind: skill
department: sales
summary: >
  Lead intake receives a call, message, referral, or form request and
  creates a job request that dispatch, quoting, or another owner can act
  on. Customer, site, problem, urgency, service fit, contact route, and
  access constraints are captured while the requester is available.
inputs: []
outputs: [job-request]
steps:
  - name: Establish contact
    role: office-manager
    note: >
      Name, callback route, site, and permission to leave messages are
      secured before a long description can be interrupted.
  - name: Capture the reported condition
    role: office-manager
    note: >
      The customer's words, affected system, onset, current operating
      state, prior work, and any immediate hazard remain distinguishable.
  - name: Decide route and priority
    role: office-manager
    note: >
      Service area, work type, urgency, licensing, account or agreement
      status, and need for a quote determine the next owner.
  - name: Create the job request
    role: office-manager
    produces: [job-request]
    note: >
      Scope known so far, contact, location, access, priority, and promises
      are written for the person who will act.
  - name: Confirm the next step
    role: office-manager
    note: >
      The customer receives the reference, expected contact or visit, and
      instructions for any condition that should trigger escalation.
tension: >
  Response speed competes with useful qualification. A fast answer keeps
  the requester engaged; a thin job request pushes missing site, hazard,
  scope, or contact detail into dispatch and the field.
failure_modes:
  - name: Hazard enters the normal queue
    cost: >
      A condition involving gas, water, electricity, heat, pressure, or
      property damage waits under a routine response promise.
    signal: >
      Urgent keywords appear in the description while priority remains
      default.
  - name: Promise exceeds known capacity
    cost: >
      The customer plans around a visit or response the operating board
      cannot support.
    signal: >
      Intake gives an arrival commitment before dispatch confirms service
      area, skill, and schedule.
  - name: Duplicate request fragments the history
    cost: >
      Separate staff respond to the same issue and site information or
      promises diverge.
    signal: >
      Matching address and concern appear under more than one open request.
maturity:
  - level: run badly
    looks_like: >
      Messages, forms, and calls live in separate inboxes and technicians
      call customers to rediscover the problem.
  - level: run well
    looks_like: >
      Every contact becomes one routed request with site, concern,
      priority, access, contact, and confirmed next step.
  - level: run excellently
    looks_like: >
      Intake defects are traced from dispatch and field outcomes, routing
      rules are explicit, and missed contacts remain in an owned queue.
competencies:
  - name: Remote triage
    note: >
      The operator recognizes urgency and service fit from an incomplete
      description without attempting a field diagnosis.
  - name: Structured listening
    note: >
      Customer language, site facts, hazards, and promises have to reach
      the job request without losing their source.
automation:
  now: >
    Omnichannel capture, duplicate detection, address and service-area
    checks, account lookup, routing prompts, confirmations, and follow-up
    queues.
  human: >
    Hazard recognition, distressed callers, ambiguous scope, service-fit
    judgment, and deciding what promise is safe to make.
questions:
  - Which open contact has no owner or confirmed next step?
  - Can dispatch act from the job request without calling intake for missing facts?
article:
  what: >
    The lead intake process is the first conversation a service
    business has with someone who needs work done, turned into a job
    request another owner can act on. It starts with a call, message,
    form, or referral and ends when the requester has a reference and a
    confirmed next step, and dispatch, the estimator, or the account
    owner has a request with customer, site, problem, urgency, service
    fit, contact route, and access constraints filled in. A plumbing
    contractor, a locksmith, a law firm, and a moving company all run
    it, and the office manager or whoever answers the phone owns it.
  why: >
    It protects the promise the business makes in the first minute. A
    hazard that enters the normal queue, a visit promised before
    dispatch has checked capacity, or a second request opened for the
    same address all start from a thin intake. When it is missing,
    technicians call customers back to rediscover the problem, messages
    sit in separate inboxes with no owner, and the customer plans
    around a response the schedule cannot deliver.
  how: >
    The office manager establishes contact first, securing name,
    callback route, site, and permission to leave messages before a
    long description can be interrupted. The reported condition is
    captured in the customer's words, with affected system, onset,
    current operating state, prior work, and any immediate hazard kept
    distinct. The route and priority are then decided from service
    area, work type, urgency, licensing, account or agreement status,
    and whether a quote is needed. The job request is created with
    scope known so far, contact, location, access, priority, and any
    promises written for the person who will act. The requester
    receives the reference, the expected contact or visit, and
    instructions for any condition that should trigger escalation.
  controls:
    - name: Hazard screen on every contact
      note: Gas, water, electrical, heat, pressure, and property damage keywords raise the priority and route the request immediately, never to the default queue.
    - name: Duplicate check by address and concern
      note: Before a new request is created, open requests at the same site with a matching concern are found and merged.
    - name: Promise limited to confirmed capacity
      note: Intake gives an arrival or response commitment only after dispatch or the schedule confirms area, skill, and availability.
    - name: Contact route recorded before description
      note: Name, callback number, and message permission are captured first so an interrupted call can still be returned.
    - name: Missed-contact queue owned
      note: Unanswered calls, forms, and messages sit in a queue with an owner and a follow-up time until the requester is reached.
