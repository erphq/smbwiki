id: array-installation
name: Photovoltaic array installation
kind: skill
department: operations
summary: >-
  Lays out attachments, maintains flashing, installs rail or mounting, manages
  wiring, sets modules, protects roof, and records concealed work.
  Photovoltaic array installation leaves a current work basis, a field record,
  and acceptance evidence that another operator can trace.
inputs:
  - site-plan
outputs:
  - commissioning-record
steps:
  - name: Confirm the work basis
    note: >-
      Before photovoltaic array installation, read the current scope and
      revisions, then verify verified roof or ground condition, energy use and
      shading data, approved electrical design, permit, utility route,
      equipment, and fall protection.
  - name: Set the field controls
    note: >-
      Translate photovoltaic array installation into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During photovoltaic array installation, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept photovoltaic array installation, check the completed work
      against structural and electrical compliance, flashed attachments,
      labeled circuits, tested shutdown, documented production, inspection,
      and utility permission, then close correction and issue the resulting
      record.
tension: >-
  Photovoltaic array installation has to remain inside its acceptance basis
  while production moves. Design, roof, electrical, permit, and utility
  decisions converge at installation, and one mismatch can delay permission to
  operate.
failure_modes:
  - name: Photovoltaic array installation starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      photovoltaic array installation is settled.
    signal: >-
      The photovoltaic array installation work package still has an open
      drawing, access, material, predecessor, or approval dependency when
      labor is assigned.
  - name: Photovoltaic array installation closes without evidence
    cost: >-
      A concealed condition or required result from photovoltaic array
      installation cannot be verified without opening, repeat work, delay, or
      a disputed exception.
    signal: >-
      Photovoltaic array installation is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Photovoltaic array installation is driven by crew availability and
      visible completion; readiness, hold points, and acceptance evidence are
      resolved afterward.
  - level: run well
    looks_like: >-
      Photovoltaic array installation starts from a checked basis, follows a
      named sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Photovoltaic array installation uses field evidence, production
      variance, defects, and closeout results to improve the next estimate,
      work package, and control point.
competencies:
  - name: Photovoltaic design and commissioning
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of photovoltaic array installation.
  - name: Evidence control
    note: >-
      Acceptance checks for photovoltaic array installation have to be
      captured while the relevant condition can still be observed and
      corrected.
automation:
  now: >-
    Photovoltaic array installation can use digital revisions, checklists,
    hold points, photo capture, test fields, correction assignment, and
    closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting photovoltaic array
    installation remain human.
questions:
  - >-
    Which unresolved condition can stop photovoltaic array installation before
    work begins?
  - >-
    Which record proves photovoltaic array installation was accepted before it
    was covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The photovoltaic array installation process is how a solar
    installation contractor puts a designed system onto a roof or ground
    mount and brings it to the point where the utility can grant
    permission to operate. It starts when the site plan, electrical
    design, permit, and equipment are in hand and the roof or ground
    condition has been verified, and it ends when the array is mounted,
    wired, labeled, tested, inspected, and recorded on a commissioning
    record. The installation crew lead owns the field work; the licensed
    electrician owns the electrical acceptance.
  why: >
    The array sits where four decisions meet: the structural attachment,
    the roof's weather seal, the electrical design, and the utility's
    requirements. A missed flashing leaks for years under modules that
    hide it. An attachment that misses the rafter fails in wind. Wiring
    routed against the design fails inspection and delays permission to
    operate, which delays the customer's savings and the contractor's
    final payment. Without the process, concealed work is closed without
    a record, and the next person on the roof, whether an inspector or a
    repair crew, cannot tell what was done.
  how: >
    The crew lead reads the current site plan and revisions and confirms
    the roof or ground condition, the energy use and shading data, the
    approved electrical design, the permit, the utility route, that
    equipment is on site, and that fall protection is in place. The work
    is then broken into field controls: attachment layout, flashing
    method, rail or mounting sequence, wire management, module setting
    order, roof protection, and hold points before anything is
    concealed. During installation the crew records attachment
    locations, torque, flashing, conduit routes, and string layout, and
    stops when a rafter, roof condition, or shading differs from the
    plan. At acceptance the licensed electrician and crew lead check
    structural and electrical compliance, flashed attachments, labeled
    circuits, rapid shutdown, and measured production, pass the
    inspection, obtain utility permission, and close the commissioning
    record.
  controls:
    - name: Attachment layout verified to structure
      note: Each attachment location is confirmed on a rafter or the designed structural member before it is drilled.
    - name: Flashing photographed before rails
      note: Every roof penetration is flashed and photographed before rails or modules cover it.
    - name: Wiring checked against the electrical design
      note: String layout, conductor sizing, grounding, and labeling are compared to the approved design before energizing.
    - name: Rapid shutdown and production tested
      note: Shutdown function and measured output are tested and recorded before inspection is requested.
    - name: Commissioning record closed with utility permission
      note: Inspection result, permission to operate, and as-built changes are filed before the job is closed.
