id: boundary-layout-verification
name: Boundary layout verification
kind: skill
department: operations
summary: >-
  Separates owner direction from survey evidence, establishes approved
  offsets, checks corners and easements, and marks a buildable fence line.
  Boundary layout verification leaves a current work basis, a field record,
  and acceptance evidence that another operator can trace.
inputs:
  - site-plan
outputs:
  - quality-report
steps:
  - name: Confirm the work basis
    note: >-
      Before boundary layout verification, read the current scope and
      revisions, then verify verified boundary or approved alignment, located
      utilities, selected system, known grade, gate geometry, material, and
      access.
  - name: Set the field controls
    note: >-
      Translate boundary layout verification into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During boundary layout verification, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept boundary layout verification, check the completed work against
      line, grade, post embedment, spacing, fastening, gate operation, finish
      condition, security, and restored site, then close correction and issue
      the resulting record.
tension: >-
  Boundary layout verification has to remain inside its acceptance basis while
  production moves. A fence can be straight and complete while occupying the
  wrong line or leaving gates and grades unusable.
failure_modes:
  - name: Boundary layout verification starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      boundary layout verification is settled.
    signal: >-
      The boundary layout verification work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Boundary layout verification closes without evidence
    cost: >-
      A concealed condition or required result from boundary layout
      verification cannot be verified without opening, repeat work, delay, or
      a disputed exception.
    signal: >-
      Boundary layout verification is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Boundary layout verification is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Boundary layout verification starts from a checked basis, follows a
      named sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Boundary layout verification uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Fence layout and field fit
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of boundary layout verification.
  - name: Evidence control
    note: >-
      Acceptance checks for boundary layout verification have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Boundary layout verification can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting boundary layout verification
    remain human.
questions:
  - >-
    Which unresolved condition can stop boundary layout verification before
    work begins?
  - >-
    Which record proves boundary layout verification was accepted before it
    was covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The boundary layout verification process is how a fence contractor
    confirms where a fence may be built before a post goes in. It starts
    when the owner has said where they want the fence and the site plan
    or survey shows where the property line and easements are, and it
    ends when a buildable line is marked on the ground at an approved
    offset, corners and easements are checked, and a quality report
    records what was marked and on what basis. The crew lead owns it,
    with the estimator responsible for the owner conversation.
  why: >
    A fence can be straight, plumb, and finished and still be on the
    neighbor's land. Owner direction and survey evidence are two
    different things, and a crew that builds to the owner's pointing
    finger with no offset, no located utilities, and no easement check
    may have to take the fence down at the contractor's cost, or leave
    the owner in a dispute. Without the process, the line is set by eye,
    utility strikes and blocked gates surface during the dig, and there
    is no record of who approved the location.
  how: >
    The crew lead reads the site plan and any revisions and confirms
    that the boundary is verified or the alignment has been approved,
    that utilities are located, that the system, grade, gate geometry,
    and material are known, and that access is workable. Field controls
    follow: the offset from the line, the corner and easement points to
    check, the string line and stake method, the utility clearance, and
    the hold point for the owner's approval of the marked line. During
    layout the crew records found corners, offsets used, utility marks,
    and any point where the owner's direction and the survey disagree,
    and stops until the disagreement is resolved. Before the crew digs,
    the marked line is checked for line, grade, post spacing, gate
    geometry, and clearance, corrections are made, and the quality
    report records the line, the approvals, and the evidence.
  controls:
    - name: Survey or approved alignment on file
      note: Layout does not start without a survey, a plat, or a written owner approval of the alignment on file.
    - name: Utility locate confirmed before staking
      note: The locate ticket and marks are confirmed on site and recorded before any stake or post hole.
    - name: Offset and corners checked
      note: The offset from the line is measured at each corner and recorded, and easements are confirmed clear.
    - name: Owner sign-off on the marked line
      note: The owner walks and approves the staked line before digging, and the approval is recorded on the quality report.
    - name: Quality report issued before installation
      note: Line, offsets, corners, utilities, and approvals are documented and filed before the fence crew mobilizes.
