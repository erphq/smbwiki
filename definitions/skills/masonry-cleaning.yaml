id: masonry-cleaning
name: Masonry cleaning
kind: skill
department: operations
summary: >-
  Selects test area, method, dilution, dwell time, rinsing, protection, and
  sequence that remove residue without damaging units or joints. Masonry
  cleaning leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - quality-report
steps:
  - name: Confirm the work basis
    note: >-
      Before masonry cleaning, read the current scope and revisions, then
      verify approved sample, sound support, control lines, unit and mortar
      supply, weather protection, embeds, and interface details.
  - name: Set the field controls
    note: >-
      Translate masonry cleaning into work limits, sequence, responsibilities,
      hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During masonry cleaning, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept masonry cleaning, check the completed work against line,
      level, plumb, bond, joint profile, reinforcement, flashing, drainage,
      cleaning, and specified appearance, then close correction and issue the
      resulting record.
tension: >-
  Masonry cleaning has to remain inside its acceptance basis while production
  moves. Masonry locks layout, structure, weather control, and visible finish
  into the same installed work.
failure_modes:
  - name: Masonry cleaning starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      masonry cleaning is settled.
    signal: >-
      The masonry cleaning work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Masonry cleaning closes without evidence
    cost: >-
      A concealed condition or required result from masonry cleaning cannot be
      verified without opening, repeat work, delay, or a disputed exception.
    signal: >-
      Masonry cleaning is released while its required check, location record,
      test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Masonry cleaning is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Masonry cleaning starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Masonry cleaning uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Masonry material and bond control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of masonry cleaning.
  - name: Evidence control
    note: >-
      Acceptance checks for masonry cleaning have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Masonry cleaning can use digital revisions, checklists, hold points, photo
    capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting masonry cleaning remain
    human.
questions:
  - Which unresolved condition can stop masonry cleaning before work begins?
  - >-
    Which record proves masonry cleaning was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The masonry cleaning process is how a masonry contractor removes
    mortar smears, efflorescence, and construction residue from
    finished brick, block, or stone without etching the units, burning
    out the joints, or staining the wall. It selects a test area, a
    method, a dilution, a dwell time, rinsing, protection for adjacent
    surfaces, and a sequence, proves them on the test panel, and then
    applies them across the wall. It begins from the construction plan
    and the approved sample and ends with a quality report on the
    accepted appearance. The masonry foreman owns it.
  why: >
    It protects the visible finish that the whole masonry job will be
    judged by. A cleaner that is too strong, left too long, or applied
    to a dry wall bleaches units, dissolves joint faces, and leaves
    streaks that cannot be undone, and overspray damages glass, metal,
    and landscaping the contractor then pays to replace. Cleaning
    before the mortar has cured drives residue into the pores, and
    skipping the test area means the first mistake is on the whole
    elevation.
  how: >
    The foreman reads the current scope and revisions, then verifies
    the approved sample, sound support, control lines, unit and mortar
    supply, weather protection, embeds, and interface details so the
    wall is ready to be cleaned. Cleaning is set up as field controls:
    the test area location, the product and dilution, dwell time,
    pre-wet and rinse steps, protection for adjacent materials, the
    sequence down the wall, hold points after the test panel and before
    each elevation, and the records to keep. During cleaning the crew
    records quantities, observations, decisions, and any detail that
    will be hidden, and stops when weather, wall condition, or results
    change the planned method. At acceptance the foreman checks line,
    level, plumb, bond, joint profile, reinforcement, flashing,
    drainage, cleaning, and the specified appearance against the
    sample, closes corrections, and issues the quality report.
  controls:
    - name: Test panel approved before production cleaning
      note: The method, dilution, and dwell are proven on a test area and accepted by the owner's representative before the wall is cleaned.
    - name: Adjacent surface protection checked
      note: Glass, metal, sealants, and landscaping are covered and inspected before any cleaner is applied, with the protection recorded.
    - name: Mortar cure confirmed
      note: Cleaning begins only after the mortar has cured for the period the plan and product require, and the date is recorded.
    - name: Product and dilution logged per elevation
      note: The cleaner, dilution, dwell, weather, and crew are logged for each elevation so results can be traced and repeated.
    - name: Appearance compared to the sample
      note: The cleaned wall is inspected next to the approved sample under natural light before the quality report is issued.
