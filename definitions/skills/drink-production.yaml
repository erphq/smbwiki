id: drink-production
name: Drink production
kind: skill
department: operations
summary: >
  Drink production turns an order ticket and recipe into a finished
  beverage at the correct handoff. The bar sequences extraction,
  heating or chilling, mixing, finishing, and labeling while shared
  equipment and perishable ingredients keep moving.
inputs: [order-ticket, recipe-card]
outputs: []
steps:
  - name: Read and mark the build
    role: barista
    consumes: [order-ticket, recipe-card]
    note: >
      Size, base, temperature, milk, modifiers, and handoff identity are
      visible before the first irreversible step.
  - name: Sequence shared work
    role: barista
    note: >
      Grinder, espresso machine, blender, steam, cold bar, and finishing
      tasks are ordered while preserving progress on the waiting tickets.
  - name: Build to recipe
    role: barista
    note: >
      Dose, yield, ingredient amount, temperature, and presentation stay
      consistent across bar positions.
  - name: Check and hand off
    role: barista
    note: >
      Ticket, cup mark, beverage, and customer or pickup identity agree
      before the drink leaves the bar.
tension: >
  Ticket speed competes with drink integrity. Parallel work reduces
  waiting; poor sequencing lets shots die, milk separate, cold drinks
  melt, or modifiers cross between tickets.
failure_modes:
  - name: Ticket identity breaks
    cost: >
      A correct drink reaches the wrong customer or a remake begins while
      the original sits at handoff.
    signal: >
      Cups move between positions without a persistent name or order
      reference.
  - name: Shared equipment becomes the hidden queue
    cost: >
      Bar staff appear busy across tickets while all completions wait on
      one machine or preparation step.
    signal: >
      Work in progress accumulates in front of the same equipment.
  - name: Recipe correction happens at handoff
    cost: >
      Product, time, and customer confidence are lost after the entire
      build is complete.
    signal: >
      Size, milk, temperature, or modifier errors dominate remakes.
maturity:
  - level: run badly
    looks_like: >
      Each barista works a whole ticket from memory and cups change hands
      without clear ownership.
  - level: run well
    looks_like: >
      Tickets stay identifiable, recipes and station setup are stable,
      and shared equipment is sequenced deliberately.
  - level: run excellently
    looks_like: >
      Remake reasons change training and layout, equipment drift surfaces
      early, and the bar can absorb mixed channels without losing handoff.
competencies:
  - name: Parallel sequencing
    note: >
      The barista times work with different extraction, heating, chilling,
      and finishing windows across several active tickets.
  - name: Sensory calibration
    note: >
      Appearance, sound, texture, temperature, and taste reveal equipment
      or ingredient drift before a customer reports it.
automation:
  now: >
    Ticket routing, recipe display, timers, equipment settings, cup
    labels, order status, and remake categorization.
  human: >
    Sensory judgment, physical coordination, queue recovery, equipment
    adjustment, and customer handoff.
questions:
  - Where does work in progress accumulate during the busiest service period?
  - Which remake reason should change the station or ticket setup?
article:
  what: >
    The drink production process is what happens between an order ticket
    reaching the bar and a finished beverage leaving it under the right
    name: the barista reads the ticket against the recipe card, marks the
    cup, sequences the grinder, espresso machine, steam wand, blender, and
    cold bar across the tickets already in progress, builds to the recipe,
    and checks the drink against the ticket at handoff. A coffee shop runs
    it all day at every bar position, and the bar lead or shift supervisor
    owns the station setup and the sequence.
  why: >
    Every remake costs product, a minute of bar time, and the customer's
    confidence in the next order. When cups are not marked before the first
    irreversible step, the wrong milk or size is discovered at the counter
    after the whole build. When shared equipment is not sequenced, shots die
    in the portafilter while milk steams, and the queue in front of the
    espresso machine becomes the real bottleneck no one can see. When the
    handoff is not checked, a correct drink goes to the wrong person and the
    right customer waits for a remake that was never needed.
  how: >
    The barista takes the ticket, reads size, base, temperature, milk,
    modifiers, and the pickup name from it and the recipe card, and marks
    the cup before touching the grinder. With the ticket marked, the barista
    orders the work across the active tickets: shots pulled when the milk is
    nearly ready, cold builds started while a blender runs, so that no
    component waits on another past its window. The drink is built to the
    recipe card's dose, yield, amounts, and temperature, consistent across
    bar positions. Before it leaves the bar, the ticket, the cup mark, the
    drink in hand, and the customer or pickup identity are compared, and
    remakes are logged with a reason so the station setup can change.
  controls:
    - name: Cup marked before the first shot
      note: Size, milk, temperature, modifiers, and the pickup name are on the cup before any irreversible step begins.
    - name: Recipe card visible at every position
      note: Dose, yield, ingredient amounts, and temperature come from the posted card so drinks match regardless of who builds them.
    - name: Handoff check against the ticket
      note: The barista reads the ticket and the cup mark together and calls the pickup name before the drink leaves the bar.
    - name: Remake reason logged
      note: Every remake is recorded with its cause so the shift lead can see whether layout, training, or equipment needs to change.
    - name: Equipment queue watched during peaks
      note: The shift lead checks where work in progress is piling up and moves a position when one machine becomes the hidden queue.
