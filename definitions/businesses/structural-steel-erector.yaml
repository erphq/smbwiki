article:
  operating_model: >
    A structural steel erector works in lifts. Each week is planned
    around crane time, the fabricator's shipping order, concrete
    strength, and anchor condition, and the raising gang is followed by
    bolting, welding, decking, survey adjustment, and inspection crews.
    Steel erection planning and hoisting and rigging are the
    load-bearing skills, with structural bolting and field welding
    control deciding whether inspection passes the first time. The
    tension is that installed tonnage looks like progress while
    connections and temporary stability carry the real risk; a misplaced
    member or a damaged anchor stops several crews, so the daily plan
    keeps alternatives and a direct line to the engineer.
  starting: >
    An erector starts with certified people and a crane relationship.
    Day-one requirements are the business registration, employer
    registration, a contractor license in most states, general liability
    and umbrella coverage sized for structural work, certified crane
    operators and qualified riggers and signal persons, welders holding
    current certifications, and a written fall protection and erection
    safety program before the first crew goes up. The minimum roles are
    an owner-operator, a project manager who does erection planning, a
    site superintendent, a trade foreperson, and installers, with an
    estimator and an office manager handling quotes, purchasing,
    invoicing, and receivables. The first records are the construction
    plan with the erection sequence, quality reports for bolting and
    welding inspection, the quote and work order, and job photos. Steel
    erection planning, hoisting and rigging, and steel erection
    inspection must exist from the first lift.
  economics: >
    Revenue is quoted projects plus erected tonnage or a package price
    adjusted for mobilization, crane, rigging, bolting, welding,
    decking, correction, and testing support. The pricing basis is tons
    or pieces against a plan of crane days and crew days, so gross
    margin is decided by crane utilization, pieces per lift, and how
    many connections pass inspection the first time. Project gross
    margin and schedule variance are the metrics that decide profit,
    because a day waiting on concrete strength or a missing member is a
    day of crane and crew cost with no tonnage. Rework rate shows in
    rejected welds and re-torqued connections, and on-time completion
    controls whether following trades and retention release stay on
    schedule. Labor is skilled and certified, crane time is rented or
    owned capital, and both are paid whether steel is standing or
    waiting, which is why quoting and planning are the margin levers.
