id: solar-installation-contractor
name: Solar Installation Contractor
codes:
  naics: '238210'
catalog_group: construction-property
extends: project-services-base
summary: >-
  A solar installation contractor surveys a site, designs a photovoltaic
  system, secures permits and utility approval, procures equipment, installs
  the array and electrical work, commissions monitoring, and closes
  inspection. Roof condition, structure, shade, service capacity, shutdown,
  access, and interconnection rules shape each job.


  Physical installation can finish before the system is allowed to operate.
  Permit corrections, utility documents, labels, settings, inspection, and
  permission to operate remain critical-path work. The contractor records
  attachments, wiring, torque, tests, and production so the owner and future
  service team can understand the installed system.
