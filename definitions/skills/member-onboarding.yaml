id: member-onboarding
name: Member onboarding
kind: skill
department: sales
summary: >
  Member onboarding converts signed membership terms into a usable
  account and access credential. The member leaves knowing where and
  when the credential works, how to use the facility, where charges
  appear, and how to get help.
inputs: [membership-agreement, liability-waiver]
outputs: [access-credential]
steps:
  - name: Verify activation documents
    role: membership-advisor
    consumes: [membership-agreement, liability-waiver]
    note: >
      Plan, start date, required acknowledgements, identity, and account
      contact details are complete before access is issued.
  - name: Configure the account
    role: membership-advisor
    note: >
      Location, hours, services, billing state, and any age or supervision
      rule become system permissions.
  - name: Issue and test access
    role: front-desk-attendant
    produces: [access-credential]
    note: >
      The member uses the credential at the real entry point while staff
      can still correct the setup.
  - name: Orient the member
    role: front-desk-attendant
    note: >
      Entry, storage, equipment, cleaning, class, guest, safety, and help
      procedures are shown in the context where they apply.
tension: >
  Fast activation competes with usable and safe setup. A credential can
  be issued in moments; unresolved permissions or unclear facility rules
  turn the first visit into an exception at the front desk.
failure_modes:
  - name: Credential and plan disagree
    cost: >
      A paying member is blocked from included access or admitted beyond
      the signed plan.
    signal: >
      Front-desk overrides cluster among newly activated accounts.
  - name: Billing state absent from activation
    cost: >
      Access begins under an account with incomplete payment authority or
      an incorrect charge date.
    signal: >
      New accounts enter the first billing run with missing method or
      start date.
  - name: Orientation becomes a handout
    cost: >
      The member uses equipment, entry, guests, or classes incorrectly
      and staff correct the issue after it affects others.
    signal: >
      Early service questions concern procedures covered only in written
      material.
maturity:
  - level: run badly
    looks_like: >
      Staff hand over a credential and the member discovers permissions,
      charges, and facility rules through later failures.
  - level: run well
    looks_like: >
      Signed terms drive account permissions, access is tested, and the
      member receives a practical facility orientation.
  - level: run excellently
    looks_like: >
      Activation exceptions feed back to sales and system rules, and the
      first visit confirms account, access, and assistance paths together.
competencies:
  - name: System translation
    note: >
      Signed language has to become the correct access, billing, and
      service configuration across connected systems.
  - name: Practical orientation
    note: >
      The operator can show the few rules and routes that prevent the
      member's first avoidable failure.
automation:
  now: >
    Document checks, account creation, permission mapping, credential
    issuance, welcome messages, and incomplete-onboarding queues.
  human: >
    Identity resolution, requested exceptions, accessibility support,
    facility walkthrough, and confirmation that the member can use access.
questions:
  - What new-member exception appears most often at the front desk?
  - Does the credential grant exactly the access described in the agreement?
article:
  what: >
    The member onboarding process is how a gym turns a signed
    membership agreement and liability waiver into an account that
    bills correctly and a credential that opens the door. It begins
    when the documents are signed and ends when the new member has used
    the credential at the real entry point, been shown the facility,
    and knows where charges appear and how to get help. The membership
    advisor owns document verification and account configuration; the
    front desk attendant issues and tests access and runs the
    orientation.
  why: >
    It protects the member's first visit and the gym's billing run. A
    credential that disagrees with the signed plan blocks a paying
    member or admits them beyond what they bought; an account activated
    without a payment method or start date enters the first billing run
    broken; an orientation reduced to a handout means the member learns
    the equipment, guest, and class rules by breaking them. Front desk
    overrides clustering among new accounts are the visible symptom.
  how: >
    The membership advisor verifies the activation documents,
    confirming plan, start date, required acknowledgements, identity,
    and account contact details are complete on the membership
    agreement and liability waiver before any access is issued. The
    account is configured so that location, hours, services, billing
    state, and any age or supervision rule become system permissions
    that match the signed plan. The front desk attendant issues the
    access credential and has the member use it at the real entry point
    while staff can still correct the setup. The attendant then orients
    the member in place: entry, storage, equipment, cleaning, classes,
    guests, safety, and where to get help, shown where each applies.
  controls:
    - name: Document completeness before activation
      note: Plan, start date, acknowledgements, identity, and contact are checked complete on the signed agreement and waiver before the account is created.
    - name: Permissions matched to the signed plan
      note: Location, hours, and services on the account are compared to the agreement so the credential grants exactly what was sold.
    - name: Billing state confirmed at activation
      note: Payment method and first charge date are recorded and verified before the credential is issued.
    - name: Live access test at the entry point
      note: The member's credential is tested at the actual gate or reader with staff present, and any failure is corrected on the spot.
    - name: Orientation checklist signed
      note: The attendant records that each orientation item was shown in place, and the incomplete-onboarding queue holds any account missing it.
