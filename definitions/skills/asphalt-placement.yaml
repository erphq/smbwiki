id: asphalt-placement
name: Asphalt placement
kind: skill
department: operations
summary: >-
  Coordinates plant and trucks, verifies mix and temperature, controls paving
  speed, joints, lift thickness, handwork, and segregation. Asphalt placement
  leaves a current work basis, a field record, and acceptance evidence that
  another operator can trace.
inputs:
  - site-plan
outputs:
  - test-report
steps:
  - name: Confirm the work basis
    note: >-
      Before asphalt placement, read the current scope and revisions, then
      verify approved limits and drainage, removed failed material, stable
      subgrade, confirmed section, available mix, weather window, and traffic
      control.
  - name: Set the field controls
    note: >-
      Translate asphalt placement into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During asphalt placement, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept asphalt placement, check the completed work against specified
      thickness, density, grade, smoothness, drainage, joint quality, edge
      support, markings, and opening strength, then close correction and issue
      the resulting record.
tension: >-
  Asphalt placement has to remain inside its acceptance basis while production
  moves. Surface appearance can hide weak subgrade, thin base, poor
  compaction, or trapped drainage that shortens pavement life.
failure_modes:
  - name: Asphalt placement starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      asphalt placement is settled.
    signal: >-
      The asphalt placement work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Asphalt placement closes without evidence
    cost: >-
      A concealed condition or required result from asphalt placement cannot
      be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Asphalt placement is released while its required check, location record,
      test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Asphalt placement is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Asphalt placement starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Asphalt placement uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Small-site pavement production
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of asphalt placement.
  - name: Evidence control
    note: >-
      Acceptance checks for asphalt placement have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Asphalt placement can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting asphalt placement remain
    human.
questions:
  - Which unresolved condition can stop asphalt placement before work begins?
  - >-
    Which record proves asphalt placement was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The asphalt placement process is how a driveway paving contractor
    lays hot mix over a prepared base and turns it into a finished
    surface that meets the plan. It starts once the base has been
    accepted and the plant, trucks, and weather window line up, and it
    ends when the mat has been placed, compacted, and checked against
    thickness, density, grade, smoothness, joints, and edges, with a
    test report the owner can keep. The paving foreman owns it,
    coordinating the plant, the truck cycle, the paver operator, the
    screed, the rollers, and the rakers.
  why: >
    Hot mix has a short working life. Mix that arrives cold, a paver
    that stops and starts, a roller that falls behind, or a joint that
    is placed against a cold edge produces a surface that looks
    acceptable at handover and ravels, cracks, or holds water within a
    season. Segregation, thin spots, and poor edge support are hidden by
    a fresh black surface. Without a work basis and test report, the
    contractor cannot show what mix went down, at what temperature, at
    what thickness, and cannot answer a warranty call with evidence.
  how: >
    Before the first truck the foreman reads the site plan and revisions
    and confirms the limits and drainage, that failed material is gone,
    that the base is stable and accepted, the confirmed section, that
    mix is available at the plant, the weather window, and traffic
    control. He sets the field controls: truck cycle against paver
    speed, mix temperature limits at delivery, lift thickness, joint
    locations and method, handwork areas, roller pattern and timing, and
    the hold points for testing. During placement the crew records
    delivery tickets, temperatures, lift depths, joint positions, and
    any base or drainage condition found under the mat, and stops when
    cold mix, rain, or a soft spot changes the method. At acceptance the
    surface is checked for thickness, density, grade, smoothness,
    drainage, joint quality, edge support, markings, and opening
    strength, corrections are closed, and the test report is issued.
  controls:
    - name: Mix ticket and temperature per load
      note: Each load's ticket is matched to the specified mix and its temperature is checked at delivery, and a cold load is rejected.
    - name: Paver speed matched to supply
      note: The truck cycle is set so the paver does not stop, and a stoppage is recorded with its location.
    - name: Joint placement recorded
      note: Longitudinal and transverse joint locations and the method used are recorded before the next pass covers them.
    - name: Density and thickness at the hold point
      note: Cores or gauge readings are taken at the agreed frequency and the surface is not opened to traffic until they pass.
    - name: Test report issued before opening
      note: Tickets, temperatures, tests, and corrections are compiled into the test report before the driveway or lot is released.
