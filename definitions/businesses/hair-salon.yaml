id: hair-salon
name: Hair Salon
codes:
  naics: "812112"
catalog_group: personal-recreation
summary: >
  A hair salon schedules time on stylists and service stations. The
  consultation records the requested result, hair condition, service
  history, timing, price, and any formula needed for repeat work.
  Service, checkout, product use, and rebooking update the client record.

  Employment, commission, and chair-rental arrangements can assign
  booking, payment, product, and client responsibilities differently.
  The operating record needs to make those boundaries clear. Formula
  history, appointment ownership, stock readiness, and schedule changes
  help the salon preserve service continuity across visits.
revenue_model:
  - id: commissioned-services
    note: the salon books and collects for services, then pays the
      stylist a commission
  - id: chair-rental
    note: independent stylists pay for use of a chair and shared space
  - id: retail-products
    note: take-home hair care sold during consultation and checkout
skills:
