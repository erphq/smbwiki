id: care-plan-delivery
name: Care plan delivery
kind: skill
department: operations
summary: >
  Care plan delivery converts assessed needs into scheduled, observed,
  and recorded support. Identity, task, time, precaution, medication,
  response, missed service, change in condition, incident, and
  escalation remain attached to the person.
inputs: [care-plan]
outputs: [medication-record, incident-report]
steps:
  - name: Review the current plan
    role: caregiver
    consumes: [care-plan]
    note: >
      Person, scheduled support, preferences, precautions, changes,
      medications, equipment, and escalation instructions are current.
  - name: Confirm condition and consent
    role: caregiver
    note: >
      Identity, immediate condition, willingness, environment, and any
      reason to delay, modify, or escalate are checked.
  - name: Deliver scheduled care
    role: caregiver
    note: >
      Assistance, observation, hygiene, mobility, nutrition, medication
      support, activity, and safety tasks follow the authorized plan.
  - name: Record response and medication
    role: caregiver
    produces: [medication-record]
    note: >
      Completed, refused, omitted, changed, and observed care is
      recorded at the time and linked to responsible staff.
  - name: Escalate a change or incident
    role: care-director
    produces: [incident-report]
    note: >
      Immediate protection, clinical contact, family or authority
      notice, evidence, follow-up, and plan review are assigned.
tension: >
  Consistent scheduled support competes with a person's changing
  condition and choices. Rigid completion can ignore harm or refusal;
  informal adaptation can bypass authorization, continuity, and
  evidence.
failure_modes:
  - name: Staff work from an obsolete plan
    cost: >
      Current precautions, medications, mobility, diet, behavior, or
      escalation needs are missed.
    signal: >
      Shift record references a plan version superseded by a recent
      assessment or order.
  - name: Missed care is recorded as completed
    cost: >
      A person lacks support while the next shift and supervisor see no
      open need.
    signal: >
      Repeated identical completion times or records entered in bulk
      after the shift.
  - name: Change in condition remains a note
    cost: >
      Deterioration repeats without clinical or plan action.
    signal: >
      Similar observation appears across shifts without an identified
      escalation result.
maturity:
  - level: run badly
    looks_like: >
      Care depends on familiar staff and handover conversation, with
      records completed after the shift.
  - level: run well
    looks_like: >
      Plan, assignment, current condition, delivered care, medication,
      observation, exception, and escalation share one person record.
  - level: run excellently
    looks_like: >
      Missed service, incident, response, and outcome evidence improves
      plan design, staffing, supervision, training, and prevention.
competencies:
  - name: Observation and escalation
    note: >
      Staff recognize meaningful change and take the authorized action
      without diagnosing beyond their role.
  - name: Respectful care execution
    note: >
      The caregiver combines safe technique with consent, dignity,
      preference, and accurate recording.
automation:
  now: >
    Plans, assignments, point-of-care prompts, medication schedules,
    completion records, missed-task alerts, incident workflow, and
    supervisory review.
  human: >
    Condition observation, consent, touch, communication, adaptation,
    emergency response, safeguarding, and clinical escalation.
questions:
  - Which scheduled care was missed without a resolved follow-up?
  - Which repeated observation has not changed the plan or reached a qualified reviewer?
article:
  what: >
    The care plan delivery process is how a caregiver turns an assessed
    plan into the support a person receives on a shift, and how that
    support is recorded so the next shift and the supervisor know what
    happened. It starts when the caregiver reviews the current care plan
    at the start of a visit or shift and ends when every scheduled task
    is recorded as completed, refused, omitted, or changed, medications
    are on the medication record, and any change in condition or
    incident has reached the care director. In an assisted living
    facility or a home health agency the caregiver owns delivery; the
    care director owns escalation and plan review.
  why: >
    The person depends on the plan being followed and on someone
    noticing when it no longer fits. Care given from a superseded plan
    misses a new precaution or medication. A task recorded as done that
    was not done leaves the person without support while everyone
    downstream sees no open need. A change in condition noted shift
    after shift without escalation lets deterioration continue. Without
    the process, care depends on familiar staff and handover
    conversation, records are filled in after the shift, and nobody can
    show a family or a regulator what was delivered.
  how: >
    The caregiver reviews the current care plan and confirms the person,
    scheduled support, preferences, precautions, recent changes,
    medications, equipment, and escalation instructions. Before
    delivering care, identity, immediate condition, willingness, and
    environment are checked, and any reason to delay, modify, or
    escalate is acted on. Scheduled assistance, observation, hygiene,
    mobility, nutrition, medication support, activity, and safety tasks
    are then delivered according to the authorized plan. Each task is
    recorded at the time as completed, refused, omitted, or changed,
    with observed response, and medication administration goes on the
    medication record against the responsible caregiver. When a change
    in condition or an incident occurs, the care director takes over:
    immediate protection, clinical contact, family or authority notice,
    evidence, follow-up, and plan review are assigned, and an incident
    report is opened.
  controls:
    - name: Current plan version confirmed at shift start
      note: The caregiver checks the plan version and date against the latest assessment or order before delivering care.
    - name: Identity and consent check before each task
      note: The person's identity and willingness are confirmed at the point of care, and a refusal is recorded as such.
    - name: Point-of-care recording
      note: Care and medication are recorded at the time they are given, and bulk entries after the shift are flagged for supervisory review.
    - name: Missed care follow-up
      note: Any task recorded as omitted or refused generates a follow-up owned by the supervisor before the end of the shift.
    - name: Escalation closed with a plan decision
      note: Every incident report and repeated observation ends in a documented decision by the care director or a clinician, including no change.
