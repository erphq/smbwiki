catalog_group: construction-property
extends: project-services-base
revenue_model:
  - id: earthwork-hauling-and-disposal
    note: measured excavation, fill, grading, and compaction plus mobilization, trucking, imported material, disposal, dewatering, and stabilization
summary: >-
  A site preparation contractor clears land, locates utilities, excavates,
  grades, manages water, places fill, compacts soil, and establishes access
  for the work that follows. Survey control, geotechnical direction, erosion
  measures, haul routes, equipment, weather, and disposal decisions move
  together.


  Earthwork exposes conditions that drawings can only estimate. Unsuitable
  soil, buried structures, groundwater, rock, and unrecorded services require
  fast evidence and direction before crews keep moving material. Quantity
  records, test locations, trucking tickets, and daily grade checks connect
  field production to change control and payment.
