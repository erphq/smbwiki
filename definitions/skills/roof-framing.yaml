id: roof-framing
name: Roof framing
kind: skill
department: operations
summary: >-
  Sets trusses or rafters, valleys, hips, blocking, bracing, sheathing,
  openings, and connectors in the engineered sequence. Roof framing leaves a
  current work basis, a field record, and acceptance evidence that another
  operator can trace.
inputs:
  - construction-plan
outputs:
  - quality-report
steps:
  - name: Confirm the work basis
    note: >-
      Before roof framing, read the current scope and revisions, then verify
      current dimensions, control lines, lumber or component package,
      connectors, openings, bearing points, and correction of supporting work.
  - name: Set the field controls
    note: >-
      Translate roof framing into work limits, sequence, responsibilities,
      hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During roof framing, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept roof framing, check the completed work against specified
      layout, bearing, fastening, bracing, openings, plane, and inspection
      readiness, then close correction and issue the resulting record.
tension: >-
  Roof framing has to remain inside its acceptance basis while production
  moves. Small layout errors repeat through floors, walls, roofs, windows,
  cabinets, and finishes.
failure_modes:
  - name: Roof framing starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for roof
      framing is settled.
    signal: >-
      The roof framing work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Roof framing closes without evidence
    cost: >-
      A concealed condition or required result from roof framing cannot be
      verified without opening, repeat work, delay, or a disputed exception.
    signal: >-
      Roof framing is released while its required check, location record, test
      result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Roof framing is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Roof framing starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Roof framing uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Wood framing layout and load-path judgment
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of roof framing.
  - name: Evidence control
    note: >-
      Acceptance checks for roof framing have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Roof framing can use digital revisions, checklists, hold points, photo
    capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting roof framing remain human.
questions:
  - Which unresolved condition can stop roof framing before work begins?
  - >-
    Which record proves roof framing was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The roof framing process sets the structure that carries the roof,
    meaning trusses or rafters, valleys, hips, blocking, bracing,
    sheathing, openings, and connectors, in the sequence the engineer
    specified. It begins when the wall framing below has been accepted
    and the truss or lumber package, connector schedule, and current
    drawing revision are on site, and it ends when layout, bearing,
    fastening, bracing, openings, and plane have been checked and
    recorded on a quality report ready for the framing inspection. In a
    framing contractor it is owned by the lead framer or foreman, with
    the company's quality checker or the inspector accepting the work.
  why: >
    The roof is the last structural stage before everything is covered,
    so an error here is either found now or lived with. A truss set on
    the wrong bearing, a hip or valley off the control line, a missing
    hurricane tie, or temporary bracing removed before the permanent
    bracing is complete can fail an inspection, hold up the roofer, or
    fail under load. Layout errors made at the plate repeat through the
    roof plane, the openings, and the finishes below. The process starts
    from a checked basis, follows the engineered sequence, and leaves
    evidence of bearing and connectors before sheathing hides them.
  how: >
    The foreman confirms the work basis by reading the current scope and
    revisions, then verifying current dimensions, control lines, the
    lumber or truss component package, connectors, openings, bearing
    points, and that supporting wall work has been corrected and
    accepted. The field controls set the erection sequence, the temporary
    bracing plan, the crane or lift plan, who checks bearing and plumb at
    each stage, the hold point before sheathing, and the photographs and
    checklist the crew must leave. During erection the crew sets, braces,
    blocks, and connects in sequence, recording quantities, observations,
    and any decision a field condition forced, and stops when the plan
    cannot be followed. Acceptance checks layout, bearing, fastening,
    bracing, openings, plane, and inspection readiness, corrections are
    closed, and the quality report is issued.
  controls:
    - name: Bearing and layout checked before setting
      note: Wall plates, control lines, and bearing points are verified against the current drawings before the first truss or rafter is set.
    - name: Connector schedule verified before sheathing
      note: Every hanger, tie, and strap on the connector schedule is confirmed installed and photographed before the deck goes on.
    - name: Temporary bracing per the truss manufacturer
      note: The bracing plan is followed and checked daily until permanent bracing is complete, with each check recorded.
    - name: Openings measured against the plan
      note: Skylight, chimney, and vent openings are measured and recorded before sheathing so the next trade is never cutting into structure.
    - name: Quality report issued before the inspection call
      note: The framing inspection is requested only after the quality report shows all items accepted or corrected.
