id: income-approach-valuation
name: Income approach valuation
kind: skill
department: operations
summary: >-
  Builds market rent and vacancy, normalizes expenses, derives income, selects
  capitalization or discount inputs, and tests the value indication. Income
  approach valuation leaves a current work basis, a field record, and
  acceptance evidence that another operator can trace.
inputs:
  - engagement-letter
outputs:
  - appraisal-report
steps:
  - name: Confirm the work basis
    note: >-
      Before income approach valuation, read the current scope and revisions,
      then verify identified client and intended use, property rights,
      effective date, assignment conditions, access, market data, and
      competent appraiser.
  - name: Set the field controls
    note: >-
      Translate income approach valuation into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During income approach valuation, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept income approach valuation, check the completed work against
      credible supported analyses, disclosed scope and assumptions, reconciled
      value opinion, compliant report, and signed delivery, then close
      correction and issue the resulting record.
tension: >-
  Income approach valuation has to remain inside its acceptance basis while
  production moves. Weak property or market verification can make a polished
  value conclusion unsupported.
failure_modes:
  - name: Income approach valuation starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for income
      approach valuation is settled.
    signal: >-
      The income approach valuation work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Income approach valuation closes without evidence
    cost: >-
      A concealed condition or required result from income approach valuation
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Income approach valuation is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Income approach valuation is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Income approach valuation starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Income approach valuation uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Real property valuation and evidence reconciliation
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of income approach valuation.
  - name: Evidence control
    note: >-
      Acceptance checks for income approach valuation have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Income approach valuation can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting income approach valuation
    remain human.
questions:
  - >-
    Which unresolved condition can stop income approach valuation before work
    begins?
  - >-
    Which record proves income approach valuation was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The income approach valuation process develops a value indication for
    an income-producing property from the income it can generate: market
    rent and vacancy are built from comparable leases and the subject's
    rent roll, operating expenses are normalized to a stabilized year, net
    operating income is derived, a capitalization rate or discount rate
    and holding assumptions are selected from market evidence, and the
    resulting indication is tested against the other approaches and the
    market. It starts when the engagement letter defines the client,
    intended use, property rights, and effective date, and ends when the
    supported analysis is reconciled into the signed appraisal report. The
    appraiser assigned to the engagement owns it at a real estate
    appraisal firm, with a reviewing appraiser signing where required.
  why: >
    An income approach can be arithmetically clean and still unsupported.
    A market rent taken from the owner's pro forma, an expense ratio
    borrowed from a different property class, or a capitalization rate
    chosen to hit a number makes a polished value conclusion a liability
    for the lender, the client, and the appraiser's license. The process
    protects the credibility of the value opinion, the appraiser's
    compliance with the applicable standards, and the client's decision
    that rests on it.
  how: >
    The appraiser reads the engagement letter and its revisions and
    confirms the identified client and intended use, property rights
    appraised, effective date, assignment conditions, access, available
    market data, and their own competence for the property type before
    analysis begins. The analysis controls are then set: the data sources
    for rent, vacancy, expenses, and rates, the verification each data
    point needs, the normalization rules for expenses, the hold points
    where the reviewer checks inputs, and the workfile record. During the
    analysis the appraiser records each comparable lease and sale with its
    source and verification, each expense adjustment with its reason, the
    rate selection with its support, and any assignment condition or data
    limitation that changed the method, and stops when the property or
    the market data do not support the planned approach. At acceptance the
    reviewer checks that the analyses are credible and supported, scope
    and assumptions are disclosed, the value opinion is reconciled, the
    report is compliant, and delivery is signed, then the appraisal report
    is issued.
  controls:
    - name: Rent and expense inputs verified to source
      note: Each market rent, vacancy, and expense figure records its source and how it was verified, and an owner's pro forma is labeled as such.
    - name: Expense normalization documented
      note: Every adjustment from the subject's historical expenses to the stabilized year carries a stated reason in the workfile.
    - name: Rate selection supported
      note: The capitalization or discount rate is tied to named market transactions or surveys, and the range considered is shown in the workfile.
    - name: Reconciliation to other approaches
      note: The income indication is tested against the sales comparison and cost indications and any gap is explained before the opinion is reconciled.
    - name: Review sign-off before delivery
      note: A reviewing appraiser checks inputs, scope disclosure, and compliance and signs before the report is delivered to the client.
