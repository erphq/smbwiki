id: insulation-contractor
name: Insulation Contractor
codes:
  naics: '238310'
catalog_group: construction-property
extends: project-services-base
summary: >-
  An insulation contractor establishes the thermal and air boundary using
  sealing, batts, blown fiber, foam, or other specified systems. The work fits
  around framing, wiring, piping, ducts, ventilation, combustion clearances,
  and irregular transitions that can create hidden bypasses or compressed
  insulation.


  Most defects disappear when walls and ceilings close. The crew therefore
  maps the boundary, verifies substrate and air sealing, controls installed
  depth or density, and records concealed conditions by location. Production
  planning also manages machine settings, bag count, weather, ventilation
  paths, access, and inspection timing.
