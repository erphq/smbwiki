id: tile-layout
name: Tile layout
kind: skill
department: operations
summary: >-
  Balances cuts, centers patterns, resolves focal lines, locates movement
  joints, establishes elevations, and records the approved dry layout. Tile
  layout leaves a current work basis, a field record, and acceptance evidence
  that another operator can trace.
inputs:
  - construction-plan
outputs:
  - quality-report
steps:
  - name: Confirm the work basis
    note: >-
      Before tile layout, read the current scope and revisions, then verify
      stable and flat substrate, cured work, approved tile and setting system,
      resolved movement joints, dry layout, and environmental control.
  - name: Set the field controls
    note: >-
      Translate tile layout into work limits, sequence, responsibilities, hold
      points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During tile layout, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept tile layout, check the completed work against bond coverage,
      plane, joint alignment, movement accommodation, drainage, lippage,
      grout, sealant, and approved appearance, then close correction and issue
      the resulting record.
tension: >-
  Tile layout has to remain inside its acceptance basis while production
  moves. A visually acceptable surface can conceal poor bond, trapped water,
  or missing movement capacity.
failure_modes:
  - name: Tile layout starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for tile
      layout is settled.
    signal: >-
      The tile layout work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Tile layout closes without evidence
    cost: >-
      A concealed condition or required result from tile layout cannot be
      verified without opening, repeat work, delay, or a disputed exception.
    signal: >-
      Tile layout is released while its required check, location record, test
      result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Tile layout is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Tile layout starts from a checked basis, follows a named sequence, stops
      on changed conditions, and closes against recorded acceptance criteria.
  - level: run excellently
    looks_like: >-
      Tile layout uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Tile assembly layout and bond control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of tile layout.
  - name: Evidence control
    note: >-
      Acceptance checks for tile layout have to be captured while the relevant
      condition can still be observed and corrected.
automation:
  now: >-
    Tile layout can use digital revisions, checklists, hold points, photo
    capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting tile layout remain human.
questions:
  - Which unresolved condition can stop tile layout before work begins?
  - >-
    Which record proves tile layout was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The tile layout process is the dry run a tile contractor performs before
    any mortar is mixed: cuts are balanced so slivers do not land at doorways
    and focal walls, patterns are centered, focal lines are resolved, movement
    joints are located, and finished elevations are set, and the approved dry
    layout is recorded so the setters can follow it. It starts when the
    prepared substrate and the approved tile are on site and ends with a
    layout the customer or general contractor has accepted and a quality
    report that fixes the reference lines. The lead setter owns it, with the
    estimator confirming that the layout still matches the quantity that was
    sold.
  why: >
    Layout decides how the finished floor or wall looks and cannot be changed
    once tile is set. A pattern that runs off center, a row of slivers along
    the most visible wall, a movement joint left out where the substrate meets
    a column, or a shower floor that does not fall to the drain are all layout
    errors that turn into removal and replacement of finished tile. Writing
    the approved layout down is what protects the contractor when the customer
    later asks why the cut sits where it does.
  how: >
    The lead setter confirms the work basis by reading the current scope and
    revisions and verifying a stable and flat substrate, cured work, the
    approved tile and setting system, resolved movement joints, and
    environmental control in the space. Field controls are then set: control
    lines snapped and labeled, the pattern origin fixed, the sequence of
    areas, who lays out and who checks, and the hold point where the customer
    or general contractor approves the dry layout. During layout the operator
    records elevations, control lines, cut sizes at perimeters, movement joint
    positions, and any substrate condition found, and stops when a room
    dimension or a substrate condition changes the planned pattern. Acceptance
    checks bond coverage expectations, plane, joint alignment, movement
    accommodation, drainage, lippage, grout, sealant, and the approved
    appearance, corrections are closed, and the quality report with the
    recorded layout is issued.
  controls:
    - name: Dry layout approved before setting
      note: The pattern, cut sizes at perimeters, and focal lines are laid out dry and signed off by the customer or general contractor before mortar is mixed.
    - name: Control lines recorded with dimensions
      note: Snapped reference lines and the pattern origin are measured from fixed features and written in the quality report so another setter can rebuild them.
    - name: Movement joints located on the plan
      note: Every required movement joint is marked on the plan and on the floor during layout, including joints at columns, perimeters, and substrate changes.
    - name: Slope checked to the drain
      note: On wet areas the layout elevations are checked against the drain and the required fall before tile positions are fixed.
    - name: Quantity reconciled after layout
      note: Cut waste from the approved layout is compared with the sold quantity and any shortfall is ordered before setting begins.
