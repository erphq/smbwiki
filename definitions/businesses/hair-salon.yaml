seo:
  title: "Hair Salon: How the Business Works | smbwiki"
article:
  operating_model: >
    A hair salon sells stylist time at a station. The book is the
    business: the salon coordinator fills each stylist's day from
    appointment requests, the stylist consults, records the formula,
    performs the service, and rebooks at checkout, and the assistant
    shampoos, mixes, and turns stations between clients. Appointment
    scheduling, hair service, and client checkout are the load-bearing
    skills; the formula card is what makes the second visit match the
    first. The week is shaped by how the salon employs its stylists:
    commissioned stylists are booked and paid through the salon, while
    chair renters book and collect for themselves and pay for the
    station, so the operating record has to show who owns the
    appointment, the payment, and the product used. The tension is
    between chair utilization and service time: a no-show leaves a
    station empty for the slot, and a color service that runs long
    pushes every later appointment.
  starting: >
    Day-one paperwork is business registration, employer registration
    for commissioned staff, sales tax registration for retail product
    and for services where the state taxes them, and the cosmetology
    establishment license that most states issue for the premises after
    an inspection of sinks, sanitation, and station layout; every
    stylist must hold a current cosmetologist license, and chair rental
    agreements need to be written so the renter is clearly independent
    under the state's rules. Capital is the build-out with plumbing for
    backwash units, styling stations, hooded dryers, lighting, a color
    bar, opening product and color inventory from a beauty supply
    distributor, and salon management software that handles online
    booking and deposits. The minimum team is a salon owner who cuts,
    one stylist, and a coordinator or assistant covering the front desk;
    many salons open with the owner and renters. The first records are
    the appointment record, the client profile, the formula card, the
    service ticket, the customer invoice, and the shift schedule.
    Appointment scheduling, client consultation, hair service, and
    client checkout must work on the first day.
  economics: >
    Revenue is commissioned services, where the salon books and collects
    and pays the stylist a share, chair rental, where the stylist pays a
    fixed weekly amount for the station, and retail products sold at
    consultation and checkout. Pricing is per service by stylist level,
    with color and treatments carrying more product cost and more time
    than cuts. Gross margin on commissioned services is what remains
    after the stylist share and product used; chair rental income is
    nearly all margin but caps at the number of stations. The metrics
    that decide profit are chair utilization, average ticket, rebooking
    rate, and labor cost percentage, because an empty station still
    carries rent and a stylist paid on commission at a low ticket cannot
    cover the chair. Appointment no-show rate is watched daily, and
    deposit policies exist to protect it. Service ticket time decides
    how many clients a station serves in a day. The business is
    labor-intensive with modest capital; profit comes from full books,
    retail attached to services, and a stylist pay model that matches
    the salon's booking risk.
