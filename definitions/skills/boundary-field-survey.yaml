id: boundary-field-survey
name: Boundary field survey
kind: skill
department: operations
summary: >-
  Searches for monuments and occupation evidence, observes boundary and
  improvements, ties adjoining control, records conditions, and flags
  conflicts. Boundary field survey leaves a current work basis, a field
  record, and acceptance evidence that another operator can trace.
inputs:
  - site-plan
outputs:
  - survey-plat
steps:
  - name: Confirm the work basis
    note: >-
      Before boundary field survey, read the current scope and revisions, then
      verify defined survey purpose, current deeds and plats, adjoining
      records, coordinate basis, access, equipment checks, and field safety
      plan.
  - name: Set the field controls
    note: >-
      Translate boundary field survey into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During boundary field survey, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept boundary field survey, check the completed work against
      traceable evidence, closed measurements, resolved boundary opinion, set
      or found monuments, complete notes, and signed deliverable, then close
      correction and issue the resulting record.
tension: >-
  Boundary field survey has to remain inside its acceptance basis while
  production moves. Treating record dimensions as field truth can move a
  boundary opinion away from controlling evidence.
failure_modes:
  - name: Boundary field survey starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      boundary field survey is settled.
    signal: >-
      The boundary field survey work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Boundary field survey closes without evidence
    cost: >-
      A concealed condition or required result from boundary field survey
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Boundary field survey is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Boundary field survey is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Boundary field survey starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Boundary field survey uses field evidence, production variance, defects,
      and closeout results to improve the next estimate, work package, and
      control point.
competencies:
  - name: Boundary evidence and measurement adjustment
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of boundary field survey.
  - name: Evidence control
    note: >-
      Acceptance checks for boundary field survey have to be captured while
      the relevant condition can still be observed and corrected.
automation:
  now: >-
    Boundary field survey can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting boundary field survey remain
    human.
questions:
  - >-
    Which unresolved condition can stop boundary field survey before work
    begins?
  - >-
    Which record proves boundary field survey was accepted before it was
    covered, loaded, energized, occupied, or handed over?
