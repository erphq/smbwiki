id: interior-design-documentation
name: Interior design documentation
kind: skill
department: operations
summary: >-
  Coordinates plans, elevations, reflected ceilings, details, schedules,
  specifications, consultant information, revisions, and issue purpose.
  Interior design documentation leaves a current work basis, a field record,
  and acceptance evidence that another operator can trace.
inputs:
  - client-brief
outputs:
  - finish-schedule
steps:
  - name: Confirm the work basis
    note: >-
      Before interior design documentation, read the current scope and
      revisions, then verify approved program, measured existing conditions,
      consultant criteria, budget, schedule, code basis, and client decision
      structure.
  - name: Set the field controls
    note: >-
      Translate interior design documentation into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During interior design documentation, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept interior design documentation, check the completed work
      against coordinated safe spaces, approved selections, complete
      documents, released procurement, installed intent, and resolved
      deficiencies, then close correction and issue the resulting record.
tension: >-
  Interior design documentation has to remain inside its acceptance basis
  while production moves. A late spatial or finish decision can affect
  building systems, price, lead time, and installed work at once.
failure_modes:
  - name: Interior design documentation starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      interior design documentation is settled.
    signal: >-
      The interior design documentation work package still has an open
      drawing, access, material, predecessor, or approval dependency when
      labor is assigned.
  - name: Interior design documentation closes without evidence
    cost: >-
      A concealed condition or required result from interior design
      documentation cannot be verified without opening, repeat work, delay, or
      a disputed exception.
    signal: >-
      Interior design documentation is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Interior design documentation is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Interior design documentation starts from a checked basis, follows a
      named sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Interior design documentation uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Interior space and material coordination
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of interior design documentation.
  - name: Evidence control
    note: >-
      Acceptance checks for interior design documentation have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Interior design documentation can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting interior design
    documentation remain human.
questions:
  - >-
    Which unresolved condition can stop interior design documentation before
    work begins?
  - >-
    Which record proves interior design documentation was accepted before it
    was covered, loaded, energized, occupied, or handed over?
