    note: shipper charge less purchased carrier cost and load-specific
      accessorials
  - id: contract-lanes
    note: repeated capacity arranged against agreed shipper rates and
      service expectations
  - id: managed-transportation
    note: broader coordination and reporting fees across a shipper's
      load book
