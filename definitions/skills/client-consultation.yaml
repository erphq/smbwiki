id: client-consultation
name: Client consultation
kind: skill
department: sales
summary: >
  Client consultation turns a booked service and prior history into an
  agreed result the stylist can execute within the client's current hair
  condition, available time, maintenance tolerance, and budget. For
  chemical and color work, the recorded formula preserves the technical
  plan for later visits.
inputs: [appointment-record, client-profile]
outputs: [formula-card]
steps:
  - name: Reconfirm the booked work
    role: stylist
    consumes: [appointment-record, client-profile]
    note: >
      The client describes the desired change while the stylist reviews
      prior services, sensitivities, home care, and known formula history.
  - name: Assess current condition
    role: stylist
    note: >
      Hair and scalp condition, existing color, length, density, texture,
      and integrity set the safe technical range.
  - name: Agree on the service plan
    role: stylist
    note: >
      Result, limitations, maintenance, service sequence, timing, and
      price assumptions are clear before preparation begins.
  - name: Record the formula
    role: stylist
    produces: [formula-card]
    note: >
      Product, shade, ratio, placement, processing, and adaptation are
      specific enough for the result to be reviewed later.
tension: >
  Desired change competes with hair condition and repeatability. The
  client may want a larger result in one visit; the service has to remain
  inside what the current hair and recorded plan can support.
failure_modes:
  - name: Reference image becomes the specification
    cost: >
      Hair history, starting condition, and maintenance requirements are
      ignored while both parties imagine different versions of the result.
    signal: >
      The plan records an image and service name with no condition or
      limitation notes.
  - name: Prior chemical history incomplete
    cost: >
      The planned process reacts unpredictably or causes avoidable damage.
    signal: >
      Existing color or texture service is visible while the profile
      history is blank.
  - name: Formula lacks placement detail
    cost: >
      The next visit repeats products but produces a different result.
    signal: >
      The card lists shades and ratios without section, placement, timing,
      or root and length treatment.
maturity:
  - level: run badly
    looks_like: >
      Consultation is a short preference question and technical decisions
      are made after the service clock has started.
  - level: run well
    looks_like: >
      Desired result, current condition, limitations, price, maintenance,
      and technical plan are agreed and recorded before service.
  - level: run excellently
    looks_like: >
      Prior outcomes improve the next formula, condition changes are
      visible, and the client can explain the staged result and home care.
competencies:
  - name: Visual translation
    note: >
      The stylist converts the client's words and references into shape,
      tone, placement, texture, and maintenance decisions.
  - name: Condition judgment
    note: >
      Technical ambition has to be adjusted to the hair and scalp present
      today.
automation:
  now: >
    History retrieval, consultation forms, photo records, formula storage,
    service timing, product calculation, and maintenance reminders.
  human: >
    Condition assessment, expectation alignment, aesthetic judgment,
    touch, consent, and responsibility for the technical plan.
questions:
  - What limitation or maintenance requirement did the client agree to?
  - Could another stylist understand the placement and processing from the formula card?
article:
  what: >
    The client consultation process happens in the chair before any
    product is mixed. It takes the appointment record and the client
    profile, adds what the stylist sees and feels today, and produces an
    agreed service plan and a formula card another stylist could
    execute. It starts when the client sits down and ends when result,
    limits, price, and maintenance are agreed and the formula is
    written. The stylist owns it in a hair salon or barber shop; the
    technician owns the equivalent in a nail salon.
  why: >
    It protects the hair and the relationship at once. A reference photo
    treated as the specification ignores the starting condition and
    chemical history, and both parties leave imagining different
    results. A blank history next to visibly processed hair means the
    planned service can react unpredictably and cause avoidable damage.
    A formula card with shades and ratios but no placement, timing, or
    root and length treatment means the next visit repeats products and
    produces a different result, and the client experiences that as
    inconsistency.
  how: >
    The stylist reconfirms the booked work with the appointment record
    and client profile open: the client describes the desired change
    while prior services, sensitivities, home care, and known formula
    history are reviewed. Current condition is assessed by hand and eye,
    with hair and scalp condition, existing color, length, density,
    texture, and integrity setting the safe technical range. The service
    plan is agreed, covering result, limitations, maintenance, service
    sequence, timing, and price assumptions, before any preparation
    begins. The formula is then recorded on the formula card with
    product, shade, ratio, placement, processing, and adaptation
    specific enough to be reviewed at the next visit.
  controls:
    - name: Chemical history confirmed against visible hair
      note: >
        Where processed hair is visible and the profile history is
        blank, the stylist records what the client reports before
        choosing a process.
    - name: Limitation and maintenance noted with the plan
      note: >
        The agreed plan records at least one limitation and the
        maintenance the client accepted, alongside any reference
        image.
    - name: Price assumption stated before preparation
      note: >
        Service sequence and the price it implies are confirmed with
        the client before product is mixed or timing starts.
    - name: Formula card complete for another stylist
      note: >
        Placement, sectioning, processing time, and root versus
        length treatment are written so a different stylist could
        reproduce the result.
