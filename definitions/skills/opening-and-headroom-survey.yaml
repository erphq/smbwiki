id: opening-and-headroom-survey
name: Opening and headroom survey
kind: skill
department: operations
summary: >-
  Measures width, height, jamb and header condition, headroom, backroom,
  sideroom, floor, track conflicts, power, and operator location. Opening and
  headroom survey leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - work-order
outputs:
  - commissioning-record
steps:
  - name: Confirm the work basis
    note: >-
      Before opening and headroom survey, read the current scope and
      revisions, then verify verified opening and structure, selected door and
      operator, electrical provision, hardware, spring design, access, and
      site protection.
  - name: Set the field controls
    note: >-
      Translate opening and headroom survey into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During opening and headroom survey, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept opening and headroom survey, check the completed work against
      secure attachment, balanced travel, correct clearances, functional
      controls, entrapment protection, manual release, seals, and owner
      instruction, then close correction and issue the resulting record.
tension: >-
  Opening and headroom survey has to remain inside its acceptance basis while
  production moves. A door can cycle under power while its spring balance,
  attachment, or safety reversal remains unsafe.
failure_modes:
  - name: Opening and headroom survey starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      opening and headroom survey is settled.
    signal: >-
      The opening and headroom survey work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Opening and headroom survey closes without evidence
    cost: >-
      A concealed condition or required result from opening and headroom
      survey cannot be verified without opening, repeat work, delay, or a
      disputed exception.
    signal: >-
      Opening and headroom survey is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Opening and headroom survey is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Opening and headroom survey starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Opening and headroom survey uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Overhead-door balance and safety control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of opening and headroom survey.
  - name: Evidence control
    note: >-
      Acceptance checks for opening and headroom survey have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Opening and headroom survey can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting opening and headroom survey
    remain human.
questions:
  - >-
    Which unresolved condition can stop opening and headroom survey before
    work begins?
  - >-
    Which record proves opening and headroom survey was accepted before it was
    covered, loaded, energized, occupied, or handed over?
