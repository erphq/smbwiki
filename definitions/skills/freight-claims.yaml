id: freight-claims
name: Freight claims
kind: skill
department: finance
summary: >
  Freight claims preserves and organizes evidence of loss, damage,
  shortage, or service failure, provides required notice, identifies the
  contractual and custody path, states the claimed value, and follows the
  matter through acceptance, denial, settlement, or other closure.
inputs: [bill-of-lading, proof-of-delivery]
outputs: [freight-claim]
steps:
  - name: Preserve the exception record
    role: claims-coordinator
    consumes: [bill-of-lading, proof-of-delivery]
    note: >
      Pickup condition, seals, counts, delivery notation, photos,
      temperature or handling data, packaging, and communication are
      secured while evidence is available.
  - name: Establish notice and custody
    role: claims-coordinator
    note: >
      Parties, contract, cargo owner, carrier, dates, transfer points, and
      required notice routes determine who must act next.
  - name: Quantify and file
    role: claims-coordinator
    produces: [freight-claim]
    note: >
      Items, quantity, value basis, salvage, mitigation, requested remedy,
      evidence, and filing date form one claim package.
  - name: Work the resolution
    role: claims-coordinator
    note: >
      Acknowledgement, information requests, investigation, reserve,
      customer communication, carrier response, settlement, and closure
      retain owners and dates.
tension: >
  Fast freight and account closure compete with preserving evidence and
  rights after an exception. Operational teams want to move the next load;
  lost notation, product condition, notice, or custody detail cannot be
  recreated when the claim is challenged.
failure_modes:
  - name: Delivery exception lacks notation
    cost: >
      The receiving record appears clean while later photos or counts claim
      damage or shortage.
    signal: >
      Customer reports a problem after signing proof with no exception.
  - name: Mitigation and salvage unmanaged
    cost: >
      Recoverable value deteriorates and claimed loss increases without a
      documented reason.
    signal: >
      Damaged freight has no location, preservation instruction, decision
      owner, or disposition.
  - name: Claim waits on an undefined document
    cost: >
      Filing or response time passes while every party assumes another
      person is collecting the evidence.
    signal: >
      Open claim status says pending documents and omits item, owner, and
      due date.
maturity:
  - level: run badly
    looks_like: >
      Claims begin from customer email after delivery and the coordinator
      searches load messages for evidence.
  - level: run well
    looks_like: >
      Exception notation, evidence, notice, custody, value, mitigation,
      filing, communication, and resolution share one claim record.
  - level: run excellently
    looks_like: >
      Claim causes change carrier, shipper, packaging, facility, and
      execution controls, while exposure and recovery remain visible by load.
competencies:
  - name: Evidence reconstruction
    note: >
      The coordinator builds a time and custody record from documents,
      images, condition data, communication, and party statements.
  - name: Commercial claims judgment
    note: >
      Liability, contract, value, mitigation, relationship, and recovery
      options have to be managed together without inventing certainty.
automation:
  now: >
    Exception intake, document collection, notice templates, claim
    packages, deadlines, reserves, status queues, and communication history.
  human: >
    Evidence quality, liability interpretation, mitigation, negotiation,
    customer and carrier communication, and settlement authority.
questions:
  - What evidence needed for the oldest open claim is still at risk of disappearing?
  - Which claim cause should change how the next similar load is handled?
article:
  what: >
    The freight claims process is how a freight brokerage handles a load
    that arrived damaged, short, lost, or late: the evidence is secured
    while it still exists, the right parties are put on notice in the
    right time, the loss is valued, the claim is filed as one package, and
    the matter is worked to acceptance, denial, settlement, or another
    closure. It starts the moment an exception is reported, usually by the
    consignee or the carrier at delivery, and ends when the claim record
    is closed with the outcome and the cause. The claims coordinator owns
    it, with the account owner handling the customer conversation.
  why: >
    The brokerage stands between a shipper who lost product and a carrier
    whose insurer will look for any reason to deny. Once the next load
    moves, the delivery notation, the photos, the temperature data, and
    the salvage disposition cannot be recreated, and a claim without them
    is a customer relationship the brokerage pays for out of margin. The
    process protects recovery from the carrier, the shipper's confidence
    that the brokerage will stand behind a load, and the operating changes
    that stop the same exception from recurring on the same lane or
    facility.
  how: >
    The claims coordinator preserves the exception record first: the bill
    of lading and proof of delivery with their notations, seal and count
    records, photos, temperature or handling data, packaging, and every
    message about the load are secured while they are available. The
    coordinator then establishes notice and custody: who the parties are,
    which contract governs, who owns the cargo, which carrier had custody
    at which transfer point, and which notice deadlines apply, so the next
    action has a name and a date. The claim is quantified and filed as one
    package with items, quantity, value basis, salvage and mitigation,
    requested remedy, evidence, and filing date, producing the freight
    claim. Resolution is then worked: acknowledgement, information
    requests, the carrier's investigation, a reserve on the brokerage's
    books, customer communication, carrier response, settlement, and
    closure each carry an owner and a date until the record is closed.
  controls:
    - name: Exception evidence secured on report
      note: Bill of lading and proof of delivery notations, photos, and condition data are collected and attached to the claim record the day the exception is reported.
    - name: Notice deadline tracked by party
      note: Each party's notice and filing deadline is recorded on the claim with the date notice was sent and to whom.
    - name: Salvage and mitigation decision on record
      note: Damaged freight has a location, a preservation instruction, a named decision owner, and a disposition before value is claimed.
    - name: Single claim package
      note: Value basis, evidence, remedy, and filing date go out together, and the package version sent to the carrier is retained.
    - name: Open claim status with owner and due date
      note: Every open claim states its next item, who owns it, and when it is due, so nothing waits on an undefined document.
