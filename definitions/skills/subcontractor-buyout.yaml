id: subcontractor-buyout
name: Subcontractor buyout
kind: skill
department: supply
summary: >-
  Reconciles exclusions, alternates, schedule duties, insurance, manpower,
  submittals, and closeout before a trade subcontract is executed.
  Subcontractor buyout leaves a current work basis, a field record, and
  acceptance evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - closeout-package
steps:
  - name: Confirm the work basis
    note: >-
      Before subcontractor buyout, read the current scope and revisions, then
      verify issued bid documents, coordinated trade boundaries, contractual
      dates, review routes, and owner decisions.
  - name: Set the field controls
    note: >-
      Translate subcontractor buyout into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During subcontractor buyout, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept subcontractor buyout, check the completed work against
      contract documents, authority approvals, designer review, tested
      systems, and owner turnover criteria, then close correction and issue
      the resulting record.
tension: >-
  Subcontractor buyout has to remain inside its acceptance basis while
  production moves. An unresolved scope boundary or late technical decision
  can move cost and time into field rework.
failure_modes:
  - name: Subcontractor buyout starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      subcontractor buyout is settled.
    signal: >-
      The subcontractor buyout work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Subcontractor buyout closes without evidence
    cost: >-
      A concealed condition or required result from subcontractor buyout
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Subcontractor buyout is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Subcontractor buyout is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Subcontractor buyout starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Subcontractor buyout uses field evidence, production variance, defects,
      and closeout results to improve the next estimate, work package, and
      control point.
competencies:
  - name: Commercial project controls
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of subcontractor buyout.
  - name: Evidence control
    note: >-
      Acceptance checks for subcontractor buyout have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Subcontractor buyout can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting subcontractor buyout remain
    human.
questions:
  - >-
    Which unresolved condition can stop subcontractor buyout before work
    begins?
  - >-
    Which record proves subcontractor buyout was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The subcontractor buyout process closes the gap between a trade bid
    and an executed subcontract on a commercial project. It reconciles
    exclusions and alternates against the drawings and the other trades,
    settles schedule duties, insurance, manpower, submittal
    responsibilities, and closeout obligations, and writes them into a
    contract before the trade mobilizes. It starts once the bid
    documents, trade boundaries, and contract dates are settled and ends
    when the trade's obligations have been carried through to the
    closeout package. A commercial general contractor owns it through
    the project manager or a dedicated buyout estimator.
  why: >
    It protects the project budget and the schedule from scope that fell
    between trades. An electrical bid that excludes the fire alarm
    conduit the fire alarm bid assumed, a drywall subcontract silent on
    who patches after the mechanical rough-in, or an insurance
    certificate that lapses mid-project each becomes a change order, a
    delay claim, or an uninsured loss that lands on the general
    contractor. Buyout is also where the profit on a job is made or
    lost, because every unresolved exclusion is money the general
    contractor will pay again.
  how: >
    The project manager reads the current scope and revisions, then
    confirms issued bid documents, coordinated trade boundaries,
    contractual dates, review routes, and owner decisions before
    starting buyout. The buyout is set out as work limits by trade
    package, a sequence that follows the schedule's need dates,
    responsibilities between estimating, project management, and the
    office, hold points where scope is reconciled before award, and the
    buyout log and scope sheets everyone uses. During the work the
    project manager reconciles each bid's exclusions and alternates
    against the drawings and neighboring trades, negotiates schedule
    duties, insurance, manpower, submittals, and closeout, records
    decisions and price movements, and stops when an owner decision or a
    design change alters the package. At acceptance each subcontract is
    checked against contract documents, authority approvals, designer
    review, tested systems, and owner turnover criteria, open items are
    closed, and the trade's contribution enters the closeout package.
  controls:
    - name: Scope sheet per trade reconciled to neighbors
      note: Each trade's inclusions and exclusions are written on a scope sheet and compared line by line with adjoining trades before award.
    - name: Buyout log with budget variance
      note: Every package records the budget, the awarded value, and the reason for any difference, and the operations lead reviews it.
    - name: Insurance and license verified before execution
      note: Certificates, endorsements, and licenses are on file and current before the subcontract is signed by either party.
    - name: Schedule and submittal duties written into the contract
      note: Milestone dates, manpower commitments, and submittal deadlines are contract exhibits, never assumptions carried in email.
    - name: Closeout obligations listed at award
      note: Warranties, as-builts, training, and attic stock are listed in the subcontract so the closeout package can be assembled from it.
