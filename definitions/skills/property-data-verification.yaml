id: property-data-verification
name: Property data verification
kind: skill
department: operations
summary: >-
  Inspects the property, checks public and private records, confirms physical
  and legal characteristics, and resolves material discrepancies. Property
  data verification leaves a current work basis, a field record, and
  acceptance evidence that another operator can trace.
inputs:
  - engagement-letter
outputs:
  - appraisal-report
steps:
  - name: Confirm the work basis
    note: >-
      Before property data verification, read the current scope and revisions,
      then verify identified client and intended use, property rights,
      effective date, assignment conditions, access, market data, and
      competent appraiser.
  - name: Set the field controls
    note: >-
      Translate property data verification into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During property data verification, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept property data verification, check the completed work against
      credible supported analyses, disclosed scope and assumptions, reconciled
      value opinion, compliant report, and signed delivery, then close
      correction and issue the resulting record.
tension: >-
  Property data verification has to remain inside its acceptance basis while
  production moves. Weak property or market verification can make a polished
  value conclusion unsupported.
failure_modes:
  - name: Property data verification starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      property data verification is settled.
    signal: >-
      The property data verification work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Property data verification closes without evidence
    cost: >-
      A concealed condition or required result from property data verification
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Property data verification is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Property data verification is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Property data verification starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Property data verification uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Real property valuation and evidence reconciliation
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of property data verification.
  - name: Evidence control
    note: >-
      Acceptance checks for property data verification have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Property data verification can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting property data verification
    remain human.
questions:
  - >-
    Which unresolved condition can stop property data verification before work
    begins?
  - >-
    Which record proves property data verification was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The property data verification process is the appraiser's check that
    the subject property is what the records and the client say it is.
    It begins when an engagement letter names the client, intended use,
    property rights, and effective date, and it ends when physical and
    legal characteristics have been inspected, compared with public and
    private records, reconciled where they disagree, and carried into the
    appraisal report with the evidence behind them. In a real estate
    appraisal firm it is owned by the appraiser signing the report, with
    a supervising appraiser accepting the work when the firm requires
    one.
  why: >
    A value opinion is only as good as the property facts under it. A
    wrong living area, an unrecorded easement, a zoning classification
    taken from a listing, or a condition rating assigned from the curb
    makes a polished report unsupported and exposes the appraiser and the
    firm to a review finding or a claim. The process forces the
    discrepancies to surface while the property can still be revisited
    and the records rechecked, and it leaves a field record that another
    appraiser can trace when the report is questioned.
  how: >
    The appraiser first confirms the work basis from the engagement
    letter: the identified client and intended use, the property rights
    appraised, the effective date, assignment conditions, access
    arrangements, available market data, and the appraiser's own
    competence for the property type. The field controls then set what
    will be measured, photographed, and checked against which records,
    and where the appraiser will stop and consult the client, for example
    when access is refused or the legal description does not match the
    site. During the inspection and records work the appraiser records
    measurements, observations, record sources, and decisions, and pauses
    when a finding changes the planned method. Acceptance checks the
    completed work against credible supported analyses, disclosed scope
    and assumptions, a reconciled value opinion, and a compliant report
    before the signed appraisal report is delivered and any correction is
    closed.
  controls:
    - name: Engagement basis confirmed before inspection
      note: Client, intended use, property rights, effective date, and assignment conditions are recorded from the engagement letter before any fieldwork begins.
    - name: Record source logged for each fact
      note: Every physical and legal characteristic in the report names the record or observation it came from, so a reviewer can retrace it.
    - name: Material discrepancy resolved or disclosed
      note: A conflict between inspection, public record, and client information is reconciled in the file or disclosed as an assumption before the value is reconciled.
    - name: Field record retained with photographs
      note: Measurements, sketches, photographs, and inspection date are kept in the workfile so the report can be defended after delivery.
    - name: Review before signature
      note: A second appraiser or the signing appraiser's own checklist confirms scope, assumptions, analyses, and compliance before the report is signed and delivered.
