id: maintenance-agreements
name: Maintenance agreements
kind: skill
department: maintenance
summary: >
  Maintenance agreements define and deliver recurring service obligations
  for installed systems or equipment. Visit scope, frequency, covered
  assets, priority terms, exclusions, price, renewal, and customer duties
  become future work the operating calendar must reserve.
inputs: []
outputs: [service-agreement]
steps:
  - name: Define the service promise
    note: >
      Covered assets, visit work, frequency, access, priority, exclusions,
      price, renewal, and cancellation are matched to real service capacity.
  - name: Present the agreement
    note: >
      The customer can separate included maintenance from repairs,
      emergency response, material, and code or upgrade work.
  - name: Activate the obligation
    produces: [service-agreement]
    note: >
      Asset list, start, renewal, billing, visit cadence, contact, and
      priority state enter the system that will create future work.
  - name: Deliver and record visits
    note: >
      Completed service, findings, declined recommendations, asset change,
      and next due date update the agreement record.
  - name: Review renewal
    note: >
      Scope, asset count, price, visit completion, and open issues are
      reviewed before a new term begins.
tension: >
  Recurring revenue competes with future service capacity and promise
  integrity. Each agreement smooths demand and strengthens the customer
  relationship; every included visit and priority term consumes a future
  slot that must be protected.
failure_modes:
  - name: Agreement sold beyond capacity
    cost: >
      Included visits and priority access crowd the calendar or arrive
      later than the customer was promised.
    signal: >
      Due agreement work grows while available recurring-service slots
      remain unchanged.
  - name: Covered assets drift
    cost: >
      Staff service equipment absent from the price or overlook equipment
      the customer expects to be included.
    signal: >
      Field notes and agreement asset list describe different systems.
  - name: Renewal hides missed obligation
    cost: >
      The customer pays for another term while prior included visits or
      unresolved findings remain open.
    signal: >
      Renewal becomes eligible before visit completion is reconciled.
maturity:
  - level: run badly
    looks_like: >
      Agreements are sold as discounts and staff search for customers to
      schedule when the season slows.
  - level: run well
    looks_like: >
      Scope, assets, due dates, priority, completed visits, findings,
      billing, and renewal share one agreement record.
  - level: run excellently
    looks_like: >
      Agreement count is planned against calendar capacity, field outcomes
      update covered assets, and renewal addresses every missed promise.
competencies:
  - name: Promise design
    note: >
      The operator turns maintenance value into specific obligations the
      schedule, technician, and customer can all recognize.
  - name: Capacity stewardship
    note: >
      Recurring work needs protected future capacity through both quiet
      periods and seasonal demand peaks.
automation:
  now: >
    Agreement templates, asset registers, recurring billing, due-date
    generation, scheduling campaigns, priority flags, and renewal queues.
  human: >
    Scope and asset judgment, capacity planning, field findings,
    exceptions, pricing changes, and renewal conversations after a missed
    obligation.
questions:
  - How many included visits are currently due without a protected slot?
  - Does each renewal account for completed visits and the current asset list?
article:
  what: >
    The maintenance agreements process is how an HVAC contractor, a
    landscaping company, a managed IT service provider, or a pest
    control company sells and delivers a recurring service promise:
    which assets are covered, what each visit includes, how often, what
    priority the customer gets, what is excluded, what it costs, and
    how it renews. It begins when a promise is designed against real
    capacity and ends, for each term, when renewal is reviewed against
    completed visits and open findings. The owner or service manager
    designs and prices the agreement; the office schedules and records
    the visits.
  why: >
    It protects both the customer's expectation and the calendar that
    has to honor it. Agreements sold as discounts without regard to
    capacity crowd the schedule and arrive late; asset lists that drift
    from what the technician actually services create either unbilled
    work or a customer who expected a system to be included; renewals
    that go out before visit completion is reconciled bill the customer
    for another term while last term's obligation is still open.
  how: >
    The service manager defines the promise first, matching covered
    assets, visit work, frequency, access, priority, exclusions, price,
    renewal, and cancellation to the capacity the calendar can protect.
    The agreement is presented so the customer can distinguish included
    maintenance from repairs, emergency response, material, and code or
    upgrade work. On activation, the asset list, start, renewal date,
    billing, visit cadence, contact, and priority state enter the
    system that will generate future work orders, and the service
    agreement becomes the record. Each visit updates that record with
    completed service, findings, declined recommendations, asset
    changes, and the next due date. Before a new term, scope, asset
    count, price, visit completion, and open issues are reviewed and
    the renewal is adjusted.
  controls:
    - name: Capacity check before sale
      note: Included visits and priority slots are counted against protected calendar capacity before a new agreement is activated.
    - name: Asset list reconciled after each visit
      note: The technician's visit record and the agreement's covered assets are compared, and differences are corrected or priced.
    - name: Due visits tracked with a protected slot
      note: Every included visit that is due appears in a queue with a scheduled date, and overdue visits have an owner.
    - name: Renewal blocked until obligations reconcile
      note: Renewal cannot issue until completed visits, open findings, and asset changes for the ending term are reviewed and recorded.
    - name: Included and excluded work stated on the agreement
      note: The signed agreement lists exclusions and how repairs and emergency calls are billed, so field staff and customer read the same terms.
