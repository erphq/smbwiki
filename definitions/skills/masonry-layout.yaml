id: masonry-layout
name: Masonry layout
kind: skill
department: operations
summary: >-
  Establishes coursing, bond, openings, control joints, corners, elevations,
  and interface dimensions before units are laid. Masonry layout leaves a
  current work basis, a field record, and acceptance evidence that another
  operator can trace.
inputs:
  - construction-plan
outputs:
  - quality-report
steps:
  - name: Confirm the work basis
    note: >-
      Before masonry layout, read the current scope and revisions, then verify
      approved sample, sound support, control lines, unit and mortar supply,
      weather protection, embeds, and interface details.
  - name: Set the field controls
    note: >-
      Translate masonry layout into work limits, sequence, responsibilities,
      hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During masonry layout, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept masonry layout, check the completed work against line, level,
      plumb, bond, joint profile, reinforcement, flashing, drainage, cleaning,
      and specified appearance, then close correction and issue the resulting
      record.
tension: >-
  Masonry layout has to remain inside its acceptance basis while production
  moves. Masonry locks layout, structure, weather control, and visible finish
  into the same installed work.
failure_modes:
  - name: Masonry layout starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      masonry layout is settled.
    signal: >-
      The masonry layout work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Masonry layout closes without evidence
    cost: >-
      A concealed condition or required result from masonry layout cannot be
      verified without opening, repeat work, delay, or a disputed exception.
    signal: >-
      Masonry layout is released while its required check, location record,
      test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Masonry layout is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Masonry layout starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Masonry layout uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Masonry material and bond control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of masonry layout.
  - name: Evidence control
    note: >-
      Acceptance checks for masonry layout have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Masonry layout can use digital revisions, checklists, hold points, photo
    capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting masonry layout remain human.
questions:
  - Which unresolved condition can stop masonry layout before work begins?
  - >-
    Which record proves masonry layout was accepted before it was covered,
    loaded, energized, occupied, or handed over?
