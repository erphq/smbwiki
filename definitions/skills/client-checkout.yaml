id: client-checkout
name: Client checkout
kind: skill
department: finance
summary: >
  Client checkout turns the completed service ticket into an accurate
  invoice and payment, explains product and home-care recommendations,
  records retail items, and handles rebooking while the service history
  is current.
inputs: [service-ticket]
outputs: [customer-invoice, payment-record]
steps:
  - name: Review the completed ticket
    role: salon-coordinator
    consumes: [service-ticket]
    note: >
      Delivered services, add-ons, products used, retail items, deposit,
      discount, and provider attribution are settled before totaling.
  - name: Present and issue the invoice
    role: salon-coordinator
    produces: [customer-invoice]
    note: >
      The client sees the final service and retail lines with any change
      from the original appointment explained.
  - name: Collect and record payment
    role: salon-coordinator
    produces: [payment-record]
    note: >
      Tender, gratuity, gift balance, package credit, and change reconcile
      to the invoice once.
  - name: Close the service relationship
    role: stylist
    note: >
      Home care, product use, timing for the next service, and any
      correction concern have a clear route after the client leaves.
tension: >
  Fast chair and counter release compete with accurate closeout and
  continuity. A hurried total frees the next appointment; missed ticket
  changes or vague follow-up create disputes and weaken the next visit.
failure_modes:
  - name: Ticket changes reach checkout verbally
    cost: >
      The coordinator charges from incomplete information and the client
      hears a price change without a durable service record.
    signal: >
      Staff edit invoice lines while asking the stylist what was done.
  - name: Retail sale loses product guidance
    cost: >
      The client buys an item without knowing frequency, amount, or fit
      with the service result.
    signal: >
      Retail lines appear with no recommendation in the service ticket.
  - name: Correction concern becomes a future surprise
    cost: >
      A client leaves uncertain about the result and contacts the salon
      after the team has lost the service context.
    signal: >
      Checkout notes mention dissatisfaction with no owner or response
      date.
maturity:
  - level: run badly
    looks_like: >
      The register reconstructs the service from the appointment and the
      stylist's memory while another client waits.
  - level: run well
    looks_like: >
      Ticket, invoice, payment, retail guidance, provider credit, and
      follow-up agree before the client leaves.
  - level: run excellently
    looks_like: >
      Checkout exceptions correct booking and service records, correction
      concerns receive immediate ownership, and rebooking uses the actual
      service interval.
competencies:
  - name: Service reconciliation
    note: >
      The coordinator connects what was booked, performed, discounted,
      sold, paid, and attributed without asking the client to resolve gaps.
  - name: Continuity handoff
    note: >
      Home care and rebooking have to reflect the technical work and the
      client's response at the end of the visit.
automation:
  now: >
    Ticket-to-invoice conversion, package and gift balances, payment,
    gratuity, receipts, product records, and rebooking prompts.
  human: >
    Explaining changes, resolving a charge, recognizing dissatisfaction,
    product guidance, and choosing the next appropriate service timing.
questions:
  - Which invoice line required verbal reconstruction from the stylist?
  - Does every correction concern leave checkout with an owner and response time?
article:
  what: >
    The client checkout process closes a visit: it takes the completed
    service ticket and turns it into an invoice the client understands,
    a payment record that reconciles once, product guidance the client
    can follow at home, and a next appointment set from the real service
    interval. It starts when the provider marks the ticket complete and
    ends when the client leaves with a receipt and a follow-up route. A
    hair salon, a day spa, or a pet grooming business runs it through
    the front desk coordinator, with the stylist or technician closing
    the relationship side.
  why: >
    It protects the price the client was quoted and the result the
    provider just delivered. When ticket changes reach the desk by word
    of mouth, the coordinator totals from guesswork and the client hears
    a new price with nothing to back it. A retail item rung up without
    guidance goes home unused and comes back as a complaint. A hesitant
    client whose concern is noted with no owner calls a week later,
    after the team has lost the context. Each is a small dispute that
    costs the next booking.
  how: >
    The salon coordinator reviews the completed service ticket first,
    settling delivered services, add-ons, products used, retail items,
    deposit, discount, and provider attribution before totaling. The
    customer invoice is presented and issued with final service and
    retail lines and any change from the original appointment explained
    to the client. Payment is collected and the payment record
    reconciles tender, gratuity, gift balance, package credit, and
    change to the invoice exactly once. The stylist then closes the
    service relationship: home care, product use, timing for the next
    service, and any correction concern get a clear route, and the
    rebooking uses the actual service interval.
  controls:
    - name: Ticket changes recorded by the provider
      note: >
        Any service added, dropped, or discounted is written on the
        service ticket by the provider before the client reaches the
        desk.
    - name: Invoice presented with changes explained
      note: >
        The client sees each line and hears the reason for any
        difference from the booked service before payment is taken.
    - name: Single reconciliation of tender to invoice
      note: >
        Tender, gratuity, gift and package credits, and change are
        reconciled to the invoice once, and the payment record is
        closed at that moment.
    - name: Retail line carries a recommendation
      note: >
        Every retail item on the invoice links to a recommendation
        on the service ticket with use frequency and amount.
    - name: Correction concern owned before departure
      note: >
        A noted dissatisfaction leaves checkout with a named owner
        and a response date, visible to the next shift.
