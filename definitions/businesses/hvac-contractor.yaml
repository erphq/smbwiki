id: hvac-contractor
name: HVAC Contractor
codes:
  naics: "238220"
catalog_group: construction-property
extends: field-services-base
summary: >
  An HVAC contractor runs service calls, replacement or installation
  projects, and recurring maintenance agreements. Intake and dispatch
  route demand work to technicians. Installation work moves through
  survey, calculation, quote, supply, permit, crew scheduling,
  commissioning, inspection, and handoff.

  Available capacity depends on technician qualification, truck stock,
  equipment supply, travel, customer access, and seasonal demand.
  Agreement visits and urgent calls draw from the same calendar, while
  installation projects require a separate readiness view. Diagnostic
  evidence, readings, scope changes, startup results, and inspection
  state return from the field on the job record.
revenue_model:
  - id: service-calls
    note: repair work, dispatched against truck capacity; margin is in
      diagnosis speed and first-time fix
  - id: install-projects
    note: replacements and new construction; equipment cost flows
      through, labor and close rate carry the margin
  - id: maintenance-agreements
    note: seasonal tune-ups sold as priority-access plans; the
      seasonality damper and the service-to-install lead funnel
  - remove: [quoted-projects]
skills:
  - ref: quoting
    roles: [comfort-advisor]
    documents: [quote, load-calculation]
    metrics: [quote-win-rate]
    software: [field-service-management]
  - ref: maintenance-agreements
    roles: [office-manager, technician]
    documents: [service-agreement]
    metrics: [agreement-count, agreement-renewal-rate]
    software: [field-service-management]
  - ref: install-project
    roles: [lead-technician, technician]
    documents: [work-order, permit, load-calculation]
    metrics: [install-gross-margin]
    software: [field-service-management]
  - ref: permits-inspections
    roles: [office-manager]
    documents: [permit]
    software: [field-service-management]
org:
  - role: owner-operator
    reports:
      - role: office-manager
      - role: dispatcher
      - role: comfort-advisor
      - role: lead-technician
        reports:
          - role: technician
licenses:
  us:
    - ref: hvac-contractor-license
      requirement: conditional
      condition: Required only where the state or locality licenses the covered mechanical contracting work.
      as_of: "2026-07-29"
    - ref: epa-608
      requirement: conditional
      condition: Required for technicians who maintain, service, repair, or dispose of equipment in ways covered by federal refrigerant rules.
      as_of: "2026-07-29"
supply_chain:
  buys_from: [hvac-distributor]
  sells_to: [homeowner, property-management-company, general-contractor]
products: [gas-furnace, heat-pump, mini-split-heat-pump, air-conditioner]
seo:
  title: "HVAC Contractor: How the Business Works | smbwiki"
article:
  operating_model: >
    An HVAC contractor runs three kinds of work from one calendar:
    service calls dispatched the same day, replacement and installation
    projects that move through survey, load calculation, quote,
    equipment order, permit, install, and inspection, and maintenance
    agreements that put tune-up visits into the shoulder seasons. The
    office manager takes job requests and manages permits and
    agreements, the dispatcher fills technician days and routes trucks,
    the comfort advisor surveys and quotes replacements, and technicians
    diagnose, repair, and install. Dispatch, field job execution, and
    quoting are the load-bearing skills, with maintenance agreements as
    the base that keeps technicians busy when the weather is mild. The
    tension is seasonal: heat waves and cold snaps bring more calls than
    the trucks can run, and the same technicians who could be installing
    a quoted system are pulled onto no-cool calls, so install dates slip
    while service revenue spikes.
  starting: >
    Day-one paperwork is business registration, employer registration,
    general liability and workers compensation insurance, and the
    mechanical or HVAC contractor license that most states or cities
    require, usually with an exam, experience proof, and a bond; every
    technician who handles refrigerant needs the federal refrigerant
    handling certification, and gas work may require a separate gas
    fitter credential depending on the state. Sales tax registration
    applies where installed equipment or parts are taxable, and permits
    are pulled per installation with the local building department.
    Capital is service trucks stocked with common parts, recovery
    machines, gauges, vacuum pumps, and brazing equipment, a distributor
    account for equipment with credit terms, and field service software
    that handles dispatch, quotes, and agreements. The minimum team is
    an owner who sells and installs, one technician, and an office
    manager who dispatches; the comfort advisor role is split off once
    install volume justifies it. The first records are the job request,
    the work order with diagnostic readings and job photos, the quote
    with a load calculation, the service agreement, the permit, and the
    customer invoice. Lead intake, dispatch, field job execution,
    quoting, and invoicing must work from the first call.
  economics: >
    Revenue is service calls, install projects, and maintenance
    agreements, and each has a different margin. Service is priced per
    call plus flat-rate repair pricing, and its margin is in diagnosis
    speed and first-time fix, because a return trip costs a second truck
    roll against the same ticket. Install projects are priced per system
    with equipment cost passed through at a markup; labor and close rate
    carry the margin, which is why install gross margin is tracked
    separately from service. Agreements are priced per year and are thin
    on their own but feed replacement leads and smooth the calendar. The
    metrics that decide profit are jobs per technician day, first-time
    fix rate, callback rate, quote win rate, and install gross margin,
    with agreement count and renewal rate as the leading indicators of
    next year's demand. Average ticket rises with flat-rate pricing and
    add-on recommendations. The business is labor-intensive with trucks
    as the capital; margins are lost to unbilled drive time, callbacks,
    and equipment quotes that lose to a lower bidder, and are won by a
    full agreement base and a technician who fixes it the first time.
