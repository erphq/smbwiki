id: elevator-maintenance-planning
name: Elevator maintenance planning
kind: skill
department: maintenance
summary: >-
  Builds unit-specific preventive work from equipment, use, callbacks, code
  tests, known wear, access windows, and parts lead time. Elevator maintenance
  planning leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - service-ticket
outputs:
  - test-report
steps:
  - name: Confirm the work basis
    note: >-
      Before elevator maintenance planning, read the current scope and
      revisions, then verify identified unit, maintenance history, code
      status, safe access, outage coordination, parts, qualified staff, and
      rescue provisions.
  - name: Set the field controls
    note: >-
      Translate elevator maintenance planning into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During elevator maintenance planning, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept elevator maintenance planning, check the completed work
      against safe operation, required clearances and protection, corrected
      defects, recorded tests, current log, and regulatory inspection status,
      then close correction and issue the resulting record.
tension: >-
  Elevator maintenance planning has to remain inside its acceptance basis
  while production moves. An elevator can return to service while an
  intermittent control, door, braking, or leveling defect remains unresolved.
failure_modes:
  - name: Elevator maintenance planning starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      elevator maintenance planning is settled.
    signal: >-
      The elevator maintenance planning work package still has an open
      drawing, access, material, predecessor, or approval dependency when
      labor is assigned.
  - name: Elevator maintenance planning closes without evidence
    cost: >-
      A concealed condition or required result from elevator maintenance
      planning cannot be verified without opening, repeat work, delay, or a
      disputed exception.
    signal: >-
      Elevator maintenance planning is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Elevator maintenance planning is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Elevator maintenance planning starts from a checked basis, follows a
      named sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Elevator maintenance planning uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Vertical-transport diagnostics and code testing
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of elevator maintenance planning.
  - name: Evidence control
    note: >-
      Acceptance checks for elevator maintenance planning have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Elevator maintenance planning can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting elevator maintenance
    planning remain human.
questions:
  - >-
    Which unresolved condition can stop elevator maintenance planning before
    work begins?
  - >-
    Which record proves elevator maintenance planning was accepted before it
    was covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The elevator maintenance planning process builds the preventive work for
    a specific unit from what is known about it: equipment type and age,
    traffic, callback history, code test results, known wear items, the
    building's access windows, and parts lead time. It starts when a unit
    joins a route or its history changes and ends with a unit-specific task
    list, interval, and parts plan recorded against the unit. An elevator
    service contractor's service supervisor or route mechanic owns it, and
    the plan becomes the basis for each service ticket on the route.
  why: >
    A generic checklist applied to every unit leaves high-traffic doors
    under-serviced and low-traffic machines over-serviced. Callbacks then
    cluster on the units the plan ignored, and a code test fails on a wear
    item that a planned task would have caught. Parts with long lead times
    are ordered after the failure instead of before it, so the outage
    stretches. A unit whose plan is not tied to its history cannot show an
    inspector or the building owner that maintenance was adequate.
  how: >
    The planner reads the unit's scope and confirms the identified unit, its
    maintenance and callback history, code status and test dates, safe
    access, the building's outage constraints, parts availability, qualified
    staff, and rescue provisions. Field controls translate that into a task
    list by interval, the sequence a mechanic follows on site, the hold
    points where a reading decides the next task, and the records each visit
    must leave. As the plan is built the planner records the evidence behind
    each interval and stops when the unit's actual condition contradicts the
    history. Acceptance checks that the plan supports safe operation,
    required protection, correction of known defects, recorded tests, a
    current log, and the inspection calendar, and the plan is issued to the
    route.
  controls:
    - name: Plan traced to unit history
      note: Every task interval on the plan cites the callback, test, or wear evidence that set it, so a change can be argued from the record.
    - name: Code test dates on the calendar
      note: Required test dates and their preparation tasks are in the plan so the test is never a surprise to the route.
    - name: Long-lead parts identified
      note: Wear items with long lead times are listed with an order trigger so replacement happens before failure.
    - name: Access windows confirmed with the building
      note: The plan records the agreed outage windows so route tickets are scheduled inside them and the building is not surprised.
    - name: Plan reviewed after each callback
      note: A callback on a planned unit triggers a review of the plan and a recorded decision to change or keep it.
