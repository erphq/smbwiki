id: masonry-contractor
name: Masonry Contractor
codes:
  naics: '238140'
catalog_group: construction-property
extends: project-services-base
summary: >-
  A masonry contractor builds brick, block, or stone assemblies from layout,
  mortar, reinforcement, anchors, flashing, units, access, and weather
  protection. Each lift combines structure, drainage, movement joints,
  openings, and a visible finish that has to remain consistent across crews
  and material batches.


  Coursing decisions affect every elevation and interface. The foreperson
  controls corners, leads, daily height, joint tooling, cavity cleanliness,
  flashing, and protection while coordinating embeds and adjacent trades.
  Cleaning and punch work can permanently alter color or joints, so the
  approved sample remains the acceptance reference through closeout.
