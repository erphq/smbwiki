id: pre-demolition-engineering-survey
name: Pre-demolition engineering survey
kind: skill
department: operations
summary: >-
  Examines construction, condition, load paths, adjacent exposure, utilities,
  hazardous materials, and removal sequence before demolition begins.
  Pre-demolition engineering survey leaves a current work basis, a field
  record, and acceptance evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - daily-report
steps:
  - name: Confirm the work basis
    note: >-
      Before pre-demolition engineering survey, read the current scope and
      revisions, then verify completed engineering survey, utility shutdown,
      hazardous-material disposition, exclusion zones, removal sequence, and
      disposal routes.
  - name: Set the field controls
    note: >-
      Translate pre-demolition engineering survey into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During pre-demolition engineering survey, the operator records
      quantities, observations, decisions, and concealed details, and stops
      when the field condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept pre-demolition engineering survey, check the completed work
      against specified removals, stable remaining structure, protected
      services and finishes, segregated waste, clean limits, and documented
      changed conditions, then close correction and issue the resulting
      record.
tension: >-
  Pre-demolition engineering survey has to remain inside its acceptance basis
  while production moves. Unknown loads, materials, utilities, and hidden
  connections make an unplanned removal sequence dangerous and destructive.
failure_modes:
  - name: Pre-demolition engineering survey starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      pre-demolition engineering survey is settled.
    signal: >-
      The pre-demolition engineering survey work package still has an open
      drawing, access, material, predecessor, or approval dependency when
      labor is assigned.
  - name: Pre-demolition engineering survey closes without evidence
    cost: >-
      A concealed condition or required result from pre-demolition engineering
      survey cannot be verified without opening, repeat work, delay, or a
      disputed exception.
    signal: >-
      Pre-demolition engineering survey is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Pre-demolition engineering survey is driven by crew availability and
      visible completion; readiness, hold points, and acceptance evidence are
      resolved afterward.
  - level: run well
    looks_like: >-
      Pre-demolition engineering survey starts from a checked basis, follows a
      named sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Pre-demolition engineering survey uses field evidence, production
      variance, defects, and closeout results to improve the next estimate,
      work package, and control point.
competencies:
  - name: Demolition sequence and existing-condition judgment
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of pre-demolition engineering survey.
  - name: Evidence control
    note: >-
      Acceptance checks for pre-demolition engineering survey have to be
      captured while the relevant condition can still be observed and
      corrected.
automation:
  now: >-
    Pre-demolition engineering survey can use digital revisions, checklists,
    hold points, photo capture, test fields, correction assignment, and
    closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting pre-demolition engineering
    survey remain human.
questions:
  - >-
    Which unresolved condition can stop pre-demolition engineering survey
    before work begins?
  - >-
    Which record proves pre-demolition engineering survey was accepted before
    it was covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The pre-demolition engineering survey process is the examination a
    demolition contractor makes of a structure before anything is
    removed: how it was built, what condition it is in, where its loads
    travel, what adjacent property and public space are exposed, which
    utilities serve it, what hazardous materials it contains, and in
    what sequence it can be taken down safely. It starts from the
    construction plan and site records and ends with a written survey
    that fixes the removal sequence, and with daily reports during
    demolition that record whether the survey held or the conditions
    that changed it. The competent person or the project manager owns
    it.
  why: >
    It protects the crew, the neighbors, and the remaining structure
    from what cannot be seen from the sidewalk. Unknown loads, hidden
    connections, live utilities, and undisclosed asbestos or lead make
    an unplanned removal sequence dangerous, and a wall that was
    carrying more than the drawing showed comes down on the wrong side.
    The survey is also the record the regulator asks for after an
    incident, and the basis for the disposal route, so a survey done
    from memory is the difference between a defensible job and a
    stop-work order.
  how: >
    The project manager confirms the work basis: the current scope and
    revisions, the completed engineering survey, utility shutdown
    confirmations, hazardous-material disposition, exclusion zones, the
    removal sequence, and disposal routes. Field controls turn the
    survey into work limits the crew can use: which elements come down
    in what order, what stays to support what, where exclusion zones and
    protected services are, hold points before each structural stage,
    and the daily report format. During demolition the crew records
    quantities removed, observations, decisions, and concealed
    conditions found, and stops when the structure or its contents
    differ from the survey. Acceptance checks specified removals, a
    stable remaining structure, protected services and finishes,
    segregated waste, clean limits, and documented changed conditions,
    corrections are closed, and the daily report is issued.
  controls:
    - name: Survey signed before the first removal
      note: The engineering survey names its author, date, and the drawings and site records used, and demolition cannot start without it on site.
    - name: Utility shutdown confirmed in writing
      note: Each utility serving the structure has a written disconnection or isolation confirmation on file before the exclusion zone is set.
    - name: Hazardous-material disposition on record
      note: The abatement clearance or the survey finding of no hazardous material is attached to the survey before any removal begins.
    - name: Hold point before each structural stage
      note: The competent person inspects the remaining structure and adjacent exposure against the sequence before the next stage is released.
    - name: Changed condition recorded the same day
      note: A hidden load path, connection, or material found during work is written on that day's report with the revised sequence.
