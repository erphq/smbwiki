id: lot-due-diligence
name: Lot due diligence
kind: skill
department: operations
summary: >-
  Tests whether title constraints, access, utilities, drainage, soils,
  setbacks, and buildable area support the proposed house before design and
  price are committed. Lot due diligence leaves a current work basis, a field
  record, and acceptance evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - closeout-package
steps:
  - name: Confirm the work basis
    note: >-
      Before lot due diligence, read the current scope and revisions, then
      verify approved plans, lot controls, selections, permits, trade scopes,
      and long-lead dates.
  - name: Set the field controls
    note: >-
      Translate lot due diligence into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During lot due diligence, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept lot due diligence, check the completed work against the
      approved plan, inspection record, owner selections, and turnover
      requirements, then close correction and issue the resulting record.
tension: >-
  Lot due diligence has to remain inside its acceptance basis while production
  moves. A missed dependency can idle several trades and move the promised
  completion date.
failure_modes:
  - name: Lot due diligence starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for lot
      due diligence is settled.
    signal: >-
      The lot due diligence work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Lot due diligence closes without evidence
    cost: >-
      A concealed condition or required result from lot due diligence cannot
      be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Lot due diligence is released while its required check, location record,
      test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Lot due diligence is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Lot due diligence starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Lot due diligence uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Residential construction sequencing
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of lot due diligence.
  - name: Evidence control
    note: >-
      Acceptance checks for lot due diligence have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Lot due diligence can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting lot due diligence remain
    human.
questions:
  - Which unresolved condition can stop lot due diligence before work begins?
  - >-
    Which record proves lot due diligence was accepted before it was covered,
    loaded, energized, occupied, or handed over?
