id: repair-execution
name: Repair execution
kind: skill
department: operations
summary: >
  Repair execution performs the authorized mechanical, electrical, or
  body-related operation under the repair order. The technician protects
  the vehicle, follows the required procedure, records installed parts
  and test results, and returns completed scope for an independent check.
inputs: [repair-order, work-authorization]
outputs: [repair-completion]
steps:
  - name: Confirm the authorized lines
    role: automotive-technician
    consumes: [repair-order, work-authorization]
    note: >
      The technician starts from the current approved scope and stops
      when a new finding changes it.
  - name: Prepare vehicle and parts
    role: automotive-technician
    note: >
      Protection, tooling, service information, parts, and one-time-use
      items are ready before disassembly.
  - name: Perform the repair
    role: automotive-technician
    note: >
      Procedure, torque, adjustment, fluid, routing, and cleanliness
      requirements are treated as part of the operation.
  - name: Test the work
    role: automotive-technician
    note: >
      The repaired system is checked under the conditions relevant to
      the original finding before handoff.
  - name: Record completion
    role: automotive-technician
    produces: [repair-completion]
    note: >
      Work performed, parts installed, measurements, and unresolved
      observations are written for quality control.
tension: >
  Bay throughput competes with procedural completeness. Moving quickly
  creates capacity only when protection, assembly, adjustment, and
  testing remain intact; a rushed omission returns as rework.
failure_modes:
  - name: Scope drift
    cost: >
      Unapproved work reaches the invoice or an important new finding is
      buried inside the original operation.
    signal: >
      Technician notes describe work or parts outside the authorization.
  - name: Assembly detail omitted
    cost: >
      A leak, noise, loose connection, damaged trim, or warning appears
      after release.
    signal: >
      Completion notes lack required torque, fluid, adjustment, or test
      readings for the operation.
  - name: Vehicle waits inside active work
    cost: >
      A bay remains occupied while the repair is waiting on
      parts, approval, information, or specialist help.
    signal: >
      No work event or explicit hold reason appears for the current shift.
maturity:
  - level: run badly
    looks_like: >
      The technician works from memory, reports completion verbally, and
      the first full test happens after the customer leaves.
  - level: run well
    looks_like: >
      Current scope, procedure, parts, test results, and completion notes
      travel together on the repair order.
  - level: run excellently
    looks_like: >
      Holds surface immediately, repeat defects lead to procedure changes,
      and quality control receives documented test evidence.
competencies:
  - name: Procedure execution
    note: >
      Reliable repair depends on the less visible preparation, protection,
      assembly, and verification details surrounding the main operation.
  - name: Stop-work judgment
    note: >
      The technician must recognize when a new condition exceeds the
      diagnosis or authorization and return the decision upstream.
automation:
  now: >
    Procedure delivery, labor-time capture, parts association, inspection
    prompts, torque or measurement capture, and hold notifications.
  human: >
    Physical execution, adaptation to actual condition, workmanship
    judgment, and responsibility for stopping when the scope changes.
questions:
  - What evidence shows the repaired system was tested before handoff?
  - Which current vehicles are waiting inside a repair step, and why?
article:
  what: >
    The repair execution process is the technician's work on the vehicle
    between authorization and quality control. It begins when the repair
    order and the work authorization agree on the approved lines and ends
    when the repair has been performed to procedure, tested under the
    conditions of the original finding, and written up as a repair
    completion with parts installed, measurements, and unresolved
    observations. In an auto repair shop, a tire dealer, or a dealership
    service department it is owned by the automotive technician assigned
    to the repair order.
  why: >
    Most comebacks are procedure gaps, never the main operation. A
    fastener left short of torque, a fluid not topped, a harness routed
    against a hot surface, or a trim clip broken on disassembly returns
    as a leak, a noise, or a warning light after the customer has paid.
    Work outside the authorization reaches the invoice or buries a new
    finding inside the original job. A vehicle sitting in a bay with no
    recorded hold reason blocks capacity nobody knows is blocked. The
    process makes preparation, procedure, testing, and recording part of
    the operation itself.
  how: >
    The automotive technician confirms the authorized lines by reading
    the repair order against the work authorization and starts only from
    the current approved scope, stopping when a new finding changes it.
    The technician prepares the vehicle and parts, setting protection,
    tooling, service information, parts, and one-time-use items in place
    before disassembly. The repair is performed with procedure, torque,
    adjustment, fluid, routing, and cleanliness requirements treated as
    part of the job. The repaired system is tested under the conditions
    relevant to the original finding before handoff. The technician
    records completion on the repair completion, listing work performed,
    parts installed, measurements, test readings, and unresolved
    observations, ready for quality control.
  controls:
    - name: Authorized scope checked before the first bolt
      note: The technician confirms the repair order matches the current work authorization and stops for any difference before starting.
    - name: Stop-work on new findings
      note: A condition beyond the diagnosis or authorization is returned to the service advisor before any unapproved work is done.
    - name: Torque, fluid, and adjustment readings recorded
      note: Required measurements for the operation are written on the completion so the assembly detail can be verified by the checker.
    - name: Test performed under the original condition
      note: The completion names the test run and the result, matching the operating detail recorded at intake and diagnosis.
    - name: Hold reason on every waiting vehicle
      note: A vehicle waiting on parts, approval, information, or specialist help carries an explicit hold reason and the time it began.
