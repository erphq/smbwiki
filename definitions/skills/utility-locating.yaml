id: utility-locating
name: Utility locating
kind: skill
department: compliance
summary: >-
  Coordinates records and locate requests, marks known services, reconciles
  conflicts, potholes critical crossings, and briefs operators on tolerance
  zones. Utility locating leaves a current work basis, a field record, and
  acceptance evidence that another operator can trace.
inputs:
  - site-plan
outputs:
  - daily-report
steps:
  - name: Confirm the work basis
    note: >-
      Before utility locating, read the current scope and revisions, then
      verify survey control, utility information, permits, erosion controls,
      equipment access, haul route, soil direction, and weather plan.
  - name: Set the field controls
    note: >-
      Translate utility locating into work limits, sequence, responsibilities,
      hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During utility locating, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept utility locating, check the completed work against specified
      limits, safe slopes and support, approved grades, drainage, compaction,
      stabilized access, and recorded quantities, then close correction and
      issue the resulting record.
tension: >-
  Utility locating has to remain inside its acceptance basis while production
  moves. Unverified utilities, unsuitable soils, water, or lost control can
  turn planned earthwork into damage and repeated handling.
failure_modes:
  - name: Utility locating starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      utility locating is settled.
    signal: >-
      The utility locating work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Utility locating closes without evidence
    cost: >-
      A concealed condition or required result from utility locating cannot be
      verified without opening, repeat work, delay, or a disputed exception.
    signal: >-
      Utility locating is released while its required check, location record,
      test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Utility locating is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Utility locating starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Utility locating uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Earthwork control and site logistics
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of utility locating.
  - name: Evidence control
    note: >-
      Acceptance checks for utility locating have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Utility locating can use digital revisions, checklists, hold points, photo
    capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting utility locating remain
    human.
questions:
  - Which unresolved condition can stop utility locating before work begins?
  - >-
    Which record proves utility locating was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The utility locating process is the work a site preparation contractor
    does before an excavator breaks ground: utility records and locate
    requests are coordinated, known services are marked on the ground,
    conflicts between records and marks are reconciled, critical crossings are
    potholed to expose the actual line, and equipment operators are briefed on
    the tolerance zones around each mark. It starts when the site plan and
    survey control are available and the locate request window has opened, and
    ends with a daily report that records the marks, potholes, and briefing
    that release each area for excavation. The site superintendent owns it,
    and the excavation foreman is responsible for keeping the marks alive.
  why: >
    A strike on a gas main, a fiber trunk, or a water main stops the job,
    injures people, and produces a repair bill and a fine that can exceed the
    contract value. Records are wrong often enough that a mark on the ground
    from a locate ticket is a starting point, and a crossing that was never
    potholed is a guess. Marks fade, get graded off, and expire, so an
    operator working from last week's paint is working blind. The daily report
    is the record that the contractor did what the law and the owner require
    before digging.
  how: >
    The superintendent confirms the work basis by reading the current scope
    and revisions and verifying survey control, the utility information on
    hand, permits, erosion controls, equipment access, the haul route, soil
    direction, and the weather plan. Field controls are then set: the locate
    ticket numbers and expiry dates, the marking convention, which crossings
    get potholed, the tolerance zone rules for each utility, who briefs the
    operators, and the daily report format. During locating the operator
    records each mark, its source, potholes with depth and photos, conflicts
    between records and marks, and the operator briefings, and stops when an
    unmarked line, an unexpected depth, or a conflict changes the planned
    excavation. Acceptance checks that the specified limits are marked, safe
    slopes and support are planned around the lines, grades and drainage are
    approved, and recorded quantities match, corrections are closed, and the
    daily report releases the area.
  controls:
    - name: Locate ticket valid for the dig area
      note: The ticket number, the utilities that responded, and the expiry date are recorded for each area, and digging stops when a ticket expires or a utility has not responded.
    - name: Conflicts reconciled before excavation
      note: Any disagreement between the record drawing and the marks on the ground is resolved by pothole or by the utility owner before the area is released.
    - name: Potholes recorded with depth
      note: Every potholed crossing is photographed and recorded with location and depth, and the result is added to the site plan for the crew.
    - name: Operator briefing signed
      note: Each equipment operator signs the briefing on tolerance zones and hand-dig requirements for the area before working in it.
    - name: Marks maintained and rechecked
      note: Faded or disturbed marks are refreshed and rechecked against the record before work continues, and the recheck is noted on the daily report.
