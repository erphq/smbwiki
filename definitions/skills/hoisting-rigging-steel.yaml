id: hoisting-rigging-steel
name: Structural steel hoisting and rigging
kind: skill
department: operations
summary: >-
  Selects pick points, rigging, tag control, travel path, landing method,
  communication, and release for each steel member or assembly. Structural
  steel hoisting and rigging leaves a current work basis, a field record, and
  acceptance evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - quality-report
steps:
  - name: Confirm the work basis
    note: >-
      Before structural steel hoisting and rigging, read the current scope and
      revisions, then verify approved erection drawings, stable access, crane
      plan, piece sequence, connection information, anchor condition, and
      concrete strength notice.
  - name: Set the field controls
    note: >-
      Translate structural steel hoisting and rigging into work limits,
      sequence, responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During structural steel hoisting and rigging, the operator records
      quantities, observations, decisions, and concealed details, and stops
      when the field condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept structural steel hoisting and rigging, check the completed
      work against erection tolerances, connection completion, weld and bolt
      records, decking stability, and required inspection release, then close
      correction and issue the resulting record.
tension: >-
  Structural steel hoisting and rigging has to remain inside its acceptance
  basis while production moves. A sequence or stability error can expose the
  crew and leave installed steel outside the connection or tolerance design.
failure_modes:
  - name: Structural steel hoisting and rigging starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      structural steel hoisting and rigging is settled.
    signal: >-
      The structural steel hoisting and rigging work package still has an open
      drawing, access, material, predecessor, or approval dependency when
      labor is assigned.
  - name: Structural steel hoisting and rigging closes without evidence
    cost: >-
      A concealed condition or required result from structural steel hoisting
      and rigging cannot be verified without opening, repeat work, delay, or a
      disputed exception.
    signal: >-
      Structural steel hoisting and rigging is released while its required
      check, location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Structural steel hoisting and rigging is driven by crew availability and
      visible completion; readiness, hold points, and acceptance evidence are
      resolved afterward.
  - level: run well
    looks_like: >-
      Structural steel hoisting and rigging starts from a checked basis,
      follows a named sequence, stops on changed conditions, and closes
      against recorded acceptance criteria.
  - level: run excellently
    looks_like: >-
      Structural steel hoisting and rigging uses field evidence, production
      variance, defects, and closeout results to improve the next estimate,
      work package, and control point.
competencies:
  - name: Steel erection sequence and connection control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of structural steel hoisting and
      rigging.
  - name: Evidence control
    note: >-
      Acceptance checks for structural steel hoisting and rigging have to be
      captured while the relevant condition can still be observed and
      corrected.
automation:
  now: >-
    Structural steel hoisting and rigging can use digital revisions,
    checklists, hold points, photo capture, test fields, correction
    assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting structural steel hoisting
    and rigging remain human.
questions:
  - >-
    Which unresolved condition can stop structural steel hoisting and rigging
    before work begins?
  - >-
    Which record proves structural steel hoisting and rigging was accepted
    before it was covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The structural steel hoisting and rigging process plans and executes
    each pick on an erection job: the pick points and rigging for the
    member or assembly, tag line control, the travel path from the truck
    or laydown to the connection, the landing method and temporary
    support, the signals between rigger, operator, and connector, and the
    release once the piece is held by its bolts or erection aids. It
    starts when the erection drawings, crane plan, and piece sequence are
    approved and ends when the erected steel is within tolerance,
    connections are complete, and the inspection release is recorded on
    the quality report. The erection foreman owns it for a structural
    steel erector, with a qualified rigger on every lift.
  why: >
    A steel pick puts tons of load over a crew on a swinging path, and a
    piece landed before it can stand on its own puts the frame at risk of
    collapse. Wrong pick points twist a beam, a travel path over workers
    or power lines is an incident waiting for a gust, and a connector
    releasing a piece before the erection bolts are in is how a member
    comes down on the crew. The process protects the crew, the crane, the
    erected frame's tolerance, and the schedule that stops the moment a
    piece has to come back down.
  how: >
    The foreman reads the current scope and revisions and confirms the
    approved erection drawings, stable access, crane plan, piece sequence,
    connection information, anchor condition, and concrete strength notice
    before the first pick. The field controls are then set: rigging and
    pick points per piece, tag line assignments, the travel path and
    exclusion zone, landing and temporary support method, signals and
    communication, the release rule for each piece, hold points for anchor
    and base conditions, and the record the crew keeps by piece. During
    erection the crew records each piece placed, rigging used, temporary
    supports, bolt and connection status, plumb and tolerance readings,
    and any changed condition such as wind, an anchor bolt out of
    position, or a piece that does not fit, and stops until the condition
    is resolved. At acceptance the foreman checks erection tolerances,
    connection completion, weld and bolt records, decking stability, and
    required inspection release, closes correction, and issues the
    quality report.
  controls:
    - name: Pick plan per piece
      note: Weight, pick points, rigging, and travel path are written for each member before it is rigged, and the rigger signs it.
    - name: Rigging inspection before each shift
      note: Slings, shackles, and hooks are inspected and the inspection recorded before the first pick of the shift.
    - name: Exclusion zone under the load
      note: The travel path is cleared and controlled before the pick, and a person under the load stops the pick.
    - name: Release only on secured connection
      note: A piece is released from the crane only when the minimum erection bolts or erection aids are in and the connector confirms it.
    - name: Plumb and tolerance record before decking
      note: Column plumb and frame tolerance are checked and recorded before decking or the next tier locks the frame in.
