id: order-taking
name: Order taking
kind: skill
department: sales
summary: >
  Order taking converts a customer's request into an unambiguous ticket
  the production team can fulfill. Item, size, quantity, modifier,
  allergy or handling note, service channel, destination, price, and
  promised timing are settled before the ticket enters the queue.
inputs: []
outputs: [order-ticket]
steps:
  - name: Establish the service context
    note: >
      Counter, table, pickup, and delivery orders require different
      identity, location, payment, and timing details.
  - name: Capture items and modifiers
    note: >
      Each choice maps to a current menu item the production station can
      read without interpretation.
  - name: Check constraints and promise
    note: >
      Availability, allergy handling, production load, and delivery area
      are checked before a time is quoted.
  - name: Confirm and release the ticket
    produces: [order-ticket]
    note: >
      The customer and production queue receive the same items, total,
      channel, name or location, and promise.
tension: >
  Queue speed competes with order certainty. Short counter time keeps
  demand moving; an unclear modifier, destination, or promise creates
  rework after production has already spent time and product.
failure_modes:
  - name: Free text replaces a defined modifier
    cost: >
      The station interprets an instruction inconsistently or stops to
      ask what it means.
    signal: >
      Similar customer requests appear under several ticket phrasings.
  - name: Promise ignores production load
    cost: >
      The customer receives a time the current queue cannot keep.
    signal: >
      Quoted times remain fixed while open-ticket volume changes.
  - name: Channel identity missing
    cost: >
      A completed order waits at the wrong handoff or is given to the
      wrong customer or driver.
    signal: >
      Tickets lack table, pickup name, order number, or delivery
      destination.
maturity:
  - level: run badly
    looks_like: >
      Staff memorize spoken changes and the kitchen discovers missing
      information after starting the order.
  - level: run well
    looks_like: >
      Every channel creates the same clear ticket vocabulary with current
      price, availability, handoff, and promise.
  - level: run excellently
    looks_like: >
      Repeated corrections change menu and modifier design, promise times
      follow live capacity, and handoff identity stays intact.
competencies:
  - name: Clarifying communication
    note: >
      The order taker confirms intent quickly when menu language and the
      customer's words differ.
  - name: Queue awareness
    note: >
      A promise depends on current production and handoff conditions.
      Normal-service charts provide only a starting point.
automation:
  now: >
    Menu validation, modifier rules, availability, pricing, channel
    routing, order confirmation, and promise-time suggestions.
  human: >
    Ambiguous requests, allergy conversations, customer recovery, and
    decisions when capacity or menu rules conflict with the request.
questions:
  - Which ticket corrections recur often enough to change the menu setup?
  - Does the customer confirmation exactly match the production ticket?
article:
  what: >
    The order taking process turns what a customer says at the counter,
    at the table, on the phone, or through an app into an order ticket
    that a production station can read without asking a question. It
    settles item, size, quantity, modifiers, any allergy or handling
    note, the service channel, the destination or name, the price, and
    the promised time before the ticket enters the queue. It starts when
    the customer begins ordering and ends when the customer's
    confirmation and the production ticket match. In a full-service
    restaurant the server owns it; in a pizzeria or a coffee shop it
    belongs to whoever is at the register or the phone.
  why: >
    It protects production time and product. An unclear modifier, a
    missing table number, or a pickup name that was never captured is
    discovered after the station has already started the order, and the
    correction costs the product, the time, and often the customer. A
    promise quoted from a normal-service chart while twenty tickets are
    open produces a customer who arrives before the food exists. An
    allergy note typed as free text and read three different ways is the
    version of this failure with the highest consequence.
  how: >
    The order taker establishes the service context first, because
    counter, table, pickup, and delivery orders need different identity,
    location, payment, and timing details. Items are then captured
    against the current menu so that each choice and each modifier maps
    to something the station can read, and a request that does not fit
    the menu vocabulary is clarified with the customer before it is
    entered. Before a time is quoted, the taker checks availability,
    allergy handling, the current production load, and the delivery
    area. The ticket is confirmed by reading back items, total, channel,
    name or location, and promise to the customer, and the same content
    is released to the production queue as the order ticket.
  controls:
    - name: Channel identity mandatory
      note: A ticket cannot release without a table number, pickup name, order number, or delivery address that matches its service channel.
    - name: Modifiers from the defined list
      note: Free text is reserved for allergy and handling notes; every other change is a menu modifier, and repeated free-text phrasings trigger a menu review.
    - name: Allergy note flagged and read back
      note: An allergy or handling note is entered in its own field, repeated to the customer, and displayed prominently on the station ticket.
    - name: Promise checked against the live queue
      note: Quoted times come from current open-ticket load and delivery distance, and the suggested time is overridden only with a recorded reason.
    - name: Confirmation equals the ticket
      note: The customer's receipt or read-back and the production ticket are generated from the same record, and a mismatch found at handoff is logged.
