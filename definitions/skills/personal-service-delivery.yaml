id: personal-service-delivery
name: Personal service delivery
kind: skill
department: operations
summary: >
  Personal service delivery carries an appointment through condition
  check, consent, preparation, service, aftercare, and record update.
  The provider keeps the requested result, safety limits, products,
  timing, and follow-up attached to the client.
inputs: [appointment-record, client-profile]
outputs: [service-ticket]
steps:
  - name: Confirm the appointment
    role: service-provider
    consumes: [appointment-record, client-profile]
    note: >
      Client identity, requested service, available time, prior record,
      current condition, and known restrictions are reviewed.
  - name: Agree the service
    role: service-provider
    note: >
      Result, method, limits, price, timing, consent, and any reason to
      defer or modify the service are made clear.
  - name: Prepare the station and client
    role: service-provider
    note: >
      Tools, products, sanitation, protection, positioning, and comfort
      are ready before the service begins.
  - name: Deliver and observe
    role: service-provider
    note: >
      The provider follows the agreed method while monitoring condition,
      comfort, result, timing, and reasons to stop.
  - name: Record and hand off
    role: service-provider
    produces: [service-ticket]
    note: >
      Service, products, observations, aftercare, price, and suggested
      follow-up update the ticket and client record.
tension: >
  A requested result competes with condition, time, safety, and honest
  service limits. Agreeing too quickly can produce injury, poor results,
  schedule spill, and a repeat visit with no reliable history.
failure_modes:
  - name: Prior condition is assumed
    cost: >
      The provider applies a service to changed health, skin, hair,
      nail, muscle, or behavior conditions.
    signal: >
      Repeat clients receive no current condition check before work.
  - name: Service grows without a new decision
    cost: >
      Time and price exceed the appointment while later clients absorb
      the delay.
    signal: >
      Added work appears on checkout without a recorded agreement.
  - name: Record omits what affects the next visit
    cost: >
      Another provider repeats products, methods, or intensity without
      knowing the prior response.
    signal: >
      Ticket records only a service code and payment.
maturity:
  - level: run badly
    looks_like: >
      Provider memory carries consent, method, products, condition, and
      follow-up between visits.
  - level: run well
    looks_like: >
      Appointment, current condition, agreed service, delivery,
      aftercare, and ticket update one client record.
  - level: run excellently
    looks_like: >
      Service evidence improves booking duration, preparation,
      provider assignment, product readiness, and follow-up.
competencies:
  - name: Condition and safety assessment
    note: >
      The provider recognizes when to modify, defer, stop, or refer a
      requested service.
  - name: Service execution
    note: >
      Technique, pacing, sanitation, observation, and client
      communication stay controlled through delivery.
automation:
  now: >
    Intake prompts, consent, service history, station checklists,
    timing, tickets, aftercare messages, and rebooking reminders.
  human: >
    Condition assessment, technique, touch, aesthetic judgment,
    behavior handling, comfort, consent, and stop decisions.
questions:
  - Which service scheduled today lacks the time or preparation its record indicates?
  - What information from a completed service would another provider need at the next visit?
article:
  what: >
    The personal service delivery process carries a booked appointment
    through the service itself: checking the client's current condition,
    agreeing what will be done and what it will cost, preparing the
    station and the client, delivering the service while watching for
    reasons to stop, and updating the ticket and the client record with
    what was done and what the next provider needs to know. It starts
    when the client arrives against an appointment record and ends with
    a completed service ticket. The service provider owns it in a barber
    shop, a day spa, a massage practice, a nail salon, or a pet grooming
    business.
  why: >
    It protects the client's safety and the provider's reputation. Skin,
    hair, nails, muscles, health, and an animal's behavior change
    between visits, and a service applied to last visit's condition can
    injure or produce a result the client did not want. A service that
    grows during the appointment without a new agreement runs over on
    time and price and pushes every later client. A ticket that records
    only a service code and a payment leaves the next provider to repeat
    a product or an intensity the client reacted to. The record is what
    makes the next visit safe.
  how: >
    The provider confirms the appointment by reviewing the appointment
    record and the client profile: identity, requested service, the time
    available, prior record, current condition, and known restrictions.
    The service is then agreed with the client: result, method, limits,
    price, timing, and consent, including any reason to defer or modify.
    The station and the client are prepared: tools, products,
    sanitation, protection, positioning, and comfort are ready before
    work starts. During delivery the provider follows the agreed method
    while monitoring condition, comfort, result, and timing, and stops
    when a reason to stop appears. At the end the service ticket and the
    client record are updated with the service, products used,
    observations, aftercare given, price, and suggested follow-up.
  controls:
    - name: Condition check on every visit
      note: A current condition and restriction check is recorded for repeat clients as well as new ones before the service begins, every time.
    - name: Agreement recorded before work
      note: Result, method, limits, price, and consent are captured on the ticket, and a change during the appointment gets a new recorded agreement.
    - name: Station preparation checklist
      note: Sanitation, tools, products, and protection are checked against the service before the client is seated, and the check is initialed.
    - name: Stop reasons named in advance
      note: The provider knows which observations end the service, and a stopped service is recorded with the reason and the client is told why.
    - name: Ticket carries what the next visit needs
      note: Products, methods, reactions, aftercare, and follow-up are on the ticket, and a ticket with only a code and a price is returned to the provider.
