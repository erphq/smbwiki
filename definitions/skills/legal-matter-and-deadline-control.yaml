id: legal-matter-and-deadline-control
name: Legal matter and deadline control
kind: skill
department: compliance
summary: >-
  Controls client authority, conflicts, jurisdiction, privilege, evidence,
  commitments, filings, service, and deadlines across one legal matter.
inputs: [engagement-letter, client-brief]
outputs: [legal-matter-file, deliverable]
steps:
  - name: Open the controlled matter
    note: Confirm client identity and authority, conflicts, scope, jurisdiction, objectives, key facts, deadlines, and custody.
  - name: Direct actions and evidence
    note: Assign responsibility, protect privilege, verify facts and law, control versions, and calendar every dependent action.
  - name: Record completion or next duty
    note: Preserve authorization, filing or service evidence, client decisions, remaining obligations, and responsible counsel.
tension: >-
  Urgent client and tribunal demands can collide with conflict checks,
  evidence verification, privilege controls, authorization, and procedural rules.
failure_modes:
  - name: A controlling deadline lacks an owned response
    cost: The client can lose rights, incur sanctions, or face avoidable legal exposure.
    signal: A deadline has no verified source, responsible attorney, predecessor action, reminder, or completion evidence.
maturity:
  - level: run badly
    looks_like: Deadlines and client instructions live in personal inboxes and matter status depends on recollection.
  - level: run well
    looks_like: Authority, evidence, privilege, actions, deadlines, decisions, and completion records share one matter control.
  - level: run excellently
    looks_like: Near misses and matter outcomes improve intake, deadline rules, review paths, and client decision prompts.
competencies:
  - name: Matter duty control
    note: The operator distinguishes client instruction, professional duty, procedural requirement, evidence, and authorization.
automation:
  now: Matter systems can calculate dates, assign actions, preserve versions, restrict access, and record filings and service.
  human: Legal judgment, ethical duties, advocacy decisions, and responsibility for released action remain human.
questions:
  - Which deadline or duty can change the client's position before the next review?
  - What matter record proves authorization, completion, filing, or service?
article:
  what: >
    The legal matter and deadline control process is how a law firm
    keeps one matter under control from engagement to closing: who the
    client is and who may instruct, whether a conflict exists, which
    jurisdiction and rules apply, what is privileged, what evidence
    exists and who holds it, what has been promised, and every filing,
    service, and deadline that follows. It begins with the engagement
    letter and the client brief and ends with a legal matter file that
    records authorization, completion, filing, and service for each
    deliverable. The responsible attorney owns it, with a paralegal or
    legal assistant maintaining the calendar and file.
  why: >
    It protects the client's rights and the firm's license. A missed
    controlling deadline can forfeit a claim, draw sanctions, or
    trigger a malpractice claim, and the most common cause is a date
    that lived in one attorney's inbox with no verified source, no
    owner, and no reminder. Weak conflict checks disqualify the firm
    mid-matter; weak privilege control waives protection; unrecorded
    client decisions leave the firm unable to show it acted on
    instruction.
  how: >
    The attorney opens the controlled matter by confirming client
    identity and authority, running the conflict check, and fixing
    scope, jurisdiction, objectives, key facts, deadlines, and custody
    of evidence in the matter file. Actions and evidence are then
    directed: responsibility is assigned for each task, privilege is
    protected in how documents are labeled and shared, facts and law
    are verified, versions are controlled, and every dependent action
    is calendared from its source rule with reminders ahead of it. As
    each action completes, the file records the authorization behind
    it, the filing or service evidence, the client's decisions, the
    remaining obligations, and the responsible counsel, so the next
    duty is visible to anyone who opens the matter.
  controls:
    - name: Conflict check before engagement
      note: The conflict search is run and its result recorded against the engagement letter before any substantive work or confidential intake begins.
    - name: Deadline with source, owner, and predecessor
      note: Every calendared deadline records the rule or order it comes from, the responsible attorney, the action that must precede it, and a reminder.
    - name: Client authority and instruction record
      note: Who may instruct and each material instruction or decision is recorded in the matter file with the date and the communication.
    - name: Filing and service evidence
      note: Each filing or service records the method, date, confirmation, and the person who completed it, attached to the calendared deadline.
    - name: Privilege labeling and access control
      note: Privileged material is marked and access is restricted in the matter system so inadvertent disclosure is prevented and traceable.
