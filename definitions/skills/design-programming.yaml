id: design-programming
name: Design programming
kind: skill
department: operations
summary: >-
  Interviews users, inventories activities and equipment, quantifies space,
  maps adjacencies, records performance needs, and secures program approval.
  Design programming leaves a current work basis, a field record, and
  acceptance evidence that another operator can trace.
inputs:
  - client-brief
outputs:
  - finish-schedule
steps:
  - name: Confirm the work basis
    note: >-
      Before design programming, read the current scope and revisions, then
      verify approved program, measured existing conditions, consultant
      criteria, budget, schedule, code basis, and client decision structure.
  - name: Set the field controls
    note: >-
      Translate design programming into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During design programming, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept design programming, check the completed work against
      coordinated safe spaces, approved selections, complete documents,
      released procurement, installed intent, and resolved deficiencies, then
      close correction and issue the resulting record.
tension: >-
  Design programming has to remain inside its acceptance basis while
  production moves. A late spatial or finish decision can affect building
  systems, price, lead time, and installed work at once.
failure_modes:
  - name: Design programming starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for design
      programming is settled.
    signal: >-
      The design programming work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Design programming closes without evidence
    cost: >-
      A concealed condition or required result from design programming cannot
      be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Design programming is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Design programming is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Design programming starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Design programming uses field evidence, production variance, defects,
      and closeout results to improve the next estimate, work package, and
      control point.
competencies:
  - name: Interior space and material coordination
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of design programming.
  - name: Evidence control
    note: >-
      Acceptance checks for design programming have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Design programming can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting design programming remain
    human.
questions:
  - Which unresolved condition can stop design programming before work begins?
  - >-
    Which record proves design programming was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The design programming process turns a client brief into an approved
    program the design can be built on: interviewing users, inventorying
    activities and equipment, quantifying the space each needs, mapping
    adjacencies, recording performance needs, and securing the client's
    approval of the program before design begins. It starts when the
    brief, existing conditions, and decision structure are confirmed and
    ends when the approved program and its early finish schedule are
    accepted. An interior design firm owns it through the project
    designer, with the principal approving the deliverable.
  why: >
    It protects every downstream decision from a late change. A user
    group never interviewed appears after layouts are drawn and their
    equipment does not fit. Unquantified space forces the plan to be
    reworked when the budget or the floor plate is tested. A performance
    need recorded late, such as acoustic separation or a heavy floor
    load, changes building systems, price, lead time, and installed work
    at once. The approved program is what makes the client's later
    change a change, and priced as one.
  how: >
    The project designer confirms the work basis by reading the current
    brief and revisions and verifying the approved program status,
    measured existing conditions, consultant criteria, budget, schedule,
    code basis, and the client's decision structure. Field controls set
    the interview list, the inventory templates, the space standards,
    hold points such as the client's program sign-off, and the records
    the team keeps. During the work the designer records interviews,
    activity and equipment inventories, area quantities, adjacency maps,
    performance requirements, decisions, and any condition that changes
    the approach. Acceptance checks the program against coordinated safe
    spaces, approved selections, complete documents, released
    procurement, installed intent, and resolved deficiencies, and the
    finish schedule is issued after correction closes.
  controls:
    - name: Interview log against the user list
      note: >
        Every user group named in the decision structure has an
        interview record, and gaps are flagged before quantification
        starts.
    - name: Space quantities tied to inventory
      note: >
        Each area figure references the activities and equipment it
        was derived from, so the basis can be reviewed later.
    - name: Performance needs recorded per space
      note: >
        Acoustic, load, power, data, and environmental needs are
        captured on the program record for each space.
    - name: Client program sign-off before design
      note: >
        The program is approved in writing by the client's named
        decision owner before layouts start.
