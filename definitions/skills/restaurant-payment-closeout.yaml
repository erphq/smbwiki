id: restaurant-payment-closeout
name: Restaurant payment closeout
kind: skill
department: finance
summary: >
  Restaurant payment closeout turns served items and authorized
  adjustments into a settled guest check, then reconciles cash, card,
  mobile, gift, discount, void, comp, and gratuity activity for the
  shift.
inputs: [order-ticket, guest-check]
outputs: [payment-record, shift-closeout]
steps:
  - name: Complete the guest check
    role: server
    consumes: [order-ticket, guest-check]
    note: >
      Table, seats, items, modifiers, added rounds, discounts, voids,
      comps, taxes, and gratuity treatment agree with service delivered.
  - name: Present and settle
    role: server
    produces: [payment-record]
    note: >
      Split, transfer, tender, tip, change, receipt, and remaining
      balance are recorded once against the current check.
  - name: Control exceptions
    role: general-manager
    note: >
      Reopen, void, comp, discount, refund, walkout, charge dispute, and
      cash exception retain reason and authority.
  - name: Reconcile the shift
    role: general-manager
    note: >
      Closed checks match tender totals, processor batches, cash,
      adjustments, tips, and checks still open at cutoff.
  - name: Sign the closeout
    role: general-manager
    produces: [shift-closeout]
    note: >
      Variances, unresolved checks, deposits, custody, follow-up, and
      manager approval remain attached to the service period.
tension: >
  Fast table release competes with accurate settlement and custody.
  Closing quickly protects the next seating; rushed edits, splits, and
  handoffs make the shift impossible to reconcile later.
failure_modes:
  - name: Check changes bypass authorization
    cost: >
      Revenue, inventory, taxes, server accountability, and guest trust
      no longer agree.
    signal: >
      Voids, comps, and discounts lack a reason or approving manager.
  - name: Tender settles outside the check
    cost: >
      Payment exists without a reliable link to the table, items, or
      remaining balance.
    signal: >
      Processor transactions require manual matching to closed checks.
  - name: Open checks cross the cutoff silently
    cost: >
      Shift revenue and cash appear short while responsibility moves to
      another team.
    signal: >
      Closeout total excludes active checks without naming them.
maturity:
  - level: run badly
    looks_like: >
      Staff close tables for speed and the manager reconstructs tenders,
      adjustments, and cash after service.
  - level: run well
    looks_like: >
      Order, guest check, authorized adjustments, tender, settlement,
      tips, cash, open items, and signoff reconcile by shift.
  - level: run excellently
    looks_like: >
      Exception patterns improve permissions, training, checkout flow,
      payment setup, staffing, and guest communication.
competencies:
  - name: Check and tender reconciliation
    note: >
      The closer traces items, adjustments, payments, tips, cash, and
      processor timing through one service cutoff.
  - name: Exception control
    note: >
      Guest recovery remains possible while discounts, voids, refunds,
      and reopenings keep explicit authority and reason.
automation:
  now: >
    Check totals, split tender, payment capture, permissions, processor
    batches, cash expectation, tip allocation, and variance alerts.
  human: >
    Dispute resolution, cash custody, exception authority, walkouts,
    ambiguous handoffs, and final closeout responsibility.
questions:
  - Which closed check cannot be matched to its recorded tender and settlement?
  - Which adjustment lacks a reason and responsible authority?
article:
  what: >
    The restaurant payment closeout process settles each table and then
    proves the whole shift. It begins when a guest check is ready to
    present and ends when every closed check, tender, tip, void, comp,
    discount, refund, and cash count for the service period has been
    reconciled and a manager has signed the shift closeout with variances
    and open checks named. In a full-service restaurant the check side is
    owned by the server and the reconciliation and signoff by the general
    manager or the manager on duty.
  why: >
    A restaurant's revenue leaves the building in small pieces, and each
    unexplained edit is a piece gone. A void or comp with no reason and
    no approving manager breaks the link between food served, inventory
    used, tax owed, and money received. A tender settled outside the
    check leaves a processor transaction with no table behind it. An
    open check that crosses the cutoff makes the shift look short and
    hands the problem to a team that never served the table. The process
    keeps reason, authority, and settlement attached to each check so
    the shift reconciles the same night.
  how: >
    The server completes the guest check from the order ticket so table,
    seats, items, modifiers, added rounds, discounts, voids, comps,
    taxes, and gratuity treatment agree with what was served. The server
    presents and settles the check, recording split, transfer, tender,
    tip, change, receipt, and any remaining balance once against the
    current check on the payment record. The general manager controls
    exceptions as they arise, so every reopen, void, comp, discount,
    refund, walkout, charge dispute, and cash exception retains its
    reason and the authorizing person. At cutoff the manager reconciles
    the shift, matching closed checks against tender totals, processor
    batches, the cash drawer, adjustments, tips, and the checks still
    open. The manager then signs the shift closeout with variances,
    unresolved checks, deposits, custody, and follow-up attached to the
    service period.
  controls:
    - name: Manager approval on every void, comp, and discount
      note: Each adjustment carries a reason code and the approving manager's credential before the check can close.
    - name: Tender recorded against the check
      note: Every card, cash, mobile, and gift payment is applied to a specific check, so no processor transaction stands alone.
    - name: Open checks named at cutoff
      note: The closeout lists every check still open at the cutoff with its table and server, so nothing crosses shifts silently.
    - name: Cash counted by two people
      note: The drawer is counted and the deposit prepared with a second person present, and both sign the count.
    - name: Shift closeout signed and retained
      note: The manager's signature, variances, and follow-up items are stored with the service period for the bookkeeper and the next shift.
