id: appointment-scheduling
name: Appointment scheduling
kind: skill
department: sales
summary: >
  Appointment scheduling converts a service request into reserved
  capacity. The record connects the customer, work, expected duration,
  assigned professional, and physical resource so everyone arrives
  prepared for the same commitment.
inputs: [appointment-request]
outputs: [appointment-record]
steps:
  - name: Clarify the request
    consumes: [appointment-request]
    note: >
      Service scope and special requirements determine how much time and
      which qualified person can be offered.
  - name: Find usable capacity
    note: >
      The scheduler checks the professional and any room, chair, bay, or
      equipment the appointment will occupy.
  - name: Reserve the appointment
    produces: [appointment-record]
    note: >
      Duration, preparation, price assumptions, and cancellation terms
      are visible in the same record.
  - name: Confirm changes
    note: >
      A moved or cancelled appointment releases every reserved resource
      and reaches the customer and assigned staff.
tension: >
  Calendar utilization competes with access and schedule reliability.
  Packing appointments tightly reduces idle capacity; weak duration
  estimates and no recovery space cause later customers to wait.
failure_modes:
  - name: Wrong service duration
    cost: >
      The professional runs late or leaves unusable time that cannot be
      sold on short notice.
    signal: >
      The same service is repeatedly extended or shortened on the day.
  - name: Resource double booking
    cost: >
      Two customers arrive for one professional, room, chair, or bay.
    signal: >
      Resource calendars are maintained separately from the appointment
      book.
  - name: Change propagation fails
    cost: >
      Staff prepare for cancelled work or the customer arrives at the
      old time.
    signal: >
      Reschedules lack a confirmation event for both customer and staff.
maturity:
  - level: run badly
    looks_like: >
      Names and times are recorded without service duration or resource
      requirements, and conflicts are found at arrival.
  - level: run well
    looks_like: >
      Each appointment reserves the required person and physical
      capacity with a confirmed scope and duration.
  - level: run excellently
    looks_like: >
      Actual service times improve future booking rules, cancellations
      release capacity promptly, and fragile parts of the day are visible
      before they fail.
competencies:
  - name: Service scoping
    note: >
      The scheduler can ask enough about the requested work to reserve
      realistic time without performing the service itself.
  - name: Calendar judgment
    note: >
      A technically open slot may create a gap, overtime risk, or an
      impossible transition for the assigned professional.
automation:
  now: >
    Availability search, resource conflict checks, confirmations,
    reminders, waitlists, and online rescheduling.
  human: >
    Ambiguous service scoping, priority decisions, and recovery when a
    late appointment changes the promises already made.
questions:
  - Which appointment types most often run beyond their reserved time?
  - Does a cancellation release every person and resource it held?
article:
  what: >
    The appointment scheduling process is how a service business turns a
    request for a service into a reserved block of a named person's time
    and the room, chair, bay, or equipment that person will need. It
    starts when the appointment request arrives by phone, web, or walk-
    in, and it ends when an appointment record holds the customer, the
    work, the duration, the assigned professional, and the physical
    resource, and everyone involved has confirmed the same commitment.
    In a dental clinic, a hair salon, or an auto repair shop the front
    desk owns it, under the practice manager or shop owner.
  why: >
    The appointment book is the business's production plan. A booking
    made without scoping the work reserves too little time and makes the
    professional late for the rest of the day, or too much time and
    leaves a gap that cannot be sold at short notice. A booking that
    reserves the professional without the chair, bay, or equipment puts
    two customers in front of one resource at arrival. A reschedule that
    reaches the customer and not the staff, or the reverse, wastes
    preparation or leaves the customer standing at the old time. Without
    the process, conflicts are found at the door.
  how: >
    The scheduler first clarifies the request: what service is wanted,
    any special requirement, and therefore how long it takes and which
    qualified person can do it. She then searches for usable capacity,
    checking both the professional's calendar and the calendar of the
    room, chair, bay, or equipment the appointment will occupy, and
    rejecting a slot that would create an impossible transition or an
    unsellable gap. The appointment is reserved as one record that shows
    duration, preparation, price assumptions, and cancellation terms,
    and the customer receives a confirmation. When the appointment moves
    or is cancelled, the change releases every resource it held and
    produces a confirmation event to both the customer and the assigned
    staff.
  controls:
    - name: Service duration from a scoped request
      note: Reserved time comes from the confirmed service and its special requirements, and a request too vague to scope is called back before booking.
    - name: Resource reserved with the person
      note: The room, chair, bay, or equipment is booked on the same record as the professional, so a conflict is caught at booking.
    - name: Confirmation to both sides
      note: Every new, moved, or cancelled appointment generates a confirmation event to the customer and the assigned staff, and a missing confirmation is an open item.
    - name: Cancellation releases all holds
      note: A cancelled appointment frees the person and every physical resource it reserved, and the released slot is visible to waitlist follow-up.
    - name: Actual time reviewed against booked time
      note: Appointment types that repeatedly run over or under are reviewed and their default duration adjusted.
