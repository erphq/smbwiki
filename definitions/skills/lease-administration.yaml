id: lease-administration
name: Lease administration
kind: skill
department: sales
summary: >
  Lease administration carries a vacant unit through application,
  screening, offer, signature, deposit, move-in, recurring charges,
  notices, renewal, and move-out. The current occupancy right and
  financial ledger stay tied to the same unit and parties.
inputs: [lease-application]
outputs: [lease, tenant-ledger]
steps:
  - name: Qualify the application
    role: property-manager
    consumes: [lease-application]
    note: >
      Unit, applicants, consent, screening criteria, supporting
      information, fair-housing controls, and decision authority are
      complete.
  - name: Establish the offer
    role: property-manager
    note: >
      Premises, term, rent, deposit, utilities, occupants, concessions,
      rules, and required disclosures form one proposed tenancy.
  - name: Execute the lease
    role: property-manager
    produces: [lease]
    note: >
      Required parties sign the current terms and satisfy funds,
      insurance, identity, and move-in conditions before possession.
  - name: Open the tenant account
    role: property-manager
    consumes: [lease]
    produces: [tenant-ledger]
    note: >
      Recurring charges, deposit treatment, credits, due dates, payment
      methods, notices, and balance start from the executed lease.
  - name: Maintain the tenancy
    role: property-manager
    consumes: [lease, tenant-ledger]
    note: >
      Payments, notices, changes, renewals, access, violations, move-out,
      and deposit disposition preserve their authority and dates.
tension: >
  Occupancy competes with disciplined qualification and record control.
  Filling a unit protects revenue; inconsistent screening, incomplete
  terms, or early possession creates collection, compliance, and
  turnover disputes.
failure_modes:
  - name: Possession precedes completed conditions
    cost: >
      The property gives access before signatures, funds, insurance, or
      required records are enforceable.
    signal: >
      Key or access release lacks a completed move-in gate.
  - name: Ledger differs from the lease
    cost: >
      Charges, credits, deposits, and due dates cannot be defended or
      collected consistently.
    signal: >
      Manual recurring charge has no matching lease term or amendment.
  - name: Notice lacks delivery evidence
    cost: >
      Renewal, access, cure, collection, and termination actions lose
      their timing or legal support.
    signal: >
      Property file records notice text without method and delivery
      date.
maturity:
  - level: run badly
    looks_like: >
      Lease, payments, messages, and notices live in separate files and
      staff reconstruct tenancy state when a dispute appears.
  - level: run well
    looks_like: >
      Application, decision, lease, possession, ledger, notices,
      renewal, and move-out share one unit and tenant record.
  - level: run excellently
    looks_like: >
      Leasing evidence improves pricing, qualification, concessions,
      renewal timing, collections, and turnover planning.
competencies:
  - name: Tenancy record control
    note: >
      The operator keeps occupancy authority, financial terms, notices,
      and current parties aligned.
  - name: Fair and consistent decision practice
    note: >
      Staff apply approved criteria and escalation without ad hoc
      treatment of applicants or tenants.
automation:
  now: >
    Listings, applications, screening workflow, templates, signatures,
    deposits, recurring charges, payments, notices, renewals, and
    move-out tasks.
  human: >
    Criteria governance, accommodation, disputed facts, legal notices,
    negotiation, exceptions, and possession decisions.
questions:
  - Which occupied unit lacks one completed condition required before possession?
  - Which tenant-ledger charge cannot be traced to a lease term or signed change?
article:
  what: >
    The lease administration process is how a residential property
    manager, a commercial property manager, or a self-storage facility
    fills a vacant unit and keeps the resulting tenancy enforceable:
    application, screening, offer, signature, deposit, move-in,
    recurring charges, notices, renewal, and move-out. It starts with a
    lease application for a specific unit and ends only when the tenant
    has moved out and the deposit is disposed of, with the lease and
    the tenant ledger tied to the same unit and parties throughout. The
    property manager owns it.
  why: >
    It protects revenue and the property's legal position at the same
    time. A unit handed over before signatures, funds, and insurance
    are in place is occupied without an enforceable agreement; a ledger
    charge with no matching lease term cannot be collected in a
    dispute; a notice with no delivery evidence loses its date when
    renewal, cure, or termination is contested. Inconsistent screening
    exposes the owner to fair-housing complaints that a documented
    process would have answered.
  how: >
    The property manager qualifies the application, confirming unit,
    applicants, consent, screening criteria, supporting information,
    fair-housing controls, and who has decision authority. The offer is
    established as one proposed tenancy: premises, term, rent, deposit,
    utilities, occupants, concessions, rules, and required
    disclosures. The lease is executed when the required parties sign
    the current terms and satisfy funds, insurance, identity, and
    move-in conditions before possession. The tenant account is opened
    from the executed lease, so recurring charges, deposit treatment,
    credits, due dates, payment methods, notices, and opening balance
    all trace to a signed term. The tenancy is then maintained:
    payments, notices, changes, renewals, access, violations, move-out,
    and deposit disposition each keep their authority and dates in the
    same record.
  controls:
    - name: Move-in gate before keys
      note: Access is released only when signatures, funds, insurance, identity, and required disclosures are all recorded complete on the unit.
    - name: Ledger charges traced to lease terms
      note: Every recurring or one-time charge references the lease clause or signed amendment that authorizes it, and manual charges are reviewed.
    - name: Screening criteria applied uniformly
      note: Approved criteria, the decision, and the decision maker are recorded for every application so treatment can be shown consistent.
    - name: Notice delivery evidence
      note: Each notice records text, method, date, and proof of delivery so its timing can be defended in a dispute.
    - name: Renewal review with current terms
      note: Before a renewal offer, rent, concessions, rules, and open violations are reviewed and the new terms are signed before the old term ends.
