id: batt-insulation-installation
name: Batt insulation installation
kind: skill
department: operations
summary: >-
  Cuts and fits batts to full cavity depth around wiring, piping, boxes,
  blocking, and irregular framing without compression or gaps. Batt insulation
  installation leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - inspection-report
steps:
  - name: Confirm the work basis
    note: >-
      Before batt insulation installation, read the current scope and
      revisions, then verify complete air-control layer, dry cavities, closed
      leaks, installed services, approved insulation system, and safe access.
  - name: Set the field controls
    note: >-
      Translate batt insulation installation into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During batt insulation installation, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept batt insulation installation, check the completed work against
      continuous thermal and air boundary, full depth, correct density,
      protected clearances, and documented concealed work, then close
      correction and issue the resulting record.
tension: >-
  Batt insulation installation has to remain inside its acceptance basis while
  production moves. Voids, compression, wind washing, and bypasses can survive
  inspection while degrading comfort and energy use for the life of the
  assembly.
failure_modes:
  - name: Batt insulation installation starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for batt
      insulation installation is settled.
    signal: >-
      The batt insulation installation work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Batt insulation installation closes without evidence
    cost: >-
      A concealed condition or required result from batt insulation
      installation cannot be verified without opening, repeat work, delay, or
      a disputed exception.
    signal: >-
      Batt insulation installation is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Batt insulation installation is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Batt insulation installation starts from a checked basis, follows a
      named sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Batt insulation installation uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Thermal and air-boundary continuity
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of batt insulation installation.
  - name: Evidence control
    note: >-
      Acceptance checks for batt insulation installation have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Batt insulation installation can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting batt insulation installation
    remain human.
questions:
  - >-
    Which unresolved condition can stop batt insulation installation before
    work begins?
  - >-
    Which record proves batt insulation installation was accepted before it
    was covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The batt insulation installation process is how an insulation
    contractor fills framed cavities with fiberglass or mineral wool
    batts cut and fitted to full depth around wiring, piping, boxes,
    blocking, and irregular framing without compressing them or leaving
    gaps. It starts when air sealing is complete and the construction
    plan defines the assemblies and R-values, and it ends when every
    cavity is filled and an inspection report records what was installed
    before drywall covers it. The insulation foreman owns it, and the
    crew installs to his sequence.
  why: >
    A batt that is compressed behind a pipe, stuffed around a box, or
    cut short of the top plate leaves a cold spot that will condense,
    stain, and cost energy for the life of the wall, and the energy
    inspector's grade for the whole house drops on those details. None
    of it can be seen once drywall is hung. Without the process, the
    crew works from memory, wind washing at eaves and bypasses at chases
    survive a glance, and the builder has no record to answer a
    homeowner's comfort complaint or a code inspector's question.
  how: >
    The foreman reads the current construction plan and revisions and
    confirms that the air-control layer is complete, that cavities are
    dry, that leaks have been sealed, that services are installed, that
    the insulation system and R-values are approved, and that access is
    safe. The field controls are then set: batt type and thickness per
    assembly, the method for splitting around wiring and fitting behind
    piping, the sequence through the building, the hold point before
    drywall, and the record form. During installation the crew records
    bags used, areas completed, and any cavity that could not be filled
    to depth, and stops when a wet cavity, missing service, or framing
    change alters the method. At acceptance the foreman checks the
    boundary for continuity, full depth, correct density, and protected
    clearances, photographs concealed work, closes corrections, and
    issues the inspection report.
  controls:
    - name: R-value and assembly map from the plan
      note: Each cavity type is matched to its specified batt thickness and R-value before material is ordered.
    - name: Full-depth fit check per room
      note: Batts are checked for compression, gaps, and splits around services before the crew leaves a room.
    - name: Clearances protected
      note: Required clearances at flues, recessed lights, and vents are confirmed and recorded before the cavity is closed.
    - name: Photo record before drywall
      note: Concealed cavities are photographed with location references before the drywall crew is released.
    - name: Inspection report issued
      note: Areas, materials, exceptions, and corrections are written into the inspection report and filed with the builder.
