id: land-surveying-firm
name: Land Surveying Firm
codes:
  naics: '541370'
catalog_group: construction-property
extends: professional-services-base
summary: >-
  A land surveying firm researches deeds and plats, establishes control,
  measures monuments and improvements, reduces observations, resolves boundary
  evidence, and issues signed plats or descriptions. The assignment purpose,
  property rights, coordinate basis, adjoining records, access, terrain, and
  required certification define the field plan.


  Measurements do not decide a boundary by themselves. The surveyor weighs
  record calls, found evidence, occupation, senior rights, closure, and
  applicable law, then documents professional judgment. Redundant
  observations, field notes, adjustment records, drafting checks, and
  signature control make the result traceable after crews leave.
