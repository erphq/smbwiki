id: drywall-punch
name: Drywall punch work
kind: skill
department: quality
summary: >-
  Inspects surfaces under representative light, marks defects by location,
  repairs without halos or ridges, and releases the room for finish. Drywall
  punch work leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - punch-list
steps:
  - name: Confirm the work basis
    note: >-
      Before drywall punch work, read the current scope and revisions, then
      verify dry and enclosed space, accepted framing and rough work, board
      type and thickness, backing, control joints, access panels, and finish
      level.
  - name: Set the field controls
    note: >-
      Translate drywall punch work into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During drywall punch work, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept drywall punch work, check the completed work against board
      orientation, fastening, joints, corners, finish level, surface
      tolerance, texture, protection, and punch closure, then close correction
      and issue the resulting record.
tension: >-
  Drywall punch work has to remain inside its acceptance basis while
  production moves. Defects hidden during hanging or finishing reappear under
  paint and finished lighting when correction is most disruptive.
failure_modes:
  - name: Drywall punch work starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      drywall punch work is settled.
    signal: >-
      The drywall punch work work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Drywall punch work closes without evidence
    cost: >-
      A concealed condition or required result from drywall punch work cannot
      be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Drywall punch work is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Drywall punch work is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Drywall punch work starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Drywall punch work uses field evidence, production variance, defects,
      and closeout results to improve the next estimate, work package, and
      control point.
competencies:
  - name: Gypsum board finishing sequence
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of drywall punch work.
  - name: Evidence control
    note: >-
      Acceptance checks for drywall punch work have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Drywall punch work can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting drywall punch work remain
    human.
questions:
  - Which unresolved condition can stop drywall punch work before work begins?
  - >-
    Which record proves drywall punch work was accepted before it was covered,
    loaded, energized, occupied, or handed over?
