revenue_model:
  - id: fence-line-gates-and-accessories
    note: installed fence length plus posts, gates, operators, hardware, access controls, removal, repair, and maintenance
summary: >-
  A fence contractor lays out and installs posts, rails, panels, fabric,
  gates, operators, and hardware across changing grade and uncertain property
  edges. Boundary authority, utilities, easements, access, material, gate
  loads, and owner expectations need agreement before holes are opened.


  Most production is repetitive, but corners, slopes, gates, structures, and
  utility crossings hold the risk. The crew controls line, post depth,
  spacing, concrete or driven support, clearances, fasteners, and finish
  damage. Closeout verifies security, safe edges, gate operation, cleanup, and
  restoration of disturbed ground.
