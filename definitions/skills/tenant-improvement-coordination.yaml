id: tenant-improvement-coordination
name: Tenant improvement coordination
kind: skill
department: operations
summary: >-
  Controls landlord criteria, design review, permits, contractor access,
  shutdowns, inspections, damage, closeout, and lease commencement
  dependencies. Tenant improvement coordination leaves a current work basis, a
  field record, and acceptance evidence that another operator can trace.
inputs:
  - lease
outputs:
  - property-operating-statement
steps:
  - name: Confirm the work basis
    note: >-
      Before tenant improvement coordination, read the current scope and
      revisions, then verify current leases, tenant contacts, vendor
      contracts, property budget, building systems, compliance calendar, and
      owner authority.
  - name: Set the field controls
    note: >-
      Translate tenant improvement coordination into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During tenant improvement coordination, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept tenant improvement coordination, check the completed work
      against accurate charges and recoveries, maintained common areas,
      controlled vendors, documented tenant work, and timely owner reporting,
      then close correction and issue the resulting record.
tension: >-
  Tenant improvement coordination has to remain inside its acceptance basis
  while production moves. Lease duties, physical operations, and accounting
  can drift apart until a tenant dispute or major repair exposes the gap.
failure_modes:
  - name: Tenant improvement coordination starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for tenant
      improvement coordination is settled.
    signal: >-
      The tenant improvement coordination work package still has an open
      drawing, access, material, predecessor, or approval dependency when
      labor is assigned.
  - name: Tenant improvement coordination closes without evidence
    cost: >-
      A concealed condition or required result from tenant improvement
      coordination cannot be verified without opening, repeat work, delay, or
      a disputed exception.
    signal: >-
      Tenant improvement coordination is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Tenant improvement coordination is driven by crew availability and
      visible completion; readiness, hold points, and acceptance evidence are
      resolved afterward.
  - level: run well
    looks_like: >-
      Tenant improvement coordination starts from a checked basis, follows a
      named sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Tenant improvement coordination uses field evidence, production
      variance, defects, and closeout results to improve the next estimate,
      work package, and control point.
competencies:
  - name: Commercial lease and property operations
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of tenant improvement coordination.
  - name: Evidence control
    note: >-
      Acceptance checks for tenant improvement coordination have to be
      captured while the relevant condition can still be observed and
      corrected.
automation:
  now: >-
    Tenant improvement coordination can use digital revisions, checklists,
    hold points, photo capture, test fields, correction assignment, and
    closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting tenant improvement
    coordination remain human.
questions:
  - >-
    Which unresolved condition can stop tenant improvement coordination before
    work begins?
  - >-
    Which record proves tenant improvement coordination was accepted before it
    was covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The tenant improvement coordination process is how a commercial property
    manager runs a tenant's build-out inside a building the owner still has to
    protect: landlord criteria, design review, permits, contractor access,
    utility shutdowns, inspections, damage, closeout, and the lease
    commencement dates that depend on all of it. It starts when a signed lease
    carries a tenant improvement obligation or allowance and ends when the
    space is accepted, the allowance is reconciled, and rent commencement is
    recorded on the property operating statement. The property manager owns
    it, with the building engineer on systems and the owner on money above the
    manager's authority.
  why: >
    Tenant work happens in a building full of other tenants and building
    systems the owner will keep long after the lease ends. Without
    coordination, an unreviewed design ties into the wrong riser, an
    unscheduled shutdown takes a neighbor offline, a contractor without
    insurance damages a corridor nobody can bill, and a missed inspection
    delays commencement so the owner loses rent and the tenant claims a delay.
    The record of who approved what and when is what settles the allowance
    reconciliation and any dispute over the commencement date.
  how: >
    The property manager confirms the work basis by reading the lease and its
    work letter, current tenant contacts, vendor contracts, the property
    budget, the building systems the work touches, the compliance calendar,
    and the limit of the owner's authority delegated to the manager. Field
    controls follow: landlord criteria issued to the tenant's architect, a
    design review hold point, contractor insurance and access rules, a
    shutdown request procedure, an inspection schedule, and the records each
    party keeps. During the build-out the manager logs access, shutdowns,
    inspections, damage, change requests, and decisions, and stops the work
    when a condition changes the approved plan or threatens another tenant.
    Acceptance checks accurate charges and recoveries, maintained common
    areas, controlled vendors, documented tenant work, and timely owner
    reporting, then closes corrections, reconciles the allowance, and records
    commencement on the property operating statement.
  controls:
    - name: Design approved against landlord criteria
      note: Tenant drawings are reviewed and approved in writing against the building criteria before a permit application or contractor mobilization.
    - name: Contractor insurance and access on file
      note: Certificates of insurance, access hours, and building rules are received and acknowledged by the tenant's contractor before the first key is issued.
    - name: Shutdown requests scheduled and logged
      note: Every utility or system shutdown is requested in advance, approved by the building engineer, notified to affected tenants, and logged with actual times.
    - name: Damage and inspection log kept current
      note: Common-area damage, inspections passed or failed, and open corrections are recorded as they happen, with the responsible party named.
    - name: Allowance and commencement reconciled to the lease
      note: Allowance draws, lien waivers, acceptance, and the commencement date are reconciled against the lease terms before the operating statement records rent.
