id: project-delivery
name: Project delivery
kind: skill
department: operations
summary: >
  Project delivery carries an accepted scope through field planning,
  readiness, site control, production, change approval, and closeout.
  The crew receives one current field package, while the office keeps
  cost, schedule, customer decisions, and completion evidence attached
  to the same job.
inputs: [quote]
outputs: [work-order, job-photos]
steps:
  - name: Build the field package
    role: estimator
    consumes: [quote]
    produces: [work-order]
    note: >
      Accepted scope, measurements, selections, exclusions, access,
      customer duties, cost allowance, and change authority enter one
      controlled work order.
  - name: Clear readiness
    role: crew-lead
    consumes: [work-order]
    note: >
      Labor, material, equipment, site access, predecessor work,
      protection, weather exposure, and required approvals are checked
      before the crew is committed.
  - name: Establish the site
    role: crew-lead
    note: >
      Existing condition, work limits, staging, safety, protection,
      neighbors or occupants, and the day's completion point are
      confirmed before production begins.
  - name: Run production and changes
    role: crew-lead
    note: >
      Installed quantity, labor, material use, defects, delays, and
      changed conditions stay current, while added scope stops for a
      priced decision.
  - name: Inspect and release
    role: crew-lead
    produces: [job-photos]
    note: >
      Completed scope, cleanup, punch work, operating or finish checks,
      customer acceptance, warranty information, and final evidence are
      reviewed before the job leaves the board.
tension: >
  Crew continuity competes with readiness and change control. Keeping
  people producing protects the schedule; starting through missing
  material, unclear scope, or unresolved site conditions turns labor
  into delay and unpriced work.
failure_modes:
  - name: Crew arrives before the job is ready
    cost: >
      Paid field time is spent finding access, material, equipment,
      decisions, or predecessor work.
    signal: >
      A committed start still has an open critical item without an
      owner and due time.
  - name: Field condition changes scope silently
    cost: >
      Added labor and material reach final billing without a customer
      decision or recoverable price.
    signal: >
      Daily notes describe work outside the accepted scope and no
      approved change.
  - name: Completion outruns closeout
    cost: >
      The crew leaves while punch work, evidence, cleanup, instruction,
      or acceptance remains disputed.
    signal: >
      The job is marked complete before the closeout record can identify
      who inspected and accepted it.
maturity:
  - level: run badly
    looks_like: >
      The accepted quote becomes a start date, and the crew resolves
      scope, supply, access, and changes in the field.
  - level: run well
    looks_like: >
      Field package, readiness, site setup, daily production, changes,
      inspection, and closeout share one controlled job.
  - level: run excellently
    looks_like: >
      Actual production and failure evidence improve estimating,
      readiness gates, crew plans, and the price of recurring risk.
competencies:
  - name: Production planning
    note: >
      The operator turns scope and quantities into a feasible sequence
      for labor, material, equipment, access, and site conditions.
  - name: Field commercial control
    note: >
      The crew lead has to distinguish correction, included work, and a
      changed condition before cost loses its approval route.
automation:
  now: >
    Work packages, readiness lists, crew schedules, daily logs, quantity
    and time capture, photo records, change requests, punch lists, and
    closeout reminders.
  human: >
    Site interpretation, production sequence, workmanship, crew
    direction, changed-condition judgment, customer decisions, and
    release of completed work.
questions:
  - Which committed project still lacks one item the crew needs to keep producing?
  - What field change is consuming cost without a priced customer decision?
article:
  what: >
    The project delivery process is the path an accepted quote takes to a
    closed job. The estimator converts the accepted scope into a
    controlled work order, the crew lead clears readiness, sets up the
    site, runs production while stopping added scope for a priced
    decision, and inspects and releases the finished work with job
    photos as evidence. It begins when the customer accepts the quote and
    ends when acceptance, punch work, cleanup, and closeout evidence are
    on the job record. In a residential remodeler, a landscaping company,
    or a masonry contractor it is owned by the crew lead, with the
    estimator and the office holding cost and change authority.
  why: >
    It protects the margin the quote promised. A crew sent to a site
    before material, access, decisions, or predecessor work are settled
    burns paid hours finding them. A field condition that changes the
    work without a customer decision reaches final billing as unpriced
    labor. A job marked complete before punch work, acceptance, and
    evidence are recorded turns into a dispute with no record of who
    inspected it. The process keeps cost, schedule, customer decisions,
    and completion evidence attached to one job so none of those losses
    arrive silently.
  how: >
    The estimator builds the field package from the accepted quote,
    entering scope, measurements, selections, exclusions, access,
    customer duties, cost allowance, and change authority into one work
    order. The crew lead clears readiness against that work order,
    checking labor, material, equipment, site access, predecessor work,
    protection, weather exposure, and approvals before committing the
    crew. On the first day the crew lead establishes the site, confirming
    existing condition, work limits, staging, safety, occupants, and the
    day's completion point. During production the crew lead keeps
    installed quantity, labor, material use, defects, delays, and changed
    conditions current and stops added scope for a priced customer
    decision. At the end the crew lead inspects completed scope, cleanup,
    punch work, and operating checks, records customer acceptance and
    warranty information, and files the job photos before the job leaves
    the board.
  controls:
    - name: Readiness gate with owner and due time
      note: Every open critical item on a committed start has a named owner and a due time, and the crew is held until the list is clear.
    - name: Change stops work for a priced decision
      note: Work outside the accepted scope pauses until the customer has approved a priced change on the job record, so daily notes never describe unpriced work.
    - name: Daily production record
      note: Installed quantity, labor, material use, defects, and delays are logged each day against the work order, so cost and schedule are known before closeout.
    - name: Inspection and acceptance recorded before closeout
      note: The job is closed only when the record names who inspected it, who accepted it, and what punch work remained.
    - name: Job photos as completion evidence
      note: Photographs of completed scope, concealed work, and site condition at handover are filed with the job so a later dispute has a record.
