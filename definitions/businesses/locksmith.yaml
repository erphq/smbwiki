id: locksmith
name: Locksmith
codes:
  naics: "561622"
catalog_group: construction-property
extends: field-services-base
summary: >
  A locksmith receives a lock, key, access, or security problem and
  must establish location, urgency, authority, identity, hardware, and
  safe entry before work begins. The technician carries mobile stock
  and tools while protecting information that could grant access later.

  Completion may mean entry, rekeying, repair, replacement, master-key
  changes, or access-device programming. The work order records
  authorization, affected openings, key or credential custody, installed
  hardware, tests, and every item handed to the customer.
revenue_model:
  - id: emergency-service
    note: urgent entry and security work priced by callout and labor
  - id: scheduled-lock-work
    note: rekey, repair, replacement, and access projects booked ahead
  - remove: [service-calls, quoted-projects]
supply_chain:
  buys_from: [security-hardware-distributor]
  sells_to: [homeowner, property-management-company]
article:
  operating_model: >
    A locksmith sells trust and speed. Calls arrive as lockouts, lost
    keys, rekeys after a tenant change, broken hardware, or access
    projects; the office manager or dispatcher establishes location,
    authority, and urgency, the technician drives with mobile stock and
    tools, and the work order records authorization, the openings
    affected, hardware installed, and every key or credential handed over.
    Field job execution and dispatch are the load-bearing skills, with
    quoting third, because an emergency job priced on the phone must still
    cover the callout and the drive. The tension sits between emergency
    work, which pays best and arrives at the worst hours, and scheduled
    lock work, which fills the day predictably; a single technician cannot
    do both without a dispatcher protecting the schedule.
  starting: >
    The definition binds no trade license, but many states and some cities
    license locksmiths individually or as a business, with fingerprinting
    and a background check, and a few require registration of the service
    vehicle, so check the state and city rule before the first callout.
    Add the business registration, employer registration before the first
    technician is hired, general liability insurance, and sales tax
    registration where hardware sales are taxable. The minimum team is an
    owner-operator who quotes and works the truck, a technician, and a
    dispatcher or office manager who takes calls, verifies authority, and
    invoices; the lead technician role comes with the second truck. The
    first records to set up are the job request with its authorization
    check, the quote, the work order, job photos of openings and installed
    hardware, the purchase order, and the customer invoice, and the skills
    that must work from the first day are lead intake, dispatch, quoting,
    field job execution, and invoicing. Capital is a stocked service
    vehicle, key machines and pinning kits, and access-device programming
    tools.
  economics: >
    Revenue is emergency service priced by callout plus labor and
    scheduled lock work such as rekeys, repairs, replacements, and access
    projects booked ahead. Emergency calls carry the highest average
    ticket, and the callout fee is what pays for the drive when the job
    itself is short. Jobs per tech day and first-time fix rate decide
    profit because a technician who arrives without the right cylinder or
    keyway makes a second trip nobody pays for, and callback rate shows
    whether installed hardware holds. Booking rate on inbound calls and
    quote win rate on projects govern volume, and days sales outstanding
    matters mainly for property management accounts that pay on terms. The
    business is labor and vehicle intensive with a modest hardware margin,
    so the margin lives in dispatch efficiency and stocked trucks.
  benchmarks:
    - scope: Employees per establishment, locksmiths (NAICS 561622)
      value: 4.1 paid employees per establishment
      note: 16,123 paid employees in the week of March 12, 2023 across 3,961 employer establishments, all legal forms of organization; ratio derived from the two published counts in the national CBP file.
      source: https://www2.census.gov/programs-surveys/cbp/datasets/2023/cbp23us.zip
      source_name: US Census Bureau, County Business Patterns 2023, United States file (2023 data)
    - scope: Annual payroll per employee, locksmiths (NAICS 561622)
      value: 51,370 dollars per employee (2023)
      note: Annual payroll of 828,238 thousand dollars divided by 16,123 paid employees, employer establishments only; ratio derived from the two published totals in the national CBP file.
      source: https://www2.census.gov/programs-surveys/cbp/datasets/2023/cbp23us.zip
      source_name: US Census Bureau, County Business Patterns 2023, United States file (2023 data)
