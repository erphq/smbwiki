id: auto-repair-shop
name: Auto Repair Shop
codes:
  naics: "811111"
catalog_group: retail-vehicles
summary: >
  An auto repair shop receives a vehicle with a reported condition or
  maintenance request, records its state, diagnoses the work, presents
  an estimate, captures authorization, performs the repair, checks the
  result, and closes payment. The repair order carries that sequence
  across the front counter, technician, parts desk, and customer.

  Capacity is limited by bays, technician skill, parts, test equipment,
  and customer decisions. A vehicle can occupy working space while the
  shop waits for authorization or supply. Symptoms, test evidence,
  approved scope, parts, labor, quality checks, and customer updates
  need to remain attached to the same repair.
revenue_model:
  - id: diagnostic-work
    note: paid testing and inspection that defines the repair scope
  - id: repair-labor
    note: technician time sold from approved estimates
  - id: parts-margin
    note: components sourced, warranted, and resold as part of a repair
  - id: maintenance-services
    note: recurring vehicle care scheduled by mileage or time
