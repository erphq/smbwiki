id: solar-commissioning
name: Solar commissioning
kind: skill
department: quality
summary: >-
  Checks torque and polarity, insulation and grounding, inverter settings,
  monitoring, shutdown, labels, production, inspection items, and owner
  instruction. Solar commissioning leaves a current work basis, a field
  record, and acceptance evidence that another operator can trace.
inputs:
  - site-plan
outputs:
  - commissioning-record
steps:
  - name: Confirm the work basis
    note: >-
      Before solar commissioning, read the current scope and revisions, then
      verify verified roof or ground condition, energy use and shading data,
      approved electrical design, permit, utility route, equipment, and fall
      protection.
  - name: Set the field controls
    note: >-
      Translate solar commissioning into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During solar commissioning, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept solar commissioning, check the completed work against
      structural and electrical compliance, flashed attachments, labeled
      circuits, tested shutdown, documented production, inspection, and
      utility permission, then close correction and issue the resulting
      record.
tension: >-
  Solar commissioning has to remain inside its acceptance basis while
  production moves. Design, roof, electrical, permit, and utility decisions
  converge at installation, and one mismatch can delay permission to operate.
failure_modes:
  - name: Solar commissioning starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for solar
      commissioning is settled.
    signal: >-
      The solar commissioning work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Solar commissioning closes without evidence
    cost: >-
      A concealed condition or required result from solar commissioning cannot
      be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Solar commissioning is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Solar commissioning is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Solar commissioning starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Solar commissioning uses field evidence, production variance, defects,
      and closeout results to improve the next estimate, work package, and
      control point.
competencies:
  - name: Photovoltaic design and commissioning
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of solar commissioning.
  - name: Evidence control
    note: >-
      Acceptance checks for solar commissioning have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Solar commissioning can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting solar commissioning remain
    human.
questions:
  - >-
    Which unresolved condition can stop solar commissioning before work
    begins?
  - >-
    Which record proves solar commissioning was accepted before it was
    covered, loaded, energized, occupied, or handed over?
