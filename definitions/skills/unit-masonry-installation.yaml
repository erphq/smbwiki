id: unit-masonry-installation
name: Unit masonry installation
kind: skill
department: operations
summary: >-
  Lays brick, block, or stone to the required bond, line, level, plumb, joint
  fill, reinforcement, and daily height. Unit masonry installation leaves a
  current work basis, a field record, and acceptance evidence that another
  operator can trace.
inputs:
  - construction-plan
outputs:
  - quality-report
steps:
  - name: Confirm the work basis
    note: >-
      Before unit masonry installation, read the current scope and revisions,
      then verify approved sample, sound support, control lines, unit and
      mortar supply, weather protection, embeds, and interface details.
  - name: Set the field controls
    note: >-
      Translate unit masonry installation into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During unit masonry installation, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept unit masonry installation, check the completed work against
      line, level, plumb, bond, joint profile, reinforcement, flashing,
      drainage, cleaning, and specified appearance, then close correction and
      issue the resulting record.
tension: >-
  Unit masonry installation has to remain inside its acceptance basis while
  production moves. Masonry locks layout, structure, weather control, and
  visible finish into the same installed work.
failure_modes:
  - name: Unit masonry installation starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for unit
      masonry installation is settled.
    signal: >-
      The unit masonry installation work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Unit masonry installation closes without evidence
    cost: >-
      A concealed condition or required result from unit masonry installation
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Unit masonry installation is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Unit masonry installation is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Unit masonry installation starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Unit masonry installation uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Masonry material and bond control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of unit masonry installation.
  - name: Evidence control
    note: >-
      Acceptance checks for unit masonry installation have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Unit masonry installation can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting unit masonry installation
    remain human.
questions:
  - >-
    Which unresolved condition can stop unit masonry installation before work
    begins?
  - >-
    Which record proves unit masonry installation was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The unit masonry installation process is the laying of brick, block, or
    stone by a masonry contractor to the bond, line, level, plumb, joint fill,
    reinforcement, and daily height the construction plan calls for. It starts
    when the approved sample, the support, and the control lines are in place
    and ends with a quality report that records the accepted wall, the
    reinforcement and flashing concealed inside it, and the cleaning. The
    foreman owns it on site, the lead mason owns the line, and the owner or
    project manager accepts the work with the general contractor.
  why: >
    Masonry is structure, weather barrier, and finish in one operation, and
    the mistakes are permanent. A wall out of plumb carries through every
    course above it; a missing flashing or weep passes water into the building
    for its whole life; reinforcement, ties, and embeds laid in the wrong
    course cannot be seen after the next course is set; and a stained or
    smeared face costs an acid wash or a rebuild. Laying above the safe daily
    height risks the wall itself. The field record of what went into the wall
    is the contractor's only evidence once the joints are struck.
  how: >
    The foreman confirms the work basis from the current scope and revisions
    and verifies the approved sample, sound support, control lines, unit and
    mortar supply, weather protection, embeds, and interface details before
    the crew is assigned. Field controls follow: the coursing story pole and
    lines, mortar mix and batch control, daily height limits, reinforcement
    and tie spacing, flashing and weep locations, the hold points at footings,
    lintels, and before each concealed course, and the records the crew keeps.
    During laying the operator records courses, batches, reinforcement, ties,
    flashing, embeds, weather, and any support or interface condition found,
    and stops when the field condition changes the planned method. Acceptance
    checks line, level, plumb, bond, joint profile, reinforcement, flashing,
    drainage, cleaning, and the specified appearance against the sample,
    corrections are closed, and the quality report is issued.
  controls:
    - name: Sample panel approved and kept
      note: The approved sample panel stays on site as the appearance standard, and the finished wall is compared with it at acceptance.
    - name: Reinforcement and ties recorded before covering
      note: Bar, joint reinforcement, tie, and embed locations are recorded with photos at each hold point before the next course conceals them.
    - name: Flashing and weeps inspected in place
      note: Flashing laps, end dams, and weep spacing are inspected and recorded before the course above is laid.
    - name: Daily height and weather logged
      note: Lifts laid per day and the weather protection in place are logged so the wall is never loaded beyond its cured strength.
    - name: Mortar batches controlled
      note: Mix proportions, batch times, and retempering limits are recorded so joint strength and color stay consistent across the wall.
