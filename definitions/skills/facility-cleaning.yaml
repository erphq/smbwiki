id: facility-cleaning
name: Facility cleaning
kind: skill
department: maintenance
summary: >
  Facility cleaning inspects and restores customer areas, work surfaces,
  floors, restrooms, carts, waste points, lint paths, and spill zones on
  a recorded route. The log records both completed work and conditions
  that require maintenance, closure, or additional attention.
inputs: []
outputs: [cleaning-log]
steps:
  - name: Inspect the route
    note: >
      Customer flow, spills, lint, waste, restroom condition, carts,
      folding areas, and blocked access set the immediate sequence.
  - name: Control the area
    note: >
      Wet floors, chemicals, sharp objects, bodily fluids, heat, and
      equipment-adjacent work are isolated before cleaning starts.
  - name: Clean and restore
    note: >
      Method, product, contact time, removal, drying, and replacement of
      supplies match the surface and condition.
  - name: Record and escalate
    produces: [cleaning-log]
    note: >
      Time, area, condition, completed work, remaining defect, and owner
      make the route useful beyond a checked box.
tension: >
  Continuous customer access competes with safe and complete cleaning.
  Keeping every area open preserves convenience; some spills, lint
  buildup, restroom conditions, and chemical work require temporary
  control of the space.
failure_modes:
  - name: Visible pass misses hidden accumulation
    cost: >
      Lint, residue, drain buildup, or waste creates odor, fire, pest,
      slip, or equipment risk behind a clean-looking floor.
    signal: >
      Logs repeat customer-facing tasks and omit equipment edges, vents,
      drains, and waste points.
  - name: Wet area released early
    cost: >
      A customer slips or tracks chemical and soil into the rest of the
      facility.
    signal: >
      Area control is removed before dry condition is checked.
  - name: Maintenance defect logged as cleaning
    cost: >
      A leak, broken surface, ventilation issue, or failing fixture
      persists across repeated routes.
    signal: >
      The same cleaning exception appears without a maintenance owner.
maturity:
  - level: run badly
    looks_like: >
      Staff clean what looks dirty between customer requests and the log
      proves only that someone initialed a time.
  - level: run well
    looks_like: >
      A risk-based route covers visible and hidden areas, controls hazards,
      and sends defects to a named owner.
  - level: run excellently
    looks_like: >
      Traffic and soil patterns shape frequency, repeated exceptions
      change maintenance or layout, and area release is explicit.
competencies:
  - name: Condition recognition
    note: >
      The attendant distinguishes removable soil from a leak, damage,
      ventilation, pest, or equipment condition requiring another skill.
  - name: Safe area control
    note: >
      Customer movement has to be redirected clearly while the cleaning
      method creates temporary slip or exposure risk.
automation:
  now: >
    Route schedules, task prompts, timestamps, area status, supply
    reminders, photo evidence, and maintenance escalation.
  human: >
    Soil and hazard assessment, physical cleaning, product choice,
    customer-area control, and release judgment.
questions:
  - Which repeated cleaning exception needs a maintenance response?
  - What customer area is open before safe dry condition is confirmed?
article:
  what: >
    The facility cleaning process is a recorded route through customer
    areas, work surfaces, floors, restrooms, carts, waste points, lint
    paths, and spill zones: the attendant inspects the route to set the
    sequence, controls each area before wet or chemical work, cleans and
    restores it to standard, and logs what was done and what was found that
    cleaning cannot fix. A laundromat runs it hourly on the floor, a hotel
    runs it on public areas between housekeeping rounds, and a janitorial
    service runs it as the contracted scope; the attendant on shift owns the
    route and the manager owns the log.
  why: >
    A facility can look clean and still be unsafe. Lint behind dryers is a
    fire load, a slow drain is a slip and odor source, and a wet floor
    released early puts a customer on the ground. A route that only covers
    what customers see leaves those conditions to accumulate. The log is
    what separates a checked box from evidence: it shows the area, the time,
    the condition found, and who owns the defect that cleaning could not
    remove, so a leak gets a maintenance owner instead of a mop every hour.
  how: >
    The attendant walks the route first, noting customer flow, spills, lint,
    waste, restroom condition, carts, folding areas, and blocked access, and
    sets the order of work from what is most urgent. Before cleaning an area
    the attendant controls it: signage or barriers for wet floors, chemical
    handling, isolation of sharp objects, bodily fluids, heat, and
    equipment-adjacent work. Cleaning follows the method for the surface,
    with the right product, contact time, removal, drying, and replacement
    of supplies. The attendant records time, area, condition found, work
    completed, and any remaining defect on the cleaning log, and escalates
    conditions that need maintenance, closure, or another skill to a named
    owner.
  controls:
    - name: Route covers hidden points
      note: The route list includes equipment edges, vents, drains, lint paths, and waste points, and each is checked off with the visible areas.
    - name: Area controlled before wet work
      note: Signage or barriers are in place before mopping or chemical use, and the log records when the area was released dry.
    - name: Log entry with condition and owner
      note: Each area entry records the condition found and, where a defect remains, the person responsible for fixing it.
    - name: Repeated exception escalated to maintenance
      note: The same exception appearing on consecutive logs is routed to maintenance with a request number.
    - name: Supervisor spot-check against the log
      note: The manager walks a sample of logged areas each week and records whether the log matches what was found.
