id: utility-isolation
name: Utility isolation
kind: skill
department: compliance
summary: >-
  Identifies every service, confirms owner and utility actions, disconnects or
  protects feeds, locks out energy, and verifies the dead condition. Utility
  isolation leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - daily-report
steps:
  - name: Confirm the work basis
    note: >-
      Before utility isolation, read the current scope and revisions, then
      verify completed engineering survey, utility shutdown,
      hazardous-material disposition, exclusion zones, removal sequence, and
      disposal routes.
  - name: Set the field controls
    note: >-
      Translate utility isolation into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During utility isolation, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept utility isolation, check the completed work against specified
      removals, stable remaining structure, protected services and finishes,
      segregated waste, clean limits, and documented changed conditions, then
      close correction and issue the resulting record.
tension: >-
  Utility isolation has to remain inside its acceptance basis while production
  moves. Unknown loads, materials, utilities, and hidden connections make an
  unplanned removal sequence dangerous and destructive.
failure_modes:
  - name: Utility isolation starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      utility isolation is settled.
    signal: >-
      The utility isolation work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Utility isolation closes without evidence
    cost: >-
      A concealed condition or required result from utility isolation cannot
      be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Utility isolation is released while its required check, location record,
      test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Utility isolation is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Utility isolation starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Utility isolation uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Demolition sequence and existing-condition judgment
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of utility isolation.
  - name: Evidence control
    note: >-
      Acceptance checks for utility isolation have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Utility isolation can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting utility isolation remain
    human.
questions:
  - Which unresolved condition can stop utility isolation before work begins?
  - >-
    Which record proves utility isolation was accepted before it was covered,
    loaded, energized, occupied, or handed over?
