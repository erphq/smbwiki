id: structural-interior-inspection
name: Structural and interior inspection
kind: skill
department: operations
summary: >-
  Traces visible foundation, framing, floors, walls, ceilings, stairs, attic,
  crawlspace, moisture, movement, and unsafe conditions. Structural and
  interior inspection leaves a current work basis, a field record, and
  acceptance evidence that another operator can trace.
inputs:
  - client-brief
outputs:
  - inspection-report
steps:
  - name: Confirm the work basis
    note: >-
      Before structural and interior inspection, read the current scope and
      revisions, then verify signed scope, identified property, agreed access,
      known occupancy and utilities, required disclosures, tools, and weather
      conditions.
  - name: Set the field controls
    note: >-
      Translate structural and interior inspection into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During structural and interior inspection, the operator records
      quantities, observations, decisions, and concealed details, and stops
      when the field condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept structural and interior inspection, check the completed work
      against complete accessible-system observations, stated limitations,
      clear defect evidence, risk significance, and timely client report, then
      close correction and issue the resulting record.
tension: >-
  Structural and interior inspection has to remain inside its acceptance basis
  while production moves. A missed area, vague limitation, or unsupported
  conclusion can distort a buyer's understanding of the property.
failure_modes:
  - name: Structural and interior inspection starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      structural and interior inspection is settled.
    signal: >-
      The structural and interior inspection work package still has an open
      drawing, access, material, predecessor, or approval dependency when
      labor is assigned.
  - name: Structural and interior inspection closes without evidence
    cost: >-
      A concealed condition or required result from structural and interior
      inspection cannot be verified without opening, repeat work, delay, or a
      disputed exception.
    signal: >-
      Structural and interior inspection is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Structural and interior inspection is driven by crew availability and
      visible completion; readiness, hold points, and acceptance evidence are
      resolved afterward.
  - level: run well
    looks_like: >-
      Structural and interior inspection starts from a checked basis, follows
      a named sequence, stops on changed conditions, and closes against
      recorded acceptance criteria.
  - level: run excellently
    looks_like: >-
      Structural and interior inspection uses field evidence, production
      variance, defects, and closeout results to improve the next estimate,
      work package, and control point.
competencies:
  - name: Building condition observation and reporting
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of structural and interior inspection.
  - name: Evidence control
    note: >-
      Acceptance checks for structural and interior inspection have to be
      captured while the relevant condition can still be observed and
      corrected.
automation:
  now: >-
    Structural and interior inspection can use digital revisions, checklists,
    hold points, photo capture, test fields, correction assignment, and
    closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting structural and interior
    inspection remain human.
questions:
  - >-
    Which unresolved condition can stop structural and interior inspection
    before work begins?
  - >-
    Which record proves structural and interior inspection was accepted before
    it was covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The structural and interior inspection process is the part of a home
    inspection that walks the visible structure and interior of a
    property, meaning foundation, framing, floors, walls, ceilings,
    stairs, attic, crawlspace, and the moisture, movement, and unsafe
    conditions they show, and records what was seen, what was not
    accessible, and why. It starts from a signed scope in the client
    brief and ends with an inspection report the buyer can act on before
    their contingency expires. A home inspection service owns it through
    the licensed inspector who performs and signs the inspection.
  why: >
    It protects the buyer's decision and the inspector's license. A
    crawlspace skipped because it was tight, a stain on a ceiling called
    cosmetic without checking above it, or a cracked foundation
    described in vague terms leaves the buyer to discover a structural
    repair after closing, and the inspector to explain the report in a
    complaint or a claim. A limitation left unstated reads as an
    inspection that found nothing. The standards the inspector is
    licensed under require the observations, the limitations, and the
    risk to be stated clearly.
  how: >
    The inspector reads the signed scope and any revisions, then
    confirms the identified property, the agreed access, known occupancy
    and utilities, required disclosures, the tools, and the weather
    before the visit. The inspection is set out as a route through the
    property, the systems and areas to observe, the responsibilities if
    another inspector or a specialist is involved, hold points where an
    unsafe condition stops entry, and the report form the observations
    go into. On site the inspector traces foundation, framing, floors,
    walls, ceilings, stairs, attic, and crawlspace, records
    observations, photos, moisture readings, and every area that could
    not be entered with the reason, and stops when a condition changes
    the planned method. At acceptance the report is checked for complete
    accessible-system observations, stated limitations, clear defect
    evidence, risk significance, and timely delivery to the client, gaps
    are closed, and the inspection report is issued.
  controls:
    - name: Every inaccessible area stated with a reason
      note: Each area the inspector did not enter or could not see is listed in the report with why, so silence never reads as clearance.
    - name: Photo evidence for every defect
      note: Each reported defect carries a photograph, its location, and the observation that supports the conclusion drawn.
    - name: Moisture and movement readings recorded
      note: Meter readings and measured cracks or slopes are recorded with the location and the instrument used.
    - name: Risk stated for each finding
      note: Every finding is classified for its significance and given a recommended next step, so the buyer can prioritize.
    - name: Report delivered inside the contingency
      note: The delivery time is recorded against the client's deadline, and a late report is an exception the owner reviews.
