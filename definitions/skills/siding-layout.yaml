id: siding-layout
name: Siding layout
kind: skill
department: operations
summary: >-
  Sets course, panel, joint, reveal, starter, corner, trim, and termination
  locations to resolve the elevation before cutting begins. Siding layout
  leaves a current work basis, a field record, and acceptance evidence that
  another operator can trace.
inputs:
  - construction-plan
outputs:
  - quality-report
steps:
  - name: Confirm the work basis
    note: >-
      Before siding layout, read the current scope and revisions, then verify
      accepted sheathing, dry substrate, complete openings, approved weather
      barrier, flashing details, material acclimation, and access.
  - name: Set the field controls
    note: >-
      Translate siding layout into work limits, sequence, responsibilities,
      hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During siding layout, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept siding layout, check the completed work against drainage
      continuity, fastening, clearances, joint layout, trim integration,
      appearance, and manufacturer requirements, then close correction and
      issue the resulting record.
tension: >-
  Siding layout has to remain inside its acceptance basis while production
  moves. A finished elevation can look complete while hidden drainage and
  movement details are already set to fail.
failure_modes:
  - name: Siding layout starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for siding
      layout is settled.
    signal: >-
      The siding layout work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Siding layout closes without evidence
    cost: >-
      A concealed condition or required result from siding layout cannot be
      verified without opening, repeat work, delay, or a disputed exception.
    signal: >-
      Siding layout is released while its required check, location record,
      test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Siding layout is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Siding layout starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Siding layout uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Exterior cladding and water-shedding control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of siding layout.
  - name: Evidence control
    note: >-
      Acceptance checks for siding layout have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Siding layout can use digital revisions, checklists, hold points, photo
    capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting siding layout remain human.
questions:
  - Which unresolved condition can stop siding layout before work begins?
  - >-
    Which record proves siding layout was accepted before it was covered,
    loaded, energized, occupied, or handed over?
