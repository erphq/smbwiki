    roles: [shipper-sales-representative, freight-broker]
    documents: [load-request]
    metrics: [quote-to-book-rate]
    software: [customer-relationship-management, transportation-management-system]
  - ref: freight-quoting
    roles: [freight-broker]
    documents: [load-request, quote]
    metrics: [quote-to-book-rate, gross-margin-per-load]
    software: [transportation-management-system]
  - ref: load-planning
    roles: [freight-broker]
    documents: [quote, load-tender]
    software: [transportation-management-system]
  - ref: carrier-onboarding
    roles: [carrier-compliance-specialist]
    documents: [carrier-packet, approved-carrier-record]
    metrics: [carrier-approval-time]
    software: [carrier-monitoring]
  - ref: carrier-sourcing
    roles: [carrier-sales-representative, freight-broker]
    documents: [load-tender, approved-carrier-record, rate-confirmation]
    metrics: [tender-acceptance-rate, gross-margin-per-load]
    software: [transportation-management-system, carrier-monitoring]
  - ref: load-execution
    roles: [tracking-coordinator, freight-broker]
    documents: [rate-confirmation, bill-of-lading, proof-of-delivery]
    metrics: [on-time-pickup-rate, on-time-delivery-rate, loads-per-broker-day]
    software: [transportation-management-system]
  - ref: customer-invoicing
    roles: [billing-specialist]
    documents: [proof-of-delivery, customer-invoice]
    metrics: [days-sales-outstanding]
    software: [transportation-management-system, accounting]
  - ref: carrier-payment
    roles: [billing-specialist]
    documents: [proof-of-delivery, carrier-invoice, payment-record]
    metrics: [carrier-days-to-pay]
    software: [transportation-management-system, accounting]
  - ref: accounts-receivable
    roles: [billing-specialist]
    documents: [customer-invoice, payment-record]
    metrics: [days-sales-outstanding]
    software: [accounting]
  - ref: freight-claims
    roles: [claims-coordinator, freight-broker]
    documents: [bill-of-lading, proof-of-delivery, freight-claim]
    metrics: [claims-rate]
    software: [transportation-management-system]
org:
