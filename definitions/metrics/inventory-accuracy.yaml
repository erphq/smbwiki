id: inventory-accuracy
name: Inventory accuracy
kind: metric
summary: >
  Share of counted item-location balances that match the system
  record.
unit: percent
direction: higher
article:
  what: >
    Inventory accuracy is the share of item-location records in the
    warehouse system that match what is physically on the shelf when
    someone counts it: right SKU, right quantity, right bin. It belongs
    to the inventory control lead, and every other warehouse number
    leans on it, because a pick sent to an empty location is a short
    shipment, a wave planned against phantom stock is a late order, and
    a customer promised stock that is not there is a lost sale. Auditors
    read it as the reliability of the inventory line on the balance
    sheet.
  formula: Counted item-locations that match the system record ÷ item-locations counted × 100
  how_to_calculate: >
    Count by location: each SKU in each bin is one record, and it
    matches only when the quantity in the system equals the quantity on
    the shelf, within the tolerance you set (often zero for units, a
    small percentage for bulk weights). Use cycle counts spread across
    the year, weighted so fast movers are counted more often, instead of
    one annual wall-to-wall count. A value-weighted version, dollars of
    matching records over dollars counted, suits finance; the location
    count version suits operations. Report accuracy before adjustments,
    since counting and then correcting the record makes every count look
    perfect. Track net and absolute dollar variance alongside the
    percentage.
  example: >
    A third-party warehouse cycle-counts 1,250 item-locations in March.
    1,213 match the system exactly, 22 are short and 15 are over, so
    inventory accuracy is 1,213 divided by 1,250, or 97.0 percent. The
    absolute variance is 4,100 dollars on 268,000 dollars counted. Most
    of the shorts sit in the forward pick area of one client whose
    replenishment moves are keyed after the fact, so the fix is
    scan-confirmed replenishment, and the next month's count reads 98.6
    percent.
  benchmarks:
    - scope: Distribution centers, best in class
      value: 99.5 percent or better, inventory count accuracy by location
      note: WERC 2025 DC Measures Report best-in-class threshold, the top 20 percent of surveyed distribution centers, accuracy by location of physical inventory against reported inventory; reproduced in a lift-truck maker's infographic because the report itself is sold to members.
      source: https://www.yale.com/globalassets/coms/yale/north-america/documents/white-papers/snack-drawer/YALE-1520_WERC-DC-Metrics-infographic.pdf
      source_name: Warehousing Education and Research Council, 2025 DC Measures Report, as summarized by Yale Lift Truck Technologies, Top 12 distribution center metrics (2025)
  drivers:
    - name: Receiving discipline
      note: A receipt keyed from the packing slip instead of a count of the pallet puts the supplier's error into the system on day one.
    - name: Scan-confirmed moves
      note: Every replenishment, relocation or return moved without a scan leaves the record where the stock used to be, and the next count finds both bins wrong.
    - name: Pick errors
      note: A picker who takes from the neighboring bin or grabs six instead of five creates two wrong records that stay wrong until someone counts.
    - name: Unrecorded damage and scrap
      note: Cartons crushed on the floor and thrown away without a transaction leave phantom units on the record that will be allocated to an order.
    - name: Count frequency and design
      note: Records drift between counts, so items counted once a year sit wrong for months; velocity-weighted cycle counting keeps the important ones close.
    - name: Mixed-SKU locations
      note: Bins holding several SKUs invite mispicks and miscounts, and the record for each of them is only as good as the last person's sorting.
  improve:
    - name: Run ABC cycle counts
      note: Count A items monthly, B quarterly and C once or twice a year, with a daily count list generated by the system, so the count is routine work.
    - name: Scan at every touch
      note: Receiving, put-away, replenishment, pick, pack and adjustment each confirm with a scan of location and item, so the record moves with the stock.
    - name: One SKU per location
      note: Slot fast movers so no bin holds two SKUs, and the pick location becomes a count that anyone can verify in seconds.
    - name: Root cause every variance
      note: Each mismatch gets a reason before the adjustment posts; a monthly tally of reasons shows which process leaks and which one to fix first.
    - name: Gate adjustments behind approval
      note: Adjustments above a threshold need a supervisor's sign-off with the reason, so the record is fixed by finding the stock, not by editing the number.
  pitfalls:
    - name: Measuring after adjustment
      note: A count that corrects the record and then reports 100 percent has measured nothing; report the match rate as found, and the adjustments on a separate line.
    - name: Tolerance set too wide
      note: A 5 percent tolerance on unit counts lets a bin of 20 be off by one every time and still pass; use zero tolerance for piece-counted items.
    - name: Mixing value and location bases
      note: A 99 percent by dollars can be 92 percent by location when the errors are on cheap fast movers; state which basis the number uses.
    - name: One annual count as the measure
      note: A wall-to-wall count once a year describes one day and disrupts shipping for a weekend; cycle counts produce a number every month.
