id: medication-dispensing
name: Medication dispensing
kind: skill
department: operations
summary: >
  Medication dispensing converts an authorized prescription into the
  correct labeled product for the correct patient. Prescriber,
  medication, dose, directions, clinical checks, claim, stock, product
  identity, pharmacist release, counseling, and pickup remain linked.
inputs: [prescription]
outputs: [dispensing-record]
steps:
  - name: Validate the prescription
    role: pharmacy-technician
    consumes: [prescription]
    note: >
      Patient, prescriber, date, drug, strength, directions, quantity,
      refills, authentication, and missing information are checked.
  - name: Resolve clinical and payment exceptions
    role: pharmacist
    consumes: [prescription]
    note: >
      Allergy, interaction, duplication, dose, timing, substitution,
      coverage, prior authorization, and prescriber questions are
      resolved under professional authority.
  - name: Prepare the fill
    role: pharmacy-technician
    note: >
      Product and lot, quantity, calculation, label, container, warning,
      claim, stock movement, and supporting records are assembled.
  - name: Perform the pharmacist check
    role: pharmacist
    note: >
      Prescription, patient, product, strength, quantity, label,
      directions, image or contents, and resolved exceptions are
      independently verified.
  - name: Release to the patient
    role: pharmacist
    produces: [dispensing-record]
    note: >
      Identity, payment, counseling, questions, pickup or delivery,
      signature, and final custody complete the dispensing record.
tension: >
  Queue speed competes with clinical and identity control. Delays can
  interrupt therapy; bypassed validation, preparation, or pharmacist
  checks can produce direct patient harm.
failure_modes:
  - name: Data entry changes the prescription
    cost: >
      Later preparation and checks follow a medication, strength,
      quantity, patient, or direction that was never authorized.
    signal: >
      Frequent manual edits lack a source image or documented prescriber
      clarification.
  - name: Exception is worked around without resolution
    cost: >
      Clinical, coverage, refill, or product questions reappear at
      pickup or reach the patient.
    signal: >
      Hold is removed without a pharmacist or prescriber decision.
  - name: Handoff identity is weak
    cost: >
      Correct medication reaches the wrong patient or unauthorized
      recipient.
    signal: >
      Pickup closes without the required identity and custody evidence.
maturity:
  - level: run badly
    looks_like: >
      Staff push items through a queue and rely on the final pharmacist
      glance to catch upstream errors.
  - level: run well
    looks_like: >
      Prescription, exception, claim, stock, preparation, independent
      check, counseling, and custody share one dispensing record.
  - level: run excellently
    looks_like: >
      Near-miss, delay, clarification, inventory, and pickup evidence
      improves staffing, workflow, product control, and patient support.
competencies:
  - name: Medication and prescription judgment
    note: >
      The pharmacist evaluates clinical appropriateness, legal validity,
      substitution, and information that requires prescriber contact.
  - name: Independent product verification
    note: >
      The final check compares source authority with patient, prepared
      product, label, and handoff.
automation:
  now: >
    Prescription intake, interaction screening, claims, inventory,
    label and image capture, fill queues, verification prompts, pickup,
    and controlled-record reporting.
  human: >
    Clinical judgment, ambiguous orders, prescriber consultation,
    professional verification, counseling, safeguarding, and refusal to
    dispense.
questions:
  - Which prescription is waiting on an exception with no named resolver?
  - Where can one person's data entry error pass through every later check?
article:
  what: >
    The medication dispensing process is how a pharmacy converts an
    authorized prescription into the correct labeled product in the
    hands of the correct patient. It begins when a prescription arrives
    by paper, phone, or electronic transmission and ends when the
    patient or their authorized representative takes custody after
    counseling, with a dispensing record that links prescriber,
    medication, dose, directions, clinical checks, claim, stock,
    product identity, pharmacist release, and pickup. Pharmacy
    technicians handle intake and preparation; the pharmacist owns
    clinical resolution, the independent check, and release.
  why: >
    It protects the patient from direct harm. A data entry error that
    changes the drug, strength, quantity, or directions is followed
    faithfully by every later step, and a final pharmacist glance is a
    weak defense against it. An exception cleared without a pharmacist
    or prescriber decision reaches the patient as an interaction or an
    uncovered claim, and a pickup without identity evidence puts a
    correct medication in the wrong hands. Each of those is also a
    regulatory finding the pharmacy has to answer.
  how: >
    A technician validates the prescription against the source:
    patient, prescriber, date, drug, strength, directions, quantity,
    refills, authentication, and any missing information. The
    pharmacist resolves clinical and payment exceptions, including
    allergy, interaction, duplication, dose, timing, substitution,
    coverage, prior authorization, and prescriber questions, under
    professional authority. The technician prepares the fill with
    product and lot, quantity, calculation, label, container, warnings,
    claim, stock movement, and supporting records. The pharmacist
    performs an independent check comparing prescription, patient,
    product, strength, quantity, label, directions, image or contents,
    and resolved exceptions. At release, identity, payment, counseling,
    questions, pickup or delivery, signature, and final custody
    complete the dispensing record.
  controls:
    - name: Source image retained with entry
      note: The original prescription image or transmission stays attached to the record so every later check compares against the prescriber's words.
    - name: Exception hold released by name
      note: A clinical or coverage hold is removed only by a pharmacist or with a documented prescriber decision, recorded on the prescription.
    - name: Independent pharmacist verification
      note: The final check is performed by a pharmacist who did not prepare the fill, comparing product, label, and source before release.
    - name: Identity and custody at pickup
      note: Patient or representative identity is confirmed and recorded with a signature before the medication leaves the pharmacy's custody.
    - name: Lot and stock movement recorded
      note: The product lot and stock decrement are recorded on the dispensing record so recalls and counts can trace every fill.
