id: residential-trade-sequencing
name: Residential trade sequencing
kind: skill
department: operations
summary: >-
  Coordinates inspections, dry-in, rough trades, insulation, finishes,
  fixtures, and correction work across a compact site with dependent crews.
  Residential trade sequencing leaves a current work basis, a field record,
  and acceptance evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - closeout-package
steps:
  - name: Confirm the work basis
    note: >-
      Before residential trade sequencing, read the current scope and
      revisions, then verify approved plans, lot controls, selections,
      permits, trade scopes, and long-lead dates.
  - name: Set the field controls
    note: >-
      Translate residential trade sequencing into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During residential trade sequencing, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept residential trade sequencing, check the completed work against
      the approved plan, inspection record, owner selections, and turnover
      requirements, then close correction and issue the resulting record.
tension: >-
  Residential trade sequencing has to remain inside its acceptance basis while
  production moves. A missed dependency can idle several trades and move the
  promised completion date.
failure_modes:
  - name: Residential trade sequencing starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      residential trade sequencing is settled.
    signal: >-
      The residential trade sequencing work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Residential trade sequencing closes without evidence
    cost: >-
      A concealed condition or required result from residential trade
      sequencing cannot be verified without opening, repeat work, delay, or a
      disputed exception.
    signal: >-
      Residential trade sequencing is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Residential trade sequencing is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Residential trade sequencing starts from a checked basis, follows a
      named sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Residential trade sequencing uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Residential construction sequencing
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of residential trade sequencing.
  - name: Evidence control
    note: >-
      Acceptance checks for residential trade sequencing have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Residential trade sequencing can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting residential trade sequencing
    remain human.
questions:
  - >-
    Which unresolved condition can stop residential trade sequencing before
    work begins?
  - >-
    Which record proves residential trade sequencing was accepted before it
    was covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The residential trade sequencing process is the superintendent's
    daily control of which crew works where on a house and what must be
    true before each one starts. It begins once the preconstruction
    baseline is released and the site is mobilized, and it ends when
    inspections, dry-in, rough trades, insulation, finishes, fixtures,
    and correction work have all been completed in order and the closeout
    package shows each stage accepted. In a single-family home builder it
    is owned by the superintendent, with trade leads confirming readiness
    and the builder's quality inspector accepting each stage.
  why: >
    A house is a compact site with dependent crews, so one trade starting
    early or one inspection missed stalls everyone behind it. Drywall
    hung before the rough inspection is opened up again; insulation
    installed before the plumber finishes hides a leak; cabinets
    delivered before the floor is done are stored in the garage and
    damaged. The process keeps the order and the readiness conditions
    explicit, records what each stage looked like before it was covered,
    and stops the next trade when a changed condition invalidates the
    plan.
  how: >
    The superintendent confirms the work basis by reading the current
    scope and revisions and verifying approved plans, lot controls,
    selections, permits, trade scopes, and long-lead dates for the stage
    ahead. The field controls set the trade order, the inspection and
    dry-in hold points, who calls each trade, and the photographs and
    inspection records each stage must leave. As crews work, the
    superintendent records progress, observations, decisions, and
    concealed conditions, and stops a following trade when the field
    condition changes the planned sequence. Each stage is accepted
    against the approved plan, the inspection record, owner selections,
    and turnover requirements, corrections are closed, and the accepted
    record goes into the closeout package.
  controls:
    - name: Inspection passed before cover
      note: No trade closes a wall, ceiling, or floor until the required inspection is recorded as passed with the date and inspector.
    - name: Readiness confirmed the day before
      note: The superintendent confirms predecessor work, material on site, and access with each trade lead before the crew is committed.
    - name: Concealed work photographed by room
      note: Rough trades and insulation are photographed by location before they are covered, and the photographs go into the closeout package.
    - name: Changed condition stops the next trade
      note: A field finding that alters the sequence is recorded and the following trade is held until the plan is revised and reissued.
    - name: Stage acceptance recorded with corrections
      note: Each stage is accepted by a named person with its open corrections listed, so nothing is carried forward silently.
