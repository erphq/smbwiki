id: rfi-control
name: RFI control
kind: skill
department: operations
summary: >-
  Moves a specific field or document conflict to the right designer, records
  the response, and carries any resulting change into the current work basis.
  RFI control leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - closeout-package
steps:
  - name: Confirm the work basis
    note: >-
      Before rfi control, read the current scope and revisions, then verify
      issued bid documents, coordinated trade boundaries, contractual dates,
      review routes, and owner decisions.
  - name: Set the field controls
    note: >-
      Translate rfi control into work limits, sequence, responsibilities, hold
      points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During rfi control, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept rfi control, check the completed work against contract
      documents, authority approvals, designer review, tested systems, and
      owner turnover criteria, then close correction and issue the resulting
      record.
tension: >-
  RFI control has to remain inside its acceptance basis while production
  moves. An unresolved scope boundary or late technical decision can move cost
  and time into field rework.
failure_modes:
  - name: RFI control starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for rfi
      control is settled.
    signal: >-
      The rfi control work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: RFI control closes without evidence
    cost: >-
      A concealed condition or required result from rfi control cannot be
      verified without opening, repeat work, delay, or a disputed exception.
    signal: >-
      RFI control is released while its required check, location record, test
      result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      RFI control is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      RFI control starts from a checked basis, follows a named sequence, stops
      on changed conditions, and closes against recorded acceptance criteria.
  - level: run excellently
    looks_like: >-
      RFI control uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Commercial project controls
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of rfi control.
  - name: Evidence control
    note: >-
      Acceptance checks for rfi control have to be captured while the relevant
      condition can still be observed and corrected.
automation:
  now: >-
    RFI control can use digital revisions, checklists, hold points, photo
    capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting rfi control remain human.
questions:
  - Which unresolved condition can stop rfi control before work begins?
  - >-
    Which record proves rfi control was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The RFI control process is how a commercial general contractor gets a
    design question answered without the field guessing. It begins when a
    conflict between drawings, specifications, site conditions, or trade
    scopes is found and cannot be resolved from the contract documents,
    and it ends when the designer's response is recorded, any resulting
    change is priced and carried into the current drawings, and affected
    trades are working from the revised basis. It is owned by the project
    engineer or project manager, with the superintendent raising field
    conflicts and the architect or engineer of record responding.
  why: >
    An unanswered design question becomes a field decision, and a field
    decision made without the designer becomes rework, a claim, or both.
    A conflict resolved on site and never written down leaves no record
    of who approved it when the inspector or the owner asks. A response
    that changes cost or time but never becomes a change order leaves the
    contractor carrying the difference. A revision that does not reach
    every affected trade means one crew builds to the old drawing. The
    process moves each question to the right designer, keeps the answer,
    and pushes the change into the work basis.
  how: >
    The project engineer confirms the work basis by reading the current
    scope and revisions and verifying issued bid documents, coordinated
    trade boundaries, contractual dates, review routes, and owner
    decisions. The field controls set who may raise an RFI, the required
    content, the routing to the designer, response time expectations, and
    how a response is logged and distributed. When a conflict arises the
    superintendent or trade documents it with location, drawing
    references, photographs, and a proposed resolution; the engineer
    logs it, sends it, tracks the response, records the answer, and stops
    affected work when the response changes the method. Acceptance checks
    that the resolution agrees with contract documents, authority
    approvals, designer review, tested systems, and owner turnover
    criteria, and the closed RFI with its drawings goes into the closeout
    package.
  controls:
    - name: RFI log with dates and owner
      note: Every RFI has a number, date raised, designer, date due, date answered, and current owner, reviewed at each coordination meeting.
    - name: Response recorded in writing
      note: A designer's answer given by phone or on site is written into the RFI and confirmed by the designer before the field acts on it.
    - name: Cost and time impact flagged at response
      note: Each response is assessed for cost or schedule change and linked to a change request before the affected work proceeds.
    - name: Revised drawings distributed to all affected trades
      note: The engineer records which trades received the revision and when, so no crew builds to a superseded sheet.
    - name: Closed RFIs filed in the closeout package
      note: Every RFI, response, and resulting drawing revision is retained with the as-built set for the owner and the warranty period.
