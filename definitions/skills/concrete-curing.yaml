id: concrete-curing
name: Concrete curing
kind: skill
department: operations
summary: >-
  Maintains moisture and temperature, protects new work from traffic and
  weather, records duration, and releases forms or loading at the right
  strength. Concrete curing leaves a current work basis, a field record, and
  acceptance evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - test-report
steps:
  - name: Confirm the work basis
    note: >-
      Before concrete curing, read the current scope and revisions, then
      verify surveyed layout, excavation acceptance, form dimensions, embeds,
      reinforcement, mix information, access, and weather controls.
  - name: Set the field controls
    note: >-
      Translate concrete curing into work limits, sequence, responsibilities,
      hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During concrete curing, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept concrete curing, check the completed work against specified
      geometry, cover, placement record, finish, curing, and required concrete
      test results, then close correction and issue the resulting record.
tension: >-
  Concrete curing has to remain inside its acceptance basis while production
  moves. Concrete fixes its location and many concealed details at placement,
  so an unchecked condition becomes demolition or structural repair.
failure_modes:
  - name: Concrete curing starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      concrete curing is settled.
    signal: >-
      The concrete curing work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Concrete curing closes without evidence
    cost: >-
      A concealed condition or required result from concrete curing cannot be
      verified without opening, repeat work, delay, or a disputed exception.
    signal: >-
      Concrete curing is released while its required check, location record,
      test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Concrete curing is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Concrete curing starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Concrete curing uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Concrete production control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of concrete curing.
  - name: Evidence control
    note: >-
      Acceptance checks for concrete curing have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Concrete curing can use digital revisions, checklists, hold points, photo
    capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting concrete curing remain
    human.
questions:
  - Which unresolved condition can stop concrete curing before work begins?
  - >-
    Which record proves concrete curing was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The concrete curing process protects a fresh placement until it
    reaches the strength the design assumes: keeping moisture in and
    temperature within range, protecting the surface from traffic and
    weather, recording how long each area has cured, and releasing forms
    or loading only when test results support it. It starts as soon as
    finishing ends and runs until the test report shows the required
    strength. A poured concrete contractor owns it through the foreman,
    with the superintendent or engineer releasing loading.
  why: >
    It protects strength and surface that cannot be added back later.
    Concrete that dries out or freezes in its first days never reaches
    design strength, and the defect is invisible until it cracks or
    fails under load. Forms stripped or a slab loaded on the calendar
    instead of on test results is the common cause. A curing record that
    is blank leaves the contractor unable to show the engineer what was
    done when a low break comes back.
  how: >
    The foreman confirms the work basis by reading the current scope and
    revisions on the construction plan and verifying surveyed layout,
    excavation acceptance, form dimensions, embeds, reinforcement, mix
    information, access, and weather controls. Field controls set the
    curing method by area, the temperature and moisture limits, the
    protection from traffic, hold points for form removal and loading,
    and the records the crew keeps. During curing the operator records
    start and end times, ambient and concrete temperatures, protection
    in place, decisions, and concealed details, and stops when weather
    or a reading changes the planned method. Acceptance checks the work
    against specified geometry, cover, placement record, finish, curing,
    and required concrete test results, and the test report is issued
    after correction closes.
  controls:
    - name: Curing method and duration set per placement
      note: >
        Each area carries the method, start time, and required
        duration on the placement record before curing begins.
    - name: Temperature and moisture readings logged
      note: >
        Readings are taken and recorded at the planned interval, and
        an out-of-range reading triggers a documented response.
    - name: Form removal and loading tied to test results
      note: >
        Forms come off and loads go on only when the cylinder or
        field test result on the test report supports it.
    - name: Protection inspected at each shift change
      note: >
        Cover, wind and traffic protection, and heating or shading
        are checked and recorded when crews change over.
