id: primary-care-practice
name: Primary Care Practice
codes:
  naics: "621111"
catalog_group: health-care
extends: clinic-base
summary: >
  A primary care practice manages scheduled visits, same-day concerns,
  preventive work, chronic-condition follow-up, results, referrals, and
  messages across a continuing patient record. The visit is one point
  in a longer care plan, so orders and follow-up have to remain visible
  after the patient leaves.

  The daily schedule combines visit length, clinical urgency, rooming,
  provider time, documentation, and work that arrives outside an
  appointment. Results and referral records need an owner and a next
  action. Billing depends on the clinical note matching the service that
  was performed and the coverage information held for the patient.
revenue_model:
  - id: office-visits
    note: evaluation and management services delivered in scheduled visits
  - id: preventive-care
    note: examinations and screening work delivered on a patient cadence
  - id: chronic-care
    note: recurring management and follow-up for ongoing conditions
  - remove: [patient-services]
skills:
  - ref: clinical-care
    roles: [physician, clinical-assistant]
    documents: [appointment-record, patient-chart, clinical-note, treatment-plan]
    software: [electronic-health-record]
org:
  - role: owner-operator
    reports:
      - role: office-manager
        reports:
          - role: receptionist
          - role: billing-specialist
      - role: physician
        reports:
          - role: clinical-assistant
licenses:
  us:
    - ref: physician-license
      requirement: required
      condition: Required for physicians providing regulated medical care.
      as_of: "2026-07-29"
seo:
  title: "Primary Care Practice: How the Business Works | smbwiki"
article:
  operating_model: >
    A primary care practice runs on the schedule and the patient chart.
    The receptionist books visits and verifies coverage with the billing
    specialist, the clinical assistant rooms the patient and updates the
    chart, and the physician sees the patient, documents the clinical
    note, and sets the treatment plan with orders and follow-up. Work
    arrives outside the appointment as results, referrals, messages, and
    refills, and each needs an owner and a next action. Clinical care
    and claims billing are the load-bearing skills, because the claim
    can only be paid when the note matches the service performed and the
    coverage held for the patient. The tension is between visit length
    and the same-day demand that has to fit into a fixed provider day.
  starting: >
    Day one requires a licensed physician, since the state physician
    license is the credential the practice is built on, plus the
    registrations every business needs: business registration, employer
    registration, and any state clinic or facility registration that
    applies. Before the first claim can be paid, the practice needs
    provider identifiers and enrollment with each insurer and with the
    federal programs it intends to bill, controlled-substance
    registrations where the physician prescribes them, a laboratory
    waiver if point-of-care tests are run in the office, and
    professional liability coverage. The minimum team is the physician,
    a clinical assistant, a receptionist who schedules and verifies
    coverage, and a billing specialist, with the office manager handling
    staff scheduling and accounts payable. The first records are the
    patient registration, insurance verification, appointment record,
    patient chart, clinical note, insurance claim, and recall list, all
    inside an electronic health record. The skills that must work from
    the first open are appointment scheduling, coverage verification,
    patient intake, clinical care, and claims billing.
  economics: >
    Revenue is office visits, preventive care, and chronic care, each
    billed as coded services against payer fee schedules the practice
    has accepted, so the price of a visit is largely set by the
    insurers and the federal programs, and the practice controls volume,
    coding accuracy, and collection. Gross margin is what remains after
    physician and staff compensation, which makes the practice labor
    intensive and puts the pressure on visits per provider day and on
    keeping the schedule full. The metrics that decide profit are
    appointment no-show rate, clean claim rate, days sales outstanding,
    and recall reappointment rate, because an empty slot cannot be
    resold, a rejected claim delays cash by weeks, and preventive and
    chronic visits only recur if patients are recalled. Capital needs
    are modest beyond the record system and exam rooms, so the margin
    question is almost entirely staffing ratio and billing discipline.
