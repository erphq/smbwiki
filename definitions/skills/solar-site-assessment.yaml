id: solar-site-assessment
name: Solar site assessment
kind: skill
department: operations
summary: >-
  Records roof structure and condition, orientation, shade, access, electrical
  service, equipment location, energy use, and constructability. Solar site
  assessment leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - site-plan
outputs:
  - commissioning-record
steps:
  - name: Confirm the work basis
    note: >-
      Before solar site assessment, read the current scope and revisions, then
      verify verified roof or ground condition, energy use and shading data,
      approved electrical design, permit, utility route, equipment, and fall
      protection.
  - name: Set the field controls
    note: >-
      Translate solar site assessment into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During solar site assessment, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept solar site assessment, check the completed work against
      structural and electrical compliance, flashed attachments, labeled
      circuits, tested shutdown, documented production, inspection, and
      utility permission, then close correction and issue the resulting
      record.
tension: >-
  Solar site assessment has to remain inside its acceptance basis while
  production moves. Design, roof, electrical, permit, and utility decisions
  converge at installation, and one mismatch can delay permission to operate.
failure_modes:
  - name: Solar site assessment starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for solar
      site assessment is settled.
    signal: >-
      The solar site assessment work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Solar site assessment closes without evidence
    cost: >-
      A concealed condition or required result from solar site assessment
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Solar site assessment is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Solar site assessment is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Solar site assessment starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Solar site assessment uses field evidence, production variance, defects,
      and closeout results to improve the next estimate, work package, and
      control point.
competencies:
  - name: Photovoltaic design and commissioning
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of solar site assessment.
  - name: Evidence control
    note: >-
      Acceptance checks for solar site assessment have to be captured while
      the relevant condition can still be observed and corrected.
automation:
  now: >-
    Solar site assessment can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting solar site assessment remain
    human.
questions:
  - >-
    Which unresolved condition can stop solar site assessment before work
    begins?
  - >-
    Which record proves solar site assessment was accepted before it was
    covered, loaded, energized, occupied, or handed over?
