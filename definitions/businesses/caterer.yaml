seo:
  title: "Caterer: How the Business Works | smbwiki"
article:
  operating_model: >
    A caterer sells a dated plan and then executes it somewhere it does
    not control. The week runs backward from event dates: the
    general-manager takes leads and writes quotes, the head-chef turns
    confirmed menus into prep lists and purchase orders, advance prep
    happens in the kitchen days ahead, timed cooking and packing happen
    the morning of, and the driver and event lead load, transport, set
    up, serve, and break down. Event production planning and quoting are
    the load-bearing skills, with staff scheduling deciding whether
    servers exist for a Saturday with several events. The tension is the
    load check: once the van leaves, a missing serving tool, a short
    dietary count, or a venue without the promised power is the
    caterer's problem to solve on site, so the plan has to be complete
    before departure.
  starting: >
    Catering is food service, so day one needs the food service license
    from the state or local health authority for the production kitchen,
    food handler permits for staff, and in most jurisdictions an
    inspection of the kitchen before it can produce for the public; a
    caterer without its own premises rents a licensed commissary kitchen
    and operates under that inspection. Serving alcohol at events
    requires a caterer's liquor license or a per-event permit in most
    states. Around those sit the business registration, sales tax
    registration on catered food and service charges, an employer
    registration for the first cook, general liability insurance that
    venues will ask to see, and a vehicle fit for food transport. The
    minimum team is an owner-operator or general-manager who sells and
    leads events, a head-chef who plans and produces, and on-call
    servers, a driver, and a dishwasher for event days. The first
    records are the job request, the quote with guest count and menu,
    the order ticket and prep list, the delivery ticket with the load
    list, and the shift schedule. Lead intake, quoting, event production
    planning, menu planning, food prep, delivery dispatch, and staff
    scheduling must all work before the first event.
  economics: >
    Revenue is drop-off events, priced per head or per tray for
    customer-managed service, and staffed events, priced as food per
    head plus service labor, rentals, setup, and cleanup. Staffed events
    carry the higher ticket and the higher risk, because labor,
    transport, and rentals are committed to a date whether or not the
    guest count holds. Quote win rate sizes the calendar; food cost
    percentage and labor cost percentage decide profit, and waste
    percentage is the leak, since a caterer buys for a guest count and
    the leftovers do not return to inventory. Delivery time and ticket
    time show whether the event was served as planned, which is what
    drives referrals. Gross margin is protected by the deposit and by
    fixing the guest count at a cutoff date. The business is labor
    intensive on event days and light on capital beyond the kitchen and
    vehicles; the calendar is lumpy, weddings and holidays pay for slow
    months, and the kitchen sits idle between them.
