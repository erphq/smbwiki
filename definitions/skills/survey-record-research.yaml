id: survey-record-research
name: Survey record research
kind: skill
department: operations
summary: >-
  Collects deeds, plats, easements, corner records, adjoining descriptions,
  prior surveys, control, and gaps or conflicts that direct fieldwork. Survey
  record research leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - site-plan
outputs:
  - survey-plat
steps:
  - name: Confirm the work basis
    note: >-
      Before survey record research, read the current scope and revisions,
      then verify defined survey purpose, current deeds and plats, adjoining
      records, coordinate basis, access, equipment checks, and field safety
      plan.
  - name: Set the field controls
    note: >-
      Translate survey record research into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During survey record research, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept survey record research, check the completed work against
      traceable evidence, closed measurements, resolved boundary opinion, set
      or found monuments, complete notes, and signed deliverable, then close
      correction and issue the resulting record.
tension: >-
  Survey record research has to remain inside its acceptance basis while
  production moves. Treating record dimensions as field truth can move a
  boundary opinion away from controlling evidence.
failure_modes:
  - name: Survey record research starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for survey
      record research is settled.
    signal: >-
      The survey record research work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Survey record research closes without evidence
    cost: >-
      A concealed condition or required result from survey record research
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Survey record research is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Survey record research is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Survey record research starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Survey record research uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Boundary evidence and measurement adjustment
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of survey record research.
  - name: Evidence control
    note: >-
      Acceptance checks for survey record research have to be captured while
      the relevant condition can still be observed and corrected.
automation:
  now: >-
    Survey record research can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting survey record research
    remain human.
questions:
  - >-
    Which unresolved condition can stop survey record research before work
    begins?
  - >-
    Which record proves survey record research was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The survey record research process is the first thing a land surveying
    firm does on a boundary job, before anyone loads the truck: the researcher
    collects the deeds, plats, easements, corner records, adjoining
    descriptions, prior surveys, and control for the parcel, then lists the
    gaps and conflicts that the field crew has to resolve. It starts when a
    survey request is accepted and ends when a research package with a
    marked-up site plan and a list of monuments to search for is handed to the
    crew chief. The licensed surveyor owns the conclusions and a research
    technician or the surveyor does the collection.
  why: >
    A crew sent out without the record wastes days looking for corners the
    record could have located and misses the corners the record shows should
    exist. An unread easement, an adjoiner's senior deed, or a prior survey
    that already found a conflict can change the boundary opinion, and a
    surveyor who signs a plat without having looked for those documents has no
    defense when the line is disputed. The research package is also where the
    firm decides whether the job as quoted is the job the record describes.
  how: >
    The surveyor confirms the work basis by fixing the purpose of the survey,
    pulling current deeds and plats, adjoining records, and the coordinate
    basis, and checking access, equipment, and the field safety plan against
    what the record suggests the site holds. Field controls are then set for
    the research itself: which sources are in scope, the search sequence from
    the subject deed outward through adjoiners and prior surveys, who compiles
    and who reviews, and the hold point where the surveyor reads the conflicts
    before fieldwork is scheduled. The researcher records each document found,
    its source and date, the calls it contains, and every gap or conflict
    between documents, and stops to consult the surveyor when a senior title
    or an unrecorded survey changes the planned method. Acceptance checks that
    the evidence is traceable, that conflicts are listed for field resolution,
    and that the package supports a resolved boundary opinion, found or set
    monuments, complete notes, and a signed survey plat.
  controls:
    - name: Source list with recording data
      note: Every deed, plat, easement, and corner record is logged with its book, page, or document number and the date it was pulled, so the chain can be reread.
    - name: Adjoiner search completed on every side
      note: The record for each adjoining parcel is read and compared with the subject description before the research package is closed.
    - name: Conflict list handed to the crew
      note: Gaps, overlaps, and disagreements between documents are written as a list of field questions the crew chief signs for before mobilizing.
    - name: Prior surveys and corner records checked
      note: Recorded prior surveys and corner records for the parcel and its adjoiners are searched and noted, including a negative result.
    - name: Surveyor reviews before fieldwork
      note: The licensed surveyor reads the research package and the conflict list and approves the field plan before the crew is scheduled.
