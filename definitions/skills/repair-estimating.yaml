id: repair-estimating
name: Repair estimating
kind: skill
department: sales
summary: >
  Repair estimating turns inspection findings into a priced scope the
  customer and shop can both understand. Labor operations, parts,
  outside work, fees, and tax are tied back to a finding before the
  estimate is presented.
inputs: [inspection-report]
outputs: [repair-estimate]
steps:
  - name: Separate the findings
    role: service-advisor
    consumes: [inspection-report]
    note: >
      Safety, the stated concern, maintenance, and optional improvement
      remain separate choices.
  - name: Build labor and parts
    role: service-advisor
    note: >
      Each operation includes the labor, parts, supplies, and outside
      services needed to finish it.
  - name: Check availability and overlap
    role: parts-manager
    note: >
      Parts timing and labor shared between operations can change both
      price and the date promised.
  - name: Issue the estimate
    role: service-advisor
    produces: [repair-estimate]
    note: >
      The customer can see what fixes the concern, what can wait, and
      what changes if only part of the scope is chosen.
tension: >
  Complete disclosure competes with decision clarity. Every supported
  finding belongs in the record; presenting unrelated work as one total
  makes approval harder and hides the purpose of each line.
failure_modes:
  - name: Unsupported line item
    cost: >
      The advisor cannot explain why the work is needed and customer
      trust shifts from the finding to the price.
    signal: >
      An estimate operation has no matching finding in the inspection
      report.
  - name: Partial approval breaks the plan
    cost: >
      The shop starts work that cannot be completed safely or efficiently
      without a declined companion operation.
    signal: >
      Bundled labor or required related parts are hidden across optional
      lines.
  - name: Availability omitted
    cost: >
      The customer approves a price and leaves the vehicle, then learns
      the required part has no confirmed arrival.
    signal: >
      Special-order parts have price but no source or expected date.
maturity:
  - level: run badly
    looks_like: >
      The estimate is one total assembled from habit and the advisor
      explains the scope from memory.
  - level: run well
    looks_like: >
      Every line traces to evidence, required and optional work are
      separated, and parts timing is known before approval.
  - level: run excellently
    looks_like: >
      Common overlaps and dependencies are handled consistently, declined
      work remains visible, and actual repair results improve future
      estimates.
competencies:
  - name: Scope construction
    note: >
      A technically correct finding must become a complete repair
      operation with no missing labor, material, or prerequisite.
  - name: Plain explanation
    note: >
      The advisor translates evidence and consequence without turning the
      estimate into pressure.
automation:
  now: >
    Labor-guide lookup, parts pricing, tax calculation, canned-operation
    assembly, availability checks, and digital presentation.
  human: >
    Separating choices, handling overlapping work, and deciding how much
    uncertainty the estimate needs to expose.
questions:
  - Can every estimate line be traced to a recorded finding?
  - What happens operationally if the customer approves only part of the scope?
article:
  what: >
    The repair estimating process turns the technician's inspection
    findings into a priced scope the customer can decide on. It begins
    when the inspection report is complete and ends when an estimate has
    been issued that separates safety items, the stated concern,
    maintenance, and optional work, with labor, parts, outside services,
    fees, and tax tied to each finding and parts availability known. In
    an auto repair shop it is owned by the service advisor, with the
    parts manager confirming availability and the labor overlap between
    operations.
  why: >
    The estimate is where a finding becomes money, and the customer's
    trust follows the link between the two. A line with no matching
    finding shifts the conversation from the vehicle to the price.
    Bundled labor hidden across optional lines lets a customer decline
    one line and unknowingly make another unsafe or impossible. A
    special-order part priced without a source or arrival date leaves the
    customer approving a repair the shop cannot schedule. The process
    keeps each line traceable, each dependency visible, and each part's
    timing known before approval.
  how: >
    The service advisor separates the findings from the inspection report
    so safety, the stated concern, maintenance, and optional improvement
    remain distinct choices. For each operation the advisor builds the
    labor, parts, supplies, and outside services needed to finish it,
    using the labor guide and parts pricing. The parts manager checks
    availability and overlap, confirming source and arrival date for
    special-order parts and identifying labor shared between operations
    that changes price or the promised date if only some lines are
    approved. The advisor issues the repair estimate so the customer can
    see what fixes the concern, what can wait, and what changes if only
    part of the scope is chosen.
  controls:
    - name: Every line traces to a finding
      note: An estimate operation cannot be added without a matching finding on the inspection report or a recorded customer request.
    - name: Required and optional work separated
      note: Safety items, the stated concern, maintenance, and optional work are grouped so a customer's partial approval is a real choice.
    - name: Dependencies disclosed on the estimate
      note: Shared labor and required companion parts are stated on the lines they affect, so declining one line shows its effect on another.
    - name: Parts source and date before presentation
      note: Special-order parts carry a supplier, price, and expected arrival before the estimate is presented to the customer.
    - name: Estimate versions retained
      note: Each revision is stored so the shop can show which version the customer saw and later authorized.
