id: elevator-modernization
name: Elevator modernization
kind: skill
department: operations
summary: >-
  Surveys retained conditions, coordinates design and permits, phases outage
  and material, installs new controls or equipment, and manages acceptance
  testing. Elevator modernization leaves a current work basis, a field record,
  and acceptance evidence that another operator can trace.
inputs:
  - service-ticket
outputs:
  - test-report
steps:
  - name: Confirm the work basis
    note: >-
      Before elevator modernization, read the current scope and revisions,
      then verify identified unit, maintenance history, code status, safe
      access, outage coordination, parts, qualified staff, and rescue
      provisions.
  - name: Set the field controls
    note: >-
      Translate elevator modernization into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During elevator modernization, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept elevator modernization, check the completed work against safe
      operation, required clearances and protection, corrected defects,
      recorded tests, current log, and regulatory inspection status, then
      close correction and issue the resulting record.
tension: >-
  Elevator modernization has to remain inside its acceptance basis while
  production moves. An elevator can return to service while an intermittent
  control, door, braking, or leveling defect remains unresolved.
failure_modes:
  - name: Elevator modernization starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      elevator modernization is settled.
    signal: >-
      The elevator modernization work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Elevator modernization closes without evidence
    cost: >-
      A concealed condition or required result from elevator modernization
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Elevator modernization is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Elevator modernization is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Elevator modernization starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Elevator modernization uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Vertical-transport diagnostics and code testing
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of elevator modernization.
  - name: Evidence control
    note: >-
      Acceptance checks for elevator modernization have to be captured while
      the relevant condition can still be observed and corrected.
automation:
  now: >-
    Elevator modernization can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting elevator modernization
    remain human.
questions:
  - >-
    Which unresolved condition can stop elevator modernization before work
    begins?
  - >-
    Which record proves elevator modernization was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The elevator modernization process replaces controls, drive, doors, or
    other major equipment on an existing unit while the building keeps
    operating: the contractor surveys what is retained, coordinates design
    and permits, phases the outage and material deliveries, installs the new
    equipment, and manages the acceptance test with the jurisdiction. It
    starts from a service ticket or contract for the unit and ends with a
    test report, an inspection sign-off, and the unit's log restarted on the
    new equipment. An elevator service contractor's modernization project
    manager owns it with a lead mechanic on site.
  why: >
    Modernization mixes old and new equipment in one hoistway, and the
    interfaces are where it fails. A retained machine or rail that was never
    surveyed properly does not fit the new controller's assumptions, and the
    discovery comes mid-outage with the car out of service and the building
    complaining. Permits and inspection scheduling left late add weeks of
    downtime. Material phased wrong fills the machine room with equipment
    that cannot be installed yet. Acceptance testing skipped or
    under-recorded leaves the unit running without proof it meets the code
    it was upgraded to.
  how: >
    The project manager reads the contract scope and confirms the identified
    unit, its maintenance history and code status, safe access, the outage
    plan agreed with the building, parts and equipment deliveries, qualified
    staff, and rescue provisions during construction. Field controls set the
    outage phases, the sequence of removal and installation, hold points for
    retained-equipment verification and inspector visits, responsibilities
    between the crew and the manufacturer, and the records for each phase.
    On site the lead mechanic records retained conditions, installation
    details, wiring, and settings, and stops when a retained condition does
    not match the survey. Acceptance runs the full test with the inspector,
    checks safe operation, clearances, corrected defects, recorded tests,
    the new log, and the inspection status, and the test report is issued.
  controls:
    - name: Retained-equipment survey on record
      note: Every component kept in service is measured and photographed before design is finalized, and the survey is attached to the job.
    - name: Permit and inspection dates scheduled early
      note: The permit application and the inspector's acceptance visit are booked before the first outage phase begins.
    - name: Phase gate before each outage
      note: Material on hand, crew, and building notice are confirmed before the car is taken out of service for a phase.
    - name: Concealed wiring and settings recorded
      note: Wiring routes, parameter settings, and adjustments are recorded as they are made so the unit can be serviced later.
    - name: Acceptance test witnessed and reported
      note: The full test is run with the inspector, and the test report and log are issued before the unit carries passengers.
