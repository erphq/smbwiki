id: food-truck
name: Food Truck
codes:
  naics: "722330"
  nic: "56103"
catalog_group: food-lodging
extends: restaurant-base
summary: >
  A food truck combines a production kitchen with a daily location and
  service window. Menu, prep, loading, travel, parking, power, water,
  fuel, storage, waste, and weather have to be settled before the first
  order.

  The service line is constrained by the equipment and people inside
  the vehicle. Orders need to match station capacity, and sold-out items
  have to leave the menu promptly. Closeout includes safe food storage,
  waste handling, cleaning, restocking, cash or payment reconciliation,
  and the plan for the next location.
revenue_model:
  - id: street-service
    note: counter orders sold during a published location and service window
  - id: booked-events
    note: attendance at private or organized events under agreed terms
  - remove: [dine-in, takeout, catering]
