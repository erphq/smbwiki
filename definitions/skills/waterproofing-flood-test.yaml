id: waterproofing-flood-test
name: Waterproofing flood test
kind: skill
department: quality
summary: >-
  Defines test boundary and duration, protects adjacent areas, records
  starting level, monitors loss and leakage, and releases the assembly after
  repair and retest. Waterproofing flood test leaves a current work basis, a
  field record, and acceptance evidence that another operator can trace.
inputs:
  - inspection-report
outputs:
  - test-report
steps:
  - name: Confirm the work basis
    note: >-
      Before waterproofing flood test, read the current scope and revisions,
      then verify identified moisture source, sound and dryable substrate,
      compatible system, prepared transitions, drainage route, and safe
      access.
  - name: Set the field controls
    note: >-
      Translate waterproofing flood test into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During waterproofing flood test, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept waterproofing flood test, check the completed work against
      continuous specified thickness, bonded transitions, sealed penetrations,
      protected terminations, drainage, cure, and required water test, then
      close correction and issue the resulting record.
tension: >-
  Waterproofing flood test has to remain inside its acceptance basis while
  production moves. Treating the visible leak without tracing pressure, path,
  termination, and drainage can move water into a new concealed route.
failure_modes:
  - name: Waterproofing flood test starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      waterproofing flood test is settled.
    signal: >-
      The waterproofing flood test work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Waterproofing flood test closes without evidence
    cost: >-
      A concealed condition or required result from waterproofing flood test
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Waterproofing flood test is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Waterproofing flood test is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Waterproofing flood test starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Waterproofing flood test uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Building-envelope moisture diagnosis
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of waterproofing flood test.
  - name: Evidence control
    note: >-
      Acceptance checks for waterproofing flood test have to be captured while
      the relevant condition can still be observed and corrected.
automation:
  now: >-
    Waterproofing flood test can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting waterproofing flood test
    remain human.
questions:
  - >-
    Which unresolved condition can stop waterproofing flood test before work
    begins?
  - >-
    Which record proves waterproofing flood test was accepted before it was
    covered, loaded, energized, occupied, or handed over?
