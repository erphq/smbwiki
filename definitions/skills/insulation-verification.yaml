id: insulation-verification
name: Insulation verification
kind: skill
department: quality
summary: >-
  Checks boundary continuity, depth, density, clearances, dams, ventilation
  paths, access treatment, and photo evidence before concealment. Insulation
  verification leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - inspection-report
steps:
  - name: Confirm the work basis
    note: >-
      Before insulation verification, read the current scope and revisions,
      then verify complete air-control layer, dry cavities, closed leaks,
      installed services, approved insulation system, and safe access.
  - name: Set the field controls
    note: >-
      Translate insulation verification into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During insulation verification, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept insulation verification, check the completed work against
      continuous thermal and air boundary, full depth, correct density,
      protected clearances, and documented concealed work, then close
      correction and issue the resulting record.
tension: >-
  Insulation verification has to remain inside its acceptance basis while
  production moves. Voids, compression, wind washing, and bypasses can survive
  inspection while degrading comfort and energy use for the life of the
  assembly.
failure_modes:
  - name: Insulation verification starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      insulation verification is settled.
    signal: >-
      The insulation verification work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Insulation verification closes without evidence
    cost: >-
      A concealed condition or required result from insulation verification
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Insulation verification is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Insulation verification is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Insulation verification starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Insulation verification uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Thermal and air-boundary continuity
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of insulation verification.
  - name: Evidence control
    note: >-
      Acceptance checks for insulation verification have to be captured while
      the relevant condition can still be observed and corrected.
automation:
  now: >-
    Insulation verification can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting insulation verification
    remain human.
questions:
  - >-
    Which unresolved condition can stop insulation verification before work
    begins?
  - >-
    Which record proves insulation verification was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The insulation verification process is an insulation contractor's
    last look at a thermal and air boundary before drywall or sheathing
    conceals it. It confirms that the boundary is continuous, that depth
    and density meet the specified values, that clearances around
    flues, recessed lights, and vents are kept, that dams and baffles
    hold material where it belongs, that ventilation paths are open,
    that access hatches are treated, and that photographs record all of
    it. It starts from the construction plan and ends with an
    inspection report the general contractor, the energy rater, and the
    code inspector can rely on. The crew lead or the quality lead owns
    it.
  why: >
    It protects performance that cannot be seen again for the life of
    the building. Voids, compressed batts, wind washing at eaves, and
    bypasses around chases pass a visual glance and then degrade
    comfort and energy use in every season that follows. A missed
    clearance is a fire hazard. Without a recorded verification, the
    contractor cannot show the rater or the builder what was installed,
    and a later comfort complaint or a failed blower door test becomes
    an argument about work that is buried.
  how: >
    The crew lead reads the current scope and revisions from the
    construction plan, then verifies that the air-control layer is
    complete, cavities are dry, known leaks are closed, services are
    installed, the insulation system is the approved one, and access is
    safe. The plan is translated into field controls: limits of the
    work, sequence by area, responsibilities, hold points before any
    area is closed, and the records to be kept. During the work the
    installer records quantities, observations, decisions, and every
    concealed detail, and stops when a field condition changes the
    planned method. At acceptance the lead checks for a continuous
    thermal and air boundary, full depth, correct density, protected
    clearances, and documented concealed work, then closes corrections
    and issues the inspection report.
  controls:
    - name: Hold point before concealment
      note: No area is released to drywall or sheathing until the verification for that area is recorded and any correction is closed.
    - name: Depth and density measured in place
      note: Depth is probed and density checked in each cavity type against the specified values, with the readings written in the report.
    - name: Clearance and dam check
      note: Flue, chimney, recessed fixture, and vent clearances and their dams or baffles are confirmed and photographed before material is placed around them.
    - name: Photo record by location
      note: Each photograph is tagged to a plan location so the report can show what was installed behind any wall or ceiling later.
    - name: Air-control layer verified first
      note: The verification does not start until the air barrier is complete and leaks are closed, since insulation over a leaking boundary is wasted.
