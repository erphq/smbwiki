id: fence-closeout
name: Fence closeout
kind: skill
department: quality
summary: >-
  Walks alignment, fasteners, sharp edges, finish, gaps, gate operation,
  cleanup, disturbed grade, and owner acceptance. Fence closeout leaves a
  current work basis, a field record, and acceptance evidence that another
  operator can trace.
inputs:
  - site-plan
outputs:
  - quality-report
steps:
  - name: Confirm the work basis
    note: >-
      Before fence closeout, read the current scope and revisions, then verify
      verified boundary or approved alignment, located utilities, selected
      system, known grade, gate geometry, material, and access.
  - name: Set the field controls
    note: >-
      Translate fence closeout into work limits, sequence, responsibilities,
      hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During fence closeout, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept fence closeout, check the completed work against line, grade,
      post embedment, spacing, fastening, gate operation, finish condition,
      security, and restored site, then close correction and issue the
      resulting record.
tension: >-
  Fence closeout has to remain inside its acceptance basis while production
  moves. A fence can be straight and complete while occupying the wrong line
  or leaving gates and grades unusable.
failure_modes:
  - name: Fence closeout starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for fence
      closeout is settled.
    signal: >-
      The fence closeout work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Fence closeout closes without evidence
    cost: >-
      A concealed condition or required result from fence closeout cannot be
      verified without opening, repeat work, delay, or a disputed exception.
    signal: >-
      Fence closeout is released while its required check, location record,
      test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Fence closeout is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Fence closeout starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Fence closeout uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Fence layout and field fit
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of fence closeout.
  - name: Evidence control
    note: >-
      Acceptance checks for fence closeout have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Fence closeout can use digital revisions, checklists, hold points, photo
    capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting fence closeout remain human.
questions:
  - Which unresolved condition can stop fence closeout before work begins?
  - >-
    Which record proves fence closeout was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The fence closeout process is the final walk a fence contractor makes
    before asking the owner to accept the job: the lead walks the full line
    checking alignment, fasteners, sharp edges, finish, gaps, gate swing and
    latch, cleanup, disturbed grade, and the condition of the site, then
    closes corrections and walks the owner through the result. It starts
    when panel installation is declared complete and ends with a signed
    quality report and owner acceptance. A fence contractor's crew lead or
    owner runs it.
  why: >
    Fences are accepted by eye and disputed by tape measure. A fence that
    looks straight and complete can sit on the wrong line, and the
    neighbor's surveyor finds it after the owner has paid. A gate that binds
    after the concrete cures, a run of exposed screw tips at child height,
    or a trench left unrestored generates the callback that turns a
    profitable job into a loss. The closeout is where those are found by the
    contractor's own people, corrected, and documented before the owner sees
    them.
  how: >
    The lead reads the site plan and revisions and confirms the verified
    boundary or approved alignment, located utilities, the selected system,
    known grade, gate geometry, material, and access. Field controls set the
    walk sequence, the checks at each post, panel, and gate, the photograph
    required for each, and the hold point before the owner is called. On the
    walk the lead records line and grade against the plan, fastener and edge
    condition, finish, gaps, gate operation, cleanup, and restored grade,
    and stops when the built line differs from the alignment. Acceptance
    checks line, grade, post embedment, spacing, fastening, gate operation,
    finish, security, and the restored site, corrections are closed, and the
    quality report is issued and signed by the owner.
  controls:
    - name: Line checked against the approved alignment
      note: The built line is measured against the verified boundary or approved alignment and recorded before the owner walk.
    - name: Gate operation tested after cure
      note: Each gate is swung, latched, and locked after posts have cured, and the result is recorded on the quality report.
    - name: Fastener and edge sweep
      note: Every panel is checked for proud fasteners, cut edges, and sharp ends at the height a child or a hand would reach.
    - name: Site restoration photographed
      note: Disturbed grade, spoil, and cleanup are photographed at each post line before the crew leaves the site.
    - name: Owner acceptance signed on the report
      note: The owner walks the fence with the lead and signs the quality report, with any open item listed by location.
