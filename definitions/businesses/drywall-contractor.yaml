revenue_model:
  - id: drywall-board-and-finish-level
    note: measured board and finishing scope adjusted for assembly, height, access, finish level, texture, protection, and patch work
summary: >-
  A drywall contractor lays out, hangs, tapes, finishes, textures, and repairs
  gypsum board after framing and rough building systems are ready. Board type,
  backing, access panels, control joints, edge support, and finish level have
  to be settled before high-volume hanging hides the supporting work.


  Finishing is a drying and surface-control process as much as a labor
  sequence. Temperature, humidity, coat thickness, sanding, lighting, and
  protection affect the result. Defects often become visible only after paint,
  so the contractor inspects representative light conditions and closes punch
  work before the finish crew leaves.
