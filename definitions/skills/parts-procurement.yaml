id: parts-procurement
name: Parts procurement
kind: skill
department: supply
summary: >
  Parts procurement turns authorized repair work into the exact
  components and supplies required at the bay. Identification, source,
  price, expected arrival, receipt, and return status stay tied to the
  repair so technical fit and job cost remain visible.
inputs: [work-authorization]
outputs: [purchase-order, supplier-invoice]
steps:
  - name: Translate the authorized work
    role: parts-manager
    consumes: [work-authorization]
    note: >
      Vehicle identity, equipment variant, and repair method determine
      the part specification before price is compared.
  - name: Choose source and promise
    role: parts-manager
    note: >
      Availability, fit confidence, warranty, return terms, and delivery
      time are considered together.
  - name: Place the order
    role: parts-manager
    produces: [purchase-order]
    note: >
      The order carries the repair reference and required date so the
      supplier promise can be checked.
  - name: Receive to the repair
    role: parts-manager
    produces: [supplier-invoice]
    note: >
      Quantity, damage, identifiers, cores, and invoice cost are checked
      before the part reaches the technician.
tension: >
  Fast availability competes with fit confidence and economic recovery.
  The quickest part can save a bay today; a wrong, nonreturnable, or
  weakly supported part creates delay and cost after installation.
failure_modes:
  - name: Wrong variant
    cost: >
      The vehicle occupies capacity while the replacement is sourced and
      the first part enters a return process.
    signal: >
      The order was placed from year and model without a complete vehicle
      or installed-part identifier.
  - name: Part arrives without job ownership
    cost: >
      Material is misplaced, installed on another repair, or excluded
      from the job cost.
    signal: >
      Received parts lack a repair-order label or assigned location.
  - name: Core or return expires
    cost: >
      Recoverable value becomes a permanent supplier charge.
    signal: >
      Removed parts and rejected components have no return owner or due
      date.
maturity:
  - level: run badly
    looks_like: >
      Technicians search supplier sites from the bay and parts arrive
      without repair labels or return tracking.
  - level: run well
    looks_like: >
      Fit, source, arrival, cost, receipt, and returns are controlled by
      one parts queue tied to authorized work.
  - level: run excellently
    looks_like: >
      Supplier performance and fit history guide sourcing, and the shop
      knows which open part can delay each repair.
competencies:
  - name: Parts identification
    note: >
      Similar-looking components can differ by production date, option,
      calibration, connector, or installed system.
  - name: Supply recovery
    note: >
      The parts manager protects credits, cores, warranties, and return
      windows after the bay has finished with the item.
automation:
  now: >
    Catalog lookup, cross references, availability and price search,
    order transmission, receiving labels, and return reminders.
  human: >
    Resolving uncertain fit, judging substitutions, escalating a delayed
    repair, and deciding which supplier promise is credible.
questions:
  - Which open repair is currently waiting for a part without a confirmed arrival?
  - Are cores and rejected parts tracked until credit is received?
article:
  what: >
    The parts procurement process gets the exact component or supply
    that an authorized repair needs to the technician's bay, with its
    cost, arrival, and return status tied to the repair order the whole
    way. It starts when a repair is authorized and the method is known,
    and it ends when the part has been received, checked, labeled to the
    repair, and its invoice cost posted to the job, with any core or
    return tracked to credit. The parts manager owns it in an auto
    repair shop; in a small shop the service writer or the owner does it
    between customers.
  why: >
    It protects bay capacity and job margin. A part ordered from year
    and model without the vehicle's full identifier or the installed
    part's number arrives as the wrong variant, and the car sits in the
    bay while a second part is sourced and the first enters a return. A
    part received without a repair label gets installed on another job
    or lost from the job cost. A core or a rejected part with no return
    owner and no due date becomes a permanent supplier charge. The
    fastest source is often the least supported one, and the process is
    where that trade is made deliberately.
  how: >
    The parts manager reads the work authorization and translates it
    into a specification: vehicle identity, equipment variant, and the
    repair method fix the part before any price is compared. A source is
    then chosen with availability, fit confidence, warranty, return
    terms, and delivery time weighed together, and a promise date is set
    from the supplier's commitment. The purchase order is placed
    carrying the repair order reference and the required date so the
    promise can be checked. On arrival the part is received to the
    repair: quantity, damage, identifiers, cores, and invoice cost are
    checked, the supplier invoice is matched, and the part is labeled
    and staged for the technician.
  controls:
    - name: Specification before sourcing
      note: The part is identified from the VIN, the equipment variant, and where possible the installed part number, and an order from year and model alone is held.
    - name: Purchase order carries the repair reference
      note: Every order names the repair order and the required date, so an arrival can be matched and a late promise escalated before the bay waits.
    - name: Receiving check to the repair
      note: Quantity, damage, and identifiers are checked at receipt, the part is labeled with the repair number, and the invoice cost is posted to the job.
    - name: Core and return register
      note: Every core and every rejected part has a return owner, a supplier reference, and a due date, and the register is reviewed until credit posts.
    - name: Open-part list against active repairs
      note: Repairs waiting for parts are listed with the promised arrival, and a missing promise is chased before the bay is scheduled.
