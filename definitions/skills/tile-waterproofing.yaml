id: tile-waterproofing
name: Tile waterproofing
kind: skill
department: operations
summary: >-
  Installs membranes, seams, corners, penetrations, drains, upturns,
  transitions, and protection as one continuous tested assembly. Tile
  waterproofing leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - quality-report
steps:
  - name: Confirm the work basis
    note: >-
      Before tile waterproofing, read the current scope and revisions, then
      verify stable and flat substrate, cured work, approved tile and setting
      system, resolved movement joints, dry layout, and environmental control.
  - name: Set the field controls
    note: >-
      Translate tile waterproofing into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During tile waterproofing, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept tile waterproofing, check the completed work against bond
      coverage, plane, joint alignment, movement accommodation, drainage,
      lippage, grout, sealant, and approved appearance, then close correction
      and issue the resulting record.
tension: >-
  Tile waterproofing has to remain inside its acceptance basis while
  production moves. A visually acceptable surface can conceal poor bond,
  trapped water, or missing movement capacity.
failure_modes:
  - name: Tile waterproofing starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for tile
      waterproofing is settled.
    signal: >-
      The tile waterproofing work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Tile waterproofing closes without evidence
    cost: >-
      A concealed condition or required result from tile waterproofing cannot
      be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Tile waterproofing is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Tile waterproofing is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Tile waterproofing starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Tile waterproofing uses field evidence, production variance, defects,
      and closeout results to improve the next estimate, work package, and
      control point.
competencies:
  - name: Tile assembly layout and bond control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of tile waterproofing.
  - name: Evidence control
    note: >-
      Acceptance checks for tile waterproofing have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Tile waterproofing can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting tile waterproofing remain
    human.
questions:
  - Which unresolved condition can stop tile waterproofing before work begins?
  - >-
    Which record proves tile waterproofing was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The tile waterproofing process is the installation by a tile contractor of
    the membrane that keeps a shower, wet room, or exterior tiled deck dry:
    membrane, seams, corners, penetrations, drains, upturns, transitions, and
    protection are installed as one continuous assembly and tested before tile
    covers them. It starts when the substrate has been prepared and accepted
    and ends with a quality report that records the completed assembly, the
    test result, and the release to tile setting. The lead setter owns it, and
    on larger jobs a dedicated waterproofing installer trained on the
    specified system does the work.
  why: >
    The membrane is the only thing between the tile and the framing. A seam
    that was never overlapped, a corner that was never reinforced, a drain
    that was never clamped, or a penetration left unsealed passes water for
    years before the damage shows as a stained ceiling below or a soft
    subfloor, and by then the repair means removing the finished shower. Tile
    and grout are porous, so the assembly has to be tested while a leak can
    still be found and repaired at the cost of a patch.
  how: >
    The lead setter confirms the work basis by reading the current scope and
    revisions and verifying a stable and flat substrate, cured work, the
    approved tile and setting system with its matching membrane, resolved
    movement joints, the approved dry layout, and environmental control. Field
    controls are set: the membrane system's installation requirements, the
    sequence from drain and corners outward, seam overlaps and cure times, who
    installs and who inspects, and the hold point for the water test. During
    installation the operator records the areas covered, seams, corners,
    penetrations, drain connection, upturn heights, and protection,
    photographs the assembly before covering, and stops when the substrate or
    a detail differs from the planned method. Acceptance checks that the
    assembly is continuous and will support bond coverage, plane, movement
    accommodation, drainage, and the approved appearance, the water test
    result is recorded, corrections are closed, and the quality report is
    issued.
  controls:
    - name: Membrane system matches the setting system
      note: The membrane, seam material, and drain assembly are confirmed on the record as the manufacturer's matching components before installation starts.
    - name: Corners, seams, and penetrations photographed
      note: Every reinforced corner, seam overlap, drain connection, and sealed penetration is photographed with location before tile covers it.
    - name: Cure time observed before testing
      note: The manufacturer's cure time is recorded and has elapsed before the assembly is flooded or tiled, and the elapsed time is on the record.
    - name: Water test recorded before tile
      note: The tested area, starting level, duration, and result are written on the quality report, and a leak is repaired and retested before release.
    - name: Upturn heights and transitions checked
      note: Membrane height at curbs, walls, and thresholds is measured against the specification and recorded before the assembly is accepted.
