extends: project-services-base
revenue_model:
  - id: concrete-volume-forming-and-finishing
    note: placed concrete volume supplemented by formwork, reinforcement, pumping, finishing, curing, testing, mobilization, and protection
summary: >-
  A poured concrete contractor turns survey control, excavation, forms,
  reinforcement, embeds, mix supply, crews, pumps, weather, and testing into
  foundations and structural elements. The placement window is short, while
  the dimensions and concealed components have to be right before the first
  truck unloads.


  Production depends on forming and steel readiness, predictable truck
  spacing, access, consolidation, finishing time, and curing protection. A
  missed embed, weak support, cold joint, poor cover, or uncontrolled surface
  cannot be corrected cheaply after hardening. Placement records connect field
  conditions to test results and payment quantities.
