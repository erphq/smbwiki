id: selective-demolition
name: Selective demolition
kind: skill
department: operations
summary: >-
  Marks removal limits, establishes protection, exposes connections, removes
  in a stable sequence, and records concealed conditions for design decisions.
  Selective demolition leaves a current work basis, a field record, and
  acceptance evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - daily-report
steps:
  - name: Confirm the work basis
    note: >-
      Before selective demolition, read the current scope and revisions, then
      verify completed engineering survey, utility shutdown,
      hazardous-material disposition, exclusion zones, removal sequence, and
      disposal routes.
  - name: Set the field controls
    note: >-
      Translate selective demolition into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During selective demolition, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept selective demolition, check the completed work against
      specified removals, stable remaining structure, protected services and
      finishes, segregated waste, clean limits, and documented changed
      conditions, then close correction and issue the resulting record.
tension: >-
  Selective demolition has to remain inside its acceptance basis while
  production moves. Unknown loads, materials, utilities, and hidden
  connections make an unplanned removal sequence dangerous and destructive.
failure_modes:
  - name: Selective demolition starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      selective demolition is settled.
    signal: >-
      The selective demolition work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Selective demolition closes without evidence
    cost: >-
      A concealed condition or required result from selective demolition
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Selective demolition is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Selective demolition is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Selective demolition starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Selective demolition uses field evidence, production variance, defects,
      and closeout results to improve the next estimate, work package, and
      control point.
competencies:
  - name: Demolition sequence and existing-condition judgment
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of selective demolition.
  - name: Evidence control
    note: >-
      Acceptance checks for selective demolition have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Selective demolition can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting selective demolition remain
    human.
questions:
  - >-
    Which unresolved condition can stop selective demolition before work
    begins?
  - >-
    Which record proves selective demolition was accepted before it was
    covered, loaded, energized, occupied, or handed over?
