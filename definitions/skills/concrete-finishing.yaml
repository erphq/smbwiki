id: concrete-finishing
name: Concrete finishing
kind: skill
department: operations
summary: >-
  Controls strike-off, flatness, edge and joint work, surface texture, bleed
  water, timing, and protection for the specified use. Concrete finishing
  leaves a current work basis, a field record, and acceptance evidence that
  another operator can trace.
inputs:
  - construction-plan
outputs:
  - test-report
steps:
  - name: Confirm the work basis
    note: >-
      Before concrete finishing, read the current scope and revisions, then
      verify surveyed layout, excavation acceptance, form dimensions, embeds,
      reinforcement, mix information, access, and weather controls.
  - name: Set the field controls
    note: >-
      Translate concrete finishing into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During concrete finishing, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept concrete finishing, check the completed work against specified
      geometry, cover, placement record, finish, curing, and required concrete
      test results, then close correction and issue the resulting record.
tension: >-
  Concrete finishing has to remain inside its acceptance basis while
  production moves. Concrete fixes its location and many concealed details at
  placement, so an unchecked condition becomes demolition or structural
  repair.
failure_modes:
  - name: Concrete finishing starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      concrete finishing is settled.
    signal: >-
      The concrete finishing work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Concrete finishing closes without evidence
    cost: >-
      A concealed condition or required result from concrete finishing cannot
      be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Concrete finishing is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Concrete finishing is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Concrete finishing starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Concrete finishing uses field evidence, production variance, defects,
      and closeout results to improve the next estimate, work package, and
      control point.
competencies:
  - name: Concrete production control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of concrete finishing.
  - name: Evidence control
    note: >-
      Acceptance checks for concrete finishing have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Concrete finishing can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting concrete finishing remain
    human.
questions:
  - Which unresolved condition can stop concrete finishing before work begins?
  - >-
    Which record proves concrete finishing was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The concrete finishing process controls the surface between
    placement and curing: strike-off to grade, flatness, edges and
    joints, the specified texture, timing around bleed water, and
    protection of the finished surface for its intended use. It starts
    as the last concrete is placed in an area and ends when the surface
    is accepted and the finish is recorded on the test report. A poured
    concrete contractor owns it through the finishing foreman, with the
    superintendent accepting the surface.
  why: >
    It protects the part of the placement everyone will see and walk on.
    Finishing that works bleed water back into the surface produces a
    weak layer that dusts and scales. A slab troweled off its tolerance
    means grinding, an overlay, or a rejection by the flooring
    installer. Joints cut late crack the slab where nobody planned. A
    finish that does not match the specified texture is rebuilt at the
    contractor's cost, and the argument about it starts after the
    concrete is hard.
  how: >
    The foreman confirms the work basis by reading the current scope and
    revisions on the construction plan and verifying surveyed layout,
    excavation acceptance, form dimensions, embeds, reinforcement, mix
    information, access, and weather controls. Field controls set the
    strike-off references, flatness tolerance, joint layout and timing,
    texture sample, weather response, hold points, and the records the
    crew keeps. During finishing the operator records set times, bleed-
    water observations, joint cuts, texture applied, decisions, and any
    concealed detail, and stops when weather or mix behavior changes the
    planned method. Acceptance checks the completed work against
    specified geometry, cover, placement record, finish, curing, and
    required concrete test results, and the test report is issued after
    correction closes.
  controls:
    - name: Approved finish sample on site
      note: >
        The texture and finish are matched to an approved sample
        panel before finishing begins on the production area.
    - name: Bleed-water hold before floating
      note: >
        Floating and troweling wait until bleed water has left the
        surface, and the observation is recorded by area.
    - name: Flatness and grade checked before curing
      note: >
        Strike-off and flatness are measured against the tolerance
        and recorded while correction is still possible.
    - name: Joint layout and cut timing recorded
      note: >
        Joint locations follow the plan and cut times are logged so
        a late or missed cut can be traced.
