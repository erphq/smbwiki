id: field-welding-control
name: Field welding control
kind: skill
department: operations
summary: >-
  Confirms procedure, welder qualification, joint preparation, consumable
  control, weather protection, weld sequence, and required examination. Field
  welding control leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - quality-report
steps:
  - name: Confirm the work basis
    note: >-
      Before field welding control, read the current scope and revisions, then
      verify approved erection drawings, stable access, crane plan, piece
      sequence, connection information, anchor condition, and concrete
      strength notice.
  - name: Set the field controls
    note: >-
      Translate field welding control into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During field welding control, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept field welding control, check the completed work against
      erection tolerances, connection completion, weld and bolt records,
      decking stability, and required inspection release, then close
      correction and issue the resulting record.
tension: >-
  Field welding control has to remain inside its acceptance basis while
  production moves. A sequence or stability error can expose the crew and
  leave installed steel outside the connection or tolerance design.
failure_modes:
  - name: Field welding control starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for field
      welding control is settled.
    signal: >-
      The field welding control work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Field welding control closes without evidence
    cost: >-
      A concealed condition or required result from field welding control
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Field welding control is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Field welding control is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Field welding control starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Field welding control uses field evidence, production variance, defects,
      and closeout results to improve the next estimate, work package, and
      control point.
competencies:
  - name: Steel erection sequence and connection control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of field welding control.
  - name: Evidence control
    note: >-
      Acceptance checks for field welding control have to be captured while
      the relevant condition can still be observed and corrected.
automation:
  now: >-
    Field welding control can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting field welding control remain
    human.
questions:
  - >-
    Which unresolved condition can stop field welding control before work
    begins?
  - >-
    Which record proves field welding control was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The field welding control process governs every weld made on the
    erected frame: the welding procedure it follows, the qualification of
    the welder making it, the joint preparation, the consumables and their
    storage, the shelter from wind and moisture, the sequence across the
    connection, and the examination that releases it. It starts when a
    connection is ready for welding under an approved erection drawing
    and ends when the weld and bolt records are complete and the inspector
    has released the connection in the quality report. The erection
    foreman owns it for a structural steel erector, with a welding
    inspector holding the release.
  why: >
    A field weld is a structural connection made in wind, cold, and
    awkward position by one person, and its soundness cannot be seen
    afterward without cutting or nondestructive testing. When procedure,
    qualification, and consumable control are loose, the frame carries
    welds that may be undersized, cracked, or made with wet electrodes,
    and the erector inherits the cost of testing, gouging, and rewelding
    under a stopped schedule. The process protects the crew working under
    the connection, the engineer's connection design, and the inspection
    release that lets decking and the next lift proceed.
  how: >
    Before welding begins the foreman reads the current scope and
    revisions, then confirms the approved erection drawings, stable
    access, crane plan, piece sequence, connection information, anchor
    condition, and concrete strength notice are all in hand. The field
    controls are then set: the welding procedure specification and
    qualified welder for each joint, consumable storage and oven rules,
    weather protection, the weld sequence across each connection, hold
    points for fit-up and for inspection, and the record the crew keeps
    by connection. During the work the welder and foreman record joint
    preparation, consumables, preheat, passes, and any fit-up condition
    the drawing did not anticipate, and stop when access, weather, or gap
    changes the planned method. At acceptance the inspector checks
    erection tolerances, connection completion, weld and bolt records,
    and decking stability, and issues the quality report that releases
    the connection.
  controls:
    - name: Procedure and welder qualification on record
      note: Each joint names the welding procedure and the qualified welder, and no weld starts without both entered in the connection record.
    - name: Consumable control log
      note: Electrode and wire lots, oven times, and exposure limits are logged so a wet or expired consumable never reaches a structural joint.
    - name: Fit-up hold point
      note: Root opening, bevel, and alignment are checked and recorded before the first pass, since they cannot be corrected once the weld is in.
    - name: Inspection release before covering
      note: Visual and any required nondestructive examination are complete and recorded before decking, fireproofing, or the next lift covers the connection.
    - name: Weather stop rule
      note: Wind, rain, and temperature limits are stated in the controls, and welding stops and restarts only on the foreman's recorded decision.
