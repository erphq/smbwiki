      requirement: required
      condition: Required for arranging covered interstate freight transportation for compensation.
      as_of: "2026-07-29"
    - ref: freight-broker-bond
      requirement: required
      condition: Required financial-security filing for the modeled federally authorized brokerage.
      as_of: "2026-07-29"
