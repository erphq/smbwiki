id: exterior-inspection
name: Exterior inspection
kind: skill
department: operations
summary: >-
  Observes site drainage, grading, cladding, openings, roof drainage, decks,
  walks, vegetation, and visible water paths around the building. Exterior
  inspection leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - client-brief
outputs:
  - inspection-report
steps:
  - name: Confirm the work basis
    note: >-
      Before exterior inspection, read the current scope and revisions, then
      verify signed scope, identified property, agreed access, known occupancy
      and utilities, required disclosures, tools, and weather conditions.
  - name: Set the field controls
    note: >-
      Translate exterior inspection into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During exterior inspection, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept exterior inspection, check the completed work against complete
      accessible-system observations, stated limitations, clear defect
      evidence, risk significance, and timely client report, then close
      correction and issue the resulting record.
tension: >-
  Exterior inspection has to remain inside its acceptance basis while
  production moves. A missed area, vague limitation, or unsupported conclusion
  can distort a buyer's understanding of the property.
failure_modes:
  - name: Exterior inspection starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      exterior inspection is settled.
    signal: >-
      The exterior inspection work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Exterior inspection closes without evidence
    cost: >-
      A concealed condition or required result from exterior inspection cannot
      be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Exterior inspection is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Exterior inspection is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Exterior inspection starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Exterior inspection uses field evidence, production variance, defects,
      and closeout results to improve the next estimate, work package, and
      control point.
competencies:
  - name: Building condition observation and reporting
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of exterior inspection.
  - name: Evidence control
    note: >-
      Acceptance checks for exterior inspection have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Exterior inspection can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting exterior inspection remain
    human.
questions:
  - >-
    Which unresolved condition can stop exterior inspection before work
    begins?
  - >-
    Which record proves exterior inspection was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The exterior inspection process is the outside portion of a home
    inspection: the inspector walks the site and the building envelope
    observing drainage, grading, cladding, openings, roof drainage, decks,
    walks, vegetation, and the visible paths water takes around the house,
    and records what was seen, what could not be accessed, and what it means
    for the buyer. It starts from a signed client brief and ends with an
    inspection report delivered on time. A home inspection service's
    licensed inspector owns it and is personally responsible for the
    conclusions.
  why: >
    A buyer relies on the report to decide whether to proceed and at what
    price. A missed area, such as a deck ledger that was never looked at,
    becomes a claim against the inspector when it fails. A vague limitation,
    like some areas not accessible, gives the buyer no idea what was left
    unchecked. An unsupported conclusion that a stain is cosmetic when it is
    an active leak costs the buyer a repair and the inspector a reputation.
    The process keeps the observation complete, the limitations specific,
    and the evidence attached to every defect.
  how: >
    The inspector reads the client brief and confirms the signed scope, the
    identified property, agreed access, known occupancy and utilities,
    required disclosures, tools, and the weather on the day. Field controls
    set the walking sequence around the building, the elevations and systems
    to be observed, the photographs required at each, the point where the
    inspector stops to record a limitation, and the report fields each
    observation lands in. During the walk the inspector records observations
    by location, photographs defects and water paths, notes anything
    concealed or inaccessible, and stops when site conditions differ from
    the brief. Acceptance checks that every accessible system was observed,
    limitations are stated, defect evidence is clear, risk significance is
    assigned, and the report reaches the client on time.
  controls:
    - name: Sequence walked in full
      note: The inspector follows a fixed route covering every elevation and site element and marks each as observed, limited, or inaccessible.
    - name: Photograph per defect and per limitation
      note: Every reported defect and every area left uninspected has a located photograph in the report.
    - name: Limitation stated with a reason
      note: Each limitation names what was not observed and why, such as stored items, vegetation, or weather on the day.
    - name: Significance assigned to each finding
      note: Findings carry a risk level and a recommended action so the buyer can tell a cosmetic issue from a structural one.
    - name: Report delivered inside the agreed time
      note: The report is issued by the deadline in the client brief, and the delivery time is recorded.
