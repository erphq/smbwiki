id: plat-preparation
name: Plat preparation
kind: skill
department: operations
summary: >-
  Drafts boundary, monuments, easements, encroachments, improvements, notes,
  certification, and legal calls for professional review and signature. Plat
  preparation leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - site-plan
outputs:
  - survey-plat
steps:
  - name: Confirm the work basis
    note: >-
      Before plat preparation, read the current scope and revisions, then
      verify defined survey purpose, current deeds and plats, adjoining
      records, coordinate basis, access, equipment checks, and field safety
      plan.
  - name: Set the field controls
    note: >-
      Translate plat preparation into work limits, sequence, responsibilities,
      hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During plat preparation, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept plat preparation, check the completed work against traceable
      evidence, closed measurements, resolved boundary opinion, set or found
      monuments, complete notes, and signed deliverable, then close correction
      and issue the resulting record.
tension: >-
  Plat preparation has to remain inside its acceptance basis while production
  moves. Treating record dimensions as field truth can move a boundary opinion
  away from controlling evidence.
failure_modes:
  - name: Plat preparation starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for plat
      preparation is settled.
    signal: >-
      The plat preparation work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Plat preparation closes without evidence
    cost: >-
      A concealed condition or required result from plat preparation cannot be
      verified without opening, repeat work, delay, or a disputed exception.
    signal: >-
      Plat preparation is released while its required check, location record,
      test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Plat preparation is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Plat preparation starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Plat preparation uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Boundary evidence and measurement adjustment
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of plat preparation.
  - name: Evidence control
    note: >-
      Acceptance checks for plat preparation have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Plat preparation can use digital revisions, checklists, hold points, photo
    capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting plat preparation remain
    human.
questions:
  - Which unresolved condition can stop plat preparation before work begins?
  - >-
    Which record proves plat preparation was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The plat preparation process turns a completed boundary survey into
    the drawing a licensed surveyor signs: boundary lines and calls,
    monuments found and set, easements, encroachments, improvements,
    notes, and the certification. It starts from the site plan, the
    field data, and the deed and record research, and it ends with a
    survey plat reviewed and signed by the professional in charge. A
    survey technician or drafter prepares it in a land surveying firm,
    the party chief supplies the field record, and the licensed surveyor
    owns the boundary opinion the plat expresses.
  why: >
    It protects the boundary opinion, which is the product the client is
    paying for and the thing that ends up in a courtroom if it is wrong.
    A plat drawn from record dimensions instead of field evidence can
    move a line away from the controlling monuments; a missing easement
    or an unshown encroachment becomes a title claim; a call that does
    not close is a drawing the surveyor cannot sign. The plat is also
    the record another surveyor will retrace decades later, so evidence
    that is not on it is evidence that is lost.
  how: >
    The drafter confirms the work basis: the current scope and
    revisions, the defined survey purpose, current deeds and plats,
    adjoining records, the coordinate basis, and the field crew's
    access, equipment checks, and safety plan. Field controls translate
    the survey into what the plat needs: which monuments are to be tied,
    closure tolerance, the evidence to be photographed, and the hold
    points where the surveyor reviews before drafting continues. During
    preparation the drafter records the evidence used, the measurements
    adjusted, decisions taken, and any conflict between record and
    field, and stops for the surveyor when a conflict changes the
    boundary. Acceptance checks traceable evidence, closed measurements,
    a resolved boundary opinion, set or found monuments, complete notes,
    and the signed deliverable; corrections are closed and the survey
    plat is issued.
  controls:
    - name: Evidence listed for every line
      note: Each boundary line on the plat cites the monuments, records, or occupation that control it, and a line with no cited evidence is returned to the field.
    - name: Closure checked before drafting
      note: Field measurements are adjusted and closure computed against tolerance before any line is drawn, and the result is kept on the file.
    - name: Record versus field conflicts logged
      note: Every disagreement between deed calls and found monuments is recorded with the surveyor's resolution before the plat advances.
    - name: Surveyor review as a hold point
      note: The licensed surveyor reviews the boundary opinion, easements, and encroachments at a defined stage, and the review is dated on the file.
    - name: Signed plat matches the field record
      note: Monument descriptions, notes, and certification on the final plat are checked against the field book before the surveyor signs.
