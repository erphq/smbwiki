id: structural-steel-erector
name: Structural Steel Erector
codes:
  naics: '238120'
catalog_group: construction-property
extends: project-services-base
summary: >-
  A structural steel erector unloads, rigs, raises, stabilizes, connects,
  aligns, and inspects fabricated members in the sequence required by the
  structure and crane plan. Erection drawings, shipping order, concrete
  strength, anchor condition, access, weather, fall protection, and temporary
  stability must agree before each lift.


  Installed tonnage is visible progress, but connection completion and
  stability control the real risk. Bolting, welding, decking, survey
  adjustment, and inspection follow the raising gang. A misplaced member or
  damaged anchor can stop several crews, so the daily plan preserves
  alternatives and a direct route to engineering decisions.
