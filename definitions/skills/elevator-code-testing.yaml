id: elevator-code-testing
name: Elevator code testing
kind: skill
department: compliance
summary: >-
  Plans the required test, confirms load and instruments, runs safety and
  performance checks, records results, corrects failures, and updates the unit
  log. Elevator code testing leaves a current work basis, a field record, and
  acceptance evidence that another operator can trace.
inputs:
  - service-ticket
outputs:
  - test-report
steps:
  - name: Confirm the work basis
    note: >-
      Before elevator code testing, read the current scope and revisions, then
      verify identified unit, maintenance history, code status, safe access,
      outage coordination, parts, qualified staff, and rescue provisions.
  - name: Set the field controls
    note: >-
      Translate elevator code testing into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During elevator code testing, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept elevator code testing, check the completed work against safe
      operation, required clearances and protection, corrected defects,
      recorded tests, current log, and regulatory inspection status, then
      close correction and issue the resulting record.
tension: >-
  Elevator code testing has to remain inside its acceptance basis while
  production moves. An elevator can return to service while an intermittent
  control, door, braking, or leveling defect remains unresolved.
failure_modes:
  - name: Elevator code testing starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      elevator code testing is settled.
    signal: >-
      The elevator code testing work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Elevator code testing closes without evidence
    cost: >-
      A concealed condition or required result from elevator code testing
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Elevator code testing is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Elevator code testing is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Elevator code testing starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Elevator code testing uses field evidence, production variance, defects,
      and closeout results to improve the next estimate, work package, and
      control point.
competencies:
  - name: Vertical-transport diagnostics and code testing
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of elevator code testing.
  - name: Evidence control
    note: >-
      Acceptance checks for elevator code testing have to be captured while
      the relevant condition can still be observed and corrected.
automation:
  now: >-
    Elevator code testing can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting elevator code testing remain
    human.
questions:
  - >-
    Which unresolved condition can stop elevator code testing before work
    begins?
  - >-
    Which record proves elevator code testing was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The elevator code testing process is the scheduled or witnessed test
    that proves a unit's safety and performance functions still work: the
    mechanic plans the required test for that unit, confirms the load
    weights and instruments, runs the safety and performance checks, records
    results, corrects what fails, and updates the unit log. It starts from a
    service ticket tied to a test due date or an inspector's request and
    ends with a test report on file and the unit's inspection status
    current. An elevator service contractor's route mechanic or adjuster
    owns it under the service supervisor.
  why: >
    The test is the only time the safeties, governor, brake, and buffers are
    exercised on purpose. If the process is skipped or done from memory, the
    unit runs on the assumption that those parts still work, and the first
    real test is an overspeed event with passengers aboard. A test run
    without the right load or instruments produces a report that cannot be
    defended to the inspector or in a claim. A result that is never written
    into the unit log means the next mechanic repeats the work or, worse,
    assumes it was done.
  how: >
    The mechanic reads the service ticket and the unit's scope, then
    confirms the identified unit, its maintenance history, the applicable
    code and test category, safe access, the outage window agreed with the
    building, test weights and instruments, qualified staff, and rescue
    provisions. Field controls set the test sequence, the hold points where
    the unit must be locked out or loaded, who witnesses each step, and
    where each result is written. During the test the mechanic records
    readings, observations, and any deviation, and stops when the unit's
    condition differs from the history. Acceptance checks safe operation,
    clearances and protection, corrected defects, recorded tests, the
    current log, and the regulatory inspection status, and the test report
    is issued.
  controls:
    - name: Test load and instruments verified
      note: Rated load weights and calibrated instruments are confirmed against the test requirement before the unit is taken out of service.
    - name: Lockout and rescue provisions in place
      note: The outage is coordinated with the building and the rescue plan is confirmed before any safety device is tripped.
    - name: Every result recorded with the reading
      note: Each test carries a measured value or a pass and fail result on the test report, never a checkmark alone.
    - name: Failed items corrected before return to service
      note: A failed safety or performance test keeps the unit out of service until the correction is made and retested.
    - name: Unit log and inspection status updated
      note: The unit log and the jurisdiction's inspection record are updated the same day so the next due date is correct.
