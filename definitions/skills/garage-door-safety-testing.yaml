id: garage-door-safety-testing
name: Garage door safety testing
kind: skill
department: quality
summary: >-
  Tests photo eyes, edge or force reversal, limits, manual release, balance,
  emergency controls, warning labels, and owner operation. Garage door safety
  testing leaves a current work basis, a field record, and acceptance evidence
  that another operator can trace.
inputs:
  - work-order
outputs:
  - commissioning-record
steps:
  - name: Confirm the work basis
    note: >-
      Before garage door safety testing, read the current scope and revisions,
      then verify verified opening and structure, selected door and operator,
      electrical provision, hardware, spring design, access, and site
      protection.
  - name: Set the field controls
    note: >-
      Translate garage door safety testing into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During garage door safety testing, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept garage door safety testing, check the completed work against
      secure attachment, balanced travel, correct clearances, functional
      controls, entrapment protection, manual release, seals, and owner
      instruction, then close correction and issue the resulting record.
tension: >-
  Garage door safety testing has to remain inside its acceptance basis while
  production moves. A door can cycle under power while its spring balance,
  attachment, or safety reversal remains unsafe.
failure_modes:
  - name: Garage door safety testing starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for garage
      door safety testing is settled.
    signal: >-
      The garage door safety testing work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Garage door safety testing closes without evidence
    cost: >-
      A concealed condition or required result from garage door safety testing
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Garage door safety testing is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Garage door safety testing is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Garage door safety testing starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Garage door safety testing uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Overhead-door balance and safety control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of garage door safety testing.
  - name: Evidence control
    note: >-
      Acceptance checks for garage door safety testing have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Garage door safety testing can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting garage door safety testing
    remain human.
questions:
  - >-
    Which unresolved condition can stop garage door safety testing before work
    begins?
  - >-
    Which record proves garage door safety testing was accepted before it was
    covered, loaded, energized, occupied, or handed over?
