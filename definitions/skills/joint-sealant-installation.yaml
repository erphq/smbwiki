id: joint-sealant-installation
name: Joint sealant installation
kind: skill
department: operations
summary: >-
  Confirms joint geometry and movement, removes old material, cleans and
  primes, sets backing, guns sealant, tools profile, and protects cure. Joint
  sealant installation leaves a current work basis, a field record, and
  acceptance evidence that another operator can trace.
inputs:
  - inspection-report
outputs:
  - test-report
steps:
  - name: Confirm the work basis
    note: >-
      Before joint sealant installation, read the current scope and revisions,
      then verify identified moisture source, sound and dryable substrate,
      compatible system, prepared transitions, drainage route, and safe
      access.
  - name: Set the field controls
    note: >-
      Translate joint sealant installation into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During joint sealant installation, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept joint sealant installation, check the completed work against
      continuous specified thickness, bonded transitions, sealed penetrations,
      protected terminations, drainage, cure, and required water test, then
      close correction and issue the resulting record.
tension: >-
  Joint sealant installation has to remain inside its acceptance basis while
  production moves. Treating the visible leak without tracing pressure, path,
  termination, and drainage can move water into a new concealed route.
failure_modes:
  - name: Joint sealant installation starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for joint
      sealant installation is settled.
    signal: >-
      The joint sealant installation work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Joint sealant installation closes without evidence
    cost: >-
      A concealed condition or required result from joint sealant installation
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Joint sealant installation is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Joint sealant installation is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Joint sealant installation starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Joint sealant installation uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Building-envelope moisture diagnosis
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of joint sealant installation.
  - name: Evidence control
    note: >-
      Acceptance checks for joint sealant installation have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Joint sealant installation can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting joint sealant installation
    remain human.
questions:
  - >-
    Which unresolved condition can stop joint sealant installation before work
    begins?
  - >-
    Which record proves joint sealant installation was accepted before it was
    covered, loaded, energized, occupied, or handed over?
