id: facility-access
name: Facility access
kind: skill
department: operations
summary: >
  Facility access validates a credential and its current permissions at
  the entry point, admits the member when conditions are met, records the
  visit, and routes exceptions to staff. Entry state remains connected
  to the account that granted it.
inputs: [access-credential]
outputs: [attendance-log]
steps:
  - name: Read the credential
    role: front-desk-attendant
    consumes: [access-credential]
    note: >
      The entry event identifies the credential, member, location, and
      time before a decision is made.
  - name: Evaluate current permission
    role: front-desk-attendant
    note: >
      Plan access, account state, hours, location rules, age, guest, and
      supervision conditions are applied consistently.
  - name: Admit or route the exception
    role: front-desk-attendant
    note: >
      Staff see the reason and the allowed remedy without sharing private
      account detail across the lobby.
  - name: Record the entry result
    role: front-desk-attendant
    produces: [attendance-log]
    note: >
      Successful entry and denied or overridden attempts remain distinct.
tension: >
  Frictionless entry competes with access control and duty of care.
  Members expect the door to work immediately; weak exception handling
  admits the wrong person or turns an account issue into a public dispute.
failure_modes:
  - name: Shared credential
    cost: >
      An unverified person enters under another member's permissions and
      the attendance record becomes unreliable.
    signal: >
      One credential appears in implausibly close entry events or repeated
      identity exceptions.
  - name: Override without reason
    cost: >
      Temporary judgment becomes invisible policy and account problems
      remain unresolved.
    signal: >
      Manual admissions lack operator, reason, and expected follow-up.
  - name: Door and desk hold different status
    cost: >
      A corrected account still fails entry or an ended account remains
      active.
    signal: >
      Staff must resave or recreate credentials after account changes.
maturity:
  - level: run badly
    looks_like: >
      The door accepts tokens while the desk maintains a separate list of
      members who should be allowed through.
  - level: run well
    looks_like: >
      Current account permissions drive entry and every exception leaves
      a reason, operator, result, and follow-up.
  - level: run excellently
    looks_like: >
      Access synchronization is monitored, suspicious use patterns surface
      early, and front-desk recovery protects privacy and flow.
competencies:
  - name: Discreet exception handling
    note: >
      The attendant has to resolve identity and account problems without
      exposing personal details or creating a lobby confrontation.
  - name: Permission judgment
    note: >
      Safety, guest, age, supervision, and temporary access cases require
      consistent application beyond a paid or unpaid flag.
automation:
  now: >
    Credential validation, permission lookup, door control, visit logs,
    duplicate-use alerts, and account synchronization.
  human: >
    Identity disputes, safety concerns, privacy-sensitive explanation,
    temporary exceptions, and escalation when the system state is wrong.
questions:
  - Which manual access override still lacks a resolved account action?
  - How quickly does an agreement change reach every entry point?
article:
  what: >
    The facility access process decides, at the door, whether a person
    presenting a credential gets in: the credential is read, its current
    permissions are evaluated against plan, account state, hours, location,
    age, guest, and supervision rules, the person is admitted or routed to
    staff with a reason, and the result is written to the attendance log. It
    runs at every entry point of a gym and at the gate of a self-storage
    facility, and the front-desk attendant owns the exceptions while the
    account system owns the permissions.
  why: >
    The door is where the business's agreement with a member is enforced. A
    shared credential lets an unverified person into a space where the
    operator has a duty of care and makes the attendance record useless for
    capacity or investigation. An override granted without a reason turns
    one attendant's judgment into invisible policy, and the account problem
    behind it stays unresolved. When the door and the desk hold different
    status, a member who just paid is refused in front of others, and an
    account that ended last month is still opening the gate.
  how: >
    The credential is read at the entry point and the event carries the
    credential, the member, the location, and the time before any decision
    is made. The system, or the attendant when the system cannot, evaluates
    the current permission: plan access, account state, hours, location
    rules, age, guest, and supervision conditions, applied the same way
    every time. When conditions are met the member is admitted. When they
    are not, the attendant sees the reason and the allowed remedy and
    resolves it without reading account detail across the lobby. Every
    result is recorded on the attendance log, with successful entries,
    denials, and overrides kept distinct and overrides carrying the
    operator, reason, and follow-up.
  controls:
    - name: Permission read from the live account
      note: Entry decisions come from the account system's current state, and the desk keeps no separate list of who should be let in.
    - name: Override with operator, reason, and follow-up
      note: Every manual admission is logged with who allowed it, why, and the account action that resolves it.
    - name: Denials kept distinct in the log
      note: Refused and overridden attempts are recorded separately from successful entries so patterns can be reviewed.
    - name: Duplicate-use review
      note: Credentials appearing in implausibly close entry events are flagged by the system and reviewed by the manager each week.
    - name: Account change reaches every entry point
      note: When an agreement changes, the time until every door reflects it is checked, and failures are escalated to the vendor.
