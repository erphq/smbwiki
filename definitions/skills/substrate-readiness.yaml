id: substrate-readiness
name: Exterior substrate readiness
kind: skill
department: quality
summary: >-
  Checks sheathing attachment, plane, moisture, openings, penetrations,
  interfaces, and repairs before the wall is covered. Exterior substrate
  readiness leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - quality-report
steps:
  - name: Confirm the work basis
    note: >-
      Before exterior substrate readiness, read the current scope and
      revisions, then verify accepted sheathing, dry substrate, complete
      openings, approved weather barrier, flashing details, material
      acclimation, and access.
  - name: Set the field controls
    note: >-
      Translate exterior substrate readiness into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During exterior substrate readiness, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept exterior substrate readiness, check the completed work against
      drainage continuity, fastening, clearances, joint layout, trim
      integration, appearance, and manufacturer requirements, then close
      correction and issue the resulting record.
tension: >-
  Exterior substrate readiness has to remain inside its acceptance basis while
  production moves. A finished elevation can look complete while hidden
  drainage and movement details are already set to fail.
failure_modes:
  - name: Exterior substrate readiness starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      exterior substrate readiness is settled.
    signal: >-
      The exterior substrate readiness work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Exterior substrate readiness closes without evidence
    cost: >-
      A concealed condition or required result from exterior substrate
      readiness cannot be verified without opening, repeat work, delay, or a
      disputed exception.
    signal: >-
      Exterior substrate readiness is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Exterior substrate readiness is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Exterior substrate readiness starts from a checked basis, follows a
      named sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Exterior substrate readiness uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Exterior cladding and water-shedding control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of exterior substrate readiness.
  - name: Evidence control
    note: >-
      Acceptance checks for exterior substrate readiness have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Exterior substrate readiness can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting exterior substrate readiness
    remain human.
questions:
  - >-
    Which unresolved condition can stop exterior substrate readiness before
    work begins?
  - >-
    Which record proves exterior substrate readiness was accepted before it
    was covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The exterior substrate readiness process is the check a siding contractor
    runs on a wall before any cladding covers it: sheathing attachment, plane,
    moisture content, openings, penetrations, interfaces with other trades,
    and repairs are inspected against the construction plan and the result is
    written down. It is triggered when a framed and sheathed elevation is
    offered to the siding crew and ends with a quality report that either
    releases the wall for weather barrier and siding or lists the corrections
    that come first. The foreman or quality lead owns it in a siding
    contractor, and the owner signs off on small crews.
  why: >
    Once siding goes on, the sheathing cannot be seen again without removing
    finished work. Loose or overdriven fasteners, a wall out of plane, wet
    sheathing, an unfinished window opening, or a penetration with no flashing
    detail all disappear behind the cladding and reappear as wavy siding,
    trapped moisture, rot, and callbacks the contractor pays for years later.
    The readiness check is also the record that another trade, a supplier, or
    the general contractor left a condition behind, which decides who pays for
    the repair.
  how: >
    The foreman starts from the current construction plan and its revisions
    and walks the elevation to confirm that sheathing is accepted, the
    substrate is dry, openings are complete, the weather barrier and flashing
    details are approved, siding material has acclimated, and access is safe.
    The findings are turned into field controls: which walls are released,
    which are held, who repairs what, and the hold points where the crew stops
    for a look. During the walk the operator records fastener condition, plane
    deviations, moisture readings, and every concealed detail with photos, and
    stops when a condition changes the planned method. Acceptance checks
    drainage continuity, fastening, clearances, joint layout, trim
    integration, appearance, and manufacturer requirements, corrections are
    closed, and the quality report is issued before the wall is covered.
  controls:
    - name: Walk against the current revision
      note: The elevation is checked against the latest construction plan revision, and an open drawing or approval dependency holds the wall instead of releasing it.
    - name: Moisture reading recorded per wall
      note: Sheathing moisture is measured and written on the record for each elevation before release, so a wet wall is never covered on a visual judgment.
    - name: Photo record of concealed conditions
      note: Fastening, repairs, penetrations, and flashing details are photographed with location before the weather barrier goes on, so a later dispute can be settled without opening the wall.
    - name: Correction closed before coverage
      note: Every defect found on the walk has an owner and is marked corrected on the record before the crew is allowed to cover that wall.
    - name: Quality report issued at release
      note: The wall is released to the siding crew only with a signed quality report that names the elevation, the date, and the person who accepted it.
