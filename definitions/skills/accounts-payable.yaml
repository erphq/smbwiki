id: accounts-payable
name: Accounts payable
kind: skill
department: finance
summary: >
  Accounts payable controls supplier bills from receipt through
  approval and payment. The work establishes that the charge belongs
  to the business, matches what was ordered, and is paid on the agreed
  date.
inputs: [supplier-invoice, purchase-order]
outputs: [payment-record]
steps:
  - name: Register the bill
    consumes: [supplier-invoice]
    note: >
      The due date and supplier identity need to be captured before the
      invoice leaves the inbox.
  - name: Match the commitment
    consumes: [purchase-order]
    note: >
      Quantity, price, and job or department ownership are checked
      against the approved order.
  - name: Resolve exceptions
    note: >
      A disputed line stays visible with one owner and a next action.
  - name: Release and record payment
    produces: [payment-record]
    note: >
      The record links the payment to the invoices it settled.
tension: >
  Cash retention competes with supplier reliability. Holding money
  until the due date protects working capital, while missed terms can
  delay the next urgent order or remove negotiated credit.
failure_modes:
  - name: Duplicate payment
    cost: >
      Cash leaves twice and recovery depends on the supplier finding or
      accepting the error.
    signal: >
      The same supplier, amount, and invoice number appear more than
      once in the payment queue.
  - name: Approval without evidence
    cost: >
      The business pays for an incorrect quantity, price, or expense
      owner.
    signal: >
      Bills are approved without a matching order or a named approver.
  - name: Missed due date
    cost: >
      The account loses terms, discounts, or access to time-sensitive
      supply.
    signal: >
      Due invoices remain unassigned inside the next payment window.
maturity:
  - level: run badly
    looks_like: >
      Invoices sit in email until a supplier calls, and payment history
      has to be reconstructed from the bank account.
  - level: run well
    looks_like: >
      Every bill has a due date, approver, order reference, and payment
      status visible in one queue.
  - level: run excellently
    looks_like: >
      Exceptions are resolved before the payment run, cash requirements
      are known ahead of time, and supplier statements reconcile without
      a search.
competencies:
  - name: Document matching
    note: >
      Small differences in unit, quantity, freight, and tax are where
      expensive duplicate or incorrect charges hide.
  - name: Payment judgment
    note: >
      The operator knows which supplier terms protect cash and which
      relationships protect operations.
automation:
  now: >
    Invoice capture, duplicate detection, due-date queues, approval
    routing, and payment-file preparation.
  human: >
    Ownership disputes, damaged or missing goods, and decisions about
    paying a critical supplier outside the normal run.
questions:
  - Which invoices due in the next payment run still lack approval?
  - Can every payment be traced to an invoice and an authorized order?
article:
  what: >
    The accounts payable process is the path a supplier bill takes from
    the day it arrives to the day the money leaves: registered with a
    due date, matched to what was ordered and received, approved by
    someone who owns the spend, and paid on the agreed terms with a
    record that ties the payment back to the invoice. It belongs to the
    owner or the bookkeeper in a small business and to a payables clerk
    under a controller in a larger one, and every business type in the
    catalog that buys anything runs it.
  why: >
    It protects cash twice. Paying early forfeits working capital, and
    a discount for prompt payment is only worth taking on purpose;
    paying late costs terms, credit lines, and the supplier's
    willingness to ship the next urgent order. Between those two dates
    the process is the only check that the business is paying for what
    it actually received at the price it agreed, which is where
    duplicate invoices, short shipments, and price creep hide.
  how: >
    A bill is registered the day it arrives, with the supplier, amount,
    invoice number, and due date captured before it leaves the inbox.
    It is then matched: quantity and price against the purchase order,
    receipt against the delivery record, and the job or department
    that owns the spend against the person approving it. Lines that do
    not match stay in an exception queue with one owner and a next
    action until they are resolved or credited. On the payment run,
    approved bills due inside the window are released together, and
    the payment record links each payment to the invoices it settled
    so the supplier statement reconciles without a search.
  controls:
    - name: Three-way match
      note: Invoice, purchase order, and receiving record agree on item, quantity, and price before approval; a missing one sends the bill to exceptions, never to the payment run.
    - name: Duplicate check on invoice number
      note: The same supplier and invoice number cannot be registered twice, and near duplicates, the same amount within a few days, are held for a human look before release.
    - name: Named approver with spend authority
      note: Every bill is approved by a person whose limit covers the amount and who owns the job or department charged, and the approval is recorded on the bill.
    - name: Aging queue reviewed before each run
      note: Open bills are listed by due date before every payment run so nothing due inside the window is left unassigned or unapproved.
    - name: Payment record reconciled to the bank
      note: Each payment in the bank feed maps to a payment record and its invoices, so the supplier ledger and the bank agree at month end without a search.
