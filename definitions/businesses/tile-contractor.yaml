article:
  operating_model: >
    A tile contractor sells a finished surface that hides most of its
    work. The week runs from substrate preparation and waterproofing,
    through dry layout and setting, to grout and seal, with the trade
    foreperson checking flatness, coverage, membrane transitions, and
    movement joints before they are covered. Tile substrate preparation
    and tile waterproofing are the load-bearing skills, because bond and
    water control are decided before the first tile is set, and tile
    layout settles appearance with samples before expensive material
    goes into mortar. The tension is speed against open time and cure:
    setting faster than the material allows shows up later as hollow
    tile, cracked grout, or a failed flood test.
  starting: >
    A tile contractor starts with a truck, tools, and one crew, and the
    day-one paperwork is the business registration, employer
    registration for the first installer, a contractor or specialty
    license in most states, general liability coverage, and sales tax
    registration where installed material is taxable. Accounts with a
    tile distributor and a setting material manufacturer come next,
    because material lead time drives scheduling. The minimum roles are
    an owner-operator who estimates and sets, a trade foreperson, and
    installers, with an office manager for purchasing, invoicing, and
    receivables as jobs multiply. The first records are the construction
    plan with the layout and focal lines, a quality report for flatness,
    coverage, and flood test results, the quote and work order, and job
    photos of waterproofing before it is covered. Quoting, tile layout,
    tile setting, and grout and seal must work from the first job.
  economics: >
    Revenue is quoted projects plus installed tile area with substrate
    correction, waterproofing, setting material, pattern complexity,
    trim, grout, seal, and repair. Pricing is by area and pattern
    against an estimate of labor days and material, so gross margin is
    driven by installer productivity, material waste rate on cuts and
    breakage, and whether substrate correction is scoped and paid. The
    metrics that decide profit are project gross margin, material waste
    rate, and rework rate, because tearing out and resetting a wet area
    destroys the margin of the job and the next one. Schedule variance
    and on-time completion matter because tile is late in the build
    sequence and waits on other trades. Labor is the largest cost and
    capital needs are modest, which is why estimating and crew
    productivity per area decide the outcome.
