id: building-systems-inspection
name: Building systems inspection
kind: skill
department: operations
summary: >-
  Operates accessible heating, cooling, plumbing, electrical, appliances, and
  controls within safe limits and records material defects. Building systems
  inspection leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - client-brief
outputs:
  - inspection-report
steps:
  - name: Confirm the work basis
    note: >-
      Before building systems inspection, read the current scope and
      revisions, then verify signed scope, identified property, agreed access,
      known occupancy and utilities, required disclosures, tools, and weather
      conditions.
  - name: Set the field controls
    note: >-
      Translate building systems inspection into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During building systems inspection, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept building systems inspection, check the completed work against
      complete accessible-system observations, stated limitations, clear
      defect evidence, risk significance, and timely client report, then close
      correction and issue the resulting record.
tension: >-
  Building systems inspection has to remain inside its acceptance basis while
  production moves. A missed area, vague limitation, or unsupported conclusion
  can distort a buyer's understanding of the property.
failure_modes:
  - name: Building systems inspection starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      building systems inspection is settled.
    signal: >-
      The building systems inspection work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Building systems inspection closes without evidence
    cost: >-
      A concealed condition or required result from building systems
      inspection cannot be verified without opening, repeat work, delay, or a
      disputed exception.
    signal: >-
      Building systems inspection is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Building systems inspection is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Building systems inspection starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Building systems inspection uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Building condition observation and reporting
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of building systems inspection.
  - name: Evidence control
    note: >-
      Acceptance checks for building systems inspection have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Building systems inspection can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting building systems inspection
    remain human.
questions:
  - >-
    Which unresolved condition can stop building systems inspection before
    work begins?
  - >-
    Which record proves building systems inspection was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The building systems inspection process is how a home inspection
    service examines the heating, cooling, plumbing, electrical,
    appliances, and controls of a property on behalf of a buyer or
    owner, operating each system within safe limits and recording
    material defects. It starts when the client brief and a signed scope
    identify the property, the access, and the disclosures required, and
    it ends when the client has an inspection report that states what
    was observed, what could not be, and what matters. The licensed
    inspector owns it from scope to report.
  why: >
    The buyer is about to make the largest purchase of their life on the
    strength of this report. A furnace that was never run, a panel that
    was not opened, or a limitation written vaguely enough to cover
    anything leaves the client without the information they paid for and
    the inspector exposed when the defect surfaces. An unsupported
    conclusion in the other direction can kill a sale. Without the
    process, the inspection follows the inspector's habit, the report is
    a checklist with no evidence, and a missed area or a hedge distorts
    what the buyer understands about the house.
  how: >
    The inspector reads the client brief and the signed scope and
    confirms the property, agreed access, known occupancy and utility
    status, required disclosures, tools, and weather conditions before
    arriving. The field controls follow: the sequence through the
    systems, the operating limits for each, what is opened and what is
    not, the photo and note standard, and the conditions under which a
    system is not operated. During the inspection the inspector operates
    each accessible system within normal controls, records observations,
    readings, and photographs where they are made, and stops and records
    a limitation when a system is unsafe to operate, inaccessible, or
    shut off. At the end the report is checked for complete accessible-
    system observations, stated limitations, clear defect evidence, and
    risk significance, and the inspection report is delivered to the
    client on time.
  controls:
    - name: Signed scope and access before arrival
      note: The property, systems included, access, and disclosures are confirmed in writing with the client before the inspection date.
    - name: Each system operated or limitation stated
      note: Every accessible system is run under normal controls, and any system not operated has the reason recorded in the report.
    - name: Photo evidence for each material defect
      note: Each defect reported carries a photograph and location so the client and a contractor can find it.
    - name: Safety limits observed
      note: Panels, equipment, and spaces are opened or entered only within the standard's safety limits, and the decision is recorded.
    - name: Report delivered within the agreed time
      note: The inspection report is issued to the client on the agreed date with limitations and significance stated.
