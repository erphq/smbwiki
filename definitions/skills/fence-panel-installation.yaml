id: fence-panel-installation
name: Fence panel installation
kind: skill
department: operations
summary: >-
  Controls grade transitions, panel or rail spacing, fastening, expansion, cut
  edges, privacy, and consistent top line. Fence panel installation leaves a
  current work basis, a field record, and acceptance evidence that another
  operator can trace.
inputs:
  - site-plan
outputs:
  - quality-report
steps:
  - name: Confirm the work basis
    note: >-
      Before fence panel installation, read the current scope and revisions,
      then verify verified boundary or approved alignment, located utilities,
      selected system, known grade, gate geometry, material, and access.
  - name: Set the field controls
    note: >-
      Translate fence panel installation into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During fence panel installation, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept fence panel installation, check the completed work against
      line, grade, post embedment, spacing, fastening, gate operation, finish
      condition, security, and restored site, then close correction and issue
      the resulting record.
tension: >-
  Fence panel installation has to remain inside its acceptance basis while
  production moves. A fence can be straight and complete while occupying the
  wrong line or leaving gates and grades unusable.
failure_modes:
  - name: Fence panel installation starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for fence
      panel installation is settled.
    signal: >-
      The fence panel installation work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Fence panel installation closes without evidence
    cost: >-
      A concealed condition or required result from fence panel installation
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Fence panel installation is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Fence panel installation is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Fence panel installation starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Fence panel installation uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Fence layout and field fit
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of fence panel installation.
  - name: Evidence control
    note: >-
      Acceptance checks for fence panel installation have to be captured while
      the relevant condition can still be observed and corrected.
automation:
  now: >-
    Fence panel installation can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting fence panel installation
    remain human.
questions:
  - >-
    Which unresolved condition can stop fence panel installation before work
    begins?
  - >-
    Which record proves fence panel installation was accepted before it was
    covered, loaded, energized, occupied, or handed over?
