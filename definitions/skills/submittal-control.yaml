id: submittal-control
name: Submittal control
kind: skill
department: quality
summary: >-
  Plans, prepares, reviews, returns, and releases product data, shop drawings,
  samples, and calculations before they block fabrication or installation.
  Submittal control leaves a current work basis, a field record, and
  acceptance evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - closeout-package
steps:
  - name: Confirm the work basis
    note: >-
      Before submittal control, read the current scope and revisions, then
      verify issued bid documents, coordinated trade boundaries, contractual
      dates, review routes, and owner decisions.
  - name: Set the field controls
    note: >-
      Translate submittal control into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During submittal control, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept submittal control, check the completed work against contract
      documents, authority approvals, designer review, tested systems, and
      owner turnover criteria, then close correction and issue the resulting
      record.
tension: >-
  Submittal control has to remain inside its acceptance basis while production
  moves. An unresolved scope boundary or late technical decision can move cost
  and time into field rework.
failure_modes:
  - name: Submittal control starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      submittal control is settled.
    signal: >-
      The submittal control work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Submittal control closes without evidence
    cost: >-
      A concealed condition or required result from submittal control cannot
      be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Submittal control is released while its required check, location record,
      test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Submittal control is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Submittal control starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Submittal control uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Commercial project controls
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of submittal control.
  - name: Evidence control
    note: >-
      Acceptance checks for submittal control have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Submittal control can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting submittal control remain
    human.
questions:
  - Which unresolved condition can stop submittal control before work begins?
  - >-
    Which record proves submittal control was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The submittal control process manages the product data, shop
    drawings, samples, and calculations that a trade must have approved
    before it can fabricate or install. It plans which submittals are
    needed and when, prepares or collects them, routes them through the
    general contractor's review and the designer's review, returns them
    with their action, and releases the approved version to the field.
    It starts once the bid documents, review routes, and contract dates
    are settled and ends when the approved submittals have been carried
    into the closeout package. A commercial general contractor owns it
    through the project engineer.
  why: >
    It protects fabrication lead time and the installed work. A curtain
    wall shop drawing submitted late, a rejected mechanical equipment
    submittal left unanswered for weeks, or a subcontractor building
    from a submittal the designer marked revise and resubmit each shows
    up as material that is missing when the schedule needs it, or
    material that is there and wrong. The submittal log is also the
    record that proves what was approved when a product fails, and it
    feeds the closeout package the owner uses to maintain the building.
  how: >
    The project engineer reads the current scope and revisions, then
    confirms issued bid documents, coordinated trade boundaries,
    contractual dates, review routes, and owner decisions before
    building the submittal schedule. The schedule is set out as work
    limits by specification section, a sequence driven by fabrication
    lead times and the construction schedule, responsibilities between
    subcontractor, general contractor, and designer, hold points where a
    submittal must be approved before release to fabrication, and the
    submittal log everyone uses. During the work the engineer collects
    submittals, reviews them for completeness and conformance before
    forwarding, tracks review turnaround, returns actions, manages
    resubmittals, records every revision and its status, and stops when
    a design change or an owner decision changes what is required. At
    acceptance the submittals are checked against contract documents,
    authority approvals, designer review, tested systems, and owner
    turnover criteria, open items are closed, and the approved set
    enters the closeout package.
  controls:
    - name: Submittal schedule tied to need dates
      note: Each required submittal carries the fabrication lead time and the date it must be approved to keep the construction schedule.
    - name: Contractor review before forwarding
      note: The general contractor checks each submittal for completeness and conformance and stamps it before the designer sees it.
    - name: Log with turnaround tracking
      note: Every submittal records the dates sent and returned at each stop, so an overdue review is visible and chased.
    - name: Release to fabrication only on approved status
      note: No material is released for fabrication or installation from a submittal marked anything other than approved or approved as noted.
    - name: Closeout set assembled from the log
      note: The final approved revisions are compiled from the log into the closeout package with product data and warranties.
