id: steel-erection-planning
name: Steel erection planning
kind: skill
department: operations
summary: >-
  Turns erection drawings, shipping sequence, crane reach, temporary
  stability, fall protection, and connection requirements into a site-specific
  sequence. Steel erection planning leaves a current work basis, a field
  record, and acceptance evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - quality-report
steps:
  - name: Confirm the work basis
    note: >-
      Before steel erection planning, read the current scope and revisions,
      then verify approved erection drawings, stable access, crane plan, piece
      sequence, connection information, anchor condition, and concrete
      strength notice.
  - name: Set the field controls
    note: >-
      Translate steel erection planning into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During steel erection planning, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept steel erection planning, check the completed work against
      erection tolerances, connection completion, weld and bolt records,
      decking stability, and required inspection release, then close
      correction and issue the resulting record.
tension: >-
  Steel erection planning has to remain inside its acceptance basis while
  production moves. A sequence or stability error can expose the crew and
  leave installed steel outside the connection or tolerance design.
failure_modes:
  - name: Steel erection planning starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for steel
      erection planning is settled.
    signal: >-
      The steel erection planning work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Steel erection planning closes without evidence
    cost: >-
      A concealed condition or required result from steel erection planning
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Steel erection planning is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Steel erection planning is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Steel erection planning starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Steel erection planning uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Steel erection sequence and connection control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of steel erection planning.
  - name: Evidence control
    note: >-
      Acceptance checks for steel erection planning have to be captured while
      the relevant condition can still be observed and corrected.
automation:
  now: >-
    Steel erection planning can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting steel erection planning
    remain human.
questions:
  - >-
    Which unresolved condition can stop steel erection planning before work
    begins?
  - >-
    Which record proves steel erection planning was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The steel erection planning process turns the erection drawings and
    the fabricator's shipping sequence into a site-specific plan: which
    pieces go up in which order, from where the crane can reach them,
    how the frame stays stable before its permanent bracing and
    connections are complete, where the crew ties off, and what each
    connection needs before the next lift. It starts when the erection
    drawings, crane plan, and anchor conditions are approved and ends
    when the plan has been carried out and the erected steel accepted in
    a quality report. A structural steel erector owns it through the
    erection superintendent.
  why: >
    It protects the crew from the most dangerous hours on a steel job,
    the ones between a piece leaving the hook and its connections being
    complete. A sequence that leaves a column line unbraced overnight, a
    crane set where it cannot reach the last beam without repositioning
    on a live road, or a truck loaded in the wrong order so the first
    piece needed is at the back each turns into improvisation with a
    load in the air. The plan is also what the general contractor, the
    crane company, and the safety authority expect to see before the
    first pick.
  how: >
    The superintendent reads the current scope and revisions, then
    confirms approved erection drawings, stable access, the crane plan,
    the piece sequence, connection information, anchor condition, and
    the concrete strength notice before planning. The plan is written as
    work limits by area and tier, a piece-by-piece sequence,
    responsibilities for rigging, connecting, bolting, and inspection,
    hold points where stability is checked before the next lift, and the
    daily lift plan the crew reads. During erection the superintendent
    records lifts made, temporary bracing installed and removed,
    deviations from the sequence, and the reasons, and stops when a
    field condition such as a late anchor bolt or a changed crane
    position alters the planned method. At acceptance the erected work
    is checked against erection tolerances, connection completion, weld
    and bolt records, decking stability, and the required inspection
    release, corrections are closed, and the quality report is issued.
  controls:
    - name: Stability check at the end of every shift
      note: The plan states what bracing and connections must be complete before the crew leaves, and the condition is recorded daily.
    - name: Crane plan matched to the sequence
      note: Each pick's weight, radius, and set position are on the lift plan, and any crane relocation is a planned step with its own check.
    - name: Shipping sequence confirmed with the fabricator
      note: The load order of each truck is checked against the erection sequence before shipment so the first piece needed is reachable.
    - name: Anchor and concrete readiness before setting columns
      note: The anchor bolt survey and the concrete strength notice are on file for each footing before its column is lifted.
    - name: Deviation recorded with the reason
      note: Any change to the sequence is written on the field record with who approved it and what stability measure covered it.
