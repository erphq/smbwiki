id: expense-recovery-reconciliation
name: Expense recovery reconciliation
kind: skill
department: finance
summary: >-
  Classifies recoverable cost, applies lease pools and caps, reconciles
  estimates to actuals, supports statements, and answers tenant review.
  Expense recovery reconciliation leaves a current work basis, a field record,
  and acceptance evidence that another operator can trace.
inputs:
  - lease
outputs:
  - property-operating-statement
steps:
  - name: Confirm the work basis
    note: >-
      Before expense recovery reconciliation, read the current scope and
      revisions, then verify current leases, tenant contacts, vendor
      contracts, property budget, building systems, compliance calendar, and
      owner authority.
  - name: Set the field controls
    note: >-
      Translate expense recovery reconciliation into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During expense recovery reconciliation, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept expense recovery reconciliation, check the completed work
      against accurate charges and recoveries, maintained common areas,
      controlled vendors, documented tenant work, and timely owner reporting,
      then close correction and issue the resulting record.
tension: >-
  Expense recovery reconciliation has to remain inside its acceptance basis
  while production moves. Lease duties, physical operations, and accounting
  can drift apart until a tenant dispute or major repair exposes the gap.
failure_modes:
  - name: Expense recovery reconciliation starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      expense recovery reconciliation is settled.
    signal: >-
      The expense recovery reconciliation work package still has an open
      drawing, access, material, predecessor, or approval dependency when
      labor is assigned.
  - name: Expense recovery reconciliation closes without evidence
    cost: >-
      A concealed condition or required result from expense recovery
      reconciliation cannot be verified without opening, repeat work, delay,
      or a disputed exception.
    signal: >-
      Expense recovery reconciliation is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Expense recovery reconciliation is driven by crew availability and
      visible completion; readiness, hold points, and acceptance evidence are
      resolved afterward.
  - level: run well
    looks_like: >-
      Expense recovery reconciliation starts from a checked basis, follows a
      named sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Expense recovery reconciliation uses field evidence, production
      variance, defects, and closeout results to improve the next estimate,
      work package, and control point.
competencies:
  - name: Commercial lease and property operations
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of expense recovery reconciliation.
  - name: Evidence control
    note: >-
      Acceptance checks for expense recovery reconciliation have to be
      captured while the relevant condition can still be observed and
      corrected.
automation:
  now: >-
    Expense recovery reconciliation can use digital revisions, checklists,
    hold points, photo capture, test fields, correction assignment, and
    closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting expense recovery
    reconciliation remain human.
questions:
  - >-
    Which unresolved condition can stop expense recovery reconciliation before
    work begins?
  - >-
    Which record proves expense recovery reconciliation was accepted before it
    was covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The expense recovery reconciliation process is the annual finance work a
    commercial property manager does to true up what tenants were billed in
    estimated operating expenses against what the building actually spent:
    recoverable costs are classified, each lease's pool, share, cap, and
    exclusions are applied, estimates are reconciled to actuals, statements
    go to tenants with supporting detail, and tenant questions and audits
    are answered. It starts when the year's books close and ends when
    statements are issued, adjustments are billed or credited, and the
    reconciliation supports the property operating statement to the owner.
  why: >
    Recoveries are a large share of a commercial building's income, and
    every dollar in dispute is a dollar the owner does not receive on time.
    Costs classified outside the lease definition get thrown out in a tenant
    audit, sometimes years later with interest. A cap applied wrongly
    overbills an anchor tenant and damages the renewal. Reconciliations
    issued late miss the lease deadline and forfeit the recovery entirely.
    The process protects the owner's income and the manager's credibility
    with tenants at the same time.
  how: >
    The property manager reads the scope and confirms the current leases and
    their recovery clauses, tenant contacts, vendor contracts, the property
    budget, the building systems the costs relate to, the compliance
    calendar with statement deadlines, and the owner's authority on
    adjustments. Field controls translate that into a reconciliation
    schedule, the classification rules per lease, the sequence of review,
    the hold point where the accountant's figures are checked against lease
    terms, and the records each step produces. During the reconciliation the
    manager records classification decisions, cap and exclusion
    applications, and any cost that does not fit the lease, and stops when a
    lease or a vendor contract differs from the assumptions. Acceptance
    checks accurate charges and recoveries, maintained common areas,
    controlled vendors, documented tenant work, and timely reporting, and
    the property operating statement is issued to the owner.
  controls:
    - name: Classification against each lease definition
      note: Every cost line is classified as recoverable or excluded per the specific lease clause, and the decision is recorded.
    - name: Cap and pool calculation checked by a second person
      note: Shares, gross-ups, and caps are recomputed by someone other than the preparer before statements go out.
    - name: Statement deadline on the compliance calendar
      note: Each lease's reconciliation deadline is tracked so no recovery is forfeited by a late statement.
    - name: Support file per statement
      note: Invoices, contracts, and the allocation workpaper are filed with each tenant statement to answer review or audit.
    - name: Owner approval on adjustments
      note: Credits, write-offs, and disputed items are approved by the owner in writing before they are posted.
