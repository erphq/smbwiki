id: moisture-path-diagnosis
name: Moisture path diagnosis
kind: skill
department: operations
summary: >-
  Uses weather history, assembly knowledge, selective testing, moisture
  readings, and opening probes to separate source from visible damage.
  Moisture path diagnosis leaves a current work basis, a field record, and
  acceptance evidence that another operator can trace.
inputs:
  - inspection-report
outputs:
  - test-report
steps:
  - name: Confirm the work basis
    note: >-
      Before moisture path diagnosis, read the current scope and revisions,
      then verify identified moisture source, sound and dryable substrate,
      compatible system, prepared transitions, drainage route, and safe
      access.
  - name: Set the field controls
    note: >-
      Translate moisture path diagnosis into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During moisture path diagnosis, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept moisture path diagnosis, check the completed work against
      continuous specified thickness, bonded transitions, sealed penetrations,
      protected terminations, drainage, cure, and required water test, then
      close correction and issue the resulting record.
tension: >-
  Moisture path diagnosis has to remain inside its acceptance basis while
  production moves. Treating the visible leak without tracing pressure, path,
  termination, and drainage can move water into a new concealed route.
failure_modes:
  - name: Moisture path diagnosis starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      moisture path diagnosis is settled.
    signal: >-
      The moisture path diagnosis work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Moisture path diagnosis closes without evidence
    cost: >-
      A concealed condition or required result from moisture path diagnosis
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Moisture path diagnosis is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Moisture path diagnosis is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Moisture path diagnosis starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Moisture path diagnosis uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Building-envelope moisture diagnosis
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of moisture path diagnosis.
  - name: Evidence control
    note: >-
      Acceptance checks for moisture path diagnosis have to be captured while
      the relevant condition can still be observed and corrected.
automation:
  now: >-
    Moisture path diagnosis can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting moisture path diagnosis
    remain human.
questions:
  - >-
    Which unresolved condition can stop moisture path diagnosis before work
    begins?
  - >-
    Which record proves moisture path diagnosis was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The moisture path diagnosis process is how a waterproofing
    contractor finds where water is actually entering a building before
    anyone proposes a repair. It begins with an inspection report
    describing visible damage, and it ends with a test report that names
    the source, the path the water travelled, and the evidence behind
    that conclusion: weather history, knowledge of the wall or roof
    assembly, moisture readings, selective water testing, and probes
    opened in the assembly. The estimator or lead technician owns it,
    and the repair scope is written from its result.
  why: >
    It protects the customer from paying for a repair that does not stop
    the leak and the contractor from a callback and a warranty claim.
    Visible damage is rarely at the entry point; water runs along
    flashing, sheathing, and framing before it shows. Sealing the stain
    without tracing pressure, path, termination, and drainage moves the
    water to a new concealed route where it does more damage before it
    is found again. The diagnosis also fixes the work basis for the
    repair estimate, so a scope built on a guess is the first thing this
    process prevents.
  how: >
    The technician confirms the work basis first: the current scope and
    revisions, the identified moisture source hypothesis, whether the
    substrate is sound and can dry, which system is compatible, prepared
    transitions, the drainage route, and safe access. Field controls are
    then set: test limits, the sequence of water testing from lowest to
    highest, who reads instruments, hold points where the assembly is
    opened, and the records the crew will keep. During the work the
    technician logs readings, observations, probe locations, and
    decisions, and stops if a condition changes the planned method.
    Acceptance is checked against the repair criteria: specified
    thickness, bonded transitions, sealed penetrations, protected
    terminations, drainage, cure, and the required water test, then
    corrections are closed and the test report is issued.
  controls:
    - name: Source hypothesis before testing
      note: The inspection report and weather history are read and a candidate source named before any water test, so the test sequence has a purpose.
    - name: Sequenced water test with hold points
      note: Testing runs from the lowest element upward with a hold at each level, and the crew cannot skip a level that has not been cleared.
    - name: Readings and probes tied to location
      note: Every moisture reading and opened probe is recorded with a marked location and a photo so another operator can find it later.
    - name: Changed condition stops the method
      note: When the assembly differs from the drawing or an unexpected path appears, work stops and the basis is revised before it resumes.
    - name: Test report issued before repair scope
      note: The repair estimate references the test report, and a scope without a diagnosed source does not leave the office.
