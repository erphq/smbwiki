id: machining-process-planning
name: Machining process planning
kind: skill
department: operations
summary: >-
  Converts the current part definition, material, quantity, tolerance, and
  due date into a controlled machining route, setup, program, and inspection plan.
inputs: [customer-order, routing-sheet]
outputs: [machining-setup-sheet, production-order]
steps:
  - name: Confirm part and material basis
    note: Verify revision, model, drawing, material, stock, quantity, tolerances, finishes, certificates, and deviations.
  - name: Plan route and setup
    note: Select sequence, machine, fixture, datum, tools, program, offsets, in-process checks, and outside operations.
  - name: Prove and release
    note: Verify setup and first piece, record measured results, authorize production, and control every subsequent change.
tension: >-
  Machine availability and delivery pressure can push work forward before
  revision, material, datum, workholding, tool access, and inspection are proven.
failure_modes:
  - name: Production runs from an unproven setup
    cost: Material, capacity, tools, and due date can be lost across the entire lot.
    signal: Quantity production begins without an accepted first piece tied to the current program and setup sheet.
maturity:
  - level: run badly
    looks_like: Setup knowledge stays with one machinist and inspection discovers route errors after quantity is produced.
  - level: run well
    looks_like: Revision, material, route, datum, setup, program, checks, first piece, and change history stay linked.
  - level: run excellently
    looks_like: Setup time, tool wear, deviations, and inspection results improve estimates, fixtures, programs, and controls.
competencies:
  - name: Machining route and setup design
    note: The planner balances datum integrity, workholding, access, capability, inspection, risk, and production sequence.
automation:
  now: Manufacturing systems can manage revisions, routes, tool lists, programs, offsets, checks, and first-piece release.
  human: Process selection, workholding judgment, changed-condition response, and setup acceptance remain human.
questions:
  - Which revision, material, datum, tool, or tolerance remains unproven?
  - What setup and first-piece evidence authorizes this exact production run?
article:
  what: >
    The machining process planning process is how a machine shop turns
    a customer order and a part definition into a machining route,
    setup, program, and inspection plan that a machinist can run and an
    inspector can accept. It starts when the current revision,
    material, quantity, tolerances, and due date are in hand and ends
    when a first piece has been proven and the production order is
    released with a controlled setup sheet. The process planner or lead
    machinist owns it, with the shop owner or production manager
    releasing the run.
  why: >
    It protects the whole lot. When production begins from an unproven
    setup, a wrong revision, an unverified datum, or a fixture that
    cannot hold the part, the material, capacity, tooling, and due date
    can all be lost at once. When setup knowledge lives with one
    machinist, inspection discovers route errors after quantity is
    produced, and no one can say which program and offsets made the
    parts.
  how: >
    The planner confirms the part and material basis: revision, model,
    drawing, material and stock, quantity, tolerances, finishes,
    certificates, and any approved deviations. The route and setup are
    then planned: operation sequence, machine, fixture, datum, tools,
    program, offsets, in-process checks, and outside operations such as
    plating or heat treatment. The setup is proven by running a first
    piece against the setup sheet, recording measured results, and
    authorizing production only when it passes; every subsequent change
    to program, offset, tool, or fixture is recorded and controlled on
    the production order so the released run and the parts it makes can
    be traced to one proven setup.
  controls:
    - name: Revision match at every step
      note: The drawing, model, program, and setup sheet all carry the same revision, and a mismatch stops the job before setup begins.
    - name: Material certificate verified
      note: The stock's certificate is checked against the specified material and recorded on the production order before cutting.
    - name: First-piece inspection recorded
      note: Measured first-piece results are recorded against each tolerance and signed before quantity production is authorized.
    - name: Datum and fixture defined on the setup sheet
      note: The setup sheet names the datum scheme, fixture, and workholding so any machinist can reproduce the proven setup.
    - name: Change control after release
      note: Any change to program, offset, tool, or fixture during the run is logged with who made it and a re-verified part.
