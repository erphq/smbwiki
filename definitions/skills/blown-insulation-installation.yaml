id: blown-insulation-installation
name: Blown insulation installation
kind: skill
department: operations
summary: >-
  Sets coverage markers, machine settings, bag count, depth, density, access
  path, and drift protection for even installed coverage. Blown insulation
  installation leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - inspection-report
steps:
  - name: Confirm the work basis
    note: >-
      Before blown insulation installation, read the current scope and
      revisions, then verify complete air-control layer, dry cavities, closed
      leaks, installed services, approved insulation system, and safe access.
  - name: Set the field controls
    note: >-
      Translate blown insulation installation into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During blown insulation installation, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept blown insulation installation, check the completed work
      against continuous thermal and air boundary, full depth, correct
      density, protected clearances, and documented concealed work, then close
      correction and issue the resulting record.
tension: >-
  Blown insulation installation has to remain inside its acceptance basis
  while production moves. Voids, compression, wind washing, and bypasses can
  survive inspection while degrading comfort and energy use for the life of
  the assembly.
failure_modes:
  - name: Blown insulation installation starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for blown
      insulation installation is settled.
    signal: >-
      The blown insulation installation work package still has an open
      drawing, access, material, predecessor, or approval dependency when
      labor is assigned.
  - name: Blown insulation installation closes without evidence
    cost: >-
      A concealed condition or required result from blown insulation
      installation cannot be verified without opening, repeat work, delay, or
      a disputed exception.
    signal: >-
      Blown insulation installation is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Blown insulation installation is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Blown insulation installation starts from a checked basis, follows a
      named sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Blown insulation installation uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Thermal and air-boundary continuity
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of blown insulation installation.
  - name: Evidence control
    note: >-
      Acceptance checks for blown insulation installation have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Blown insulation installation can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting blown insulation
    installation remain human.
questions:
  - >-
    Which unresolved condition can stop blown insulation installation before
    work begins?
  - >-
    Which record proves blown insulation installation was accepted before it
    was covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The blown insulation installation process is how an insulation
    contractor blows loose-fill fiberglass or cellulose into attics and
    enclosed cavities to an even installed depth and density. It starts
    when air sealing is done, the construction plan sets the R-value,
    and the attic or cavity is dry, accessible, and free of open leaks,
    and it ends when coverage markers show the depth, the bag count
    matches the coverage chart, and an inspection report records the
    result before the space is closed. The insulation foreman owns it;
    the machine operator and hose operator work to his settings.
  why: >
    Loose-fill settles, drifts, and thins where the hose does not reach,
    and the result looks uniform from the hatch. Too few bags for the
    area means the rated R-value was never installed. Insulation blown
    over a recessed light without clearance, into a soffit vent, or
    across an unprotected access path creates a fire, ventilation, or
    safety problem that a homeowner finds later. Without the process,
    the crew runs the machine until the truck is empty, the energy
    inspector has no markers or bag count to check, and the contractor
    has no evidence to answer a comfort complaint.
  how: >
    The foreman reads the current construction plan and revisions and
    confirms that the air-control layer is complete, cavities are dry,
    leaks are closed, services are installed, the insulation system is
    approved, and access is safe. He then sets the field controls:
    coverage markers at the required depth, machine settings for the
    material, bag count from the manufacturer's chart for the area and
    R-value, the blowing pattern, the access path and walkway, and drift
    protection at eaves, hatches, and clearances. During installation
    the crew records bags used, areas completed, and any location that
    could not reach depth, and stops when a wet cavity, an unprotected
    fixture, or a missing baffle changes the method. At acceptance the
    foreman checks the thermal and air boundary for continuity, full
    depth at the markers, correct density, and protected clearances,
    photographs the concealed work, closes corrections, and issues the
    inspection report.
  controls:
    - name: Bag count from the coverage chart
      note: The required bags for the area and R-value are calculated before starting and reconciled against bags used at the end.
    - name: Depth markers placed and photographed
      note: Markers at the specified depth are installed across the area and photographed after blowing to show coverage.
    - name: Clearance and baffle check before blowing
      note: Recessed lights, flues, vents, and eave baffles are protected and confirmed before the machine starts.
    - name: Density spot check
      note: Installed density is checked at the agreed points for the material, and low areas are reblown before the space is closed.
    - name: Inspection report with card at the hatch
      note: The report and the attic card showing R-value, depth, and bag count are completed before the crew leaves.
