id: interior-design-documentation
name: Interior design documentation
kind: skill
department: operations
summary: >-
  Coordinates plans, elevations, reflected ceilings, details, schedules,
  specifications, consultant information, revisions, and issue purpose.
  Interior design documentation leaves a current work basis, a field record,
  and acceptance evidence that another operator can trace.
inputs:
  - client-brief
outputs:
  - finish-schedule
steps:
  - name: Confirm the work basis
    note: >-
      Before interior design documentation, read the current scope and
      revisions, then verify approved program, measured existing conditions,
      consultant criteria, budget, schedule, code basis, and client decision
      structure.
  - name: Set the field controls
    note: >-
      Translate interior design documentation into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During interior design documentation, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept interior design documentation, check the completed work
      against coordinated safe spaces, approved selections, complete
      documents, released procurement, installed intent, and resolved
      deficiencies, then close correction and issue the resulting record.
tension: >-
  Interior design documentation has to remain inside its acceptance basis
  while production moves. A late spatial or finish decision can affect
  building systems, price, lead time, and installed work at once.
failure_modes:
  - name: Interior design documentation starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      interior design documentation is settled.
    signal: >-
      The interior design documentation work package still has an open
      drawing, access, material, predecessor, or approval dependency when
      labor is assigned.
  - name: Interior design documentation closes without evidence
    cost: >-
      A concealed condition or required result from interior design
      documentation cannot be verified without opening, repeat work, delay, or
      a disputed exception.
    signal: >-
      Interior design documentation is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Interior design documentation is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Interior design documentation starts from a checked basis, follows a
      named sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Interior design documentation uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Interior space and material coordination
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of interior design documentation.
  - name: Evidence control
    note: >-
      Acceptance checks for interior design documentation have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Interior design documentation can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting interior design
    documentation remain human.
questions:
  - >-
    Which unresolved condition can stop interior design documentation before
    work begins?
  - >-
    Which record proves interior design documentation was accepted before it
    was covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The interior design documentation process is how an interior design
    firm turns an approved program and a client brief into a
    coordinated set of plans, elevations, reflected ceiling plans,
    details, schedules, and specifications that consultants can price
    and a contractor can build. It begins once the program, existing
    conditions, consultant criteria, budget, schedule, and code basis
    are settled, and it ends with a finish schedule and a document set
    issued for a stated purpose, with every revision and consultant
    input accounted for. The project designer owns it under the
    principal.
  why: >
    It protects the client's money and the firm's reputation from
    decisions made late or documented twice. A finish chosen after
    procurement, a ceiling detail that ignores the mechanical
    consultant, or an issued set with a stale revision reaches the
    field as a change order, a lead-time miss, or installed work that
    has to come out. Without a controlled issue purpose, a set drawn
    for pricing gets built from, and the contractor and the client
    argue over which version governs.
  how: >
    The designer confirms the work basis by reading the current scope
    and revisions, then verifying the approved program, measured
    existing conditions, consultant criteria, budget, schedule, code
    basis, and the client's decision structure. The work is translated
    into field controls: which sheets and schedules are in scope, the
    sequence of coordination with consultants, who owns each drawing,
    hold points before an issue, and the records to keep. As the set
    develops, the designer records quantities, observations, decisions,
    and details that will be concealed, and stops when a consultant or
    field condition changes the planned approach. At acceptance the set
    is checked for coordinated safe spaces, approved selections,
    complete documents, released procurement, installed intent, and
    resolved deficiencies, then corrections are closed and the finish
    schedule is issued.
  controls:
    - name: Issue purpose on every set
      note: Each issued set states whether it is for pricing, permit, or construction, and the revision log records what changed since the last issue.
    - name: Consultant coordination check
      note: Reflected ceilings, details, and schedules are cross-checked against consultant drawings before issue so nothing collides with structure or services.
    - name: Client decision record
      note: Every selection and approval is recorded with who decided and when, so a late change can be traced to a client instruction.
    - name: Finish schedule reconciled to specifications
      note: Each finish schedule entry matches the specification section, sample approval, and procurement status before the schedule is released.
    - name: Field measurement verified before detailing
      note: Details rely on measured existing conditions confirmed on site, never on assumed dimensions from prior drawings.
