id: vehicle-sales
name: Vehicle sales
kind: skill
department: sales
summary: >
  Vehicle sales carries an identified unit from acquisition and
  reconditioning state through buyer qualification, demonstration,
  deal agreement, funding, title, delivery, and final accounting. The
  promised vehicle and completed documents remain the same transaction.
inputs: [client-profile, stock-record]
outputs: [vehicle-purchase-agreement, sales-receipt]
steps:
  - name: Match buyer and vehicle
    role: vehicle-salesperson
    consumes: [client-profile, stock-record]
    note: >
      Intended use, budget, timing, trade, required features, unit
      availability, condition, and known ownership facts are confirmed.
  - name: Present and demonstrate
    role: vehicle-salesperson
    note: >
      Identified vehicle, equipment, condition, history, warranty,
      inspection, test drive, and unanswered questions are recorded.
  - name: Agree the deal
    role: vehicle-salesperson
    produces: [vehicle-purchase-agreement]
    note: >
      Vehicle, price, trade, taxes, fees, products, credits, deposit,
      delivery conditions, and signatures form one buyer decision.
  - name: Complete funding and title
    role: finance-manager
    consumes: [vehicle-purchase-agreement]
    note: >
      Identity, credit, lender terms, contract, payoff, title, tax,
      registration, insurance, and funding conditions are completed.
  - name: Deliver and close
    role: vehicle-salesperson
    consumes: [vehicle-purchase-agreement]
    produces: [sales-receipt]
    note: >
      Final vehicle condition, accessories, keys, documents, payment,
      customer acceptance, inventory relief, and deal accounting close.
tension: >
  Deal speed competes with unit identity, disclosure, funding, title,
  and complete delivery. A verbal commitment can reserve the buyer;
  incomplete facts create unwind risk, delayed cash, and disputes after
  the vehicle leaves.
failure_modes:
  - name: Deal follows the wrong unit state
    cost: >
      Price and promise ignore actual condition, reconditioning, title,
      installed equipment, or availability.
    signal: >
      Vehicle identification or inventory status changes after terms
      are quoted.
  - name: Funding condition appears after delivery
    cost: >
      The dealer releases the vehicle without final cash authority and
      may have to restructure or recover the deal.
    signal: >
      Delivery checklist remains open on lender approval, identity,
      insurance, contract, or stipulation.
  - name: Final accounting omits a commitment
    cost: >
      Due bill, accessory, trade payoff, repair, tax, or fee remains
      unowned after gross profit is reported.
    signal: >
      Customer promise exists outside the signed deal jacket.
maturity:
  - level: run badly
    looks_like: >
      Sales, finance, service, title, and accounting each maintain a
      partial deal and reconcile it after delivery.
  - level: run well
    looks_like: >
      Unit, buyer, demonstration, agreement, trade, funding, title,
      commitments, delivery, and accounting share one deal jacket.
  - level: run excellently
    looks_like: >
      Lead, inventory-age, reconditioning, funding, unwind, and gross
      evidence improves acquisition, pricing, staffing, lender use, and
      delivery control.
competencies:
  - name: Unit and deal control
    note: >
      The operator keeps the physical vehicle, represented condition,
      commercial terms, documents, and ownership transfer aligned.
  - name: Buyer communication
    note: >
      Staff explain price, condition, products, financing, trade, and
      delivery commitments accurately.
automation:
  now: >
    Inventory feeds, lead records, desking, credit applications,
    contracts, title tasks, lender status, delivery checklists, and deal
    accounting.
  human: >
    Vehicle condition, demonstration, negotiation, disclosure,
    suitability, exception handling, identity, and release authority.
questions:
  - Which promised vehicle is not ready under the condition represented to the buyer?
  - Which delivered deal still depends on an unfunded or unverified condition?
article:
  what: >
    The vehicle sales process carries a single identified unit from the lot to
    the buyer's driveway in a new or used car dealership: the salesperson
    matches the buyer to a vehicle whose condition and availability are known,
    presents and demonstrates it, agrees a deal on a vehicle purchase
    agreement, the finance manager completes funding and title, and the
    salesperson delivers the vehicle and closes the deal with a sales receipt
    and deal accounting. It starts when a client profile meets a stock record
    and ends when the vehicle, the money, the title, and the accounting all
    describe the same transaction. The sales manager owns the desk, the
    finance manager owns funding, and the salesperson owns the buyer.
  why: >
    A vehicle sale is a promise, a contract, a loan, a title transfer, and a
    delivery, and they fail when they describe different things. A price
    quoted on a unit whose reconditioning or title state changed after the
    quote, a vehicle released before the lender's conditions were met, or a
    due bill promised outside the deal jacket produce unwound deals, delayed
    cash, and disputes after the vehicle has left. One deal jacket with the
    unit, the buyer, the terms, the funding, the title, and every commitment
    is what keeps sales, finance, service, and accounting from reconciling
    after delivery.
  how: >
    The salesperson matches buyer and vehicle from the client profile and the
    stock record, confirming intended use, budget, timing, trade, required
    features, and the unit's availability, condition, and ownership facts. The
    presentation and demonstration record the identified vehicle, its
    equipment, condition, history, warranty, inspection, the test drive, and
    any unanswered questions. The deal is agreed on the vehicle purchase
    agreement, with vehicle, price, trade, taxes, fees, products, credits,
    deposit, delivery conditions, and signatures forming one buyer decision.
    The finance manager then completes identity, credit, lender terms, the
    contract, payoff, title, tax, registration, insurance, and funding
    conditions. On delivery the salesperson verifies final vehicle condition,
    accessories, keys, documents, and payment, obtains customer acceptance,
    and the sales receipt, inventory relief, and deal accounting close the
    transaction.
  controls:
    - name: Unit state confirmed before quoting
      note: Stock status, reconditioning completion, title state, and installed equipment are verified on the stock record before a price is put in writing.
    - name: Purchase agreement holds every commitment
      note: Accessories, due bills, trade payoff, and delivery conditions are written on the vehicle purchase agreement, and a promise outside it is never honored by accounting.
    - name: Funding conditions cleared before release
      note: The delivery checklist shows lender approval, identity, insurance, contract, and stipulations complete before the keys are handed over.
    - name: Title and payoff verified by finance
      note: Title status and any trade payoff are confirmed with the lienholder and recorded in the deal jacket before funding.
    - name: Deal accounting reconciled to the jacket
      note: Gross, products, fees, and commitments in the accounting entry are reconciled to the signed deal jacket before the deal is reported as closed.
