id: guest-recovery
name: Guest recovery
kind: skill
department: operations
summary: >
  Guest recovery identifies a service failure while context is still
  available, protects the guest, corrects what can be corrected,
  records the response, and turns repeated causes into operating
  changes.
inputs: [order-ticket, guest-check]
outputs: [guest-issue-record]
steps:
  - name: Receive and stabilize
    role: server
    consumes: [order-ticket, guest-check]
    note: >
      The immediate food, allergy, safety, timing, conduct, payment, or
      comfort risk is understood before staff argue cause or policy.
  - name: Establish the service facts
    role: general-manager
    note: >
      Guest, table, order, timing, people, product, promise, and current
      impact are confirmed with the least repeated explanation.
  - name: Choose and deliver the response
    role: general-manager
    note: >
      Remake, replacement, move, explanation, adjustment, refund,
      follow-up, or escalation receives one owner and honest timing.
  - name: Confirm the outcome
    role: server
    note: >
      The guest knows what happened next, any payment change is visible,
      and an unresolved concern has a named follow-up route.
  - name: Record and learn
    role: general-manager
    produces: [guest-issue-record]
    note: >
      Concern, context, response, cost, outcome, owner, and recurring
      cause are complete enough to change the operation.
tension: >
  Immediate generosity competes with consistent authority and useful
  evidence. A scripted or defensive response loses the guest; an
  undocumented concession hides the failure and invites recurrence.
failure_modes:
  - name: Guest repeats the story at every handoff
    cost: >
      Frustration grows while the team loses time and appears not to own
      the problem.
    signal: >
      Server, manager, kitchen, and cashier each ask for the full account.
  - name: Adjustment replaces correction
    cost: >
      The charge changes but unsafe, incorrect, or delayed service
      continues.
    signal: >
      A comp is entered without a recorded operational response.
  - name: Promise has no owner
    cost: >
      The guest leaves with a follow-up expectation that no person or
      deadline carries.
    signal: >
      Issue notes say contact later without a responsible role and time.
maturity:
  - level: run badly
    looks_like: >
      Recovery depends on the manager present and concessions disappear
      into payment adjustments.
  - level: run well
    looks_like: >
      Risk, facts, response, authority, guest outcome, payment effect,
      follow-up, and issue record stay connected.
  - level: run excellently
    looks_like: >
      Recurring issues change menu design, training, staffing, pacing,
      equipment, permissions, and supplier controls.
competencies:
  - name: De-escalation and ownership
    note: >
      Staff listen without defensiveness, protect immediate needs, and
      keep one accountable route through resolution.
  - name: Cause-oriented follow-through
    note: >
      The operator separates a fair guest response from the corrective
      work required to prevent recurrence.
automation:
  now: >
    Issue capture, order and payment context, response permissions,
    follow-up tasks, recurring-cause grouping, and closure reminders.
  human: >
    Listening, safety judgment, apology, proportional remedy, conflict
    resolution, and deciding what the operating evidence means.
questions:
  - Which open guest promise has no named owner or response time?
  - Which repeated issue continues to receive compensation without preventive action?
article:
  what: >
    The guest recovery process is what a full-service restaurant does when
    service fails at the table: a wrong or late dish, an allergen concern,
    a spill, a billing error, or a guest who is upset for a reason the
    team has not yet understood. It starts when a server or any staff
    member notices or hears the concern and ends when the guest knows
    what happened next, any payment change is visible on the check, and a
    guest issue record captures the concern, the response, and the cause.
    The server receives it and the general manager owns the response and
    the record.
  why: >
    The guest who has a problem handled well comes back; the guest who
    explains it four times and receives a silent comp does not. Without a
    process, recovery depends on which manager is on shift, concessions
    vanish into payment adjustments with no record, and the same kitchen
    or pacing failure keeps being paid for at the table. The process
    protects the guest's immediate safety when the issue is an allergen or
    a hazard, the restaurant's margin from unrecorded comps, and the
    operating changes that stop the recurrence.
  how: >
    The server receives the concern and stabilizes it first: any food,
    allergy, safety, timing, conduct, payment, or comfort risk is
    understood and handled before anyone discusses cause or policy. The
    general manager then establishes the service facts from the order
    ticket and guest check, the table, the timing, the people involved,
    and the promise made, with the guest telling the story once. The
    manager chooses and delivers a response, whether a remake, a
    replacement, a table move, an explanation, a check adjustment, a
    refund, a follow-up, or an escalation, with one owner and honest
    timing. The server confirms the outcome with the guest so they know
    what is happening, sees any payment change on the check, and has a
    named follow-up route for anything unresolved. The manager records the
    concern, context, response, cost, outcome, owner, and recurring cause
    in the guest issue record, and repeated causes go into the operating
    review.
  controls:
    - name: Safety first, cause later
      note: Any allergen, injury, or conduct risk is handled and recorded before the team discusses what went wrong or what the guest is owed.
    - name: One telling of the story
      note: The manager gathers the facts from the ticket, the check, and the server so the guest is never asked to repeat the account.
    - name: Comp tied to a recorded response
      note: A check adjustment cannot be entered without a guest issue record naming the operational response that went with it.
    - name: Follow-up with owner and time
      note: Any promise to contact the guest later carries a named role and a time in the issue record before the guest leaves.
    - name: Recurring cause review
      note: Issue records are grouped by cause on a set cadence and repeated causes are assigned an operating change with an owner.
