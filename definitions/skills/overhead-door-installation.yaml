id: overhead-door-installation
name: Overhead door installation
kind: skill
department: operations
summary: >-
  Sets jamb brackets and track, assembles sections, installs rollers and
  hinges, aligns travel, seals the opening, and secures the structure.
  Overhead door installation leaves a current work basis, a field record, and
  acceptance evidence that another operator can trace.
inputs:
  - work-order
outputs:
  - commissioning-record
steps:
  - name: Confirm the work basis
    note: >-
      Before overhead door installation, read the current scope and revisions,
      then verify verified opening and structure, selected door and operator,
      electrical provision, hardware, spring design, access, and site
      protection.
  - name: Set the field controls
    note: >-
      Translate overhead door installation into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During overhead door installation, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept overhead door installation, check the completed work against
      secure attachment, balanced travel, correct clearances, functional
      controls, entrapment protection, manual release, seals, and owner
      instruction, then close correction and issue the resulting record.
tension: >-
  Overhead door installation has to remain inside its acceptance basis while
  production moves. A door can cycle under power while its spring balance,
  attachment, or safety reversal remains unsafe.
failure_modes:
  - name: Overhead door installation starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      overhead door installation is settled.
    signal: >-
      The overhead door installation work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Overhead door installation closes without evidence
    cost: >-
      A concealed condition or required result from overhead door installation
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Overhead door installation is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Overhead door installation is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Overhead door installation starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Overhead door installation uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Overhead-door balance and safety control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of overhead door installation.
  - name: Evidence control
    note: >-
      Acceptance checks for overhead door installation have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Overhead door installation can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting overhead door installation
    remain human.
questions:
  - >-
    Which unresolved condition can stop overhead door installation before work
    begins?
  - >-
    Which record proves overhead door installation was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The overhead door installation process is the site work that puts a
    sectional garage door and its hardware into a surveyed opening:
    setting jamb brackets and vertical track, assembling the sections,
    installing rollers and hinges, hanging the horizontal track,
    aligning travel, fitting the spring system and operator, sealing the
    opening, and securing everything to the structure. It starts from a
    work order with a completed opening survey and ends with a
    commissioning record showing the door balanced, safe, and handed to
    the owner. The lead installer owns it for a garage door contractor.
  why: >
    It protects the people who will walk under the door every day. A
    door can run under power and look finished while its springs are
    out of balance, its track brackets are into weak framing, or its
    photo eyes and force reversal have never been tested, and each of
    those is a crushing or falling hazard that shows up later without
    warning. It also protects the contractor: a callback for a door that
    binds, a seal that leaks, or an operator that was never programmed
    for the owner costs a crew day and the customer's confidence.
  how: >
    The lead installer confirms the work basis on arrival: current scope
    and revisions, the surveyed opening and structure, the selected door
    and operator, electrical provision, hardware, spring design, access,
    and site protection. Field controls set the sequence, who does what,
    the hold points at spring tensioning and first powered cycle, and
    the records to be kept. During installation the crew sets brackets
    and track, stacks and pins sections, installs rollers and hinges,
    aligns travel, tensions springs, mounts and wires the operator,
    seals the perimeter, and secures the assembly, recording concealed
    fastening and any deviation, and stopping when the opening or the
    structure differs from the survey. Acceptance checks secure
    attachment, balanced travel, clearances, functional controls,
    entrapment protection, manual release, seals, and owner instruction,
    corrections are closed, and the commissioning record is issued.
  controls:
    - name: Survey matched before track goes up
      note: Opening dimensions and structure are re-measured against the survey and the work order, and a difference is recorded and resolved first.
    - name: Spring tensioning as a hold point
      note: Spring winding is done by the lead installer with the door locked down, and the turn count is recorded on the commissioning record.
    - name: Balance test before operator connection
      note: The door is cycled by hand and holds at mid-travel before the operator arm is attached, and the result is written on the record.
    - name: Entrapment protection tested and recorded
      note: Photo-eye interruption and force reversal are tested on the installed door and the results, with the operator settings, go on the record.
    - name: Owner instruction signed
      note: The owner is shown manual release, safety features, and maintenance needs, and signs the commissioning record at handover.
