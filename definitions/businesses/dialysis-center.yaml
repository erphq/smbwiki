id: dialysis-center
name: Dialysis Center
codes:
  naics: "621492"
catalog_group: health-care
extends: clinic-base
summary: >
  A dialysis center schedules repeated treatments against a prescribed
  order, vascular access, target fluid removal, laboratory results,
  medications, machine, station, water system, and qualified staff.
  Patient condition at arrival can change the safe treatment plan.

  Each session records pre-treatment assessment, machine and dialysate
  checks, connection, monitoring, interventions, medications,
  disconnection, post-treatment state, and unresolved findings. Facility
  control also covers water quality, infection prevention, emergency
  readiness, equipment maintenance, and supply continuity.
revenue_model:
  - id: dialysis-treatments
    note: recurring facility treatments billed under covered renal-care arrangements
  - id: related-clinical-services
    note: eligible medications, tests, training, and support tied to treatment
  - remove: [patient-services, preventive-care]
skills:
  - ref: care-plan-delivery
    roles: [clinician, clinical-assistant]
    documents: [care-plan, medication-record, incident-report]
    metrics: [incident-rate]
    software: [care-management, electronic-health-record]
licenses:
  us:
    - ref: dialysis-facility-certification
      requirement: required
      condition: Required for the modeled facility to operate and participate in the applicable coverage program.
      as_of: "2026-07-29"
supply_chain:
  buys_from: [dialysis-supply-distributor]
  sells_to: [patient, payer]
article:
  operating_model: >
    A dialysis center week is a fixed grid of treatment shifts. Each
    patient has a chair time several times a week, and each session
    follows a prescribed order: pre-treatment assessment, machine and
    dialysate checks, connection to the vascular access, monitoring,
    medications, disconnection, and post-treatment state, all recorded
    in the care plan and medication record. Clinicians and clinical
    assistants run the floor, the receptionist keeps the schedule and
    coverage current, and the billing specialist bills treatments under
    renal care arrangements. The load-bearing skills are care plan
    delivery and clinical care, with appointment scheduling close
    behind, because a missed or shortened treatment is a clinical event
    and a lost billable session at once. The tension is between the
    fixed grid and the patient in front of the clinician: arrival
    condition can change the safe plan, and the water system, machines,
    and supply continuity have to hold every shift because there is no
    slack to reschedule a full unit.
  starting: >
    A dialysis center starts with facility certification, since the
    facility must be certified to operate and to participate in the
    coverage program that pays for most treatments, and certification
    follows a survey of the water treatment system, infection control,
    emergency readiness, staffing, and records. Some states add a
    certificate of need before construction and a state facility
    license, and a medical director who is a nephrologist is required.
    The universal paperwork is the business registration, employer
    registration, clinical and general liability insurance, medical
    waste handling, and a certificate of occupancy for a build-out with
    water treatment, drainage, and emergency power. The minimum team is
    a medical director, registered nurses and patient care technicians
    filling the clinician and clinical assistant roles at the ratios
    the certification requires, a receptionist, and a billing
    specialist familiar with renal billing, with a dialysis supply
    distributor under contract and a biomedical technician for machines
    and water. The first records are the patient registration, the
    insurance verification, the patient chart, the care plan, the
    medication record, the clinical note, the incident report, the
    insurance claim, and the recall list. Patient intake, coverage
    verification, appointment scheduling, care plan delivery, clinical
    care, and claims billing must work before the first patient is
    connected.
  economics: >
    Revenue is dialysis treatments billed per session under covered
    renal care arrangements and related clinical services such as
    eligible medications, tests, training, and support tied to
    treatment. Pricing is largely set by the payer: a bundled
    per-treatment rate from the public program covers most patients,
    and commercial coverage for the remainder pays more per treatment
    and carries a disproportionate share of margin. Gross margin is
    clinical labor, supplies, and medications against the bundled rate,
    so profit depends on staffing efficiently to the required ratios,
    buying supplies well, and keeping every scheduled chair occupied.
    The metrics that decide profit are incident rate, appointment
    no-show rate, clean claim rate, and days sales outstanding, because
    an adverse event carries clinical, regulatory, and payment
    consequences, a missed treatment cannot be billed, and renal claims
    are complex enough that rejections are common. The business is
    capital-intensive in water treatment, machines, and the build-out
    and labor-intensive in licensed staff, so margins are judged after
    equipment replacement and depend on payer mix as much as on
    operations.
  benchmarks:
    - scope: Medicare ESRD PPS base rate per treatment
      value: 281.71 dollars per treatment, calendar 2026 (273.82 dollars in 2025)
      note: "Bundled per-treatment payment for outpatient maintenance dialysis before case-mix, wage index, and facility adjustments. CMS projects about 6 billion dollars in payments to roughly 7,600 ESRD facilities in 2026, a 2.2 percent increase over 2025."
      source: https://www.cms.gov/newsroom/fact-sheets/calendar-year-cy-2026-end-stage-renal-disease-esrd-prospective-payment-system-final-rule
      source_name: Centers for Medicare and Medicaid Services, CY 2026 ESRD PPS Final Rule fact sheet (November 2025)
