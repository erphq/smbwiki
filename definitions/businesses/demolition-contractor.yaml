article:
  operating_model: >
    A demolition contractor's week starts with the engineering survey
    and ends with a cleared, documented limit line. The estimator
    quotes from drawings and a site walk, the project manager
    coordinates hazardous material abatement and utility isolation
    before crews arrive, and the site superintendent runs the removal
    sequence with exclusion zones, debris routes, and a daily report
    that records what was found and what changed. Trade forepersons and
    installers open work carefully, compare the actual assembly with
    the survey, and stop when load paths or materials differ from the
    drawings. The load-bearing skills are pre-demolition engineering
    survey, hazardous material coordination, and utility isolation,
    because removal cannot safely accelerate until all of them are
    settled. The tension is between production pace and discovery:
    every day of crew and equipment on site costs money, and every
    unexpected material or live service found stops the clock until it
    is handled and documented.
  starting: >
    A demolition contractor starts with equipment, insurance, and the
    licenses to disturb buildings. Most states license demolition under
    the general or specialty contractor license, some cities require a
    separate demolition permit for each job and a wrecking license for
    the firm, and any building with asbestos, lead, or other regulated
    materials brings notification rules and a licensed abatement
    contractor before removal begins; disposal facilities require
    manifests for regulated waste. The universal paperwork is the
    business registration, employer registration once crews are hired,
    workers' compensation, general liability at the limits general
    contractors demand, and pollution coverage where hazardous work is
    expected. The minimum team is an owner-operator, an estimator or
    office manager, a site superintendent, and a crew of trade
    foreperson and installers, with hauling and abatement subcontracted
    at first. The first records are the job request, the quote, the
    construction plan with the survey findings, the daily report, the
    work order, job photos before and after, the supplier invoice from
    the disposal facility, and the customer invoice. Quoting,
    pre-demolition engineering survey, utility isolation, hazardous
    material coordination, demolition waste control, and project
    delivery must work on the first job.
  economics: >
    Revenue is quoted projects made of demolition scope plus hauling,
    disposal, recycling, salvage credit, hazardous material
    coordination, and equipment charges. Pricing is per job from the
    estimated crew days, equipment time, and disposal tonnage, with
    salvage and recycling credits netted against disposal cost. Gross
    margin is decided by how well the estimate predicted the tonnage
    and the discovery, because disposal fees are paid by weight and an
    extra week of crew and machines on a fixed-price job is margin
    given away. The metrics that decide profit are project gross
    margin, schedule variance, rework rate, on-time completion, and
    days sales outstanding, since general contractors pay on their own
    owner's schedule while disposal facilities and fuel are paid on
    delivery. Quote win rate against booking rate tells the estimator
    whether pricing carries enough contingency for what the survey
    cannot see. The business is capital-intensive in excavators,
    attachments, and trucks, and margins are judged after equipment
    financing and the cost of idle machines between jobs.
