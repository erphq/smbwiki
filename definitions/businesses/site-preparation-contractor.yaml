article:
  operating_model: >
    A site preparation contractor moves dirt against a survey, and the
    week is measured in loads, grade checks, and compaction tests. The
    project manager sequences utility locating, clearing and grubbing,
    excavation, grading, and compaction so machines and trucks are never
    idle, and the trade foreperson keeps the daily report honest with
    quantities, test locations, and trucking tickets. Excavation control
    and compaction control are the load-bearing skills, because
    unsuitable soil, rock, groundwater, and unrecorded services appear
    only when the ground is opened. The tension is between keeping
    expensive equipment producing and stopping for evidence and
    direction when conditions change.
  starting: >
    Starting an earthwork business is an equipment and insurance
    decision before it is a sales decision. Day-one requirements are the
    business registration, employer registration for the first operator
    hired, a contractor license in most states, commercial auto and
    equipment coverage, a one-call utility locate account, and, on
    larger sites, the stormwater and erosion permits the local authority
    issues; aggregate suppliers and equipment rental companies need
    accounts opened in the business name. The minimum roles are an
    owner-operator who estimates and runs a machine, a trade foreperson,
    and an office manager for invoicing, payables, and receivables, with
    an estimator added once bids outrun the owner's time. The first
    records are the site plan with survey control, a daily report
    template, trucking tickets, and the quote and work order pair.
    Utility locating, excavation control, grading control, and quoting
    must work from the first job.
  economics: >
    Revenue is quoted projects plus measured earthwork, hauling, and
    disposal: excavation, fill, grading, and compaction sold by
    quantity, with mobilization, trucking, imported material, disposal,
    dewatering, and stabilization priced on top. Gross margin is driven
    by machine hours per unit moved, haul distance, disposal fees, and
    how much unforeseen condition work is documented and paid as change.
    The metrics that decide profit are project gross margin, schedule
    variance, and rework rate, because a failed compaction test means
    re-excavating and re-placing material that was already paid for
    once. Quote win rate against booking rate tells the owner whether
    the estimator is pricing fuel and trucking correctly. Equipment is
    capital-heavy and idle iron burns cash, so utilization across jobs
    and prompt collection against days sales outstanding decide whether
    the fleet pays for itself.
