id: grading-control
name: Grading control
kind: skill
department: operations
summary: >-
  Maintains benchmarks, balances cut and fill, places lifts, shapes drainage,
  checks elevations, and protects completed grade from traffic and rain.
  Grading control leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - site-plan
outputs:
  - daily-report
steps:
  - name: Confirm the work basis
    note: >-
      Before grading control, read the current scope and revisions, then
      verify survey control, utility information, permits, erosion controls,
      equipment access, haul route, soil direction, and weather plan.
  - name: Set the field controls
    note: >-
      Translate grading control into work limits, sequence, responsibilities,
      hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During grading control, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept grading control, check the completed work against specified
      limits, safe slopes and support, approved grades, drainage, compaction,
      stabilized access, and recorded quantities, then close correction and
      issue the resulting record.
tension: >-
  Grading control has to remain inside its acceptance basis while production
  moves. Unverified utilities, unsuitable soils, water, or lost control can
  turn planned earthwork into damage and repeated handling.
failure_modes:
  - name: Grading control starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      grading control is settled.
    signal: >-
      The grading control work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Grading control closes without evidence
    cost: >-
      A concealed condition or required result from grading control cannot be
      verified without opening, repeat work, delay, or a disputed exception.
    signal: >-
      Grading control is released while its required check, location record,
      test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Grading control is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Grading control starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Grading control uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Earthwork control and site logistics
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of grading control.
  - name: Evidence control
    note: >-
      Acceptance checks for grading control have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Grading control can use digital revisions, checklists, hold points, photo
    capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting grading control remain
    human.
questions:
  - Which unresolved condition can stop grading control before work begins?
  - >-
    Which record proves grading control was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The grading control process keeps earthwork on the site plan:
    benchmarks and survey control maintained through the job, cut and
    fill balanced against the plan, fill placed in lifts and compacted,
    drainage shaped to carry water off the pad, elevations checked as the
    grade develops, and finished grade protected from traffic and rain
    until the next trade takes it. It starts when survey control, utility
    information, permits, and erosion controls are in place and ends when
    grades, drainage, compaction, and quantities are accepted on the daily
    report. The grading foreman owns it for a site preparation contractor.
  why: >
    Earthwork moves fast and buries its mistakes. A lost benchmark puts a
    building pad at the wrong elevation, a lift placed too thick fails
    compaction under the slab, a swale shaped the wrong way sends water at
    the foundation, and a finished grade driven over in the rain has to be
    reworked. Each of these is repeated handling of the same dirt, and
    some are structural. The process protects the design elevations, the
    compaction record the engineer will ask for, and the quantities the
    contractor gets paid on.
  how: >
    The foreman reads the current scope and revisions and confirms survey
    control, utility information, permits, erosion controls, equipment
    access, haul route, soil direction, and the weather plan before
    equipment moves. The field controls are then set: benchmark and stake
    protection, the cut and fill sequence, lift thickness and compaction
    testing frequency, drainage shaping checkpoints, elevation checks at
    each stage, and the daily report the foreman keeps. During grading the
    foreman records quantities moved, elevations checked, compaction
    results, soil conditions encountered, weather, and any point where
    unsuitable soil, water, or an unmarked utility changed the plan, and
    stops until the changed condition is resolved. At acceptance the
    foreman checks limits, slopes and support, approved grades, drainage,
    compaction, stabilized access, and recorded quantities against the
    plan, closes correction, and issues the daily report.
  controls:
    - name: Benchmark check each day
      note: Survey control is verified before grading starts each day and any disturbed stake is reset and recorded.
    - name: Lift thickness and compaction test log
      note: Each lift's thickness and its compaction test result are logged by location before the next lift goes on.
    - name: Elevation check at each stage
      note: Subgrade, drainage, and finished grade elevations are shot and recorded against the plan before the stage is called complete.
    - name: Unsuitable soil and water stop rule
      note: Unsuitable material, groundwater, or an unmarked utility stops work in that area until the disposition is recorded.
    - name: Daily report with quantities
      note: Quantities moved, tests, elevations, weather, and changed conditions go on the daily report the same day they happen.
