id: member-sales
name: Member sales
kind: skill
department: sales
summary: >
  Member sales turns an inquiry or trial visit into a specific access
  agreement the prospective member understands. Plan, location,
  services, recurring charge, term, cancellation route, start date, and
  activity acknowledgement are settled before activation.
inputs: [membership-application]
outputs: [membership-agreement, liability-waiver]
steps:
  - name: Establish intended use
    role: membership-advisor
    consumes: [membership-application]
    note: >
      Location, schedule, facilities, classes, training, and expected
      frequency determine which plan can serve the prospect.
  - name: Explain the plan
    role: membership-advisor
    note: >
      Access boundaries, recurring price, additional charges, commitment,
      renewal, pause, and cancellation are discussed from the actual
      agreement.
  - name: Complete the agreement
    role: membership-advisor
    produces: [membership-agreement]
    note: >
      Selected plan and sales promises appear in the same terms the
      member signs.
  - name: Complete activity acknowledgement
    role: membership-advisor
    produces: [liability-waiver]
    note: >
      The member has time to disclose relevant concerns and ask how rules
      apply before using the facility.
tension: >
  Immediate conversion competes with plan fit and clear terms. Closing a
  mismatched agreement adds recurring revenue today and creates access,
  billing, and cancellation conflict later.
failure_modes:
  - name: Verbal benefit exceeds the agreement
    cost: >
      The member expects a location, service, class, or cancellation term
      the operating system cannot honor.
    signal: >
      Sales notes contain exceptions absent from the signed agreement.
  - name: Recurring obligation obscured
    cost: >
      The first renewal or debit produces a dispute and a preventable
      cancellation.
    signal: >
      Prospects ask about the total commitment only after signing.
  - name: Plan fit assumed
    cost: >
      The member cannot use the facility at the desired place, time, or
      service level.
    signal: >
      Early account complaints concern access boundaries explained during
      the sale.
maturity:
  - level: run badly
    looks_like: >
      Staff quote promotions from memory, signatures are the finish line,
      and exceptions surface at the door or first charge.
  - level: run well
    looks_like: >
      Intended use, selected plan, recurring obligation, access, waiver,
      and cancellation route are confirmed in one sale record.
  - level: run excellently
    looks_like: >
      Early access and billing failures improve sales explanation, plan
      fit is reviewed, and staff promises remain inside operable terms.
competencies:
  - name: Needs discovery
    note: >
      The advisor has to understand actual use before describing a plan's
      value.
  - name: Terms explanation
    note: >
      Recurring price, access, commitment, and exit rules must survive the
      handoff from conversation to signed document.
automation:
  now: >
    Plan comparison, eligibility rules, promotion calculation, agreement
    assembly, electronic signature, and required-field checks.
  human: >
    Understanding intended use, explaining consequences, recognizing poor
    fit, and handling a requested exception.
questions:
  - Which sales promise most often conflicts with access or billing later?
  - Can a new member explain the recurring charge and cancellation route?
article:
  what: >
    The member sales process takes a person who has walked in, called,
    or finished a trial and turns that interest into a signed membership
    agreement whose terms the member can repeat back: which location and
    facilities, which plan, what recurs and when, how long the commitment
    runs, how it pauses or ends, and when access starts. It begins with a
    membership application and ends with an activated account, a signed
    agreement, and a completed liability waiver. A membership advisor
    owns it in a gym, and in a boutique studio the owner or the
    front-desk lead runs it.
  why: >
    It protects the recurring revenue that the agreement creates and the
    relationship that has to survive the first renewal. An agreement
    sold on a promise the system cannot enforce, a second location, a
    class pass, a cancellation route that does not exist in the terms,
    turns into an access argument at the door or a billing dispute on
    the first debit. A plan chosen without asking how the member intends
    to train produces a member who cannot use what they are paying for
    and cancels early. The waiver step is where the member gets to
    disclose a condition before using the equipment.
  how: >
    The membership advisor starts from the application and asks about
    intended use: which location, what times, which facilities or
    classes, whether training is wanted, and how often the person
    expects to come. That determines which plans fit. The advisor then
    explains the chosen plan from the actual agreement text: access
    boundaries, the recurring price and any add-on charges, the
    commitment term, renewal, pause rules, and the cancellation route.
    The agreement is completed with the selected plan and every promise
    made in conversation written into the same terms the member signs.
    The member then completes the liability waiver with time to disclose
    relevant concerns and ask how facility rules apply, and the account
    is activated with a start date.
  controls:
    - name: Intended use recorded before plan choice
      note: The application captures location, schedule, facilities, and expected frequency, and the plan selected is checked against them before terms are discussed.
    - name: Terms explained from the document
      note: The advisor walks the recurring charge, commitment, pause, and cancellation route from the agreement itself, and the member confirms each in the sale record.
    - name: Promises inside operable terms
      note: Any exception offered in conversation is written into the signed agreement or withdrawn, and sales notes are compared to signed terms at activation.
    - name: Waiver completed before first use
      note: The liability waiver is signed with a disclosure opportunity before any facility access, and activation is blocked until it is on file.
    - name: Early failures fed back
      note: Access denials and first-charge disputes in the first weeks are reviewed against the sale record to find the explanation that was missed.
