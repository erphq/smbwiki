id: funeral-home
name: Funeral Home
codes:
  naics: "812210"
catalog_group: personal-recreation
extends: professional-services-base
summary: >
  A funeral home receives a death call and coordinates authorization,
  transfer, identity, custody, preparation, disposition, ceremony,
  permits, notices, merchandise, transport, cemetery or crematory, and
  payment while a family is making time-sensitive decisions.

  The case record makes chain of custody and decision authority durable
  through each handoff. It connects the deceased, authorized representative,
  selected services, disclosures, vital information, personal effects,
  third parties, schedule, permits, preparation, final disposition, and
  every promise made to the family.
revenue_model:
  - id: funeral-service-arrangements
    note: professional, facility, ceremony, transfer, and disposition coordination
  - id: merchandise-and-cash-advances
    note: selected goods and third-party charges handled within the case
  - remove: [fixed-fee-engagements, time-based-work, recurring-advisory]
