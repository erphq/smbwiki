id: transport-execution
name: Transport execution
kind: skill
department: operations
summary: >
  Transport execution turns an accepted movement into a dispatched
  vehicle, controlled custody, completed stops, delivery evidence, and
  billable work. Driver, equipment, cargo, route, hours, appointments,
  exceptions, and documents remain on one trip record.
inputs: [load-request]
outputs: [bill-of-lading, proof-of-delivery]
steps:
  - name: Plan the trip
    role: dispatcher
    consumes: [load-request]
    note: >
      Stops, cargo, equipment, handling, appointments, route, distance,
      hours, access, cost, and customer promise are checked together.
  - name: Release driver and vehicle
    role: dispatcher
    note: >
      Qualified driver, serviceable equipment, instructions, documents,
      contacts, tracking, and exception authority are confirmed.
  - name: Take custody
    role: driver
    produces: [bill-of-lading]
    note: >
      Arrival, count, condition, securement, bill of lading, seal,
      exception, and departure time establish physical custody.
  - name: Control the movement
    role: driver
    note: >
      Location, available hours, vehicle condition, delay, customer
      contact, route change, and recovery action stay current.
  - name: Deliver and close
    role: driver
    produces: [proof-of-delivery]
    note: >
      Recipient, time, count, condition, signature, refusal, returns,
      final mileage, documents, and vehicle status are reconciled.
tension: >
  Vehicle utilization competes with legal, safe, and reliable movement.
  Dense schedules protect revenue; plans that ignore hours, loading,
  traffic, access, service, and recovery time create late work and
  unsafe pressure on drivers.
failure_modes:
  - name: Dispatch plan is infeasible at release
    cost: >
      The driver begins a trip that cannot meet appointments within
      available hours and realistic stop time.
    signal: >
      Planned arrival has no remaining allowance for loading, traffic,
      access, breaks, or known delay.
  - name: Cargo exception is accepted silently
    cost: >
      Shortage, damage, count, temperature, or packaging responsibility
      becomes a dispute at delivery.
    signal: >
      Pickup document contains a notation absent from the trip
      exception record.
  - name: Delivery closes without usable proof
    cost: >
      Customer billing, claims, and custody defense wait on missing or
      unreadable evidence.
    signal: >
      Completed trip lacks recipient, time, condition, and document
      review.
maturity:
  - level: run badly
    looks_like: >
      Dispatch calls drivers for status and reconstructs mileage,
      documents, delays, and exceptions after the trip.
  - level: run well
    looks_like: >
      Plan, driver, vehicle, custody, milestones, hours, exception,
      delivery proof, and closeout share one trip record.
  - level: run excellently
    looks_like: >
      Actual stop, route, delay, service, fuel, maintenance, and failure
      evidence improves pricing, dispatch, fleet, and customer promises.
competencies:
  - name: Movement feasibility
    note: >
      The operator combines equipment, cargo, hours, route, appointment,
      access, weather, and stop work into a credible plan.
  - name: Custody and exception control
    note: >
      Drivers and dispatch preserve evidence and recovery options while
      the goods are still in their control.
automation:
  now: >
    Route planning, driver and vehicle assignment, electronic logs,
    navigation, tracking, geofences, documents, exception alerts, proof
    of delivery, and mileage.
  human: >
    Safe operation, equipment inspection, cargo condition, road and
    site judgment, customer contact, recovery, refusal, and emergency
    decisions.
questions:
  - Which dispatched trip cannot meet its next commitment under current hours and conditions?
  - Which completed delivery still lacks evidence sufficient for billing and custody?
article:
  what: >
    The transport execution process is the run of a single movement from
    accepted load request to closed trip: the dispatcher plans the trip and
    releases a driver and vehicle, the driver takes custody of the cargo on a
    bill of lading, controls the movement against hours and appointments, and
    delivers against a proof of delivery that the office can bill. It starts
    when a load request has been accepted and ends when the trip record is
    reconciled and the invoice can be raised. In a courier company or a local
    delivery service the dispatcher and driver may be the same person on a
    small day; in a general freight trucking company or a moving company the
    dispatcher owns the plan and the driver owns custody.
  why: >
    Cargo in transit is the business's liability and its revenue at the same
    time. A plan that cannot meet its appointments inside legal hours puts the
    driver under pressure to run late or run illegal. A shortage or damage
    noted on the pickup document but missing from the trip record becomes a
    claim the carrier cannot defend. A delivery without a legible recipient,
    time, and condition cannot be billed and cannot be used to close a custody
    dispute. The trip record is the one place where plan, custody, exceptions,
    and proof stay together.
  how: >
    The dispatcher plans the trip from the load request, checking stops,
    cargo, equipment, handling, appointments, route, distance, hours, access,
    cost, and the customer promise together, and then releases a qualified
    driver with serviceable equipment, instructions, documents, contacts,
    tracking, and the authority to handle exceptions. The driver takes custody
    at pickup, recording arrival, count, condition, securement, seal, any
    exception, and departure time on the bill of lading. During the movement
    the driver keeps location, available hours, vehicle condition, delays,
    customer contact, route changes, and recovery actions current on the trip
    record. At delivery the driver records recipient, time, count, condition,
    signature, any refusal or return, final mileage, documents, and vehicle
    status on the proof of delivery, and dispatch reconciles the trip so it
    can be billed.
  controls:
    - name: Feasibility check at release
      note: Planned arrival times are checked against loading time, traffic, access, breaks, and available hours before the driver is released, and an infeasible plan is replanned.
    - name: Driver and vehicle qualification confirmed
      note: License, hours available, and the pre-trip inspection result are recorded on the trip before the vehicle leaves the yard.
    - name: Exceptions written on both documents
      note: Any shortage, damage, count, or seal exception at pickup is noted on the bill of lading and on the trip exception record at the same time.
    - name: Proof of delivery reviewed before closing
      note: Recipient name, time, count, condition, and signature are checked for completeness and legibility before the trip is closed for billing.
    - name: Trip record reconciled to mileage and documents
      note: Final mileage, fuel, documents returned, and vehicle status are reconciled to the trip record before the invoice is raised.
