id: below-grade-waterproofing
name: Below-grade waterproofing
kind: skill
department: operations
summary: >-
  Installs membrane, reinforcement, terminations, penetrations, drainage
  composite, protection, and backfill controls as one below-grade system.
  Below-grade waterproofing leaves a current work basis, a field record, and
  acceptance evidence that another operator can trace.
inputs:
  - inspection-report
outputs:
  - test-report
steps:
  - name: Confirm the work basis
    note: >-
      Before below-grade waterproofing, read the current scope and revisions,
      then verify identified moisture source, sound and dryable substrate,
      compatible system, prepared transitions, drainage route, and safe
      access.
  - name: Set the field controls
    note: >-
      Translate below-grade waterproofing into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During below-grade waterproofing, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept below-grade waterproofing, check the completed work against
      continuous specified thickness, bonded transitions, sealed penetrations,
      protected terminations, drainage, cure, and required water test, then
      close correction and issue the resulting record.
tension: >-
  Below-grade waterproofing has to remain inside its acceptance basis while
  production moves. Treating the visible leak without tracing pressure, path,
  termination, and drainage can move water into a new concealed route.
failure_modes:
  - name: Below-grade waterproofing starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      below-grade waterproofing is settled.
    signal: >-
      The below-grade waterproofing work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Below-grade waterproofing closes without evidence
    cost: >-
      A concealed condition or required result from below-grade waterproofing
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Below-grade waterproofing is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Below-grade waterproofing is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Below-grade waterproofing starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Below-grade waterproofing uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Building-envelope moisture diagnosis
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of below-grade waterproofing.
  - name: Evidence control
    note: >-
      Acceptance checks for below-grade waterproofing have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Below-grade waterproofing can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting below-grade waterproofing
    remain human.
questions:
  - >-
    Which unresolved condition can stop below-grade waterproofing before work
    begins?
  - >-
    Which record proves below-grade waterproofing was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The below-grade waterproofing process is how a waterproofing
    contractor installs the membrane, reinforcement, terminations,
    penetration seals, drainage composite, protection, and backfill
    controls that keep water out of a foundation or basement, as one
    system. It starts when an inspection report has identified the
    moisture source and the substrate is sound and dryable, and it ends
    when the system has been placed, tested where required, and accepted
    on a test report before backfill covers it. The waterproofing
    foreman owns it, with the contractor's estimator responsible for the
    system selection.
  why: >
    Everything this process installs is buried. A termination left
    unsealed, a penetration wrapped without a proper boot, a membrane
    placed on a damp or dusty wall, or drainage composite that does not
    reach the drain lets water find a new route into the building, and
    the fix means excavation. Treating the visible leak without tracing
    pressure, path, and drainage moves the water somewhere else. Without
    the process, the crew cannot show what was installed, the water test
    is skipped, and the warranty claim arrives with no record to answer
    it.
  how: >
    The foreman reads the inspection report, the scope, and any
    revisions and confirms the moisture source, that the substrate is
    sound and can be dried, that the selected system is compatible with
    the substrate and conditions, that transitions are prepared, that
    the drainage route exists, and that access is safe. Field controls
    follow: surface preparation standard, membrane thickness and lap,
    reinforcement at corners and transitions, termination detail,
    penetration method, drainage composite placement, protection board,
    backfill sequence, and hold points before each cover. During the
    work the crew records thickness readings, lap and termination
    locations, penetrations, cure times, and any substrate condition
    that differs, and stops when moisture, cracking, or an unplanned
    penetration changes the method. At acceptance the system is checked
    for continuous thickness, bonded transitions, sealed penetrations,
    protected terminations, drainage, cure, and the required water test,
    corrections are closed, and the test report is issued.
  controls:
    - name: Substrate moisture and soundness check
      note: The wall is tested for moisture and inspected for cracks and contamination before membrane is applied.
    - name: Thickness readings at set intervals
      note: Wet-film or dry-film readings are taken and recorded across the wall, and thin areas are recoated before cover.
    - name: Termination and penetration detail photographed
      note: Each termination and penetration is photographed with location before protection board or backfill covers it.
    - name: Water test before backfill
      note: Where the specification requires it, a flood or spray test is run and its result recorded before the excavation is closed.
    - name: Backfill release signed
      note: The foreman signs the backfill release only after protection and drainage composite are confirmed in place.
