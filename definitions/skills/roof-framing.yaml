id: roof-framing
name: Roof framing
kind: skill
department: operations
summary: >-
  Sets trusses or rafters, valleys, hips, blocking, bracing, sheathing,
  openings, and connectors in the engineered sequence. Roof framing leaves a
  current work basis, a field record, and acceptance evidence that another
  operator can trace.
inputs:
  - construction-plan
outputs:
  - quality-report
steps:
  - name: Confirm the work basis
    note: >-
      Before roof framing, read the current scope and revisions, then verify
      current dimensions, control lines, lumber or component package,
      connectors, openings, bearing points, and correction of supporting work.
  - name: Set the field controls
    note: >-
      Translate roof framing into work limits, sequence, responsibilities,
      hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During roof framing, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept roof framing, check the completed work against specified
      layout, bearing, fastening, bracing, openings, plane, and inspection
      readiness, then close correction and issue the resulting record.
tension: >-
  Roof framing has to remain inside its acceptance basis while production
  moves. Small layout errors repeat through floors, walls, roofs, windows,
  cabinets, and finishes.
failure_modes:
  - name: Roof framing starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for roof
      framing is settled.
    signal: >-
      The roof framing work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Roof framing closes without evidence
    cost: >-
      A concealed condition or required result from roof framing cannot be
      verified without opening, repeat work, delay, or a disputed exception.
    signal: >-
      Roof framing is released while its required check, location record, test
      result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Roof framing is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Roof framing starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Roof framing uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Wood framing layout and load-path judgment
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of roof framing.
  - name: Evidence control
    note: >-
      Acceptance checks for roof framing have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Roof framing can use digital revisions, checklists, hold points, photo
    capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting roof framing remain human.
questions:
  - Which unresolved condition can stop roof framing before work begins?
  - >-
    Which record proves roof framing was accepted before it was covered,
    loaded, energized, occupied, or handed over?
