id: freight-brokerage
name: Freight Brokerage
codes:
  naics: "488510"
catalog_group: logistics-production
summary: >
  A freight brokerage accepts a shipper's load request, builds a service
  and price, tenders the load to an approved carrier, tracks execution,
  collects delivery evidence, invoices the customer, and pays the
  carrier. The carrier holds physical custody while the brokerage
  controls the commercial record and communication.

  Gross margin is the difference between the customer charge and the
  carrier cost after accessorial and claim effects. Carrier identity,
  authority, insurance, dispatch contact, equipment, and payment details
  need verification before pickup information is released. Cash timing
  also matters because carrier terms and customer terms can settle on
  different dates.
revenue_model:
  - id: margin-per-load
    note: shipper charge less purchased carrier cost and load-specific
      accessorials
  - id: contract-lanes
    note: repeated capacity arranged against agreed shipper rates and
      service expectations
  - id: managed-transportation
    note: broader coordination and reporting fees across a shipper's
      load book
skills:
