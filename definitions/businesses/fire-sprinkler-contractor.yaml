id: fire-sprinkler-contractor
name: Fire Sprinkler Contractor
codes:
  naics: '238220'
catalog_group: construction-property
extends: project-services-base
summary: >-
  A fire sprinkler contractor surveys hazards and water supply, designs or
  coordinates a listed system, releases fabrication, installs piping and
  devices, tests performance, and manages authority acceptance. Ceiling,
  structure, storage, other trades, outages, and occupancy changes affect
  coverage and routing.


  The system is inspected as life-safety work, while much of its coordination
  occurs before pipe reaches the site. Hydraulic criteria, approved drawings,
  hanger and seismic details, obstructions, valve supervision, flushing,
  pressure tests, and alarm interfaces all need traceable records. Service
  work also protects occupied operations during impairments.
skills:
  - ref: project-delivery
    roles: [project-manager, site-superintendent, trade-foreperson]
    documents: [quote, work-order, job-photos]
    metrics: [project-gross-margin, schedule-variance]
    software: [project-operations]
  - ref: sprinkler-system-survey
    roles:
      - project-manager
      - trade-foreperson
      - installer
    documents:
      - construction-plan
      - test-report
    metrics:
      - rework-rate
      - on-time-completion
    software:
