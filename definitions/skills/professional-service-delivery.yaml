id: professional-service-delivery
name: Professional service delivery
kind: skill
department: operations
summary: >
  Professional service delivery carries an authorized engagement
  through planning, technical work, review, release, and closeout.
  Evidence, judgment, versions, time, client decisions, and billing
  state remain attached to the same assignment.
inputs: [engagement-letter]
outputs: [deliverable, time-record]
steps:
  - name: Plan the work
    role: professional
    consumes: [engagement-letter]
    note: >
      Deliverables, methods, sources, dependencies, reviewers,
      milestones, budget, and client decision points become an
      executable plan.
  - name: Perform and record
    role: professional
    produces: [time-record]
    note: >
      Work is completed against the current scope while assumptions,
      evidence, issues, decisions, and effort are recorded.
  - name: Review the work product
    role: principal
    consumes: [time-record]
    note: >
      Technical sufficiency, scope, evidence, calculation, consistency,
      risk, and presentation are checked by the required authority.
  - name: Release the deliverable
    role: principal
    produces: [deliverable]
    note: >
      The approved version, limitations, decisions requested, and
      delivery evidence reach the authorized client recipient.
  - name: Close the engagement stage
    role: client-coordinator
    consumes: [deliverable, time-record]
    note: >
      Acceptance, follow-up, open items, records, unbilled work, and
      the next authorized stage are reconciled.
tension: >
  Thoroughness competes with the client's deadline and fee boundary.
  More analysis can reduce uncertainty; uncontrolled analysis consumes
  capacity without changing the decision the engagement was hired to
  support.
failure_modes:
  - name: Work follows an obsolete scope
    cost: >
      A technically sound deliverable answers a superseded question or
      omits a newly authorized requirement.
    signal: >
      Team members hold different engagement versions or change
      decisions live only in messages.
  - name: Review is compressed into release
    cost: >
      Errors, unsupported conclusions, and scope gaps reach the client
      under the firm's authority.
    signal: >
      Reviewer receives the first complete work product at the delivery
      deadline.
  - name: Performed work remains invisible
    cost: >
      Managers cannot see budget consumption, staffing pressure,
      unbilled value, or recurring rework.
    signal: >
      Time and issue records arrive days after the work or only when an
      invoice is prepared.
maturity:
  - level: run badly
    looks_like: >
      Professionals hold the assignment in personal files and the
      client discovers status at the deadline.
  - level: run well
    looks_like: >
      Plan, evidence, work, review, version, time, delivery, and
      closeout share one engagement record.
  - level: run excellently
    looks_like: >
      Delivery evidence improves scoping, methods, knowledge reuse,
      review gates, staffing, and engagement economics.
competencies:
  - name: Technical execution
    note: >
      The practitioner applies the discipline's methods and knows what
      evidence can support the conclusion.
  - name: Review and release judgment
    note: >
      The principal distinguishes useful additional work from delay and
      refuses unsupported release.
automation:
  now: >
    Work plans, assignments, time capture, document control, templates,
    evidence retrieval, calculations, review routing, delivery, and
    work-in-progress reporting.
  human: >
    Professional judgment, source evaluation, novel analysis, material
    uncertainty, client advice, ethical duties, and release authority.
questions:
  - Which deliverable is closest to release without an identified reviewer?
  - Which engagement is consuming effort beyond its authorized scope or budget?
article:
  what: >
    The professional service delivery process carries an engagement from
    the signed engagement letter to an accepted deliverable and a closed
    stage. It starts when a client has authorized scope, fee, and timing,
    and it ends when the approved work product has reached the named
    client recipient, acceptance and open items are recorded, and
    unbilled time is reconciled. In an accounting firm, a law firm, or an
    engineering firm it is owned by the professional running the
    assignment, with a principal holding review and release authority
    and a client coordinator closing the stage.
  why: >
    The firm's name goes on every deliverable, so the process is what
    stands between a practitioner's draft and the client acting on it.
    Without it, work drifts onto a superseded scope, the reviewer sees
    the first complete version on the delivery day, and time sits
    unrecorded until an invoice forces a reconstruction. Each of those
    puts an unsupported conclusion, a missed requirement, or unbillable
    effort under the firm's authority and leaves the principal unable to
    say what was checked before release.
  how: >
    The professional plans the work from the engagement letter, turning
    deliverables, methods, sources, reviewers, milestones, budget, and
    client decision points into a plan the team can execute. Work then
    proceeds against the current scope while assumptions, evidence,
    issues, decisions, and effort are captured on the time record as
    they occur. The principal reviews the work product for technical
    sufficiency, scope, evidence, calculation, consistency, risk, and
    presentation, and releases the approved version with its limitations
    and requested decisions to the authorized client recipient, keeping
    delivery evidence. The client coordinator then closes the engagement
    stage by reconciling acceptance, follow-up, open items, records,
    unbilled work, and the next authorized stage.
  controls:
    - name: Single current engagement version
      note: Every team member works from the same scope and revision, and a change decision is recorded on the engagement before work proceeds under it.
    - name: Named reviewer before the deadline
      note: The reviewer and review date are set in the plan, so the work product reaches an independent principal with time to act on findings.
    - name: Time recorded the day it is worked
      note: Effort and issues are logged against the assignment daily, so budget consumption, staffing pressure, and unbilled value are visible before the invoice.
    - name: Release evidence on file
      note: The approved version, limitations, decisions requested, recipient, and delivery date are stored with the deliverable so the firm can show what was released and to whom.
    - name: Stage closeout reconciliation
      note: Acceptance, open items, unbilled work, and the next authorized stage are reconciled before the engagement stage is marked closed.
