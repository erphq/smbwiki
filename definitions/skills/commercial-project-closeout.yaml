id: commercial-project-closeout
name: Commercial project closeout
kind: skill
department: operations
summary: >-
  Collects inspections, tests, training, as-builts, warranties, attic stock,
  releases, punch closure, and owner acceptance into a controlled turnover.
  Commercial project closeout leaves a current work basis, a field record, and
  acceptance evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - closeout-package
steps:
  - name: Confirm the work basis
    note: >-
      Before commercial project closeout, read the current scope and
      revisions, then verify issued bid documents, coordinated trade
      boundaries, contractual dates, review routes, and owner decisions.
  - name: Set the field controls
    note: >-
      Translate commercial project closeout into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During commercial project closeout, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept commercial project closeout, check the completed work against
      contract documents, authority approvals, designer review, tested
      systems, and owner turnover criteria, then close correction and issue
      the resulting record.
tension: >-
  Commercial project closeout has to remain inside its acceptance basis while
  production moves. An unresolved scope boundary or late technical decision
  can move cost and time into field rework.
failure_modes:
  - name: Commercial project closeout starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      commercial project closeout is settled.
    signal: >-
      The commercial project closeout work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Commercial project closeout closes without evidence
    cost: >-
      A concealed condition or required result from commercial project
      closeout cannot be verified without opening, repeat work, delay, or a
      disputed exception.
    signal: >-
      Commercial project closeout is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Commercial project closeout is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Commercial project closeout starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Commercial project closeout uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Commercial project controls
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of commercial project closeout.
  - name: Evidence control
    note: >-
      Acceptance checks for commercial project closeout have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Commercial project closeout can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting commercial project closeout
    remain human.
questions:
  - >-
    Which unresolved condition can stop commercial project closeout before
    work begins?
  - >-
    Which record proves commercial project closeout was accepted before it was
    covered, loaded, energized, occupied, or handed over?
