id: specimen-processing
name: Specimen processing
kind: skill
department: operations
summary: >
  Specimen processing carries an authorized test from patient and
  specimen identity through acceptance, preparation, analysis, quality
  control, result review, critical notification, and release. Custody
  and validity remain visible at every step.
inputs: [specimen-order]
outputs: [lab-result]
steps:
  - name: Accept the order and specimen
    role: laboratory-technologist
    consumes: [specimen-order]
    note: >
      Patient identifiers, test, specimen type, collection time,
      container, volume, condition, transport, and priority meet
      acceptance rules.
  - name: Prepare and route
    role: laboratory-technologist
    note: >
      Accession, labeling, separation, aliquot, storage, worklist, and
      custody preserve identity and specimen stability.
  - name: Run test and controls
    role: laboratory-technologist
    note: >
      Validated method, instrument status, calibration, controls,
      reagent, maintenance, and operator requirements are satisfied.
  - name: Review the result
    role: laboratory-technologist
    note: >
      Control acceptance, flags, plausibility, repeat criteria,
      comparison, interference, units, and reference information are
      evaluated.
  - name: Release and notify
    role: laboratory-technologist
    produces: [lab-result]
    note: >
      Verified result, release authority, time, recipient, critical
      notification, and retained-specimen action are recorded.
tension: >
  Turnaround competes with specimen validity and analytical control.
  A fast result has no clinical value when identity, custody, condition,
  controls, method, or review cannot support it.
failure_modes:
  - name: Specimen accepted through a rejection condition
    cost: >
      A result is reported from the wrong container, time, identity,
      condition, volume, or transport history.
    signal: >
      Acceptance exception is free text without an authorized decision.
  - name: Failed control is treated as instrument noise
    cost: >
      Patient results release from an analytical run that did not
      demonstrate valid performance.
    signal: >
      Results leave the hold while the related control remains outside
      acceptance.
  - name: Critical result lacks closed communication
    cost: >
      A time-sensitive finding sits in the record without reaching a
      qualified recipient.
    signal: >
      Notification logs an outbound attempt without recipient readback
      or escalation.
maturity:
  - level: run badly
    looks_like: >
      Staff move tubes and results through separate benches, and
      missing identity or control evidence is reconstructed later.
  - level: run well
    looks_like: >
      Order, specimen, custody, method, controls, result, review,
      notification, and release share one accession.
  - level: run excellently
    looks_like: >
      Rejection, delay, control, repeat, correction, and notification
      evidence improves collection, routing, methods, capacity, and
      clinical communication.
competencies:
  - name: Specimen validity
    note: >
      The technologist knows how identity, collection, container,
      transport, preparation, and storage affect the result.
  - name: Analytical review
    note: >
      The reviewer interprets controls, flags, interference, method
      limits, and results that require repeat or escalation.
automation:
  now: >
    Orders, accession labels, instrument interfaces, worklists,
    controls, autoverification rules, holds, critical alerts, and report
    delivery.
  human: >
    Specimen exceptions, method limits, unusual results, control
    investigation, result correction, and critical communication.
questions:
  - Which specimen in process has an unresolved acceptance exception?
  - Which released result cannot be traced to an accepted analytical run?
article:
  what: >
    The specimen processing process carries a test from the moment a
    specimen and its order arrive at the laboratory to the moment a
    verified result reaches the person who ordered it. It checks that
    the patient, the specimen, and the order belong together, prepares
    and routes the specimen without losing identity or stability, runs
    the analysis under controls that prove the method was working,
    reviews the result, and releases it with any critical notification
    closed. In a medical laboratory it belongs to the laboratory
    technologist on the bench, under a laboratory director who sets the
    acceptance and release rules.
  why: >
    It protects the patient from a result that looks valid and is not. A
    tube accepted with a mismatched identifier, a specimen that sat too
    long before separation, or a run whose control was out and waved
    through as instrument noise produces a number that a clinician will
    act on. A critical value that reaches the record and never reaches a
    qualified person is a missed treatment. The process is also what the
    laboratory's accreditation inspects, so a gap in custody or control
    evidence is a gap in the license.
  how: >
    The technologist accepts the order and the specimen together,
    checking patient identifiers, the test ordered, specimen type,
    collection time, container, volume, condition, transport, and
    priority against the acceptance rules, and recording an authorized
    decision on any exception. The specimen is accessioned, labeled,
    separated or aliquoted, stored, and placed on a worklist with
    custody preserved. The test is run on a validated method with the
    instrument status, calibration, controls, reagent lot, maintenance,
    and operator requirements satisfied. The result is reviewed for
    control acceptance, flags, plausibility, repeat criteria, comparison
    to prior results, interference, units, and reference information.
    The verified result is released with the release authority, time,
    and recipient recorded, a critical value is communicated with
    readback, and the retained-specimen action is noted, all under the
    same accession number.
  controls:
    - name: Patient identifier match at acceptance
      note: The specimen and the order are matched on the required patient identifiers, and a mismatch is rejected or resolved by an authorized person on the record.
    - name: Control acceptance before release
      note: No patient result leaves the hold while a control in the same analytical run is outside its acceptance limits.
    - name: Accession carries custody
      note: Every handling step, storage location, and operator is recorded against the accession so the specimen's history can be reconstructed.
    - name: Critical value readback
      note: A critical result is communicated to a qualified recipient with readback and time recorded, with an escalation path if no recipient answers.
    - name: Release authority recorded
      note: The person or the autoverification rule that released each result is on the record, with the review criteria it passed.
