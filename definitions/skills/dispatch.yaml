id: dispatch
name: Dispatch
kind: skill
department: operations
summary: >
  Assigning booked jobs to techs and sequencing routes through the
  day. The dispatcher trades revenue per truck against promise times
  and skill match on every assignment.
inputs: [job-request]
outputs: [work-order]
steps:
  - name: Build the board
    role: dispatcher
    consumes: [job-request]
    note: >
      The day's calls ranked by urgency, agreement status, and geography.
  - name: Match tech to job
    role: dispatcher
    note: >
      Skills and licenses first, drive time second, revenue third.
  - name: Cut the work order
    role: dispatcher
    produces: [work-order]
    note: >
      Scope, site history, and parts likely needed, so the truck arrives ready.
  - name: Reshuffle live
    role: dispatcher
    note: >
      The morning plan is obsolete by ten. The skill is reshuffling without breaking a promise window.
tension: >
  Revenue per truck against promise integrity. Packing the board
  maximizes today's billing; every broken promise window spends
  tomorrow's. The dispatcher is the person who prices that trade all
  day, one assignment at a time.
failure_modes:
  - name: Skill mismatch
    cost: A callback, a burned slot, and a customer who watched a
      technician struggle.
    signal: Callbacks clustering on one technician or one job type.
  - name: Geography thrash
    cost: Windshield time quietly eats a job per truck per day.
    signal: Miles per completed job creeping up month over month.
  - name: Overpromising the board
    cost: Missed windows, and the missed ones are always the
      customers who took time off work to be home.
    signal: Same-day reshuffles that touch already-promised slots.
maturity:
  - level: run badly
    looks_like: Whoever answers the phone assigns the job. The board
      is a group text, and nobody can say where a truck is.
  - level: run well
    looks_like: One person owns the board. Calls are ranked by
      urgency, agreement status, and geography, and job status is
      live.
  - level: run excellently
    looks_like: Promise windows are quoted from real drive times,
      agreement priority is enforced by the system with memory as a
      backup, and the dispatcher is measured on jobs per truck and
      windows kept, together.
competencies:
  - name: Triage judgment
    note: Hearing the difference between "no cooling" as discomfort
      and "no cooling" as an infant, an elderly parent, or a server
      room.
  - name: The tech-skill map
    note: Knowing without looking which technician has the license,
      the temperament, and the history for this address.
  - name: Geographic memory
    note: The dispatcher who knows the traffic pattern beats the one
      with the map open.
automation:
  now: Route optimization, live status, and assignment suggestions.
    Software is genuinely good at the geometry.
  human: Bumping a bigger ticket for an agreement customer and
    splitting a two-tech job. These exceptions price the brand over
    time, and the algorithm lacks that context.
questions:
  - Who owns the board when the dispatcher is out?
  - What is allowed to break a promise window, and who approves it?
  - Which technician takes the 2am call, and is that a system or a
    habit?
article:
  what: >
    The dispatch process is the daily act of turning booked job requests
    into a sequence of technician assignments that keeps promise windows
    while filling every truck. It starts when the day's calls are ranked
    on the board and ends when each work order has been cut, run, and
    reshuffled through the day without a broken promise. In an HVAC
    contractor, a plumbing contractor, or an electrical contractor it
    belongs to one dispatcher who owns the board, with the service
    manager setting what may override a promise.
  why: >
    It protects the promise the office made to a customer who took the
    day off, and the revenue each truck can earn. A technician sent
    without the license or history for the address produces a callback
    and a burned slot. A board packed by revenue alone creates
    windshield time that quietly eats a job per truck. A same-day
    reshuffle that touches an already promised slot spends tomorrow's
    trust for today's billing. The dispatcher prices that trade all day,
    one assignment at a time.
  how: >
    The dispatcher builds the board from the job requests, ranking the
    day's calls by urgency, agreement status, and geography. Each job is
    matched to a technician on skills and licenses first, drive time
    second, and revenue third. The work order is cut with scope, site
    history, and the parts likely needed so the truck arrives ready. As
    the morning plan becomes obsolete, the dispatcher reshuffles live,
    moving work between trucks without breaking a promise window and
    escalating any exception that would.
  controls:
    - name: Board ranked by urgency, agreement, and geography
      note: >
        Every call is ranked on all three before assignment, and the
        ranking is visible to the service manager.
    - name: Skill and license match on the work order
      note: >
        The work order records the technician's qualification for
        the job type, and a mismatch cannot be dispatched.
    - name: Promise-window override approved
      note: >
        Any reshuffle that moves an already promised slot needs the
        service manager's approval and a customer contact record.
    - name: Jobs per truck and windows kept reviewed together
      note: >
        The dispatcher's daily results are reviewed on both measures
        so neither is traded away silently.
    - name: Named backup for the board
      note: >
        A second person is trained and named to own the board when
        the dispatcher is out, and the handover is recorded.
