id: real-estate-appraisal-firm
name: Real Estate Appraisal Firm
codes:
  naics: '531320'
catalog_group: construction-property
extends: professional-services-base
summary: >-
  A real estate appraisal firm accepts an assignment, defines the property
  interest and value question, inspects and verifies the asset, researches the
  market, develops applicable valuation approaches, reconciles the evidence,
  and issues a signed opinion. Intended use, effective date, scope,
  assumptions, and credential determine the work.


  Comparable sales and income data require verification and judgment before
  they become valuation evidence. Property records can conflict with observed
  condition or legal rights. The appraiser documents sources, adjustments,
  exclusions, and reconciliation so a reviewer can follow how the final
  opinion arose from the assignment and its supporting evidence.
