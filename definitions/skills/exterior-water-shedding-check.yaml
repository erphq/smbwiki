id: exterior-water-shedding-check
name: Exterior water-shedding check
kind: skill
department: quality
summary: >-
  Traces water from upper transitions through openings, penetrations,
  cladding, flashings, and base drainage before access is removed. Exterior
  water-shedding check leaves a current work basis, a field record, and
  acceptance evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - quality-report
steps:
  - name: Confirm the work basis
    note: >-
      Before exterior water-shedding check, read the current scope and
      revisions, then verify accepted sheathing, dry substrate, complete
      openings, approved weather barrier, flashing details, material
      acclimation, and access.
  - name: Set the field controls
    note: >-
      Translate exterior water-shedding check into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During exterior water-shedding check, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept exterior water-shedding check, check the completed work
      against drainage continuity, fastening, clearances, joint layout, trim
      integration, appearance, and manufacturer requirements, then close
      correction and issue the resulting record.
tension: >-
  Exterior water-shedding check has to remain inside its acceptance basis
  while production moves. A finished elevation can look complete while hidden
  drainage and movement details are already set to fail.
failure_modes:
  - name: Exterior water-shedding check starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      exterior water-shedding check is settled.
    signal: >-
      The exterior water-shedding check work package still has an open
      drawing, access, material, predecessor, or approval dependency when
      labor is assigned.
  - name: Exterior water-shedding check closes without evidence
    cost: >-
      A concealed condition or required result from exterior water-shedding
      check cannot be verified without opening, repeat work, delay, or a
      disputed exception.
    signal: >-
      Exterior water-shedding check is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Exterior water-shedding check is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Exterior water-shedding check starts from a checked basis, follows a
      named sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Exterior water-shedding check uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Exterior cladding and water-shedding control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of exterior water-shedding check.
  - name: Evidence control
    note: >-
      Acceptance checks for exterior water-shedding check have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Exterior water-shedding check can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting exterior water-shedding
    check remain human.
questions:
  - >-
    Which unresolved condition can stop exterior water-shedding check before
    work begins?
  - >-
    Which record proves exterior water-shedding check was accepted before it
    was covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The exterior water-shedding check process is the quality hold a siding
    contractor runs before scaffold and lifts come down: the lead traces the
    path water will take from the top of the wall through every transition,
    window and door opening, penetration, cladding lap, flashing, and the
    base drainage, and confirms each detail sheds water outward and onto the
    next layer down. It starts when cladding on an elevation is declared
    complete and ends with a quality report that clears the elevation or
    lists what must be corrected while access still exists.
  why: >
    Cladding hides its own failures. A reverse-lapped flashing or a missed
    kick-out looks fine on the day and rots the sheathing over three
    winters, and by then the contractor is paying to strip a finished wall.
    The check costs an hour per elevation while the scaffold is up; the same
    correction after access is removed costs a lift rental and a day. It
    also protects the manufacturer's warranty, which depends on the details
    the check verifies.
  how: >
    The lead reads the construction plan and revisions and confirms that
    sheathing was accepted, the substrate is dry, openings are complete, the
    weather barrier is approved, flashing details are known, material was
    acclimated, and access is in place. Field controls set the tracing route
    from top to bottom on each elevation, the details to be checked at every
    opening and penetration, the photograph required at each, and the hold
    point that keeps the scaffold up until the report is issued. The lead
    walks the elevation, records each detail as correct or deficient with a
    location, notes concealed conditions, and stops when a detail differs
    from the approved drawing. Acceptance checks drainage continuity,
    fastening, clearances, joint layout, trim integration, appearance, and
    manufacturer requirements, and the quality report is issued.
  controls:
    - name: Trace from top to base on every elevation
      note: The check follows water from the upper transition down to the base drainage and records each layer it crosses.
    - name: Every opening and penetration photographed
      note: Head, jamb, and sill flashing at each opening and each penetration are photographed with a location before cladding is accepted.
    - name: Scaffold held until the report clears
      note: Access is kept on an elevation until the quality report has cleared it or the listed corrections are complete.
    - name: Manufacturer detail compared in the field
      note: Each flashing and clearance is checked against the manufacturer's published detail, and deviations are recorded.
    - name: Corrections closed with a second photograph
      note: Each deficiency is corrected and re-photographed, and the report shows the before and after by location.
