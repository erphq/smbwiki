id: residential-preconstruction
name: Residential preconstruction
kind: skill
department: operations
summary: >-
  Converts the sales plan into a permitted, costed, purchasable, and
  schedulable construction baseline with named decision deadlines. Residential
  preconstruction leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - closeout-package
steps:
  - name: Confirm the work basis
    note: >-
      Before residential preconstruction, read the current scope and
      revisions, then verify approved plans, lot controls, selections,
      permits, trade scopes, and long-lead dates.
  - name: Set the field controls
    note: >-
      Translate residential preconstruction into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During residential preconstruction, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept residential preconstruction, check the completed work against
      the approved plan, inspection record, owner selections, and turnover
      requirements, then close correction and issue the resulting record.
tension: >-
  Residential preconstruction has to remain inside its acceptance basis while
  production moves. A missed dependency can idle several trades and move the
  promised completion date.
failure_modes:
  - name: Residential preconstruction starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      residential preconstruction is settled.
    signal: >-
      The residential preconstruction work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Residential preconstruction closes without evidence
    cost: >-
      A concealed condition or required result from residential
      preconstruction cannot be verified without opening, repeat work, delay,
      or a disputed exception.
    signal: >-
      Residential preconstruction is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Residential preconstruction is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Residential preconstruction starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Residential preconstruction uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Residential construction sequencing
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of residential preconstruction.
  - name: Evidence control
    note: >-
      Acceptance checks for residential preconstruction have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Residential preconstruction can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting residential preconstruction
    remain human.
questions:
  - >-
    Which unresolved condition can stop residential preconstruction before
    work begins?
  - >-
    Which record proves residential preconstruction was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The residential preconstruction process converts a sold plan into a
    baseline the field can build from. It begins when a buyer's sales
    plan and lot are fixed and ends when permits are issued, the plan is
    costed against trade scopes, long-lead materials are purchasable with
    dates, the schedule is set, and every buyer selection has a named
    decision deadline. In a single-family home builder it is owned by the
    preconstruction or purchasing manager, with the superintendent
    accepting the baseline before the first trade is scheduled.
  why: >
    Every missing dependency at the start becomes several idle trades
    later. A permit condition found after excavation, a selection still
    open when the cabinet order date passes, a trade scope that omits the
    gap between two contracts, or a long-lead window nobody booked moves
    the promised completion date and the buyer's move-in. The process
    forces plans, permits, selections, trade scopes, and lead times to be
    settled and dated before the site is mobilized, and leaves a baseline
    that another operator can trace when the schedule is questioned.
  how: >
    The preconstruction manager confirms the work basis by reading the
    current scope and revisions, then verifying approved plans, lot
    controls, selections, permits, trade scopes, and long-lead dates
    against the sales contract. The field controls translate the baseline
    into work limits, sequence, responsibilities, hold points, and the
    records the superintendent and trades will use, including selection
    deadlines tied to order dates. As the baseline is built the manager
    records quantities, decisions, and open items and stops when a plan
    or permit condition changes the intended method. Acceptance checks
    the baseline against the approved plan, inspection requirements,
    owner selections, and turnover requirements before it is released to
    the field, and corrections are closed into the closeout package that
    follows the house to handover.
  controls:
    - name: Permit and plan revision matched
      note: The permitted plan set and the current construction revision are compared and reconciled before the baseline is released to the field.
    - name: Selection deadline on every long-lead item
      note: Each buyer selection that drives an order carries a decision date set back from the order lead time, and the buyer has it in writing.
    - name: Trade scopes checked for gaps and overlaps
      note: Adjacent trade contracts are read together so every scope line has exactly one owner before purchasing begins.
    - name: Cost baseline signed before mobilization
      note: The costed plan is approved by the person accountable for margin before the first trade is scheduled on the lot.
    - name: Baseline accepted by the superintendent
      note: The superintendent reviews and accepts the baseline, and that acceptance is recorded in the job file before the site is mobilized.
