id: pavement-compaction
name: Pavement compaction
kind: skill
department: operations
summary: >-
  Matches roller type and pattern to mat temperature and support, protects
  joints and edges, checks density, and corrects marks before cooling.
  Pavement compaction leaves a current work basis, a field record, and
  acceptance evidence that another operator can trace.
inputs:
  - site-plan
outputs:
  - test-report
steps:
  - name: Confirm the work basis
    note: >-
      Before pavement compaction, read the current scope and revisions, then
      verify approved limits and drainage, removed failed material, stable
      subgrade, confirmed section, available mix, weather window, and traffic
      control.
  - name: Set the field controls
    note: >-
      Translate pavement compaction into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During pavement compaction, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept pavement compaction, check the completed work against
      specified thickness, density, grade, smoothness, drainage, joint
      quality, edge support, markings, and opening strength, then close
      correction and issue the resulting record.
tension: >-
  Pavement compaction has to remain inside its acceptance basis while
  production moves. Surface appearance can hide weak subgrade, thin base, poor
  compaction, or trapped drainage that shortens pavement life.
failure_modes:
  - name: Pavement compaction starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      pavement compaction is settled.
    signal: >-
      The pavement compaction work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Pavement compaction closes without evidence
    cost: >-
      A concealed condition or required result from pavement compaction cannot
      be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Pavement compaction is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Pavement compaction is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Pavement compaction starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Pavement compaction uses field evidence, production variance, defects,
      and closeout results to improve the next estimate, work package, and
      control point.
competencies:
  - name: Small-site pavement production
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of pavement compaction.
  - name: Evidence control
    note: >-
      Acceptance checks for pavement compaction have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Pavement compaction can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting pavement compaction remain
    human.
questions:
  - >-
    Which unresolved condition can stop pavement compaction before work
    begins?
  - >-
    Which record proves pavement compaction was accepted before it was
    covered, loaded, energized, occupied, or handed over?
