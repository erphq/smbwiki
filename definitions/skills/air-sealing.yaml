id: air-sealing
name: Air sealing
kind: skill
department: operations
summary: >-
  Closes top plates, chases, penetrations, rim areas, openings, and boundary
  transitions with compatible materials before insulation hides them. Air
  sealing leaves a current work basis, a field record, and acceptance evidence
  that another operator can trace.
inputs:
  - construction-plan
outputs:
  - inspection-report
steps:
  - name: Confirm the work basis
    note: >-
      Before air sealing, read the current scope and revisions, then verify
      complete air-control layer, dry cavities, closed leaks, installed
      services, approved insulation system, and safe access.
  - name: Set the field controls
    note: >-
      Translate air sealing into work limits, sequence, responsibilities, hold
      points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During air sealing, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept air sealing, check the completed work against continuous
      thermal and air boundary, full depth, correct density, protected
      clearances, and documented concealed work, then close correction and
      issue the resulting record.
tension: >-
  Air sealing has to remain inside its acceptance basis while production
  moves. Voids, compression, wind washing, and bypasses can survive inspection
  while degrading comfort and energy use for the life of the assembly.
failure_modes:
  - name: Air sealing starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for air
      sealing is settled.
    signal: >-
      The air sealing work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Air sealing closes without evidence
    cost: >-
      A concealed condition or required result from air sealing cannot be
      verified without opening, repeat work, delay, or a disputed exception.
    signal: >-
      Air sealing is released while its required check, location record, test
      result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Air sealing is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Air sealing starts from a checked basis, follows a named sequence, stops
      on changed conditions, and closes against recorded acceptance criteria.
  - level: run excellently
    looks_like: >-
      Air sealing uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Thermal and air-boundary continuity
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of air sealing.
  - name: Evidence control
    note: >-
      Acceptance checks for air sealing have to be captured while the relevant
      condition can still be observed and corrected.
automation:
  now: >-
    Air sealing can use digital revisions, checklists, hold points, photo
    capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting air sealing remain human.
questions:
  - Which unresolved condition can stop air sealing before work begins?
  - >-
    Which record proves air sealing was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The air sealing process is how an insulation contractor closes the
    leaks in a building's air barrier before insulation covers them: top
    plates, chases, penetrations, rim joists, window and door openings,
    and the transitions between wall, roof, and floor. It starts when
    the construction plan and the framing, plumbing, and electrical
    rough-ins are complete enough to define the air-control layer, and
    it ends when every sealed location is recorded on an inspection
    report and the insulation crew can begin. The insulation foreman
    owns it, working ahead of his own batt or blown crew.
  why: >
    An unsealed gap behind insulation is a permanent defect. Air moves
    through it for the life of the building, carrying heat, moisture,
    and dust past the insulation and making the rated R-value
    meaningless in that spot. The gap cannot be found or fixed once
    drywall is on without opening the wall. Without the process, the
    crew seals what is visible, misses chases and top plates that are
    already hard to reach, uses a sealant that is incompatible with the
    material it is meant to bond to, and leaves nothing that a blower-
    door test or an energy inspector can trace back.
  how: >
    The foreman starts by reading the current construction plan and
    revisions and confirming that the air-control layer is defined and
    complete, that the cavities are dry, that known leaks have been
    closed by other trades, that services are installed, that the
    insulation system has been approved, and that the crew can reach the
    work safely. He then sets the field controls: the list of locations
    to seal, the sealant or foam for each substrate, the sequence
    through the building, the hold point before insulation, and the
    record form. During the work the crew records the locations sealed,
    material used, and any penetration or opening that was not on the
    plan, and stops when a condition such as a wet cavity or a missing
    service changes the method. At acceptance the sealed boundary is
    checked for continuity, clearances are confirmed, concealed work is
    photographed, corrections are closed, and the inspection report is
    issued to the builder.
  controls:
    - name: Sealing location list from the plan
      note: Top plates, chases, penetrations, rim areas, and openings are listed from the construction plan before work starts, and each is ticked off by location.
    - name: Material compatibility check
      note: The sealant or foam for each substrate is confirmed against the manufacturer's listing before it is applied, and an unlisted pairing is stopped.
    - name: Photo record before cover
      note: Every sealed location that insulation or drywall will conceal is photographed with a location reference before the next trade starts.
    - name: Hold point before insulation
      note: The insulation crew does not begin until the foreman has walked the sealed boundary and signed the hold point.
    - name: Inspection report issued
      note: The report lists locations, materials, exceptions, and corrections and is filed before the building is closed in.
