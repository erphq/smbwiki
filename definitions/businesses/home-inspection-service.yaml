id: home-inspection-service
name: Home Inspection Service
codes:
  naics: '541350'
catalog_group: construction-property
extends: professional-services-base
summary: >-
  A home inspection service examines accessible site, structure, envelope,
  roof, interior, plumbing, electrical, heating, cooling, appliances, and
  safety conditions for a client. The engagement defines the standard,
  exclusions, access, utilities, occupancy, timing, and report so the limits
  are clear before fieldwork.


  The inspector samples and observes without dismantling the building. Defects
  need precise location, evidence, significance, and an appropriate
  recommendation, while inaccessible areas and unsafe tests are stated as
  limitations. Report quality depends on disciplined field notes and
  photographs as much as building knowledge.
skills:
