id: door-fitting
name: Door fitting
kind: skill
department: operations
summary: >-
  Checks opening geometry, hangs or adjusts the leaf, sets clearances, fits
  latch and hardware, and verifies swing, seal, and fire requirements. Door
  fitting leaves a current work basis, a field record, and acceptance evidence
  that another operator can trace.
inputs:
  - construction-plan
outputs:
  - punch-list
steps:
  - name: Confirm the work basis
    note: >-
      Before door fitting, read the current scope and revisions, then verify
      stable conditioned space, verified field dimensions, dry material,
      approved profiles and samples, complete backing, and protected access.
  - name: Set the field controls
    note: >-
      Translate door fitting into work limits, sequence, responsibilities,
      hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During door fitting, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept door fitting, check the completed work against fit, reveal,
      joint, operation, fastening, surface condition, alignment, hardware, and
      finish readiness, then close correction and issue the resulting record.
tension: >-
  Door fitting has to remain inside its acceptance basis while production
  moves. Finish carpentry absorbs accumulated framing, drywall, floor, and
  casework tolerances in the most visible work.
failure_modes:
  - name: Door fitting starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for door
      fitting is settled.
    signal: >-
      The door fitting work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Door fitting closes without evidence
    cost: >-
      A concealed condition or required result from door fitting cannot be
      verified without opening, repeat work, delay, or a disputed exception.
    signal: >-
      Door fitting is released while its required check, location record, test
      result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Door fitting is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Door fitting starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Door fitting uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Field fitting and finish tolerance control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of door fitting.
  - name: Evidence control
    note: >-
      Acceptance checks for door fitting have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Door fitting can use digital revisions, checklists, hold points, photo
    capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting door fitting remain human.
questions:
  - Which unresolved condition can stop door fitting before work begins?
  - >-
    Which record proves door fitting was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The door fitting process hangs or adjusts each door leaf so it
    swings, latches, seals, and, where required, meets its fire rating:
    checking the opening geometry, setting clearances, fitting latch and
    hardware, and verifying the operation. It starts when the openings
    are dry, dimensioned, and backed and ends when each door is accepted
    or listed on the punch list. A finish carpentry contractor owns it
    through the lead carpenter, with the superintendent or the general
    contractor accepting the work.
  why: >
    It protects the most visible work on the job from tolerances that
    arrived with everyone else. Finish carpentry absorbs accumulated
    framing, drywall, floor, and casework error, and a door that rubs,
    sags, or shows an uneven reveal is what the owner notices first. A
    fire door fitted outside its clearance or hardware requirement fails
    inspection after the finish is on. Hardware fitted before the leaf
    is set right is drilled twice. Unrecorded field adjustments become
    disputed punch items.
  how: >
    The lead carpenter confirms the work basis by reading the current
    scope and revisions on the construction plan and verifying stable
    conditioned space, verified field dimensions, dry material, approved
    profiles and samples, complete backing, and protected access. Field
    controls set the fitting sequence by opening, clearance and reveal
    targets, hardware templates, hold points for fire-rated openings,
    and the records the crew keeps. During the work the carpenter
    records each opening's geometry, adjustments made, hardware fitted,
    observations, decisions, and concealed conditions, and stops when an
    opening is out of the range the planned method can absorb.
    Acceptance checks each door against fit, reveal, joint, operation,
    fastening, surface condition, alignment, hardware, and finish
    readiness, and the punch list is issued once correction closes.
  controls:
    - name: Opening geometry recorded before hanging
      note: >
        Width, height, plumb, and level of each opening are measured
        and recorded, and out-of-range openings are reported before
        fitting.
    - name: Clearance and reveal check per door
      note: >
        Each leaf's clearances and reveals are measured against the
        target and recorded before hardware is fitted.
    - name: Fire-rated openings as hold points
      note: >
        Rated doors are verified for label, clearance, hardware, and
        closer before the opening is released for finish.
    - name: Operation test recorded
      note: >
        Swing, latch, and seal are tested on every door and the
        result is recorded on the punch list or acceptance record.
