id: mortar-control
name: Mortar control
kind: skill
department: operations
summary: >-
  Controls approved materials, batching, water, mixing time, board life,
  retempering limits, weather protection, and batch records. Mortar control
  leaves a current work basis, a field record, and acceptance evidence that
  another operator can trace.
inputs:
  - construction-plan
outputs:
  - quality-report
steps:
  - name: Confirm the work basis
    note: >-
      Before mortar control, read the current scope and revisions, then verify
      approved sample, sound support, control lines, unit and mortar supply,
      weather protection, embeds, and interface details.
  - name: Set the field controls
    note: >-
      Translate mortar control into work limits, sequence, responsibilities,
      hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During mortar control, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept mortar control, check the completed work against line, level,
      plumb, bond, joint profile, reinforcement, flashing, drainage, cleaning,
      and specified appearance, then close correction and issue the resulting
      record.
tension: >-
  Mortar control has to remain inside its acceptance basis while production
  moves. Masonry locks layout, structure, weather control, and visible finish
  into the same installed work.
failure_modes:
  - name: Mortar control starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for mortar
      control is settled.
    signal: >-
      The mortar control work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Mortar control closes without evidence
    cost: >-
      A concealed condition or required result from mortar control cannot be
      verified without opening, repeat work, delay, or a disputed exception.
    signal: >-
      Mortar control is released while its required check, location record,
      test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Mortar control is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Mortar control starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Mortar control uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Masonry material and bond control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of mortar control.
  - name: Evidence control
    note: >-
      Acceptance checks for mortar control have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Mortar control can use digital revisions, checklists, hold points, photo
    capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting mortar control remain human.
questions:
  - Which unresolved condition can stop mortar control before work begins?
  - >-
    Which record proves mortar control was accepted before it was covered,
    loaded, energized, occupied, or handed over?
