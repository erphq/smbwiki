id: field-job-execution
name: Field job execution
kind: skill
department: operations
summary: >
  Field job execution carries an assigned work order into a customer
  site, controls hazards and property, confirms the condition, performs
  the authorized work, verifies the result, and returns usable evidence
  to the office.
inputs: [work-order]
outputs: [job-photos]
steps:
  - name: Accept the site and scope
    role: technician
    consumes: [work-order]
    note: >
      Contact, access, reported condition, authorized work, site history,
      and known hazards are reviewed with the person responsible on site.
  - name: Control hazards and property
    role: technician
    note: >
      Isolation, protection, test area, tools, materials, and occupant
      impact are settled before opening the system or structure.
  - name: Confirm and perform the work
    role: technician
    note: >
      Findings support the action, scope changes stop for authorization,
      and required procedure and code remain part of completion.
  - name: Test the result
    role: technician
    note: >
      Function, safety, leaks, settings, controls, cleanup, and the
      original condition are checked under a realistic operating state.
  - name: Document and hand off
    role: technician
    produces: [job-photos]
    note: >
      Before condition, completed work, test evidence, materials, customer
      instruction, and remaining issue return on the work order.
tension: >
  Jobs completed per day compete with safe, durable, and documented work.
  A fast departure creates capacity only when isolation, authorization,
  testing, cleanup, and customer handoff remain complete.
failure_modes:
  - name: Site condition expands scope silently
    cost: >
      The technician performs unpriced work or leaves a required adjacent
      problem unexplained.
    signal: >
      Completion notes describe a condition absent from the work order and
      any change authorization.
  - name: Operating test omitted
    cost: >
      The repair or installation appears complete at rest and fails when
      load, flow, heat, pressure, drainage, or controls are used.
    signal: >
      Completion evidence shows installed work with no operating readings
      or result.
  - name: Site protection fails
    cost: >
      Property damage, contamination, water, debris, or unsafe access
      becomes a second job and customer dispute.
    signal: >
      Work begins before protection and isolation are recorded.
maturity:
  - level: run badly
    looks_like: >
      The technician receives an address and problem, then reports done
      through a short note from the truck.
  - level: run well
    looks_like: >
      Site acceptance, hazard control, scope, change approval, execution,
      test evidence, cleanup, and handoff remain on the work order.
  - level: run excellently
    looks_like: >
      Field findings improve intake and quoting, repeat defects change
      procedure, and the office can close the job from technician evidence.
competencies:
  - name: Site control
    note: >
      The technician has to protect occupants, property, utilities, and
      the work area while creating access to the system.
  - name: Technical verification
    note: >
      Workmanship becomes a completed result only after the system is
      tested under the condition the customer will use.
automation:
  now: >
    Work-order delivery, navigation, checklists, procedure lookup, parts
    and time capture, photos, readings, signatures, and completion status.
  human: >
    Hazard control, physical diagnosis and work, site adaptation,
    workmanship, customer communication, and release judgment.
questions:
  - What operating evidence proves the latest completed job resolved its condition?
  - Which field finding should change intake, quoting, or truck preparation?
article:
  what: >
    The field job execution process is the technician's side of a service
    visit: arriving with a work order, agreeing the scope and access with
    the person on site, protecting the property and isolating the hazard,
    confirming the condition matches the order before working, performing
    the authorized work and stopping for any change, testing the result
    under real operating conditions, and sending photos and evidence back so
    the office can close the job. It runs in an HVAC contractor, a plumbing
    contractor, an appliance repair service, a pest control company, and
    every other trade that sends a technician to a customer's premises, and
    the technician owns the visit.
  why: >
    The office prices, schedules, and invoices from what the technician
    reports, and the customer judges the company on what the technician
    leaves behind. Work done on a condition that was never confirmed gets
    billed as the wrong thing. Scope expanded on site without authorization
    is either unpaid or disputed. A repair that passes at rest and fails
    under load is a callback and a lost customer. Water on a floor, debris
    on a lawn, or a gate left open becomes a second job and a complaint. The
    process keeps each of those outcomes tied to a step that has a record.
  how: >
    The technician reviews the work order with the responsible person on
    site, covering contact, access, the reported condition, the authorized
    work, site history, and known hazards. Before opening anything the
    technician sets up isolation, protection, a test area, tools, materials,
    and the arrangement for occupants. The condition is confirmed and the
    work performed; when findings do not support the order or the scope
    needs to grow, work stops until the office or customer authorizes the
    change, and required procedure and code stay part of completion. The
    result is tested under a realistic operating state, checking function,
    safety, leaks, settings, controls, cleanup, and the original condition.
    Before and after photos, test evidence, materials used, customer
    instruction, and any remaining issue go back on the work order for the
    office to close.
  controls:
    - name: Site acceptance recorded before work
      note: Contact, access, reported condition, and hazards are confirmed with the person on site and noted on the work order.
    - name: Protection and isolation photographed
      note: Floor protection, isolation, and the work area are photographed before the system or structure is opened.
    - name: Change authorization before scope grows
      note: Any work beyond the order stops until an authorization with a price is recorded from the customer or the office.
    - name: Operating test with readings
      note: The completion record carries readings taken under load, flow, heat, pressure, or the relevant operating condition.
    - name: Handoff evidence on the work order
      note: Before and after photos, materials, customer sign-off, and remaining issues are attached before the technician leaves the site.
