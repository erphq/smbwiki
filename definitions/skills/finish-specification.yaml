id: finish-specification
name: Finish specification
kind: skill
department: operations
summary: >-
  Selects and schedules materials for use, code, maintenance, availability,
  budget, substrate, transition, appearance, and approved sample. Finish
  specification leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - client-brief
outputs:
  - finish-schedule
steps:
  - name: Confirm the work basis
    note: >-
      Before finish specification, read the current scope and revisions, then
      verify approved program, measured existing conditions, consultant
      criteria, budget, schedule, code basis, and client decision structure.
  - name: Set the field controls
    note: >-
      Translate finish specification into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During finish specification, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept finish specification, check the completed work against
      coordinated safe spaces, approved selections, complete documents,
      released procurement, installed intent, and resolved deficiencies, then
      close correction and issue the resulting record.
tension: >-
  Finish specification has to remain inside its acceptance basis while
  production moves. A late spatial or finish decision can affect building
  systems, price, lead time, and installed work at once.
failure_modes:
  - name: Finish specification starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for finish
      specification is settled.
    signal: >-
      The finish specification work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Finish specification closes without evidence
    cost: >-
      A concealed condition or required result from finish specification
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Finish specification is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Finish specification is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Finish specification starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Finish specification uses field evidence, production variance, defects,
      and closeout results to improve the next estimate, work package, and
      control point.
competencies:
  - name: Interior space and material coordination
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of finish specification.
  - name: Evidence control
    note: >-
      Acceptance checks for finish specification have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Finish specification can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting finish specification remain
    human.
questions:
  - >-
    Which unresolved condition can stop finish specification before work
    begins?
  - >-
    Which record proves finish specification was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The finish specification process is how an interior design firm turns
    a client brief into a finish schedule: a room-by-room and
    surface-by-surface list of flooring, wall finish, tile, countertop,
    millwork finish, and hardware, each chosen for the way the space is used, the
    code it must meet, the maintenance the client will accept, the budget,
    the substrate it goes on, the transition it meets, and the sample the
    client approved. It starts once the program and existing conditions
    are settled and ends when the schedule is complete, samples are
    signed, and procurement is released. The project designer owns it,
    with the principal approving the released schedule.
  why: >
    A finish decided late or loosely reaches every other trade at once:
    the tile setter needs the substrate prepared for that tile, the
    electrician needs the countertop thickness, the contractor needs the
    lead time, and the client needs the price. When the specification is
    weak, a material arrives that fails slip or fire requirements, cannot
    be cleaned the way the client cleans, or meets an adjacent finish with
    no transition detail, and the firm absorbs the redesign or the
    reputation. The process protects the design intent, the budget, and
    the firm's liability for what it specified.
  how: >
    The designer reads the current brief and revisions and confirms the
    approved program, measured existing conditions, consultant criteria,
    budget, schedule, code basis, and client decision structure before
    selecting anything. The controls are then set: the schedule format by
    room and surface, the criteria each selection must meet, the order in
    which rooms and long-lead items are decided, the hold points where the
    client signs a sample and where the contractor confirms substrate and
    lead time, and who keeps the schedule current. As selections are made,
    the designer records the basis for each choice, the sample reference,
    availability confirmed with the supplier, and any substitution with
    the reason, and stops when a substrate, budget, or code finding
    changes what can be specified. At acceptance the principal checks
    that spaces are coordinated, selections are approved, documents are
    complete, procurement is released, and any deficiency is resolved,
    then issues the finish schedule.
  controls:
    - name: Criteria checklist per selection
      note: Each line on the schedule records use, code, maintenance, availability, budget, substrate, and transition, and a blank column holds the selection.
    - name: Signed sample on file
      note: The physical or photographed sample the client approved is referenced on the schedule line so the installed material can be checked against it.
    - name: Substitution logged with reason
      note: Any change from the approved selection carries the reason, the approver, and the date, and the affected trades are notified from the log.
    - name: Lead time confirmed before release
      note: Availability and lead time are confirmed with the supplier and recorded before the schedule line is released to procurement.
    - name: Schedule revision control
      note: The finish schedule carries a revision date, and only the current revision is issued to the contractor and suppliers.
