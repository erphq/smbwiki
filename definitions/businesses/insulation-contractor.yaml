article:
  operating_model: >
    An insulation contractor sells an installed thermal and air
    boundary, and most of what the crew does disappears behind drywall
    within days. The week runs on production scheduling: the estimator
    quotes from plans or an attic assessment, the office manager orders
    bags and batts against the job, and the foreperson and installers
    air seal, install batts or run the blowing machine to the specified
    depth and density, and record concealed conditions by location
    before the inspection. Thermal envelope assessment, air sealing, and
    insulation verification are the load-bearing skills, with batt and
    blown installation as the production work between them. The tension
    is between production speed and verification: a crew paid by the bag
    or the square foot moves fast, and compressed batts, missed
    bypasses, and low density are invisible once walls close, so the
    inspection report and photographs are the only defense when a
    homeowner's energy bill or a builder's blower door test comes back
    wrong.
  starting: >
    Day-one paperwork is business registration, employer registration,
    general liability and workers compensation insurance rated for attic
    and crawlspace work, and a contractor license where the state or
    locality licenses insulation as a specialty trade or requires a
    general contractor class; sales tax registration applies where
    installed materials are taxable, and utility rebate and
    weatherization programs each require their own contractor enrollment
    with training and quality standards before rebate work can be
    claimed. Capital is a truck or trailer with a blowing machine and
    hose, a compressor and foam rig if spray foam or air sealing foam is
    offered, respirators and protective equipment, an infrared camera
    and blower door for assessment, and a distributor account for bags
    and batts. The minimum team is an owner who estimates and runs the
    crew, one installer, and someone in the office handling orders,
    permits, and rebate paperwork. The first records are the job
    request, the quote with areas, R-values, and bag counts, the
    construction plan or assessment, the work order, the inspection
    report with depth and density readings and photographs, and the
    customer invoice. Lead intake, quoting, purchasing, project
    delivery, and insulation verification must work from the first job.
  economics: >
    Revenue is quoted projects and the installed insulation quantity
    with air sealing, assessment, removal, ventilation accessories,
    testing, and rebate documentation attached. Pricing is per square
    foot by material and R-value, or per bag for blown work, with air
    sealing and removal priced by the hour or area; rebates are
    collected from the utility or program on the customer's behalf and
    paid after documentation is approved. Gross margin is material cost
    against price, and it moves with machine settings and bag count:
    over-blowing a job to reach depth uses material the quote did not
    price, and under-blowing fails verification. The metrics that decide
    profit are project gross margin, quote win rate, rework rate, and
    on-time completion, because a return visit to add depth or fix a
    bypass is a crew day with no revenue, and builders drop trades that
    miss the drywall date. Schedule variance and days sales outstanding
    matter on new construction where the builder pays late. The business
    is labor-intensive with a modest equipment base; margins depend on
    production planning, on material bought in volume, and on rebate
    paperwork completed cleanly.
