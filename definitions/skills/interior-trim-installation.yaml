id: interior-trim-installation
name: Interior trim installation
kind: skill
department: operations
summary: >-
  Sequences jambs, casing, base, crown, panels, returns, joints, backing,
  fasteners, and fillers for consistent reveals. Interior trim installation
  leaves a current work basis, a field record, and acceptance evidence that
  another operator can trace.
inputs:
  - construction-plan
outputs:
  - punch-list
steps:
  - name: Confirm the work basis
    note: >-
      Before interior trim installation, read the current scope and revisions,
      then verify stable conditioned space, verified field dimensions, dry
      material, approved profiles and samples, complete backing, and protected
      access.
  - name: Set the field controls
    note: >-
      Translate interior trim installation into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During interior trim installation, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept interior trim installation, check the completed work against
      fit, reveal, joint, operation, fastening, surface condition, alignment,
      hardware, and finish readiness, then close correction and issue the
      resulting record.
tension: >-
  Interior trim installation has to remain inside its acceptance basis while
  production moves. Finish carpentry absorbs accumulated framing, drywall,
  floor, and casework tolerances in the most visible work.
failure_modes:
  - name: Interior trim installation starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      interior trim installation is settled.
    signal: >-
      The interior trim installation work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Interior trim installation closes without evidence
    cost: >-
      A concealed condition or required result from interior trim installation
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Interior trim installation is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Interior trim installation is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Interior trim installation starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Interior trim installation uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Field fitting and finish tolerance control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of interior trim installation.
  - name: Evidence control
    note: >-
      Acceptance checks for interior trim installation have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Interior trim installation can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting interior trim installation
    remain human.
questions:
  - >-
    Which unresolved condition can stop interior trim installation before work
    begins?
  - >-
    Which record proves interior trim installation was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The interior trim installation process is how a finish carpentry
    contractor sets jambs, casing, base, crown, panels, and returns so
    that reveals are consistent, joints are tight, and every piece is
    fastened to backing that will hold it. It begins when the space is
    conditioned and dry, dimensions are verified, and profiles and
    samples are approved, and it ends with the installed trim accepted
    against the construction plan and a punch list that names whatever
    remains. The lead carpenter owns it, with the foreman holding the
    acceptance.
  why: >
    It protects the most visible work in the building. Finish carpentry
    absorbs the accumulated tolerances of framing, drywall, floors, and
    casework, and when the process is weak the result is uneven
    reveals, open miters, nail pops, and crown that telegraphs a wavy
    ceiling. Trim installed in an unconditioned space or with wet
    material shrinks and opens after painting, and correction at that
    stage means repainting rooms that were finished.
  how: >
    The lead carpenter reads the current scope and revisions, then
    verifies a stable conditioned space, field dimensions, dry
    material, approved profiles and samples, complete backing, and
    protected access before the crew is committed. The plan becomes
    field controls: the sequence by room and element, which reveals and
    joint types govern, who cuts and who sets, hold points where
    framing or drywall conditions have to be accepted first, and the
    records the crew keeps. During installation the crew records
    quantities, observations, decisions, and any backing or shim
    conditions that will be concealed, and stops when a field condition
    changes the planned method. At acceptance the foreman checks fit,
    reveal, joint, door and window operation, fastening, surface
    condition, alignment, hardware, and finish readiness, then closes
    corrections and issues the punch list.
  controls:
    - name: Moisture and conditioning check
      note: Material moisture content and room temperature and humidity are confirmed and recorded before any trim is cut or set.
    - name: Reveal and profile sample approval
      note: The approved sample and reveal dimension are on site and signed before the first piece is set in any room.
    - name: Backing verified before covering
      note: Blocking locations for base, crown, and panels are confirmed and photographed before drywall or trim conceals them.
    - name: Room-by-room acceptance
      note: Each room is checked against fit, reveal, joint, and operation criteria and corrections are recorded before the crew moves on.
    - name: Punch list with owner and status
      note: Every open item names the room, the element, the correction, and who will close it, so nothing lingers into paint.
