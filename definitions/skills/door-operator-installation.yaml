id: door-operator-installation
name: Door operator installation
kind: skill
department: operations
summary: >-
  Mounts and aligns the operator, connects drive and controls, sets travel and
  force, installs manual release, and coordinates power. Door operator
  installation leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - work-order
outputs:
  - commissioning-record
steps:
  - name: Confirm the work basis
    note: >-
      Before door operator installation, read the current scope and revisions,
      then verify verified opening and structure, selected door and operator,
      electrical provision, hardware, spring design, access, and site
      protection.
  - name: Set the field controls
    note: >-
      Translate door operator installation into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During door operator installation, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept door operator installation, check the completed work against
      secure attachment, balanced travel, correct clearances, functional
      controls, entrapment protection, manual release, seals, and owner
      instruction, then close correction and issue the resulting record.
tension: >-
  Door operator installation has to remain inside its acceptance basis while
  production moves. A door can cycle under power while its spring balance,
  attachment, or safety reversal remains unsafe.
failure_modes:
  - name: Door operator installation starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for door
      operator installation is settled.
    signal: >-
      The door operator installation work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Door operator installation closes without evidence
    cost: >-
      A concealed condition or required result from door operator installation
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Door operator installation is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Door operator installation is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Door operator installation starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Door operator installation uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Overhead-door balance and safety control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of door operator installation.
  - name: Evidence control
    note: >-
      Acceptance checks for door operator installation have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Door operator installation can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting door operator installation
    remain human.
questions:
  - >-
    Which unresolved condition can stop door operator installation before work
    begins?
  - >-
    Which record proves door operator installation was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The door operator installation process starts when a work order assigns
    a crew to a verified opening and ends when the operator has been
    mounted, wired, set for travel and force, fitted with a manual release,
    tested for reversal, and handed to the owner with a commissioning
    record. A garage door contractor runs it on every powered residential
    and commercial door, and the lead installer owns it under the service
    manager or the owner.
  why: >
    A powered door is a moving load over people and vehicles. When the
    process is weak the operator gets mounted on a door whose spring balance
    was never checked, so the motor carries weight it was never sized for
    and the drive fails early or the door drops when the release is pulled.
    Force limits set by feel let the door close on an object without
    reversing. A photoelectric sensor out of alignment, a release the owner
    was never shown, and a blank commissioning record mean the next
    technician has no basis for a callback and the contractor has no proof
    the safety functions worked on the day of handover.
  how: >
    The installer reads the work order and the current scope, then confirms
    the opening and structure, the selected door and operator, the
    electrical provision, the hardware and spring design, and site
    protection before unloading. The crew lead sets the field controls:
    which door is worked first, where the hold points fall (spring balance
    before the operator is attached, force and travel before the first
    powered cycle), and which record each check lands in. During the install
    the crew records mount points, wiring route, travel and force settings,
    and any concealed condition, and stops when the opening or structure
    differs from the plan. Acceptance checks secure attachment, balanced
    travel, clearances, control function, entrapment reversal, manual
    release, seals, and owner instruction; corrections are closed and the
    commissioning record is issued.
  controls:
    - name: Spring balance check before attachment
      note: The door is balanced by hand and held at mid travel before the operator carriage is connected, and the result is written in the field record.
    - name: Entrapment reversal test on record
      note: The reversal test against a fixed obstruction and the photoelectric interruption test are run, witnessed, and recorded with the force setting used.
    - name: Manual release demonstrated to the owner
      note: The owner operates the release and reconnects the carriage in front of the installer, and the commissioning record notes who was instructed.
    - name: Changed-condition stop
      note: When the header, structure, spring, or power provision differs from the work order, the crew stops and gets the revised method approved before continuing.
    - name: Commissioning record issued before the truck leaves
      note: The record carries the settings, tests, photos, and open corrections, and the job stays open in the office until every field is complete.
