      source_name: US Census Bureau, County Business Patterns 2023, United States file (2023 data)
    - scope: Annual payroll per employee, administrative management and general management consulting services (NAICS 541611)
      value: 121,753 dollars per employee (2023)
      note: Annual payroll of 105,858,919 thousand dollars divided by 869,457 paid employees, employer establishments only; ratio derived from the two published totals in the national CBP file.
      source: https://www2.census.gov/programs-surveys/cbp/datasets/2023/cbp23us.zip
