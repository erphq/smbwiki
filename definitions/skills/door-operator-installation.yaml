id: door-operator-installation
name: Door operator installation
kind: skill
department: operations
summary: >-
  Mounts and aligns the operator, connects drive and controls, sets travel and
  force, installs manual release, and coordinates power. Door operator
  installation leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - work-order
outputs:
  - commissioning-record
steps:
  - name: Confirm the work basis
    note: >-
      Before door operator installation, read the current scope and revisions,
      then verify verified opening and structure, selected door and operator,
      electrical provision, hardware, spring design, access, and site
      protection.
  - name: Set the field controls
    note: >-
      Translate door operator installation into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During door operator installation, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept door operator installation, check the completed work against
      secure attachment, balanced travel, correct clearances, functional
      controls, entrapment protection, manual release, seals, and owner
      instruction, then close correction and issue the resulting record.
tension: >-
  Door operator installation has to remain inside its acceptance basis while
  production moves. A door can cycle under power while its spring balance,
  attachment, or safety reversal remains unsafe.
failure_modes:
  - name: Door operator installation starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for door
      operator installation is settled.
    signal: >-
      The door operator installation work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Door operator installation closes without evidence
    cost: >-
      A concealed condition or required result from door operator installation
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Door operator installation is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Door operator installation is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Door operator installation starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Door operator installation uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Overhead-door balance and safety control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of door operator installation.
  - name: Evidence control
    note: >-
      Acceptance checks for door operator installation have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Door operator installation can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting door operator installation
    remain human.
questions:
  - >-
    Which unresolved condition can stop door operator installation before work
    begins?
  - >-
    Which record proves door operator installation was accepted before it was
    covered, loaded, energized, occupied, or handed over?
