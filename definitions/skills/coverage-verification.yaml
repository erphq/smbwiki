id: coverage-verification
name: Coverage verification
kind: skill
department: finance
summary: >
  Coverage verification records what a payer reports about eligibility,
  benefits, limits, exclusions, and expected patient responsibility for
  planned care. It is dated evidence for scheduling and billing
  decisions; final adjudication can still apply different information.
inputs: [patient-registration]
outputs: [insurance-verification]
steps:
  - name: Confirm payer identity
    consumes: [patient-registration]
    note: >
      Member, plan, provider, and patient relationship details have to
      match the payer's record before benefits are interpreted.
  - name: Check active coverage
    note: >
      Effective dates, network status, and the service category are
      checked for the intended date of care.
  - name: Record benefit detail
    note: >
      Deductible, remaining benefit, copay, coinsurance, exclusions,
      frequency limits, and authorization requirements are kept with the
      source and time of inquiry.
  - name: Publish the verification
    produces: [insurance-verification]
    note: >
      Assumptions and unresolved items are visible to the person
      presenting cost or preparing the claim.
tension: >
  Scheduling speed competes with financial clarity. Holding every visit
  for exhaustive payer research blocks care; weak verification moves an
  avoidable surprise to the patient or billing queue.
failure_modes:
  - name: Wrong benefit category
    cost: >
      Staff quote responsibility from a benefit outside the planned
      service category.
    signal: >
      The verification records general eligibility without service-level
      benefit detail.
  - name: Stale verification
    cost: >
      Coverage, network status, or remaining benefit changes before the
      date of care.
    signal: >
      The verification date falls outside the clinic's refresh rule for
      the scheduled service.
  - name: Authorization requirement missed
    cost: >
      A completed service reaches claim review without the payer approval
      required for payment.
    signal: >
      Planned care has a verification result but no authorization status.
maturity:
  - level: run badly
    looks_like: >
      An insurance card is copied and coverage questions are answered
      after the payer rejects or reduces the claim.
  - level: run well
    looks_like: >
      Dated service-level benefits, network status, and authorization
      requirements are visible before care.
  - level: run excellently
    looks_like: >
      Verification rules reflect service risk, unresolved items have
      owners, and claim outcomes correct recurring interpretation errors.
competencies:
  - name: Benefit interpretation
    note: >
      Payer language has to be mapped to the planned service, provider,
      date, and sequence of care.
  - name: Assumption communication
    note: >
      The operator can explain what was confirmed, what remains
      conditional, and what the patient may owe.
automation:
  now: >
    Electronic eligibility queries, benefit extraction, network checks,
    refresh queues, and authorization prompts.
  human: >
    Ambiguous benefit language, conflicting payer responses, service
    mapping, and financial conversations with the patient.
questions:
  - What source and date support the expected patient responsibility?
  - Which scheduled services still have an unresolved authorization requirement?
article:
  what: >
    The coverage verification process records, before care is delivered,
    what the payer says about a patient's eligibility, benefits, limits,
    exclusions, authorization needs, and expected responsibility for the
    planned service. It starts from the patient registration and ends
    when a dated insurance verification is published to the people who
    quote cost and prepare the claim. In a primary care practice, a
    dental clinic, or a physical therapy clinic it belongs to the front
    desk or a verification specialist, with the billing lead setting the
    refresh rules.
  why: >
    It protects the patient from a surprise balance and the clinic from
    an unpaid claim. Quoting from general eligibility instead of the
    service-level benefit puts the wrong number in front of the patient.
    A verification done weeks ahead can be stale by the date of care
    when coverage or network status has changed. A service that needed
    prior authorization reaches claim review without it, and the payer
    denies work already delivered. Each failure moves cost onto the
    patient or into the billing queue.
  how: >
    The operator confirms payer identity from the patient registration,
    matching member, plan, provider, and patient relationship details to
    the payer's record before any benefit is interpreted. Active
    coverage is checked for the intended date of care: effective dates,
    network status, and the service category. Benefit detail is recorded
    next, with deductible, remaining benefit, copay, coinsurance,
    exclusions, frequency limits, and authorization requirements kept
    alongside the source and time of the inquiry. The insurance
    verification is then published with its assumptions and unresolved
    items visible to whoever presents cost to the patient or prepares
    the claim.
  controls:
    - name: Service-level benefit required
      note: >
        The verification records the benefit for the planned service
        category, and a general eligibility result alone does not
        close the task.
    - name: Source and timestamp on every entry
      note: >
        Each benefit detail carries the payer source, the reference
        or call record, and the date and time of the inquiry.
    - name: Refresh rule by service
      note: >
        Verifications older than the clinic's refresh window for
        that service are re-run before the date of care.
    - name: Authorization status on planned care
      note: >
        Every scheduled service with an authorization requirement
        shows its authorization status and an owner before the
        visit.
