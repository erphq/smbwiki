id: sprinkler-system-survey
name: Sprinkler system survey
kind: skill
department: operations
summary: >-
  Records water supply, existing riser and zones, occupancy hazards, ceiling
  and structure, obstructions, temperature exposure, and tie-in constraints.
  Sprinkler system survey leaves a current work basis, a field record, and
  acceptance evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - test-report
steps:
  - name: Confirm the work basis
    note: >-
      Before sprinkler system survey, read the current scope and revisions,
      then verify verified hazard and occupancy, approved hydraulic basis,
      coordinated drawings, listed material, fabrication release, access, and
      outage plan.
  - name: Set the field controls
    note: >-
      Translate sprinkler system survey into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During sprinkler system survey, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept sprinkler system survey, check the completed work against
      approved coverage, support and clearances, clean piping, hydrostatic
      result, alarm and supervisory operation, inspection, and owner records,
      then close correction and issue the resulting record.
tension: >-
  Sprinkler system survey has to remain inside its acceptance basis while
  production moves. A small coordination or obstruction error can leave a
  protected area outside the approved discharge pattern.
failure_modes:
  - name: Sprinkler system survey starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      sprinkler system survey is settled.
    signal: >-
      The sprinkler system survey work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Sprinkler system survey closes without evidence
    cost: >-
      A concealed condition or required result from sprinkler system survey
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Sprinkler system survey is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Sprinkler system survey is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Sprinkler system survey starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Sprinkler system survey uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Water-based fire protection systems
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of sprinkler system survey.
  - name: Evidence control
    note: >-
      Acceptance checks for sprinkler system survey have to be captured while
      the relevant condition can still be observed and corrected.
automation:
  now: >-
    Sprinkler system survey can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting sprinkler system survey
    remain human.
questions:
  - >-
    Which unresolved condition can stop sprinkler system survey before work
    begins?
  - >-
    Which record proves sprinkler system survey was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The sprinkler system survey process records what exists before a
    system is designed or modified, meaning the water supply, the
    existing riser and zones, the occupancy hazards, ceiling and
    structure, obstructions, temperature exposure, and the constraints
    on tying in to what is already there. It starts when a bid or a
    design needs field facts and ends when the survey record has been
    checked and issued to the designer and estimator. A fire sprinkler
    contractor owns it through a surveyor, often the designer or a
    senior fitter, working ahead of the detailing.
  why: >
    It protects the estimate and the design from what the drawings do
    not show. An existing riser with a seized valve, a zone that serves
    more than the drawings say, a freezer that puts a wet line at risk,
    a ceiling full of duct where the branch lines were supposed to run,
    or an occupancy that has changed since the last design each moves
    the price and the approach. Found on the survey they are line items;
    found after mobilization they are change orders, tie-in outages, and
    coverage arguments with the authority.
  how: >
    The surveyor reads the current scope and revisions, then confirms
    what is already known about the hazard and occupancy, the hydraulic
    basis, coordinated drawings, listed material, fabrication release,
    access, and the outage plan before the visit. The survey is set out
    as work limits by area, a route through the building,
    responsibilities, and the record form with the measurements, photos,
    and readings to capture. On site the surveyor records the water
    supply and riser, existing zones and valves, occupancy hazards by
    area, ceiling heights and structure, obstructions, temperature
    exposure, and tie-in constraints, and stops to flag anything that
    changes the intended approach. At acceptance the survey record is
    checked so it can support approved coverage, support and clearances,
    clean piping, the hydrostatic result, alarm and supervisory
    operation, inspection, and owner records, gaps are closed, and the
    record is issued.
  controls:
    - name: Riser and valve condition recorded with photos
      note: Every existing control valve, gauge, and riser component is photographed and its condition and position noted on the record.
    - name: Occupancy walked area by area
      note: The hazard for each area is recorded from what is actually stored or done there, with photos, and compared with the drawings.
    - name: Obstructions mapped to the ceiling plan
      note: Ducts, beams, lights, and equipment that affect head placement are located on the plan with their heights.
    - name: Tie-in constraints and outage needs listed
      note: Where the new work connects to existing systems, the shutdown, drain, and notification requirements are recorded.
    - name: Survey record checked against the scope
      note: The designer confirms the survey answers each item the design and estimate depend on before the record is issued.
