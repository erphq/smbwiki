catalog_group: construction-property
extends: project-services-base
revenue_model:
  - id: demolition-hauling-and-salvage
    note: demolition scope supplemented by hauling, disposal, recycling, salvage credit, hazardous-material coordination, and equipment charges
summary: >-
  A demolition contractor surveys, isolates, removes, sorts, hauls, and
  documents existing building or site work in a controlled sequence.
  Structural stability, hazardous materials, active utilities, occupied
  neighbors, dust, noise, access, salvage, and disposal rules have to be
  settled before removal accelerates.


  Existing drawings are incomplete evidence. The contractor opens work
  carefully, compares the actual assembly with the engineering survey, and
  stops when load paths or materials differ. Daily control tracks exclusion
  zones, remaining stability, debris routes, regulated waste, changed
  conditions, and the exact limits left ready for new construction.
