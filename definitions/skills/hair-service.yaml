id: hair-service
name: Hair service
kind: skill
department: operations
summary: >
  Hair service executes the agreed cut, color, texture, treatment, or
  styling plan at the chair. The stylist protects the client, controls
  product and timing, adapts to what the hair reveals, and records what
  was delivered for checkout and future service.
inputs: [appointment-record, formula-card]
outputs: [service-ticket]
steps:
  - name: Confirm plan and readiness
    role: stylist
    consumes: [appointment-record, formula-card]
    note: >
      Service, timing, protection, products, tools, and any assistant
      handoff are ready before the technical work starts.
  - name: Execute the technical sequence
    role: stylist
    note: >
      Sectioning, application, cutting, tension, heat, processing, and
      checks follow the agreed plan and current condition.
  - name: Control changes
    role: stylist
    note: >
      Unexpected lift, porosity, reaction, density, or timing is discussed
      when it changes result, scope, price, or future condition.
  - name: Finish and record
    role: stylist
    produces: [service-ticket]
    note: >
      Delivered services, products, formula changes, result, home care,
      and follow-up recommendation reach checkout together.
tension: >
  Chair utilization competes with careful execution and adaptation.
  Finishing inside the appointment protects the day; forcing a technical
  sequence to fit the clock can damage condition or lower the result.
failure_modes:
  - name: Assistant handoff loses the formula
    cost: >
      Product, section, saturation, timing, or rinse changes between the
      stylist's plan and delegated work.
    signal: >
      The assistant receives verbal direction with no visible formula or
      stage ownership.
  - name: Processing runs without an owner
    cost: >
      A client exceeds the intended development time while the stylist
      starts another service.
    signal: >
      Timers exist without a named person responsible for the check.
  - name: Delivered work differs from the ticket
    cost: >
      Checkout charges and the future profile reflect the booked service
      while the actual technical work goes unrecorded.
    signal: >
      Formula or service changes appear in conversation and disappear
      before checkout.
maturity:
  - level: run badly
    looks_like: >
      The appointment name drives the chair, formula changes stay in
      memory, and timing pressure becomes the client's problem.
  - level: run well
    looks_like: >
      Plan, delegated stages, timers, adaptations, delivered service, and
      home-care instruction are controlled and recorded.
  - level: run excellently
    looks_like: >
      Actual service time improves booking, repeat adjustments improve the
      formula, and chair handoffs preserve technical ownership.
competencies:
  - name: Technical execution
    note: >
      Hand control, sectioning, product placement, timing, heat, and
      finishing have to respond to the individual client's hair.
  - name: Live adaptation
    note: >
      The stylist recognizes when the hair is departing from the plan and
      changes the sequence without losing consent or record accuracy.
automation:
  now: >
    Formula display, product quantities, timers, service-stage tracking,
    assistant tasks, ticket updates, and photo comparison.
  human: >
    Cutting and chemical execution, tactile and visual assessment,
    aesthetic choices, client comfort, and technical adaptation.
questions:
  - Who owns every active timer and delegated technical stage?
  - Did the service ticket capture each change from the consultation plan?
article:
  what: >
    The hair service process is the work at the chair from the moment the
    client sits down to the moment the service ticket reaches checkout:
    confirming the plan from the appointment record and formula card,
    executing the cut, color, texture, treatment, or styling sequence,
    handling what the hair reveals along the way, and finishing with a
    record of what was actually delivered. It starts when the consultation
    plan is agreed and the station is ready and ends when the ticket,
    formula changes, home care, and next recommendation are complete. The
    stylist owns it in a hair salon, with assistants taking delegated
    stages under the stylist's direction.
  why: >
    Chemical services do not wait. A color left processing while the
    stylist starts the next client, a formula passed to an assistant by
    word of mouth, or a change made mid-service and forgotten by checkout
    costs the client's hair condition, the salon's revenue on the actual
    work, and the accuracy of the record the next stylist will trust. The
    process protects the client's scalp and hair, the salon's charge for
    what was delivered, and the formula card that makes the next visit
    repeatable.
  how: >
    The stylist confirms the plan and readiness: the service, timing,
    protection, products, tools, and any assistant handoff are ready
    against the appointment record and formula card before technical work
    begins. The stylist then executes the technical sequence, sectioning,
    application, cutting, tension, heat, processing, and checks, following
    the agreed plan and the hair's current condition, with every timer and
    delegated stage owned by a named person. When the hair reveals
    something unexpected, such as faster lift, uneven porosity, a
    reaction, or a timing problem, the stylist controls the change by
    discussing it with the client when it affects result, scope, price,
    or future condition, and records the decision. At the finish the
    stylist records delivered services, products used, formula changes,
    result, home care, and the follow-up recommendation on the service
    ticket so checkout and the client's profile reflect the work done.
  controls:
    - name: Formula visible at the chair
      note: The formula card is at the station and any delegated stage is written with product, section, saturation, and timing before the assistant starts.
    - name: Named owner for every timer
      note: Each processing timer carries the name of the person responsible for the check, and that person stays on the floor until it is done.
    - name: Client consent on scope or price change
      note: A change that alters result, scope, price, or future condition is agreed with the client and noted before it is applied.
    - name: Service ticket matches the work
      note: Delivered services and products on the ticket are checked against what was actually done before the ticket goes to checkout.
    - name: Formula card updated at finish
      note: Formula changes and the observed result are written to the card so the next appointment starts from the real history.
