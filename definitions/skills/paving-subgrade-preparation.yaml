id: paving-subgrade-preparation
name: Paving subgrade preparation
kind: skill
department: operations
summary: >-
  Removes unsuitable material, shapes drainage, conditions moisture, compacts
  the formation, proof-rolls weak areas, and records corrections. Paving
  subgrade preparation leaves a current work basis, a field record, and
  acceptance evidence that another operator can trace.
inputs:
  - site-plan
outputs:
  - test-report
steps:
  - name: Confirm the work basis
    note: >-
      Before paving subgrade preparation, read the current scope and
      revisions, then verify approved limits and drainage, removed failed
      material, stable subgrade, confirmed section, available mix, weather
      window, and traffic control.
  - name: Set the field controls
    note: >-
      Translate paving subgrade preparation into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During paving subgrade preparation, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept paving subgrade preparation, check the completed work against
      specified thickness, density, grade, smoothness, drainage, joint
      quality, edge support, markings, and opening strength, then close
      correction and issue the resulting record.
tension: >-
  Paving subgrade preparation has to remain inside its acceptance basis while
  production moves. Surface appearance can hide weak subgrade, thin base, poor
  compaction, or trapped drainage that shortens pavement life.
failure_modes:
  - name: Paving subgrade preparation starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for paving
      subgrade preparation is settled.
    signal: >-
      The paving subgrade preparation work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Paving subgrade preparation closes without evidence
    cost: >-
      A concealed condition or required result from paving subgrade
      preparation cannot be verified without opening, repeat work, delay, or a
      disputed exception.
    signal: >-
      Paving subgrade preparation is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Paving subgrade preparation is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Paving subgrade preparation starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Paving subgrade preparation uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Small-site pavement production
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of paving subgrade preparation.
  - name: Evidence control
    note: >-
      Acceptance checks for paving subgrade preparation have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Paving subgrade preparation can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting paving subgrade preparation
    remain human.
questions:
  - >-
    Which unresolved condition can stop paving subgrade preparation before
    work begins?
  - >-
    Which record proves paving subgrade preparation was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The paving subgrade preparation process is the earthwork that makes
    the ground ready to carry a driveway: removing unsuitable material,
    shaping the formation to drain, conditioning moisture, compacting to
    the specified density, proof-rolling to find soft areas, and
    recording every correction before base or asphalt is placed. It
    starts from the site plan and ends with a test report showing the
    formation meets grade, density, and drainage and that weak areas
    were repaired. The paving foreman owns it for a driveway paving
    contractor, with the excavator and roller operators executing.
  why: >
    It protects everything placed on top. A driveway fails from below: a
    soft spot left under the base becomes a depression, trapped water
    under the section heaves in frost, and a formation that does not
    drain keeps the base wet so the asphalt cracks along the wet line.
    None of this is visible once the surface is down, and the owner's
    complaint arrives a year later as a settlement or a pothole that has
    to be cut out to the subgrade to fix. The proof roll and the
    compaction record are the only evidence the contractor has that the
    ground was sound.
  how: >
    The foreman confirms the work basis: current scope and revisions,
    approved limits and drainage, removed failed material, a stable
    subgrade target, the confirmed section, available mix, the weather
    window, and traffic control. Field controls set the excavation
    limits, the drainage shape and fall, the moisture range for
    compaction, roller type and passes, where density is tested, and the
    proof-roll route and load. During the work the crew strips
    unsuitable material, shapes the formation, adjusts moisture,
    compacts in lifts, proof-rolls, and records each soft area found and
    how it was corrected, stopping when the ground differs from what the
    plan assumed. Acceptance checks thickness, density, grade,
    smoothness, drainage, joint quality, edge support, markings, and
    opening strength for the finished section, corrections are closed,
    and the test report is issued.
  controls:
    - name: Unsuitable material logged at removal
      note: Organic, saturated, or soft material found during stripping is recorded with location, depth, and the replacement material placed.
    - name: Drainage fall checked before compaction
      note: The shaped formation is checked for cross fall and outlet before rolling begins, and a low area is corrected before the roller moves.
    - name: Moisture within range at compaction
      note: Moisture is checked and adjusted before each lift is rolled, and the reading is on the record with the lift it belongs to.
    - name: Proof roll witnessed and recorded
      note: The loaded proof roll is watched by the foreman, every deflection is marked and corrected, and the second pass is recorded.
    - name: Density results before base placement
      note: Compaction tests at the specified locations pass before base material is ordered onto the formation, and the report is filed with the job.
