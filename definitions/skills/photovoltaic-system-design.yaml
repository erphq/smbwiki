id: photovoltaic-system-design
name: Photovoltaic system design
kind: skill
department: operations
summary: >-
  Selects array and inverter architecture, lays out modules, checks structural
  loading, sizes conductors and protection, and coordinates shutdown and
  labels. Photovoltaic system design leaves a current work basis, a field
  record, and acceptance evidence that another operator can trace.
inputs:
  - site-plan
outputs:
  - commissioning-record
steps:
  - name: Confirm the work basis
    note: >-
      Before photovoltaic system design, read the current scope and revisions,
      then verify verified roof or ground condition, energy use and shading
      data, approved electrical design, permit, utility route, equipment, and
      fall protection.
  - name: Set the field controls
    note: >-
      Translate photovoltaic system design into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During photovoltaic system design, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept photovoltaic system design, check the completed work against
      structural and electrical compliance, flashed attachments, labeled
      circuits, tested shutdown, documented production, inspection, and
      utility permission, then close correction and issue the resulting
      record.
tension: >-
  Photovoltaic system design has to remain inside its acceptance basis while
  production moves. Design, roof, electrical, permit, and utility decisions
  converge at installation, and one mismatch can delay permission to operate.
failure_modes:
  - name: Photovoltaic system design starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      photovoltaic system design is settled.
    signal: >-
      The photovoltaic system design work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Photovoltaic system design closes without evidence
    cost: >-
      A concealed condition or required result from photovoltaic system design
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Photovoltaic system design is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Photovoltaic system design is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Photovoltaic system design starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Photovoltaic system design uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Photovoltaic design and commissioning
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of photovoltaic system design.
  - name: Evidence control
    note: >-
      Acceptance checks for photovoltaic system design have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Photovoltaic system design can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting photovoltaic system design
    remain human.
questions:
  - >-
    Which unresolved condition can stop photovoltaic system design before work
    begins?
  - >-
    Which record proves photovoltaic system design was accepted before it was
    covered, loaded, energized, occupied, or handed over?
