id: waterproofing-contractor
name: Waterproofing Contractor
codes:
  naics: '238390'
catalog_group: construction-property
extends: project-services-base
summary: >-
  A waterproofing contractor diagnoses moisture paths and installs membranes,
  coatings, drainage layers, sealants, flashings, and protection at roofs,
  walls, decks, joints, or below-grade assemblies. The visible leak may be far
  from its source, so investigation precedes product selection and repair
  scope.


  Performance depends on substrate condition, compatible transitions,
  specified thickness, termination, drainage, cure, and protection from
  following work. Many details become inaccessible after backfill or finish.
  The contractor records concealed work and uses adhesion, spray, or flood
  testing where the assembly requires direct proof.
