id: customer-invoicing
name: Customer invoicing
kind: skill
department: finance
summary: >
  Customer invoicing turns a delivered load and its proof into a shipper
  bill that agrees with the sell rate, approved accessorials, customer
  references, document rules, portal route, and payment terms.
inputs: [proof-of-delivery]
outputs: [customer-invoice]
steps:
  - name: Validate delivery proof
    role: billing-specialist
    consumes: [proof-of-delivery]
    note: >
      Signature, date, location, count, condition, exception notation, and
      image quality meet the customer's billing requirement.
  - name: Reconcile charges
    role: billing-specialist
    note: >
      Line haul, fuel, stops, detention, layover, handling, and other
      accessorials trace to the accepted sell terms and approval evidence.
  - name: Apply customer routing
    role: billing-specialist
    note: >
      Purchase order, load reference, cost center, attachment, invoice
      format, portal, recipient, and terms follow the account setup.
  - name: Issue the invoice
    role: billing-specialist
    produces: [customer-invoice]
    note: >
      Submission and acceptance evidence start the aging clock from a bill
      the customer can process.
tension: >
  Billing speed competes with first-pass acceptance. Every day after
  delivery delays cash; an invoice missing proof, approval, reference, or
  routing restarts the customer's payable process.
failure_modes:
  - name: Clean proof assumed
    cost: >
      An exception noted at delivery reaches the customer as an ordinary
      invoice and claim or charge handling begins late.
    signal: >
      Proof is attached without reviewing handwritten or electronic
      exception fields.
  - name: Accessorial lacks approval
    cost: >
      The customer short-pays or rejects a charge the brokerage may already
      owe the carrier.
    signal: >
      Invoice includes an extra charge with no customer authorization or
      governing term.
  - name: Portal acceptance unconfirmed
    cost: >
      The brokerage marks the invoice sent while the customer's system
      never entered it into payable workflow.
    signal: >
      Submission has no receipt, status, or rejection queue.
maturity:
  - level: run badly
    looks_like: >
      Billing attaches the available delivery image and emails an invoice
      to the last known contact.
  - level: run well
    looks_like: >
      Proof, exceptions, rates, approvals, references, portal, recipient,
      terms, submission, and acceptance are checked together.
  - level: run excellently
    looks_like: >
      Customer rejection causes improve account setup and execution, and
      every delivered load becomes billable through a visible exception queue.
competencies:
  - name: Freight-charge reconciliation
    note: >
      The biller connects sell terms, delivery events, approvals, and
      documents without blending carrier cost into customer entitlement.
  - name: Customer payable fluency
    note: >
      Each shipper's references, attachments, portal, recipient, and
      acceptance states determine when an invoice truly enters the queue.
automation:
  now: >
    Proof-quality checks, rate import, accessorial matching, reference
    validation, invoice creation, portal routing, and rejection queues.
  human: >
    Delivery exceptions, disputed accessorials, unclear approvals,
    customer-specific requirements, and short-pay resolution.
questions:
  - Which delivered load still lacks one item required for customer acceptance?
  - What accessorial on the current invoice cannot be traced to approval?
article:
  what: >
    The customer invoicing process turns a delivered load and its proof
    of delivery into a bill the shipper can process on first pass: the
    charges agree with the sell rate and approved accessorials, the
    references and attachments follow the account setup, and submission
    goes through the route the customer requires. It starts when the
    proof of delivery arrives and ends when the invoice is accepted into
    the customer's payable workflow and aging begins. A freight
    brokerage, a general freight trucking company, or a courier company
    runs it through a billing specialist.
  why: >
    It protects cash timing and the customer relationship. Every day
    between delivery and an accepted invoice delays payment; an invoice
    missing the proof, an approval, a reference, or the right portal
    restarts the customer's payable process. An exception noted on the
    delivery receipt and sent through as a clean invoice means the claim
    begins late and the charge is disputed later. An accessorial with no
    approval evidence is short-paid while the carrier still has to be
    paid for it.
  how: >
    The billing specialist validates the proof of delivery first:
    signature, date, location, count, condition, exception notation, and
    image quality must meet the customer's billing requirement. Charges
    are reconciled next, with line haul, fuel, stops, detention,
    layover, handling, and other accessorials traced to the accepted
    sell terms and their approval evidence. Customer routing is applied
    from the account setup: purchase order, load reference, cost center,
    attachments, invoice format, portal, recipient, and terms. The
    customer invoice is issued, and the submission and acceptance
    evidence are kept so the aging clock starts from a bill the
    customer's system has entered.
  controls:
    - name: Exception fields read on every proof
      note: >
        Handwritten and electronic exception notations are reviewed
        before the proof is attached, and any exception opens claim
        handling.
    - name: Accessorial approval on file
      note: >
        Each accessorial charge links to the governing term or the
        customer's written authorization before it appears on the
        invoice.
    - name: Account routing checklist
      note: >
        References, attachments, format, portal, and recipient are
        checked against the customer's account setup before
        submission.
    - name: Submission acceptance confirmed
      note: >
        The invoice is marked sent only when a receipt, portal
        status, or acknowledgement is stored, with rejections in a
        worked queue.
    - name: Unbilled delivered loads reviewed
      note: >
        Delivered loads without an issued invoice are listed on a
        fixed cadence with the missing item named for each.
