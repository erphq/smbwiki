catalog_group: construction-property
extends: project-services-base
revenue_model:
  - id: garage-door-product-service-and-parts
    note: door and operator margin plus installation, safety testing, remotes and access devices, repair, parts, and maintenance
summary: >-
  A garage door contractor surveys openings, installs sectional or overhead
  doors, fits tracks and hardware, balances springs and cables, adds operators
  and controls, and services failed systems. Opening geometry, structure,
  headroom, vehicle clearance, power, access, and selected door weight
  determine the equipment and method.


  Stored spring energy and a heavy moving door make setup and testing central
  to the job. A powered cycle does not prove balance, attachment, force, or
  entrapment protection. The technician verifies manual operation, travel
  limits, reversal devices, release, seals, controls, and owner instruction
  before handover.
