id: grout-and-seal
name: Grout and seal
kind: skill
department: operations
summary: >-
  Prepares joints, mixes and places grout, shapes and cleans the surface,
  installs movement sealant, cures, and applies sealer where specified. Grout
  and seal leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - quality-report
steps:
  - name: Confirm the work basis
    note: >-
      Before grout and seal, read the current scope and revisions, then verify
      stable and flat substrate, cured work, approved tile and setting system,
      resolved movement joints, dry layout, and environmental control.
  - name: Set the field controls
    note: >-
      Translate grout and seal into work limits, sequence, responsibilities,
      hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During grout and seal, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept grout and seal, check the completed work against bond
      coverage, plane, joint alignment, movement accommodation, drainage,
      lippage, grout, sealant, and approved appearance, then close correction
      and issue the resulting record.
tension: >-
  Grout and seal has to remain inside its acceptance basis while production
  moves. A visually acceptable surface can conceal poor bond, trapped water,
  or missing movement capacity.
failure_modes:
  - name: Grout and seal starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for grout
      and seal is settled.
    signal: >-
      The grout and seal work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Grout and seal closes without evidence
    cost: >-
      A concealed condition or required result from grout and seal cannot be
      verified without opening, repeat work, delay, or a disputed exception.
    signal: >-
      Grout and seal is released while its required check, location record,
      test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Grout and seal is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Grout and seal starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Grout and seal uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Tile assembly layout and bond control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of grout and seal.
  - name: Evidence control
    note: >-
      Acceptance checks for grout and seal have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Grout and seal can use digital revisions, checklists, hold points, photo
    capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting grout and seal remain human.
questions:
  - Which unresolved condition can stop grout and seal before work begins?
  - >-
    Which record proves grout and seal was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The grout and seal process finishes a tile installation: joints are
    cleaned and prepared, grout is mixed and placed, the surface is shaped
    and cleaned, movement joints receive sealant, the grout cures, and a
    sealer goes on where the specification calls for it. It starts when
    the set tile is cured and the substrate, tile, and setting system are
    accepted, and it ends when bond, plane, joint alignment, movement
    accommodation, drainage, grout, sealant, and appearance are checked
    and the quality report is issued. The tile foreman owns it for a tile
    contractor.
  why: >
    Grout and sealant are what the owner sees and what keeps water out of
    the assembly. A joint grouted before the setting material has cured, a
    movement joint filled with grout instead of sealant, or a shower floor
    sealed over trapped water looks fine on the day and cracks, stains, or
    leaks within the year, and the repair means cutting out finished work.
    The process protects the water management the assembly was designed
    for, the appearance the client approved, and the contractor's
    warranty.
  how: >
    The foreman reads the current scope and revisions and confirms the
    substrate is stable and flat, setting work is cured, the tile and
    setting system are the approved ones, movement joints are resolved,
    layout is dry, and temperature and humidity are controlled before
    grout is mixed. The field controls are then set: grout type and mix
    per area, the order of grouting, cleaning, sealant, cure, and sealer,
    hold points for joint preparation before grout and for cure before
    sealer, and the record the crew keeps. During the work the crew
    records grout batches, areas completed, movement joint locations and
    sealant used, cure times, and any condition such as a soft setting bed
    or an unplanned movement joint that changed the method. At acceptance
    the foreman checks bond coverage, plane, joint alignment, movement
    accommodation, drainage, lippage, grout, sealant, and appearance
    against the approved sample, closes correction, and issues the quality
    report.
  controls:
    - name: Cure check before grouting
      note: Setting material cure time is confirmed and recorded before the joints in that area are grouted.
    - name: Movement joints mapped and sealed
      note: Every movement joint location is marked on the layout and receives sealant, and a grouted movement joint is a correction.
    - name: Grout batch and area log
      note: Each batch's product, mix, and the area it covers are logged so a color or hardness difference can be traced.
    - name: Drainage test on wet areas
      note: Shower floors and wet areas are flood tested or checked for drainage before sealer goes on.
    - name: Appearance check against approved sample
      note: The finished surface is compared with the approved grout and tile sample in daylight before the quality report is issued.
