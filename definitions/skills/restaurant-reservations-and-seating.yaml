id: restaurant-reservations-and-seating
name: Restaurant reservations and seating
kind: skill
department: operations
summary: >
  Restaurant reservations and seating turns bookings and walk-ins into
  an honest wait and table plan. Party needs, table capacity, arrival
  state, dining duration, server load, and reset readiness remain
  visible while the room changes.
inputs: [restaurant-reservation]
outputs: [table-status]
steps:
  - name: Maintain the reservation book
    role: host
    consumes: [restaurant-reservation]
    note: >
      Date, time, party size, contact, table needs, deposits or policy,
      notes, changes, cancellation, and confirmation remain current.
  - name: Read the room
    role: host
    note: >
      Occupied, reserved, resetting, blocked, and available tables are
      considered with server sections and the active kitchen load.
  - name: Quote and sequence arrivals
    role: host
    note: >
      Reservations and walk-ins receive a realistic wait and a durable
      place in the arrival order without promising the same capacity twice.
  - name: Seat and hand off
    role: host
    produces: [table-status]
    note: >
      Party, table, server, seating time, needs, and current service
      state are visible to the floor team.
  - name: Release the table
    role: host
    consumes: [table-status]
    note: >
      Payment, departure, clearing, reset, and readiness update the
      table before it is offered again.
tension: >
  Maximizing occupied seats competes with keeping arrival promises and
  service flow. Seating every open table can overload a server or the
  kitchen and turn apparent capacity into a longer guest wait.
failure_modes:
  - name: Reservation and walk-in queues diverge
    cost: >
      Staff promise the same future table twice and resolve the conflict
      in front of arriving guests.
    signal: >
      Wait estimates do not change when reservations arrive early or late.
  - name: Table availability ignores reset state
    cost: >
      A party is called before the table is clean, complete, and ready.
    signal: >
      Seated status follows departure before reset is confirmed.
  - name: Seating ignores downstream load
    cost: >
      Several parties enter the same server or kitchen queue together,
      delaying greetings, drinks, and courses.
    signal: >
      Open tables are filled while one section or production station is
      already behind.
maturity:
  - level: run badly
    looks_like: >
      Reservations, quoted waits, and table state live on separate lists
      and staff walk the room to learn what is available.
  - level: run well
    looks_like: >
      Booking, arrival, wait, table, server, stage, departure, and reset
      share one current room view.
  - level: run excellently
    looks_like: >
      Arrival and turn evidence improves booking intervals, section
      design, staffing, wait quotes, and pacing decisions.
competencies:
  - name: Live capacity judgment
    note: >
      The host reads physical tables together with party needs, service
      stages, server capacity, and kitchen load.
  - name: Promise communication
    note: >
      Wait and reservation commitments must stay honest as actual
      arrivals and dining durations change.
automation:
  now: >
    Booking, confirmations, waitlist, table map, quoted waits, seating,
    server rotation, status updates, and no-show reporting.
  human: >
    Party needs, pacing, exceptions, accessibility, guest communication,
    and recovery when promised and actual capacity differ.
questions:
  - Which arriving party is promised against a table that is not yet truly available?
  - Where is seating pace exceeding the floor or kitchen's current capacity?
article:
  what: >
    The restaurant reservations and seating process is the host's control
    of who sits where and when. It begins when a booking is taken or a
    walk-in arrives and ends when the party has been seated, handed to a
    server, and the table has been released back to available after
    departure and reset. In a full-service restaurant it is owned by the
    host, with the manager on duty adjusting pacing and resolving
    conflicts when promised and actual capacity differ.
  why: >
    A restaurant's capacity is a moving target, and a promise made
    against it in error is broken in front of the guest. When the
    reservation book and the walk-in list drift apart, the same table is
    promised twice. When availability ignores reset state, a party is
    called to a table that is still dirty. When seating ignores server
    and kitchen load, several parties enter the same queue together and
    everyone waits longer for a greeting, a drink, and a course. The
    process keeps the room, the queue, and the kitchen visible together
    so every quoted wait is one the floor can meet.
  how: >
    The host maintains the reservation book so date, time, party size,
    contact, table needs, deposit or policy, notes, changes,
    cancellations, and confirmations stay current. Before each seating
    decision the host reads the room, weighing occupied, reserved,
    resetting, blocked, and available tables together with server
    sections and the kitchen's current load. Reservations and walk-ins
    are quoted a realistic wait and given a durable place in the arrival
    order without promising the same capacity twice. When a party is
    seated the host records party, table, server, seating time, needs,
    and service state on the table status so the floor team sees it.
    After payment and departure the host releases the table only after
    clearing, reset, and readiness are confirmed on the table status.
  controls:
    - name: One arrival list for reservations and walk-ins
      note: Both queues are merged in the order they will be seated, so early and late reservations change walk-in quotes immediately.
    - name: Table set to available only after reset
      note: A departed table stays in resetting until a busser or the host confirms it is clean, complete, and ready.
    - name: Server section load checked before seating
      note: The host checks how many tables in a section were seated in the last interval before adding another party to it.
    - name: Reservation confirmations and no-shows recorded
      note: Each booking carries its confirmation status and outcome so booking intervals and deposit policy rest on evidence.
    - name: Quoted wait logged against actual seat time
      note: The quote given and the time the party was seated are both recorded, so the host can see when quotes drift from reality.
