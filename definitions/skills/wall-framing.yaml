id: wall-framing
name: Wall framing
kind: skill
department: operations
summary: >-
  Builds and sets walls with correct plate, stud, header, opening, shear,
  anchor, bracing, plumbness, and trade access. Wall framing leaves a current
  work basis, a field record, and acceptance evidence that another operator
  can trace.
inputs:
  - construction-plan
outputs:
  - quality-report
steps:
  - name: Confirm the work basis
    note: >-
      Before wall framing, read the current scope and revisions, then verify
      current dimensions, control lines, lumber or component package,
      connectors, openings, bearing points, and correction of supporting work.
  - name: Set the field controls
    note: >-
      Translate wall framing into work limits, sequence, responsibilities,
      hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During wall framing, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept wall framing, check the completed work against specified
      layout, bearing, fastening, bracing, openings, plane, and inspection
      readiness, then close correction and issue the resulting record.
tension: >-
  Wall framing has to remain inside its acceptance basis while production
  moves. Small layout errors repeat through floors, walls, roofs, windows,
  cabinets, and finishes.
failure_modes:
  - name: Wall framing starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for wall
      framing is settled.
    signal: >-
      The wall framing work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Wall framing closes without evidence
    cost: >-
      A concealed condition or required result from wall framing cannot be
      verified without opening, repeat work, delay, or a disputed exception.
    signal: >-
      Wall framing is released while its required check, location record, test
      result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Wall framing is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Wall framing starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Wall framing uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Wood framing layout and load-path judgment
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of wall framing.
  - name: Evidence control
    note: >-
      Acceptance checks for wall framing have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Wall framing can use digital revisions, checklists, hold points, photo
    capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting wall framing remain human.
questions:
  - Which unresolved condition can stop wall framing before work begins?
  - >-
    Which record proves wall framing was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The wall framing process is the framing contractor's work of building and
    standing the walls of a structure: plates are laid out from control lines,
    studs, headers, and openings are cut and assembled to the plan, shear
    walls are sheathed and nailed to the schedule, walls are anchored, braced,
    and plumbed, and the openings and blocking that other trades need are left
    in place. It starts when the floor or slab is accepted and the lumber
    package and connectors are on site and ends with a quality report that
    records the walls accepted for the next floor, roof, or inspection. The
    framing foreman owns it and the lead carpenter owns layout.
  why: >
    A layout error in the first wall repeats through every floor, roof,
    window, cabinet, and finish that follows it, and it costs the least to fix
    when it is still a pencil line on a plate. A missing header, an undersized
    bearing point, a shear wall nailed off the schedule, or a hold-down
    installed off its bolt is structural and hidden once sheathing and drywall
    go on. Walls out of plumb produce doors that swing, cabinets that gap, and
    tile that will not run true. The inspection depends on the framer being
    able to show what is inside the wall.
  how: >
    The foreman confirms the work basis by reading the current scope and
    revisions and verifying current dimensions, control lines, the lumber or
    component package, connectors, openings, bearing points, and that
    supporting work has been corrected. Field controls follow: plate layout
    checked against the plan, header and shear schedules posted, the wall
    build and stand sequence, bracing and anchor rules, who checks plumb and
    line, the hold points before sheathing and before the next level loads the
    walls, and the records to keep. During framing the operator records walls
    built, connectors and hold-downs installed, shear nailing, changes made
    for field conditions, and photographs concealed details, and stops when a
    dimension, a bearing point, or a component differs from the plan.
    Acceptance checks specified layout, bearing, fastening, bracing, openings,
    plane, and inspection readiness, corrections are closed, and the quality
    report is issued.
  controls:
    - name: Plate layout checked before cutting
      note: The lead carpenter's plate layout is checked against the plan dimensions and control lines by a second person before studs are cut.
    - name: Header and shear schedules posted on site
      note: The header sizes, shear wall nailing, and hold-down schedule are posted where the crew works and each shear wall is signed off against it.
    - name: Plumb and line recorded per wall
      note: Plumb, line, and diagonal checks are recorded for each wall after bracing and before the next level or roof loads it.
    - name: Concealed connectors photographed
      note: Hold-downs, straps, and anchor bolts are photographed in place with location before sheathing or drywall covers them.
    - name: Inspection readiness confirmed on the report
      note: The quality report lists the walls, corrections closed, and the concealed evidence available before the framing inspection is requested.
