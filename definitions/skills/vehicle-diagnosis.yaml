id: vehicle-diagnosis
name: Vehicle diagnosis
kind: skill
department: operations
summary: >
  Vehicle diagnosis converts a recorded concern into supported findings.
  The technician reproduces the condition where possible, tests the
  relevant system, separates causes from symptoms, and leaves evidence
  another technician or advisor can review.
inputs: [repair-order]
outputs: [inspection-report]
steps:
  - name: Read and reproduce
    role: automotive-technician
    consumes: [repair-order]
    note: >
      A test under the reported conditions comes before parts are
      removed or codes are cleared.
  - name: Establish the baseline
    role: automotive-technician
    note: >
      Relevant measurements, fault codes, fluid condition, and visible
      evidence are captured in their original state.
  - name: Isolate the cause
    role: automotive-technician
    note: >
      Testing narrows the failure until measured evidence supports the
      proposed repair.
  - name: Record findings
    role: automotive-technician
    produces: [inspection-report]
    note: >
      Confirmed faults, related risks, and tests that passed remain
      distinguishable in the report.
tension: >
  Diagnostic depth competes with time and customer appetite for testing
  cost. Stopping early risks selling the wrong repair; continuing
  without a decision point can consume bay time the customer never
  intended to buy.
failure_modes:
  - name: Code treated as cause
    cost: >
      A component is replaced while the wiring, leak, operating
      condition, or upstream fault remains.
    signal: >
      The finding repeats a fault-code description without a confirming
      test.
  - name: Symptom cannot be reproduced
    cost: >
      The shop either returns an unresolved vehicle or spends open-ended
      time searching under the wrong conditions.
    signal: >
      The inspection report lacks the temperature, speed, load, or timing
      described at intake.
  - name: Evidence lost during testing
    cost: >
      Clearing codes or changing the vehicle removes the baseline needed
      to justify the finding.
    signal: >
      Pre-test readings and freeze-frame or condition notes are absent.
maturity:
  - level: run badly
    looks_like: >
      The first plausible part is quoted from the symptom or fault code
      and failed repairs return as new work.
  - level: run well
    looks_like: >
      Each recommended repair has a reproduced concern, a test result,
      and a finding written for review.
  - level: run excellently
    looks_like: >
      Diagnostic paths are repeatable, uncertain findings are labeled,
      and later quality checks can rerun the same condition.
competencies:
  - name: Systems reasoning
    note: >
      The technician traces how power, control, pressure, heat, motion,
      and communication interact before naming a failed component.
  - name: Evidence discipline
    note: >
      Measurements and conditions must survive translation from the bay
      to the estimate and later customer explanation.
automation:
  now: >
    Scan data capture, service-information lookup, test-plan prompts,
    measurement storage, and pattern comparison against prior repairs.
  human: >
    Choosing the next discriminating test, judging intermittent evidence,
    and taking responsibility for the causal finding.
questions:
  - What test result supports each part or operation being recommended?
  - Can quality control reproduce the original concern from this report?
article:
  what: >
    The vehicle diagnosis process is the technician's work between the repair
    order and the estimate in an auto repair shop: the recorded concern is
    reproduced under the conditions the driver described, the baseline
    readings and fault codes are captured before anything is disturbed,
    testing narrows the failure until the evidence supports a repair, and the
    findings are written in an inspection report an advisor or another
    technician can review. It starts when a repair order with a concern line
    is assigned to a bay and ends when the inspection report supports a
    recommended repair or records why the concern could not be reproduced. The
    technician owns the finding and the shop foreman reviews it.
  why: >
    Diagnosis is where a shop earns or loses its reputation. A part replaced
    because a fault code named it, while the wiring, the leak, or the upstream
    cause remains, brings the car back with the same complaint and a customer
    who paid twice. Codes cleared before they were read, or a baseline never
    captured, remove the evidence needed to justify the repair to the
    customer. Open-ended testing consumes bay time the customer never agreed
    to buy, so the process needs a decision point where the advisor goes back
    to the customer with what is known.
  how: >
    The technician reads the concern line on the repair order and reproduces
    the condition under the temperature, speed, load, and timing recorded at
    intake, before any part is removed or any code is cleared. The baseline is
    then established: fault codes, freeze-frame data, relevant measurements,
    fluid condition, and visible evidence are captured in their original
    state. The technician isolates the cause by choosing tests that
    discriminate between the remaining possibilities, and stops at the agreed
    diagnostic time to have the advisor confirm further testing with the
    customer. Findings are recorded on the inspection report with the
    confirmed faults, related risks, and the tests that passed kept
    distinguishable, so the advisor can build the estimate and quality control
    can rerun the same condition.
  controls:
    - name: Reproduction attempted before disassembly
      note: The report records the conditions under which the concern was reproduced, or the attempts made, before any component is removed.
    - name: Baseline captured before clearing codes
      note: Fault codes, freeze-frame data, and measurements are stored on the report in their original state before any code is cleared or any test performed.
    - name: Test result behind every recommendation
      note: Each recommended part or operation on the inspection report cites the measurement or test that supports it, and a code description alone is sent back.
    - name: Diagnostic time checkpoint
      note: When the authorized diagnostic time is reached, the technician stops and the advisor records the customer's decision on further testing on the repair order.
    - name: Foreman review of uncertain findings
      note: Findings labeled as uncertain or intermittent are reviewed by the foreman before the estimate is presented to the customer.
