article:
  operating_model: >
    A waterproofing contractor sells proof that water stays out, mostly
    at details that will be buried or covered. The week runs from
    moisture path diagnosis on leak calls, through surface preparation,
    membrane and coating installation, joint sealant, and flashings, to
    flood or adhesion testing before backfill or finish. Moisture path
    diagnosis and waterproofing surface preparation are the load-bearing
    skills, because the visible leak is often far from its source and a
    membrane on a poorly prepared substrate fails regardless of product.
    The tension is with following trades: cure time, protection, and
    inspection windows have to be held while a general contractor wants
    to backfill or close the wall.
  starting: >
    A waterproofing business starts with product training and testing
    equipment as much as with a truck. Day-one paperwork is the business
    registration, employer registration for the first installer, a
    contractor or specialty license in most states, general liability
    coverage that covers completed operations because claims arrive
    after backfill, and manufacturer approvals where warranted systems
    require an approved installer. Accounts with a waterproofing
    material distributor and a drainage product supplier need to exist
    before the first quote. The minimum roles are an owner-operator, a
    trade foreperson, and installers, with an estimator and an office
    manager as leak investigation and warranty calls add to project
    work. The first records are the inspection report from the
    diagnosis, the test report from flood or adhesion tests, the quote
    and work order, and job photos of every detail before it is
    concealed. Moisture path diagnosis, surface preparation, and flood
    testing must be reliable from the first job.
  economics: >
    Revenue is quoted projects plus installed waterproofing area with
    surface repair, detailing, protection, testing, maintenance, leak
    investigation, and warranty work. Pricing is by area and detail
    count against an estimate of preparation and cure days, so gross
    margin is decided by substrate condition discovered on site, product
    coverage rates, and how many mobilizations a job takes while waiting
    on cure and inspection. Project gross margin and rework rate decide
    profit, because a failed flood test means stripping and reapplying
    on the same substrate at the contractor's cost, and warranty
    callbacks arrive years after the invoice was paid. Schedule variance
    and on-time completion matter because the contractor sits between
    excavation and backfill on the critical path. Labor and product are
    the main costs with modest capital, so diagnosis accuracy and
    preparation discipline are the margin levers.
