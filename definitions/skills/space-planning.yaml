id: space-planning
name: Space planning
kind: skill
department: operations
summary: >-
  Tests circulation, accessibility, egress, furniture, clearances, privacy,
  daylight, building systems, and future change within the measured shell.
  Space planning leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - client-brief
outputs:
  - finish-schedule
steps:
  - name: Confirm the work basis
    note: >-
      Before space planning, read the current scope and revisions, then verify
      approved program, measured existing conditions, consultant criteria,
      budget, schedule, code basis, and client decision structure.
  - name: Set the field controls
    note: >-
      Translate space planning into work limits, sequence, responsibilities,
      hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During space planning, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept space planning, check the completed work against coordinated
      safe spaces, approved selections, complete documents, released
      procurement, installed intent, and resolved deficiencies, then close
      correction and issue the resulting record.
tension: >-
  Space planning has to remain inside its acceptance basis while production
  moves. A late spatial or finish decision can affect building systems, price,
  lead time, and installed work at once.
failure_modes:
  - name: Space planning starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for space
      planning is settled.
    signal: >-
      The space planning work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Space planning closes without evidence
    cost: >-
      A concealed condition or required result from space planning cannot be
      verified without opening, repeat work, delay, or a disputed exception.
    signal: >-
      Space planning is released while its required check, location record,
      test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Space planning is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Space planning starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Space planning uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Interior space and material coordination
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of space planning.
  - name: Evidence control
    note: >-
      Acceptance checks for space planning have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Space planning can use digital revisions, checklists, hold points, photo
    capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting space planning remain human.
questions:
  - Which unresolved condition can stop space planning before work begins?
  - >-
    Which record proves space planning was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The space planning process tests how a program of rooms and
    functions fits inside a measured shell, working through circulation,
    accessibility, egress, furniture, clearances, privacy, daylight,
    building systems, and the changes the client expects to make later.
    It starts with an approved program and measured existing conditions
    from the client brief and ends when a plan has been accepted and the
    selections it drives have been released into a finish schedule. An
    interior design firm owns it, usually through the project designer
    under a principal who holds the client relationship.
  why: >
    It protects the client from a plan that works on paper and fails in
    occupancy, and it protects the firm from redesign after procurement.
    A corridor that meets code on the drawing but loses clearance once
    the casework arrives, a workstation layout that puts the quiet team
    under the mechanical unit, or an egress path that a later partition
    closes each surfaces after the furniture is ordered, when fixing it
    costs lead time, price, and installed work at the same time.
  how: >
    The designer reads the current scope and revisions, then confirms
    the approved program, the measured existing conditions, the
    consultants' criteria, the budget, the schedule, the code basis, and
    how the client makes decisions before planning starts. The work is
    set out as a sequence with the options to test, the reviews with
    consultants and the client, hold points where the plan is frozen
    before selections proceed, and the drawing and decision record the
    team uses. During planning the designer tests circulation,
    accessibility, egress, furniture, clearances, privacy, daylight, and
    systems against the measured shell, records the decisions and the
    reasons behind them, and stops when a field measurement or a
    consultant's requirement changes the approach. At acceptance the
    designer checks the plan against coordinated safe spaces, approved
    selections, complete documents, released procurement, installed
    intent, and resolved deficiencies, closes any open item, and issues
    the finish schedule.
  controls:
    - name: Plan tested against measured conditions
      note: Every option is drawn on the field-verified shell, and a discrepancy between survey and drawing stops the option until it is resolved.
    - name: Code and accessibility check recorded per option
      note: Egress widths, door clearances, and accessible routes are checked and noted on each plan option before it goes to the client.
    - name: Consultant coordination before freeze
      note: Mechanical, electrical, and structural criteria are confirmed against the plan and logged before the plan is frozen.
    - name: Client decision log
      note: Each client decision on the plan is recorded with the date and the option chosen, so a later change is priced as a change.
    - name: Finish schedule released from the frozen plan
      note: Selections are released for procurement only against the accepted plan revision, and the schedule cites that revision.
