id: outpatient-surgery-center
name: Outpatient Surgery Center
codes:
  naics: "621493"
catalog_group: health-care
extends: clinic-base
summary: >
  An outpatient surgery center coordinates a scheduled procedure across
  patient selection, surgeon, anesthesia, consent, preoperative testing,
  equipment, implants, sterile supply, room time, recovery, escort, and
  transfer capability. Readiness must be cleared before the procedure
  uses scarce room and clinical capacity.

  The case record follows identity, site, procedure, medications,
  counts, devices, specimens, findings, recovery criteria, discharge,
  and follow-up. Infection prevention, emergency response, medication
  custody, equipment maintenance, and sterilization records support
  each day beyond the individual chart.
revenue_model:
  - id: facility-procedure-fees
    note: surgical facility resources billed for eligible outpatient cases
  - id: supplies-and-implants
    note: allowed procedure-specific materials and devices
  - remove: [patient-services, preventive-care]
skills:
  - ref: instrument-sterilization
    roles: [clinical-assistant]
    documents: [instrument-log, sterilization-log]
    metrics: [cycle-failure-rate]
    software: [practice-management]
licenses:
  us:
    - ref: ambulatory-surgery-center-certification
      requirement: required
      condition: Required for the modeled facility under applicable facility approval and coverage rules.
      as_of: "2026-07-29"
    - ref: physician-license
      requirement: required
      condition: Required for physicians performing regulated medical and surgical care.
      as_of: "2026-07-29"
supply_chain:
  buys_from: [surgical-supply-distributor]
  sells_to: [patient, payer]
article:
  operating_model: >
    An outpatient surgery center sells room time and the clinical team
    around it, so the week is a block schedule of cases against
    operating rooms, surgeons, anesthesia, and recovery bays. The
    receptionist and clinical assistant clear readiness before the day:
    identity, consent, preoperative testing, coverage, escort, and
    implant or supply availability. The clinicians run the case, the
    clinical assistant sterilizes and logs instruments between cases,
    and the billing specialist files the facility fee and the supply and
    implant claim. Clinical care, instrument sterilization, and coverage
    verification are load-bearing. The tension is that a case cancelled
    on the day for a missing clearance, a failed sterilization cycle, or
    an unauthorized coverage still consumed the block, the staff, and
    the supplies opened for it.
  starting: >
    Day one requires the ambulatory surgery center certification for the
    facility, which in most states means a state license, a facility
    inspection, and, where the center wants to bill federal programs,
    certification and usually accreditation by a recognized body; some
    states also require a certificate of need before construction. Every
    operating physician needs the physician license and privileges
    granted by the center. The general layer is entity registration,
    employer registration, a controlled substance registration for the
    medication supply, medical waste handling, and payer credentialing
    for the facility itself, which takes months. The build-out
    (operating rooms, sterile processing, recovery, medical gases,
    backup power) is the capital decision and usually the reason these
    centers are physician-owned or joint ventures. The minimum roles are
    the clinicians, a clinical assistant for sterile processing, a
    receptionist, a billing specialist, and an office manager. The first
    records are the appointment record and patient registration, the
    insurance verification, the patient chart with consent, the clinical
    note, the instrument log, and the sterilization log. Patient intake,
    clinical care, instrument sterilization, and claims billing must all
    work on the first case.
  economics: >
    Revenue is facility procedure fees for eligible outpatient cases and
    supplies and implants billed for the materials the case allows, with
    the surgeon's professional fee billed separately by the surgeon. The
    price basis is a facility fee per case set by payer contracts and
    federal fee schedules, so the center's lever is case mix and room
    utilization, since staffing, rent, and equipment cost about the same
    whether the room is used or empty. Gross margin per case is the fee
    less the supplies, implants, and clinical labor consumed;
    implant-heavy cases can carry large revenue and thin margin if the
    implant is reimbursed at cost. The metrics that decide profit are
    the appointment no-show rate as a measure of cancelled block time,
    the cycle failure rate in sterilization, because a failed cycle
    delays or cancels cases, the clean claim rate and days sales
    outstanding on high-value facility claims, and the recall
    reappointment rate for follow-up. The center is capital-heavy and
    labor-heavy; margins come from filling blocks with cases whose fee
    comfortably exceeds their supply cost.
