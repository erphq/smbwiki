id: drywall-hanging
name: Drywall hanging
kind: skill
department: operations
summary: >-
  Cuts, fits, lifts, and fastens the specified board without damaged face,
  unsupported edges, proud fasteners, or forced joints. Drywall hanging leaves
  a current work basis, a field record, and acceptance evidence that another
  operator can trace.
inputs:
  - construction-plan
outputs:
  - punch-list
steps:
  - name: Confirm the work basis
    note: >-
      Before drywall hanging, read the current scope and revisions, then
      verify dry and enclosed space, accepted framing and rough work, board
      type and thickness, backing, control joints, access panels, and finish
      level.
  - name: Set the field controls
    note: >-
      Translate drywall hanging into work limits, sequence, responsibilities,
      hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During drywall hanging, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept drywall hanging, check the completed work against board
      orientation, fastening, joints, corners, finish level, surface
      tolerance, texture, protection, and punch closure, then close correction
      and issue the resulting record.
tension: >-
  Drywall hanging has to remain inside its acceptance basis while production
  moves. Defects hidden during hanging or finishing reappear under paint and
  finished lighting when correction is most disruptive.
failure_modes:
  - name: Drywall hanging starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      drywall hanging is settled.
    signal: >-
      The drywall hanging work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Drywall hanging closes without evidence
    cost: >-
      A concealed condition or required result from drywall hanging cannot be
      verified without opening, repeat work, delay, or a disputed exception.
    signal: >-
      Drywall hanging is released while its required check, location record,
      test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Drywall hanging is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Drywall hanging starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Drywall hanging uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Gypsum board finishing sequence
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of drywall hanging.
  - name: Evidence control
    note: >-
      Acceptance checks for drywall hanging have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Drywall hanging can use digital revisions, checklists, hold points, photo
    capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting drywall hanging remain
    human.
questions:
  - Which unresolved condition can stop drywall hanging before work begins?
  - >-
    Which record proves drywall hanging was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The drywall hanging process covers a room from the moment framing is
    accepted and the space is dry to the moment every board is fastened,
    edges are supported, and the surface is ready for taping. The crew cuts,
    fits, lifts, and screws the specified board without damaging the face,
    forcing joints, or leaving fasteners proud, and hands the room over with
    a field record and a punch list of what still needs correction. A
    drywall contractor's crew lead owns it under the foreman or project
    manager.
  why: >
    Hanging defects are cheap to fix on the day and expensive once mud,
    texture, and paint are on. A board hung on wet or unaccepted framing
    telegraphs every stud bow under finished lighting. Unsupported edges
    crack at the joint, proud screws pop through the finish, and a missing
    access panel means cutting a finished wall to reach a valve. The process
    keeps the crew from starting before the room is ready and from leaving
    before the hidden conditions are recorded.
  how: >
    The crew lead reads the construction plan and current revisions, then
    walks the room to confirm it is dry and enclosed, that framing and rough
    work are accepted, and that board type and thickness, backing, control
    joints, access panels, and finish level are settled. Field controls are
    set from that walk: the hanging sequence by wall and ceiling, where the
    crew stops for a check, and who records what. While hanging, the crew
    records board counts, concealed backing, decisions on cuts and openings,
    and stops if framing or rough-in differs from the plan. At acceptance
    the lead checks orientation, fastening, joints, corners, readiness for
    the finish level, surface tolerance, and protection, and issues the
    punch list.
  controls:
    - name: Framing acceptance before the first board
      note: The lead confirms in the field record that framing and rough-in were accepted and the space is dry before any board is lifted.
    - name: Fastener and edge check per wall
      note: Each wall is checked for proud or missed fasteners and unsupported edges before the crew moves to the next one.
    - name: Concealed conditions photographed
      note: Backing, blocking, and anything the board will cover are photographed and located in the record before they disappear.
    - name: Changed-condition stop
      note: When framing, openings, or rough work differ from the plan the crew stops and the lead gets the method change approved.
    - name: Punch list issued at room handover
      note: The lead issues the punch list with locations for every open correction so the finishers start from a known surface.
