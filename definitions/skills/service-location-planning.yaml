id: service-location-planning
name: Service location planning
kind: skill
department: sales
summary: >
  Service location planning selects and confirms where a mobile
  operation will trade. Expected demand, fees, travel, access, parking,
  permissions, utilities, service hours, weather exposure, nearby
  competition, and the operating setup become a location schedule the
  team and customers can rely on.
inputs: []
outputs: [location-schedule]
steps:
  - name: Evaluate the opportunity
    role: owner-operator
    note: >
      Audience, event or host, expected service window, sales history,
      fees, travel, and competing use of the same date are reviewed.
  - name: Confirm operating conditions
    role: owner-operator
    note: >
      Permission, parking position, arrival route, power, water, waste,
      restrooms, security, weather plan, and site contact are verified.
  - name: Commit the location
    role: owner-operator
    produces: [location-schedule]
    note: >
      Address, map point, date, service hours, arrival time, contact,
      fees, site duties, and cancellation route enter the operating calendar.
  - name: Publish and brief
    role: owner-operator
    note: >
      Customers receive the correct location and hours while staff use
      the same record for prep, loading, travel, and setup.
  - name: Record the outcome
    role: owner-operator
    note: >
      Sales, service time, waste, fees, access issues, host performance,
      weather, and repeat decision update the location history.
tension: >
  Demand opportunity competes with operating fit. A promising crowd can
  still produce a poor service day when travel, fees, access, utilities,
  setup time, weather, or site rules consume the available window.
failure_modes:
  - name: Verbal permission becomes the booking
    cost: >
      The operator arrives without an accepted position, service window,
      utility arrangement, or responsible site contact.
    signal: >
      The calendar has a location and lacks written operating conditions.
  - name: Public details drift from the calendar
    cost: >
      Customers travel to an old location or arrive outside service hours.
    signal: >
      Published address or time differs across channels.
  - name: Revenue is reviewed without site cost
    cost: >
      A busy location is repeated even though fees, travel, setup, waste,
      or short service time consume the return.
    signal: >
      Location history records sales and omits the cost of serving there.
maturity:
  - level: run badly
    looks_like: >
      Locations live in messages, customers receive late updates, and the
      team discovers access and utilities on arrival.
  - level: run well
    looks_like: >
      Opportunity, conditions, confirmation, publication, team brief,
      and outcome share one dated location record.
  - level: run excellently
    looks_like: >
      Location history changes booking choices, service hours, prep,
      staffing, menu availability, and host terms.
competencies:
  - name: Site feasibility
    note: >
      The operator combines customer opportunity with the physical and
      commercial conditions needed to trade.
  - name: Public coordination
    note: >
      Site, team, and customer information must change together when a
      location or service window moves.
automation:
  now: >
    Calendars, host records, maps, condition checklists, public location
    updates, route planning, weather alerts, and outcome history.
  human: >
    Opportunity judgment, host negotiation, site inspection, weather
    decisions, operating tradeoffs, and cancellation authority.
questions:
  - Which booked location still lacks one condition required to operate?
  - Which repeated location produces activity without enough usable service time?
article:
  what: >
    The service location planning process decides where a mobile
    operation such as a food truck will trade on a given day, and turns
    that decision into a location schedule the crew and the public can
    rely on. It starts when an opportunity appears, whether a host
    invitation, an event, or a recurring lunch spot, and ends when the
    day has been served and its sales, costs, and access problems have
    been written back into the location history. In a food truck
    business the owner-operator owns every step, from evaluating the
    opportunity to recording the outcome.
  why: >
    It protects the service day from being consumed by things that have
    nothing to do with cooking. A crowd can be real and the day still
    lose money when the host fee, travel, setup time, a missing power
    hookup, or a parking position with no foot traffic eats the service
    window. It also protects the customer relationship, because a
    published address that differs from where the truck actually parks
    sends people to an empty curb and teaches them to stop checking.
  how: >
    The owner-operator evaluates the opportunity by looking at the
    audience, the host or event, the expected service window, any sales
    history at that spot, fees, travel, and whether the same date is
    already committed. Before committing, the owner confirms the
    operating conditions in writing, meaning permission, the exact
    parking position, the arrival route, power, water, waste, restrooms,
    security, a weather plan, and a named site contact. The location
    then enters the operating calendar with its address, map point,
    date, service hours, arrival time, contact, fees, site duties, and
    cancellation route, which is the location schedule. The same record
    is published to customers and used by staff for prep, loading,
    travel, and setup. After service, sales, service time, waste, fees,
    access issues, host performance, weather, and the repeat decision
    are recorded against that location.
  controls:
    - name: Written operating conditions before the calendar entry
      note: No location is committed until permission, position, utilities, and site contact are confirmed in a message the operator can produce later.
    - name: One location record feeds every channel
      note: The published address and hours come from the location schedule, so a change made there updates the crew brief and the customer post together.
    - name: Outcome recorded with site cost
      note: Every served day records fees, travel, setup, and usable service time alongside sales, so the repeat decision sees the full cost of trading there.
    - name: Repeat decision reviewed against history
      note: A location is rebooked only after its history, including host reliability and access problems, has been read by the operator.
