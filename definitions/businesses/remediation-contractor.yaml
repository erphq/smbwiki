id: remediation-contractor
name: Remediation Contractor
codes:
  naics: "562910"
catalog_group: construction-property
extends: project-services-base
summary: >
  A remediation contractor contains and removes hazardous or damaged
  material under a defined assessment, work area, method, clearance
  requirement, and waste path. Site history, sampling, occupant
  protection, utilities, access, and insurer or owner decisions shape
  the work package.

  Conditions change as assemblies open. The crew records containment,
  air or moisture control, removed quantities, transport, cleaning,
  tests, photographs, and changed scope before evidence disappears.
  Release depends on the specified verification and documented transfer
  to reconstruction or occupancy.
revenue_model:
  - id: emergency-mitigation
    note: containment, extraction, drying, and stabilization after a loss
  - id: regulated-remediation
    note: planned removal and clearance under a defined hazardous-material scope
  - remove: [quoted-projects]
supply_chain:
  buys_from: [environmental-testing-laboratory, waste-disposal-facility]
  sells_to: [homeowner, property-management-company]
article:
  operating_model: >
    A remediation contractor answers two kinds of calls. Emergency
    mitigation starts with a loss: the crew lead and field crew contain
    the area, extract water, set drying equipment, and stabilize before
    damage spreads, with the estimator pricing from the insurer's line
    items as the scope becomes visible. Regulated remediation is planned
    work under an assessment and a defined hazardous material scope,
    with containment, air or moisture control, removal, transport, and
    clearance testing by an independent laboratory. Quoting and project
    delivery carry the business, because every removed quantity,
    reading, photograph, and manifest is the evidence that gets the
    invoice paid and the space released. The tension is that conditions
    change as assemblies open, so scope, cost, and authority have to
    move together while the crew is still on site.
  starting: >
    The paperwork is heavier than in most trades. Beyond business
    registration, employer registration, and sales tax registration
    where applicable, most states license asbestos and lead abatement
    contractors and require trained and accredited workers, some states
    license mold remediation, federal renovator certification applies
    to disturbing paint in housing built before the lead paint ban, and
    hauling contaminated material may require transporter registration
    and manifests tied to an approved disposal facility. Pollution
    liability coverage is needed alongside general liability and
    workers compensation, and insurer program work usually requires
    industry certifications in water and mold restoration. Capital
    items are extraction and drying equipment, air scrubbers, negative
    air machines, containment supplies, monitoring instruments, and a
    truck or trailer. The minimum roles are an owner-operator, an
    estimator who can write insurer estimates, a crew lead, and field
    crew, with the office manager handling purchasing and invoicing.
    The first records are the job request, the quote, the work order,
    job photos, the supplier invoice, and the customer invoice, and the
    skills that must exist from the first loss are lead intake,
    quoting, project delivery, and accounts receivable.
  economics: >
    Revenue is emergency mitigation billed largely per line item and
    equipment day against insurer pricing, and regulated remediation
    quoted as a defined scope with removal quantities, disposal, and
    clearance. Gross margin depends on equipment utilization, crew hours
    per job, laboratory and disposal fees passed through at cost, and
    how much of the documented scope the adjuster actually approves;
    a disputed line item is margin lost after the labor is spent. The
    metrics that decide profit are project gross margin, schedule
    variance, quote win rate, booking rate on emergency calls, and days
    sales outstanding, which runs long when the insurer, the owner, and
    a mortgage holder all sit between the invoice and the payment. The
    business is equipment and labor intensive with unpredictable demand
    tied to storms and freezes, so idle drying equipment and standby
    crews in a quiet month are the cost that pricing has to cover.
