id: spring-and-cable-balancing
name: Spring and cable balancing
kind: skill
department: operations
summary: >-
  Confirms spring and drum selection, installs restraints, winds or tensions
  safely, seats cables, and balances the door through its travel. Spring and
  cable balancing leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - work-order
outputs:
  - commissioning-record
steps:
  - name: Confirm the work basis
    note: >-
      Before spring and cable balancing, read the current scope and revisions,
      then verify verified opening and structure, selected door and operator,
      electrical provision, hardware, spring design, access, and site
      protection.
  - name: Set the field controls
    note: >-
      Translate spring and cable balancing into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During spring and cable balancing, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept spring and cable balancing, check the completed work against
      secure attachment, balanced travel, correct clearances, functional
      controls, entrapment protection, manual release, seals, and owner
      instruction, then close correction and issue the resulting record.
tension: >-
  Spring and cable balancing has to remain inside its acceptance basis while
  production moves. A door can cycle under power while its spring balance,
  attachment, or safety reversal remains unsafe.
failure_modes:
  - name: Spring and cable balancing starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for spring
      and cable balancing is settled.
    signal: >-
      The spring and cable balancing work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Spring and cable balancing closes without evidence
    cost: >-
      A concealed condition or required result from spring and cable balancing
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Spring and cable balancing is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Spring and cable balancing is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Spring and cable balancing starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Spring and cable balancing uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Overhead-door balance and safety control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of spring and cable balancing.
  - name: Evidence control
    note: >-
      Acceptance checks for spring and cable balancing have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Spring and cable balancing can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting spring and cable balancing
    remain human.
questions:
  - >-
    Which unresolved condition can stop spring and cable balancing before work
    begins?
  - >-
    Which record proves spring and cable balancing was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The spring and cable balancing process sets an overhead door so it
    hangs balanced through its full travel. The torsion or extension
    springs and drums are confirmed against the door weight, restraints
    are installed, the springs are wound or tensioned under control, the
    cables are seated, and the door is balanced and tested before the
    operator is allowed to run it. It starts from a work order with the
    opening, door, and spring design verified, and ends with a
    commissioning record. A garage door contractor owns it through the
    technician on the job.
  why: >
    It protects the technician first, then the owner. A torsion spring
    stores enough energy to break an arm or send a winding bar across
    the garage, and a cable that slips a drum under load drops the door
    on that side. An unbalanced door that runs under power hides its
    condition behind the operator's motor until the opener fails, the
    reversal test fails, or the door falls on a car or a child. The
    commissioning record is also the contractor's defense when a door is
    later modified by someone else.
  how: >
    The technician reads the work order and any revisions, then confirms
    the verified opening and structure, the selected door and operator,
    electrical provision, hardware, the spring design for the door
    weight, access, and site protection before starting. The job is set
    out as a safe sequence with restraints, tools, hold points before
    winding and before power, and the record the technician fills in.
    During the work the technician confirms spring and drum selection
    against the door, installs restraints, winds or tensions the
    springs, seats the cables, and records turns, measurements, and any
    deviation, stopping when the door weight, track condition, or
    hardware differs from the work order. At acceptance the technician
    checks secure attachment, balanced travel, correct clearances,
    functional controls, entrapment protection, manual release, seals,
    and owner instruction, closes corrections, and issues the
    commissioning record.
  controls:
    - name: Spring selection verified against measured door weight
      note: The door is weighed or its weight confirmed from the manufacturer before springs are wound, and the match is recorded.
    - name: Restraints and hold point before winding
      note: Winding bars, cable restraints, and a clear zone are in place and checked before any tension is applied to a spring.
    - name: Balance test with the operator disconnected
      note: The door is tested by hand at several positions through its travel and the result recorded before the operator is connected.
    - name: Entrapment and reversal test recorded
      note: The operator's reversal and any photo-eye function are tested and recorded on the commissioning record before handover.
    - name: Owner instruction acknowledged
      note: The owner receives and acknowledges the manual release and safety instruction, and the acknowledgment is on the record.
