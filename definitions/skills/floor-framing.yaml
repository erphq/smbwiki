id: floor-framing
name: Floor framing
kind: skill
department: operations
summary: >-
  Installs sill, beams, joists, blocking, rim, openings, connectors, and
  subfloor while maintaining bearing, plane, and load path. Floor framing
  leaves a current work basis, a field record, and acceptance evidence that
  another operator can trace.
inputs:
  - construction-plan
outputs:
  - quality-report
steps:
  - name: Confirm the work basis
    note: >-
      Before floor framing, read the current scope and revisions, then verify
      current dimensions, control lines, lumber or component package,
      connectors, openings, bearing points, and correction of supporting work.
  - name: Set the field controls
    note: >-
      Translate floor framing into work limits, sequence, responsibilities,
      hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During floor framing, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept floor framing, check the completed work against specified
      layout, bearing, fastening, bracing, openings, plane, and inspection
      readiness, then close correction and issue the resulting record.
tension: >-
  Floor framing has to remain inside its acceptance basis while production
  moves. Small layout errors repeat through floors, walls, roofs, windows,
  cabinets, and finishes.
failure_modes:
  - name: Floor framing starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for floor
      framing is settled.
    signal: >-
      The floor framing work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Floor framing closes without evidence
    cost: >-
      A concealed condition or required result from floor framing cannot be
      verified without opening, repeat work, delay, or a disputed exception.
    signal: >-
      Floor framing is released while its required check, location record,
      test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Floor framing is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Floor framing starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Floor framing uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Wood framing layout and load-path judgment
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of floor framing.
  - name: Evidence control
    note: >-
      Acceptance checks for floor framing have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Floor framing can use digital revisions, checklists, hold points, photo
    capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting floor framing remain human.
questions:
  - Which unresolved condition can stop floor framing before work begins?
  - >-
    Which record proves floor framing was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The floor framing process builds the platform everything above it
    stands on: sill on the foundation, beams and posts, joists at the
    specified spacing, blocking, rim, framed openings for stairs and
    chases, the connectors that tie it together, and the subfloor. It
    starts when the foundation is accepted and the lumber or component
    package and connectors are on site, and it ends when the floor is
    checked for bearing, plane, fastening, and openings and the inspection
    release is recorded in the quality report. The framing foreman owns it
    for a framing contractor, with the lead carpenter running the crew.
  why: >
    Every wall, roof, window, cabinet, and finish floor inherits what the
    floor frame does. A joist bearing short on a beam, a missing hanger, a
    rim out of plane, or an opening framed to the wrong side of a line
    shows up as a bouncy floor, a cracked tile, a door that will not
    close, or an inspection failure after the walls are up, when the fix
    means opening finished work. The process protects the load path the
    engineer designed, the plane the finishes need, and the inspection
    that lets the next floor proceed.
  how: >
    The foreman reads the current scope and revisions and confirms the
    dimensions, control lines, lumber or component package, connectors,
    opening locations, bearing points, and correction of the supporting
    work before the crew starts. The field controls are then set: layout
    responsibility, the sequence of sill, beams, joists, blocking, rim,
    openings, and subfloor, the hold points for bearing and connector
    checks before subfloor covers them, and the record the crew keeps.
    During framing the crew records material used, any bearing or hanger
    condition that differed from the plan, and concealed details such as
    blocking and connectors before the subfloor goes down, and stops when
    a foundation dimension or a component does not match the drawing. At
    acceptance the foreman checks layout, bearing, fastening, bracing,
    openings, and plane against the plan, closes correction, and issues
    the quality report ready for inspection.
  controls:
    - name: Bearing and connector check before subfloor
      note: Joist bearing length, hangers, and hold-downs are checked and photographed at a hold point before the subfloor conceals them.
    - name: Layout verified against control lines
      note: Sill and beam placement is checked to the survey control and foundation dimensions, and any foundation error is recorded before framing adapts to it.
    - name: Component package reconciled to the plan
      note: Engineered joists, beams, and connectors received on site are checked against the layout and the engineer's schedule before installation.
    - name: Plane and level record
      note: Rim and joist tops are checked for plane and the reading recorded, so a subfloor or wall problem later has a known starting condition.
    - name: Quality report issued for inspection
      note: The completed frame, its checks, and any correction are recorded in the quality report before the inspection is called and the next floor proceeds.
