seo:
  title: "Auto Repair Shop: How the Business Works | smbwiki"
article:
  operating_model: >
    An auto repair shop sells bay time and technician skill through a
    repair order. Each day the service-advisor books appointments,
    writes up the vehicle at intake, and turns the technician's
    inspection report into an estimate the customer can approve; the
    parts-manager sources what the approved work needs; the technician
    performs the repair; the shop-foreman checks it; and the advisor
    closes the invoice at pickup. Vehicle diagnosis, repair estimating,
    and repair authorization are the load-bearing skills, because the
    estimate is where the shop's revenue is decided and the
    authorization is what makes it collectible. The tension is the bay:
    a vehicle waiting on a customer decision or a back-ordered part
    occupies working space that earns nothing, so the advisor's
    follow-up and the parts-manager's sourcing are what keep technicians
    turning hours.
  starting: >
    Only some states and localities register motor vehicle repair
    businesses, so the first check is whether the operating state issues
    a repair shop registration or imposes written estimate and
    authorization rules; where it does, the registration must be in hand
    before the first customer. Universal requirements are the business
    registration, sales tax registration because parts are resold, an
    employer registration for the first technician, and a setup for used
    oil, coolant, and solvent handling that most localities inspect.
    Technicians who service air conditioning need the federal
    refrigerant certification. The minimum team is an owner-operator or
    shop-foreman who can diagnose, one automotive-technician, and a
    service-advisor who owns the counter; the parts-manager role is
    absorbed by the advisor until volume grows. The capital items are
    lifts, an air compressor, a scan tool, and tire and brake equipment.
    The first records are the appointment record, the repair order, the
    inspection report, the repair estimate and signed work
    authorization, purchase orders for parts, the quality check, and the
    customer invoice. Appointment scheduling, vehicle intake, vehicle
    diagnosis, repair estimating, repair authorization, repair
    execution, and repair checkout must all work on the first day.
  economics: >
    Revenue is diagnostic work, repair labor, parts margin, and
    maintenance services scheduled by mileage or time. Labor is priced
    at a shop rate against flat-rate hours for each job; parts are
    marked up over distributor cost; diagnosis is charged as a fee that
    is often credited when the repair is approved. Gross margin comes
    from two places, the spread between the shop rate and technician
    pay, and the parts markup, so technician efficiency, the ratio of
    flat-rate hours billed to hours paid, and bay utilization decide
    profit. Estimate approval rate turns inspection into revenue,
    average ticket reflects how completely the inspection was sold, and
    comeback rate is the leak, because a repair done twice is paid once.
    The shop is capital intensive in lifts and diagnostic equipment and
    labor intensive in skilled technicians who are hard to hire, and the
    fleet and commercial accounts that fill bays on slow days come with
    slower payment terms.
