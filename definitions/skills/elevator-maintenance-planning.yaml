id: elevator-maintenance-planning
name: Elevator maintenance planning
kind: skill
department: maintenance
summary: >-
  Builds unit-specific preventive work from equipment, use, callbacks, code
  tests, known wear, access windows, and parts lead time. Elevator maintenance
  planning leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - service-ticket
outputs:
  - test-report
steps:
  - name: Confirm the work basis
    note: >-
      Before elevator maintenance planning, read the current scope and
      revisions, then verify identified unit, maintenance history, code
      status, safe access, outage coordination, parts, qualified staff, and
      rescue provisions.
  - name: Set the field controls
    note: >-
      Translate elevator maintenance planning into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During elevator maintenance planning, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept elevator maintenance planning, check the completed work
      against safe operation, required clearances and protection, corrected
      defects, recorded tests, current log, and regulatory inspection status,
      then close correction and issue the resulting record.
tension: >-
  Elevator maintenance planning has to remain inside its acceptance basis
  while production moves. An elevator can return to service while an
  intermittent control, door, braking, or leveling defect remains unresolved.
failure_modes:
  - name: Elevator maintenance planning starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      elevator maintenance planning is settled.
    signal: >-
      The elevator maintenance planning work package still has an open
      drawing, access, material, predecessor, or approval dependency when
      labor is assigned.
  - name: Elevator maintenance planning closes without evidence
    cost: >-
      A concealed condition or required result from elevator maintenance
      planning cannot be verified without opening, repeat work, delay, or a
      disputed exception.
    signal: >-
      Elevator maintenance planning is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Elevator maintenance planning is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Elevator maintenance planning starts from a checked basis, follows a
      named sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Elevator maintenance planning uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Vertical-transport diagnostics and code testing
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of elevator maintenance planning.
  - name: Evidence control
    note: >-
      Acceptance checks for elevator maintenance planning have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Elevator maintenance planning can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting elevator maintenance
    planning remain human.
questions:
  - >-
    Which unresolved condition can stop elevator maintenance planning before
    work begins?
  - >-
    Which record proves elevator maintenance planning was accepted before it
    was covered, loaded, energized, occupied, or handed over?
