id: comparable-sales-analysis
name: Comparable sales analysis
kind: skill
department: operations
summary: >-
  Searches the relevant market, verifies transactions, selects competitive
  sales, analyzes differences, supports adjustments, and derives an indicated
  value. Comparable sales analysis leaves a current work basis, a field
  record, and acceptance evidence that another operator can trace.
inputs:
  - engagement-letter
outputs:
  - appraisal-report
steps:
  - name: Confirm the work basis
    note: >-
      Before comparable sales analysis, read the current scope and revisions,
      then verify identified client and intended use, property rights,
      effective date, assignment conditions, access, market data, and
      competent appraiser.
  - name: Set the field controls
    note: >-
      Translate comparable sales analysis into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During comparable sales analysis, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept comparable sales analysis, check the completed work against
      credible supported analyses, disclosed scope and assumptions, reconciled
      value opinion, compliant report, and signed delivery, then close
      correction and issue the resulting record.
tension: >-
  Comparable sales analysis has to remain inside its acceptance basis while
  production moves. Weak property or market verification can make a polished
  value conclusion unsupported.
failure_modes:
  - name: Comparable sales analysis starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      comparable sales analysis is settled.
    signal: >-
      The comparable sales analysis work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Comparable sales analysis closes without evidence
    cost: >-
      A concealed condition or required result from comparable sales analysis
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Comparable sales analysis is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Comparable sales analysis is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Comparable sales analysis starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Comparable sales analysis uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Real property valuation and evidence reconciliation
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of comparable sales analysis.
  - name: Evidence control
    note: >-
      Acceptance checks for comparable sales analysis have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Comparable sales analysis can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting comparable sales analysis
    remain human.
questions:
  - >-
    Which unresolved condition can stop comparable sales analysis before work
    begins?
  - >-
    Which record proves comparable sales analysis was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The comparable sales analysis process is how an appraiser turns
    market evidence into a supported value opinion: searching the
    relevant market, verifying each transaction, selecting the sales
    that truly compete with the subject, analyzing the differences,
    supporting each adjustment, and reconciling to an indicated value.
    It starts when the engagement letter fixes the client, intended use,
    property rights, and effective date, and ends when the analysis is
    reviewed and signed into the appraisal report. A real estate
    appraisal firm owns it through the appraiser of record, with a
    reviewer where the firm requires one.
  why: >
    It protects the credibility of the value opinion and the appraiser's
    license behind it. A sale used without verification can carry a
    concession or a non-market condition that moves the indicated value.
    An adjustment without support reads as opinion, and a reviewer,
    lender, or court will treat it that way. A polished report on weak
    verification is the most expensive kind of wrong, because the error
    is discovered after someone has relied on it.
  how: >
    The appraiser confirms the work basis by reading the current scope
    and any revisions and verifying the identified client and intended
    use, property rights, effective date, assignment conditions, access,
    market data, and that a competent appraiser holds the assignment.
    The field controls set the search parameters, selection criteria,
    verification sources, hold points such as the reviewer's check, and
    the records the workfile will keep. During the analysis the
    appraiser records the sales searched and rejected, verification
    calls, observed differences, adjustment support, decisions, and any
    condition that changes the approach. Acceptance checks the work
    against credible supported analyses, disclosed scope and
    assumptions, a reconciled value opinion, a compliant report, and
    signed delivery, and corrections close before the appraisal report
    is issued.
  controls:
    - name: Transaction verification recorded per sale
      note: >
        Each comparable carries the source, the party contacted, the
        date, and any condition of sale discovered during
        verification.
    - name: Selection rationale in the workfile
      note: >
        Sales considered and rejected are listed with the reason, so
        the chosen set can be defended when the report is
        questioned.
    - name: Adjustment support cited
      note: >
        Every adjustment references the paired data, market study,
        or analysis that supports its direction and size.
    - name: Reconciliation reviewed before signature
      note: >
        The reviewer or a second appraiser checks the reconciliation
        and the disclosed assumptions before the report is signed.
