id: masonry-layout
name: Masonry layout
kind: skill
department: operations
summary: >-
  Establishes coursing, bond, openings, control joints, corners, elevations,
  and interface dimensions before units are laid. Masonry layout leaves a
  current work basis, a field record, and acceptance evidence that another
  operator can trace.
inputs:
  - construction-plan
outputs:
  - quality-report
steps:
  - name: Confirm the work basis
    note: >-
      Before masonry layout, read the current scope and revisions, then verify
      approved sample, sound support, control lines, unit and mortar supply,
      weather protection, embeds, and interface details.
  - name: Set the field controls
    note: >-
      Translate masonry layout into work limits, sequence, responsibilities,
      hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During masonry layout, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept masonry layout, check the completed work against line, level,
      plumb, bond, joint profile, reinforcement, flashing, drainage, cleaning,
      and specified appearance, then close correction and issue the resulting
      record.
tension: >-
  Masonry layout has to remain inside its acceptance basis while production
  moves. Masonry locks layout, structure, weather control, and visible finish
  into the same installed work.
failure_modes:
  - name: Masonry layout starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      masonry layout is settled.
    signal: >-
      The masonry layout work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Masonry layout closes without evidence
    cost: >-
      A concealed condition or required result from masonry layout cannot be
      verified without opening, repeat work, delay, or a disputed exception.
    signal: >-
      Masonry layout is released while its required check, location record,
      test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Masonry layout is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Masonry layout starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Masonry layout uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Masonry material and bond control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of masonry layout.
  - name: Evidence control
    note: >-
      Acceptance checks for masonry layout have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Masonry layout can use digital revisions, checklists, hold points, photo
    capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting masonry layout remain human.
questions:
  - Which unresolved condition can stop masonry layout before work begins?
  - >-
    Which record proves masonry layout was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The masonry layout process is how a masonry contractor establishes,
    before any unit is laid, where every course, bond, opening, control
    joint, corner, and elevation will fall so that the wall meets the
    drawings and the other trades' work. It sets story poles, corner
    leads, coursing, and interface dimensions from the construction
    plan and the site benchmark, and it ends with a quality report that
    records the layout the wall was built to. The masonry foreman owns
    it with the layout checked by the superintendent.
  why: >
    It protects everything that follows in the wall. A layout error
    becomes a cut course at a window head, a control joint through an
    opening, a bond pattern that breaks at a corner, or a wall that
    misses the steel embed by a course, and every one of those is
    expensive once units are in mortar. Masonry locks layout,
    structure, weather control, and finish into the same installed
    work, so a layout that is wrong cannot be corrected without
    demolition.
  how: >
    The foreman reads the current scope and revisions, then verifies
    the approved sample, sound support, control lines, unit and mortar
    supply, weather protection, embeds, and interface details. Layout
    is set up as field controls: the benchmark and control lines,
    coursing and story pole, bond and corner start, opening dimensions,
    control joint locations, elevations at shelf angles and lintels,
    responsibilities for each lead, hold points before the first
    course, and the records to keep. During layout the crew records
    quantities, observations, decisions, and dimensions that will be
    concealed, and stops when a field condition such as a foundation
    out of tolerance changes the planned method. At acceptance the
    foreman checks line, level, plumb, bond, joint profile,
    reinforcement, flashing, drainage, cleaning, and specified
    appearance, closes corrections, and issues the quality report.
  controls:
    - name: Benchmark and control lines verified
      note: Layout starts from the surveyed benchmark and control lines, checked against the plan before any story pole is set.
    - name: Story pole approved against openings
      note: Coursing is checked at every opening head and sill and at embeds before the pole is used to set leads.
    - name: Foundation tolerance recorded
      note: Foundation line and level are measured and deviations are recorded and resolved before the first course is laid.
    - name: Control joint locations marked and checked
      note: Joint locations are marked on the wall and confirmed against the plan and openings before units are placed.
    - name: Corner leads checked by a second person
      note: Each corner lead is checked for plumb, level, bond, and coursing by someone other than the mason who built it before the wall is run.
