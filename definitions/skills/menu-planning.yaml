id: menu-planning
name: Menu planning
kind: skill
department: operations
summary: >
  Menu planning decides which items and modifiers the operation will
  offer, how they are priced, and whether the team can execute them
  through normal purchasing, preparation, service, and equipment
  capacity. A published item becomes an operating commitment.
inputs: [recipe-card]
outputs: [menu]
steps:
  - name: Review the item economics
    consumes: [recipe-card]
    note: >
      Portion cost, expected waste, packaging, and labor burden are
      understood before a selling price is chosen.
  - name: Test the operating fit
    note: >
      The item is run through prep, storage, station space, equipment,
      ticket flow, and service handoff.
  - name: Set price and boundaries
    note: >
      Size, included sides, modifiers, availability, and channel rules
      prevent the order from becoming a new recipe at the counter.
  - name: Publish the menu
    produces: [menu]
    note: >
      Kitchen references, ordering channels, supplier needs, and staff
      training change under one effective date.
tension: >
  Customer choice competes with repeatable execution. More items can
  capture more preferences; every addition occupies ingredients, prep
  time, station attention, and training capacity during service.
failure_modes:
  - name: Ingredient cost hides operating cost
    cost: >
      An item appears profitable while extra prep, waste, packaging, or
      slow service consumes the margin.
    signal: >
      The recipe is costed while labor and station impact remain
      unreviewed.
  - name: Channel menus drift
    cost: >
      Staff receive orders for prices, modifiers, or items the current
      operation cannot fulfill as displayed.
    signal: >
      Counter, delivery, and online menus carry different effective
      versions.
  - name: Item exceeds station capacity
    cost: >
      One popular order slows unrelated tickets and destabilizes the
      service period.
    signal: >
      The item repeatedly creates a queue at one appliance or work
      position.
maturity:
  - level: run badly
    looks_like: >
      New items are added from supplier price and owner preference, then
      the kitchen discovers the prep and service burden.
  - level: run well
    looks_like: >
      Recipe, cost, price, modifiers, equipment, prep, and channel
      publication are reviewed together.
  - level: run excellently
    looks_like: >
      Item performance includes waste and service impact, menu changes
      have controlled effective dates, and weak items are removed cleanly.
competencies:
  - name: Item economics
    note: >
      The operator sees portion, yield, waste, packaging, channel fee,
      and labor as parts of one item result.
  - name: Service-system judgment
    note: >
      A good product can still be a poor menu item when it overloads the
      equipment or handoff used by the rest of the menu.
automation:
  now: >
    Recipe costing, price comparisons, item performance reports, menu
    versioning, channel publishing, and modifier validation.
  human: >
    Taste, product judgment, operational testing, brand fit, and deciding
    which customer choices deserve permanent complexity.
questions:
  - Which menu item creates the most disruption outside its own station?
  - Do all ordering channels show the same current price and availability?
article:
  what: >
    The menu planning process decides what a food operation will sell,
    at what price, with which modifiers, and through which channels, and
    confirms the kitchen can produce it during a normal service before
    it is published. It starts with a costed recipe card for a proposed
    item and ends with a published menu carrying one effective date
    across the counter, the kitchen references, the ordering channels,
    and the supplier order. In a full-service restaurant the chef and
    the owner own it together; in a coffee shop, a food truck, or a
    retail bakery the owner usually decides with the lead on the line.
  why: >
    It protects margin and service stability. An item costed on
    ingredients alone can look profitable while its prep time, waste,
    packaging, and slow assembly consume the margin on every ticket. An
    item that overloads one appliance or one station slows unrelated
    orders and destabilizes the whole service period, which is a cost
    the recipe card never shows. And when the counter, delivery, and
    online menus carry different versions, staff take orders at prices
    and with modifiers the operation cannot fulfil as displayed, and
    every one of those becomes a correction at the pass.
  how: >
    The owner or chef reviews the item economics from the recipe card:
    portion cost, expected waste, packaging, and the labor the item
    loads onto the line, before any selling price is discussed. The item
    is then run through the operation as a test: prep, storage, station
    space, equipment, ticket flow, and the handoff to service, to see
    what it does to other orders. Price and boundaries are set next:
    size, included sides, allowed modifiers, availability by daypart,
    and channel rules, so an order cannot become a new recipe at the
    counter. Publication is a single change: the menu, kitchen
    references, ordering channels, supplier needs, and staff training
    all switch on one effective date.
  controls:
    - name: Full cost before price
      note: The recipe card carries portion, waste, packaging, and labor before a price is proposed, and an item with only ingredient cost cannot advance.
    - name: Service test recorded
      note: The item is run during a live or simulated service and its effect on station load and ticket times is noted before approval.
    - name: Modifier and channel boundaries written
      note: Allowed modifiers, sizes, sides, availability, and channel rules are defined in the menu system, so free-text substitutions are blocked at order entry.
    - name: One effective date across channels
      note: Counter, online, delivery, and kitchen references are compared at publication and again after any price change so no channel drifts.
    - name: Item review with waste and disruption
      note: Item performance is reviewed with waste and station disruption alongside sales so weak items are removed cleanly instead of lingering.
