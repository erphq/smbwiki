id: survey-data-adjustment
name: Survey data adjustment
kind: skill
department: operations
summary: >-
  Reduces observations, checks instrument and closure error, applies an
  appropriate adjustment, compares record calls, and documents judgment.
  Survey data adjustment leaves a current work basis, a field record, and
  acceptance evidence that another operator can trace.
inputs:
  - site-plan
outputs:
  - survey-plat
steps:
  - name: Confirm the work basis
    note: >-
      Before survey data adjustment, read the current scope and revisions,
      then verify defined survey purpose, current deeds and plats, adjoining
      records, coordinate basis, access, equipment checks, and field safety
      plan.
  - name: Set the field controls
    note: >-
      Translate survey data adjustment into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During survey data adjustment, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept survey data adjustment, check the completed work against
      traceable evidence, closed measurements, resolved boundary opinion, set
      or found monuments, complete notes, and signed deliverable, then close
      correction and issue the resulting record.
tension: >-
  Survey data adjustment has to remain inside its acceptance basis while
  production moves. Treating record dimensions as field truth can move a
  boundary opinion away from controlling evidence.
failure_modes:
  - name: Survey data adjustment starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for survey
      data adjustment is settled.
    signal: >-
      The survey data adjustment work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Survey data adjustment closes without evidence
    cost: >-
      A concealed condition or required result from survey data adjustment
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Survey data adjustment is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Survey data adjustment is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Survey data adjustment starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Survey data adjustment uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Boundary evidence and measurement adjustment
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of survey data adjustment.
  - name: Evidence control
    note: >-
      Acceptance checks for survey data adjustment have to be captured while
      the relevant condition can still be observed and corrected.
automation:
  now: >-
    Survey data adjustment can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting survey data adjustment
    remain human.
questions:
  - >-
    Which unresolved condition can stop survey data adjustment before work
    begins?
  - >-
    Which record proves survey data adjustment was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The survey data adjustment process is the office stage of a boundary or
    topographic survey where a land surveying firm turns raw field
    observations into coordinates it will sign: angles and distances are
    reduced, instrument and closure error is checked, an adjustment is applied
    and justified, the adjusted figures are compared with the record calls in
    deeds and plats, and the surveyor's judgment is written down. It begins
    when the field crew delivers a closed set of observations and ends when
    the licensed surveyor accepts the adjusted network as the basis for the
    survey plat. The licensed surveyor owns it, with a survey technician doing
    the reduction.
  why: >
    An adjustment spreads error across a network, and an adjustment applied
    without thought spreads a blunder into every corner. If closure is never
    checked, a missed setup or a wrong prism height becomes a boundary line
    that disagrees with the monuments on the ground. If record dimensions are
    treated as field truth, the plat can move a boundary opinion away from the
    controlling evidence and expose the firm to a neighbor's claim. The
    written judgment is what a second surveyor, a court, or a title company
    reads when the line is questioned.
  how: >
    The surveyor confirms the work basis first: the defined purpose of the
    survey, current deeds and plats, adjoining records, the coordinate basis,
    and that field equipment checks and the field safety plan were completed.
    The technician then sets the field controls for the reduction, meaning
    which observations are in scope, the sequence of reduction, who checks
    whose work, and the hold point where the surveyor reviews closures before
    any adjustment runs. The work itself reduces the observations, computes
    closure, applies the chosen adjustment, compares adjusted positions with
    record calls, and records every decision and any observation rejected,
    stopping when a closure exceeds what the purpose allows. Acceptance checks
    traceable evidence, closed measurements, a resolved boundary opinion, set
    or found monuments, complete notes, and a signed deliverable before the
    survey plat is drawn and corrections are closed.
  controls:
    - name: Closure checked before adjustment
      note: Angular and linear closure are computed and compared with the tolerance for the survey purpose before any adjustment is applied to the observations.
    - name: Equipment check on the record
      note: Instrument calibration and field equipment checks are recorded with the observation set, so an instrument error can be separated from a field blunder.
    - name: Rejected observations listed with reason
      note: Any observation removed from the network is named in the notes with the reason, so the adjusted result can be rebuilt by another surveyor.
    - name: Record calls compared line by line
      note: Each adjusted course is compared with the deed and plat call, and every difference beyond expected precision is explained in the surveyor's notes.
    - name: Licensed surveyor signs the adjusted basis
      note: The adjusted coordinates become the plat basis only after the licensed surveyor reviews closures, judgment notes, and monument evidence and signs the deliverable.
