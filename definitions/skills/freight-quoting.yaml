id: freight-quoting
name: Freight quoting
kind: skill
department: sales
summary: >
  Freight quoting turns a load request into a sell rate the brokerage can
  cover under current market and operating conditions. Buy cost,
  equipment, timing, facility behavior, commodity risk, accessorial rules,
  service work, credit, and desired margin support the offer.
inputs: [load-request]
outputs: [quote]
steps:
  - name: Validate the movement
    role: freight-broker
    consumes: [load-request]
    note: >
      Locations, dates, appointments, commodity, weight, equipment,
      handling, contacts, and special requirements are complete enough to
      expose carrier cost.
  - name: Read current capacity
    role: freight-broker
    note: >
      Recent buys, available carriers, season, day, imbalance, lead time,
      and facility reputation inform the expected purchase range.
  - name: Price risk and accessorials
    role: freight-broker
    note: >
      Line haul, expected extras, tracking work, credit exposure, claims
      risk, and recovery difficulty are considered before margin.
  - name: Issue the quote
    role: freight-broker
    produces: [quote]
    note: >
      Rate, validity, equipment, service, accessorial rules, assumptions,
      and acceptance route travel together.
tension: >
  Win probability competes with coverability and margin. A lower sell
  rate improves the customer's immediate choice; a rate below credible
  carrier cost or risk leaves the load uncovered or the brokerage paying
  to move it.
failure_modes:
  - name: Stale buy assumption
    cost: >
      The shipper accepts a rate the current carrier market cannot support.
    signal: >
      The quote uses old lane history despite changed date, lead time,
      equipment, or market condition.
  - name: Accessorial exposure omitted
    cost: >
      Detention, layover, stop, handling, storage, or re-delivery becomes
      an unpriced dispute.
    signal: >
      Facility and service constraints appear in the request while the
      quote has no governing accessorial terms.
  - name: Ambiguous quote acceptance
    cost: >
      The shipper tenders freight under a rate, date, or service assumption
      different from the broker's offer.
    signal: >
      Accepted quotes lack a version, validity period, or load reference.
maturity:
  - level: run badly
    looks_like: >
      A lane average becomes the sell rate and carrier cost is discovered
      after the shipper tenders the load.
  - level: run well
    looks_like: >
      Complete load facts, current capacity, accessorial exposure, credit,
      margin, validity, and acceptance support each quote.
  - level: run excellently
    looks_like: >
      Actual buy and exception cost improve future pricing, volatile lanes
      receive shorter validity, and reasons for lost quotes remain usable.
competencies:
  - name: Market reading
    note: >
      The broker interprets lane balance, calendar, lead time, equipment,
      facility, and recent carrier behavior for this movement.
  - name: Risk pricing
    note: >
      Service work, claim exposure, credit, and uncertain accessorials have
      to enter the decision before the margin is declared.
automation:
  now: >
    Lane histories, market feeds, routing distance, fuel inputs, rate
    models, margin calculation, quote versioning, and validity controls.
  human: >
    Market interpretation, unusual freight, facility risk, customer
    strategy, carrier conversations, and final commitment.
questions:
  - What changed since the buy assumption behind this quote was observed?
  - Which likely accessorial has no agreed customer treatment?
article:
  what: >
    The freight quoting process turns a shipper's load request into a sell
    rate the brokerage can cover with a real carrier at a margin it can
    keep. It starts when a load request arrives with enough detail to
    expose carrier cost and ends when a versioned quote with rate,
    validity, equipment, service, accessorial rules, and assumptions is
    issued and the acceptance route is clear. The freight broker on the
    account owns it; a pricing desk supports lane data in a larger
    brokerage, while in a small one the same broker reads the market and
    commits.
  why: >
    A quote is a promise to cover. A sell rate built on last month's lane
    average is accepted by the shipper and then discovered to be below
    what any carrier will take on the day, and the brokerage either fails
    the load or pays to move it. Accessorials left out of the quote turn
    detention, layover, and re-delivery into unpriced disputes after the
    fact. The process protects margin, coverability, and the shipper's
    trust that a quoted rate means a truck will show up.
  how: >
    The broker validates the movement first: locations, dates,
    appointments, commodity, weight, equipment, handling, contacts, and
    special requirements are checked for completeness against the load
    request so the cost side can be seen. The broker then reads current
    capacity: recent buys on the lane, carriers available, season and day
    of week, lane imbalance, lead time, and the reputation of the
    facilities set the expected purchase range. Risk and accessorials are
    priced next: line haul, likely extras, tracking work, credit exposure
    on the shipper, claims risk on the commodity, and recovery difficulty
    are added before margin is declared. The quote is then issued with
    rate, validity period, equipment, service level, accessorial rules,
    assumptions, and the route by which the shipper accepts it, and the
    version is recorded against the load reference.
  controls:
    - name: Load request completeness check
      note: A quote is built only after locations, dates, equipment, commodity, and facility details are complete enough to expose carrier cost.
    - name: Buy assumption dated
      note: The carrier cost basis behind each quote records its source and date, so a stale lane history is visible before the rate goes out.
    - name: Accessorial terms on every quote
      note: Detention, layover, stops, handling, and re-delivery treatment are stated on the quote whenever the request shows a facility or service constraint.
    - name: Quote version and validity
      note: Each quote carries a version, a validity period, and the load reference, and acceptance is recorded against that version.
    - name: Actual buy compared to quote
      note: The carrier cost paid on covered loads is compared with the quoted buy assumption so pricing on the lane improves.
