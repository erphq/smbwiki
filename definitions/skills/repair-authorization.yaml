id: repair-authorization
name: Repair authorization
kind: skill
department: sales
summary: >
  Repair authorization records the customer's informed scope and price
  decision before repair work begins. Approval, decline, method, time,
  and any limit on added work remain attached to the estimate and repair
  order.
inputs: [repair-estimate]
outputs: [work-authorization]
steps:
  - name: Present the choices
    role: service-advisor
    consumes: [repair-estimate]
    note: >
      The finding, proposed correction, consequence, price, and timing
      are explained for each decision line.
  - name: Answer scope questions
    role: service-advisor
    note: >
      The advisor confirms what the selected work will resolve and which
      recorded concerns will remain.
  - name: Capture the decision
    role: service-advisor
    produces: [work-authorization]
    note: >
      Approved and declined lines, total, contact method, and approval
      time are recorded together.
  - name: Release the work
    role: service-advisor
    note: >
      The bay and parts desk receive the same authorized scope the
      customer accepted.
tension: >
  Decision speed competes with informed consent. A waiting bay creates
  pressure to get an answer; unclear approval exposes the customer and
  shop to a dispute that can exceed the value of the repair.
failure_modes:
  - name: Blanket approval
    cost: >
      The shop cannot prove which estimate version, price, or optional
      lines the customer accepted.
    signal: >
      The authorization says proceed without listing the approved work.
  - name: Verbal change left unrecorded
    cost: >
      Added work appears on the invoice without durable evidence of the
      customer's decision.
    signal: >
      Repair-order scope exceeds the written authorization.
  - name: Declined work disappears
    cost: >
      Future advisors lose the safety or maintenance recommendation and
      the customer cannot revisit it later.
    signal: >
      Declined estimate lines lose their date and reason.
maturity:
  - level: run badly
    looks_like: >
      Technicians begin from an estimate while approval lives in a phone
      call no one else heard.
  - level: run well
    looks_like: >
      Work starts only from recorded approved lines and every added scope
      creates a new authorization event.
  - level: run excellently
    looks_like: >
      Estimate versions, decisions, declines, and limits are durable, and
      the bay sees scope changes as soon as the customer makes them.
competencies:
  - name: Consent communication
    note: >
      The advisor confirms understanding of the work and consequence
      without using urgency to erase the customer's choice.
  - name: Scope control
    note: >
      The operator keeps the estimate, authorization, repair order, and
      final invoice aligned as decisions change.
automation:
  now: >
    Digital estimate delivery, line-level approve or decline controls,
    signatures, timestamps, version history, and bay notifications.
  human: >
    Explaining uncertainty, handling affordability choices, and
    recognizing when new findings require a fresh conversation.
questions:
  - Can the shop show exactly what the customer approved and when?
  - How does the bay learn that authorized scope changed?
article:
  what: >
    The repair authorization process captures the customer's informed yes
    or no on each line of a repair estimate before the bay touches the
    vehicle. It begins when the estimate is ready to present and ends
    when approved and declined lines, the total, the contact method, and
    the approval time are recorded on a work authorization and the same
    scope has reached the technician and the parts desk. In an auto
    repair shop it is owned by the service advisor, and every added
    finding during the repair reopens it for a fresh decision.
  why: >
    An unclear approval costs more than the repair. A customer who was
    told to proceed without a list of lines can dispute any of them at
    pickup, and the shop cannot prove which estimate version or price was
    accepted. A verbal add-on that never reached the record appears on
    the invoice with no evidence behind it. A declined safety item that
    loses its date and reason is gone the next time the vehicle comes in.
    The process turns each decision into a durable record that protects
    both the customer's consent and the shop's right to bill.
  how: >
    The service advisor presents the choices from the repair estimate,
    explaining for each decision line the finding, the proposed
    correction, the consequence of waiting, the price, and the timing.
    The advisor answers scope questions, confirming what the selected
    work will resolve and which recorded concerns will remain open. The
    decision is captured on the work authorization with approved and
    declined lines, the total, the contact method, and the approval time,
    backed by a signature or a timestamped digital approval. The advisor
    then releases the work so the bay and the parts desk receive exactly
    the authorized scope the customer accepted, and any new finding
    during the repair returns to the advisor for a new authorization
    event.
  controls:
    - name: Line-level approval
      note: The work authorization lists each approved and declined line with its price, so a blanket proceed is never the only evidence of consent.
    - name: Timestamp and contact method recorded
      note: Every approval carries when it was given and how, whether in person, by phone, or by digital signature.
    - name: Declined lines kept with date and reason
      note: Declined work stays on the vehicle history with the decline date so the recommendation can be revisited at the next visit.
    - name: Estimate version tied to the authorization
      note: The authorization names the estimate version it approves so a later price change cannot be confused with what the customer accepted.
    - name: Added scope requires a new authorization
      note: Work beyond the approved lines stops until a new authorization event is recorded and the bay is notified.
