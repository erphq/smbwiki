id: property-vendor-control
name: Property vendor control
kind: skill
department: supply
summary: >-
  Defines service scope and access, verifies insurance, dispatches work,
  checks completion, reconciles invoices, and records recurring performance.
  Property vendor control leaves a current work basis, a field record, and
  acceptance evidence that another operator can trace.
inputs:
  - lease
outputs:
  - property-operating-statement
steps:
  - name: Confirm the work basis
    note: >-
      Before property vendor control, read the current scope and revisions,
      then verify current leases, tenant contacts, vendor contracts, property
      budget, building systems, compliance calendar, and owner authority.
  - name: Set the field controls
    note: >-
      Translate property vendor control into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During property vendor control, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept property vendor control, check the completed work against
      accurate charges and recoveries, maintained common areas, controlled
      vendors, documented tenant work, and timely owner reporting, then close
      correction and issue the resulting record.
tension: >-
  Property vendor control has to remain inside its acceptance basis while
  production moves. Lease duties, physical operations, and accounting can
  drift apart until a tenant dispute or major repair exposes the gap.
failure_modes:
  - name: Property vendor control starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      property vendor control is settled.
    signal: >-
      The property vendor control work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Property vendor control closes without evidence
    cost: >-
      A concealed condition or required result from property vendor control
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Property vendor control is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Property vendor control is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Property vendor control starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Property vendor control uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Commercial lease and property operations
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of property vendor control.
  - name: Evidence control
    note: >-
      Acceptance checks for property vendor control have to be captured while
      the relevant condition can still be observed and corrected.
automation:
  now: >-
    Property vendor control can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting property vendor control
    remain human.
questions:
  - >-
    Which unresolved condition can stop property vendor control before work
    begins?
  - >-
    Which record proves property vendor control was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The property vendor control process governs every outside service a
    commercial property manager brings onto a building, from janitorial,
    landscaping, and elevator service to HVAC, security, and repair
    contractors. It begins when a lease or the property budget creates a
    service obligation and ends when the work has been scoped, insured,
    dispatched, verified, invoiced, and reported to the owner on the
    property operating statement. It is owned by the property manager,
    with maintenance staff checking completion and the property
    accountant reconciling invoices to contracts and tenant recoveries.
  why: >
    Vendors are how lease promises get kept and how owner money leaves
    the property. Without control, an uninsured contractor works on the
    roof, a recurring service is billed at a rate the contract no longer
    supports, common area maintenance is charged back to tenants without
    proof it was performed, and a tenant dispute or a major repair is the
    first time anyone compares the lease, the work, and the accounting.
    The process keeps scope, insurance, dispatch, completion, and invoice
    attached to one vendor record so those gaps show up on the statement
    and never in a lawsuit.
  how: >
    The property manager confirms the work basis by reading current
    leases, tenant contacts, vendor contracts, the property budget,
    building systems, the compliance calendar, and owner authority
    limits, so every service need has a contract, a budget line, and an
    approver. The field controls then define scope, access, hours,
    insurance requirements, hold points such as tenant notification, and
    the completion record each vendor must leave. As work is dispatched
    and performed, the manager and maintenance staff record what was
    done, when, by whom, and any condition that changed the plan.
    Acceptance checks accurate charges and recoveries, maintained common
    areas, controlled vendors, documented tenant work, and timely owner
    reporting; corrections are closed and the results flow into the
    property operating statement.
  controls:
    - name: Certificate of insurance current before dispatch
      note: No vendor is released to the property until its liability and workers' compensation certificates are on file and unexpired.
    - name: Contract rate matched on every invoice
      note: Each vendor invoice is checked against the contract rate, the dispatched scope, and the completion record before it is approved for payment.
    - name: Completion verified by property staff
      note: A manager or maintenance technician confirms the work was performed to scope before the vendor's invoice moves to approval.
    - name: Tenant recovery traced to the lease
      note: Every charge recovered from tenants maps to a lease clause and a performed service, so the reconciliation survives a tenant audit.
    - name: Recurring performance record
      note: Response time, missed visits, and quality findings are logged by vendor so contract renewal decisions rest on evidence.
