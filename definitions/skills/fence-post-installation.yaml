id: fence-post-installation
name: Fence post installation
kind: skill
department: operations
summary: >-
  Sets spacing, hole dimensions, depth, alignment, concrete or driven support,
  bracing, cure, and protection around utilities. Fence post installation
  leaves a current work basis, a field record, and acceptance evidence that
  another operator can trace.
inputs:
  - site-plan
outputs:
  - quality-report
steps:
  - name: Confirm the work basis
    note: >-
      Before fence post installation, read the current scope and revisions,
      then verify verified boundary or approved alignment, located utilities,
      selected system, known grade, gate geometry, material, and access.
  - name: Set the field controls
    note: >-
      Translate fence post installation into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During fence post installation, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept fence post installation, check the completed work against
      line, grade, post embedment, spacing, fastening, gate operation, finish
      condition, security, and restored site, then close correction and issue
      the resulting record.
tension: >-
  Fence post installation has to remain inside its acceptance basis while
  production moves. A fence can be straight and complete while occupying the
  wrong line or leaving gates and grades unusable.
failure_modes:
  - name: Fence post installation starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for fence
      post installation is settled.
    signal: >-
      The fence post installation work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Fence post installation closes without evidence
    cost: >-
      A concealed condition or required result from fence post installation
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Fence post installation is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Fence post installation is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Fence post installation starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Fence post installation uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Fence layout and field fit
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of fence post installation.
  - name: Evidence control
    note: >-
      Acceptance checks for fence post installation have to be captured while
      the relevant condition can still be observed and corrected.
automation:
  now: >-
    Fence post installation can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting fence post installation
    remain human.
questions:
  - >-
    Which unresolved condition can stop fence post installation before work
    begins?
  - >-
    Which record proves fence post installation was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The fence post installation process sets the posts that everything else
    depends on: the crew marks spacing along the approved line, digs or
    drives to the required depth and hole dimensions, aligns each post plumb
    and to the string, sets it in concrete or by driving, braces it,
    protects it during cure, and keeps every hole clear of located
    utilities. It starts once the line and utility locates are confirmed and
    ends with a cured, accepted run of posts recorded on the quality report.
    A fence contractor's crew lead owns it.
  why: >
    Every fence defect that cannot be fixed later starts at the posts. A
    post set off the boundary puts the whole fence on the neighbor's land. A
    post set shallow heaves in the first frost, and a gate post set without
    extra depth and bracing sags under the gate's weight within a season. A
    utility strike during digging stops the job and can injure the crew.
    Once the concrete cures, correcting any of these means pulling the post
    and starting over, so the process puts the checks before the pour.
  how: >
    The lead reads the site plan and revisions and confirms the verified
    boundary or approved alignment, located utilities, the selected system,
    known grade, gate geometry, material, and access. Field controls set the
    string line, post spacing marks, hole depth and diameter by post type,
    the setting method, the bracing and cure period, the exclusion around
    utility marks, and the hold point where posts are checked before
    concrete is placed. During setting the crew records each post's
    location, depth, and alignment, notes any rock, water, or utility found
    in a hole, and stops when the ground or the line differs from the plan.
    Acceptance checks line, grade, embedment, spacing, and gate post
    geometry, and the run is recorded on the quality report before panels
    are hung.
  controls:
    - name: Utility locates walked before digging
      note: The lead walks the locate marks against the post layout and hand digs any hole inside the marked tolerance zone.
    - name: Depth and alignment checked before concrete
      note: Each post's depth, plumb, and position on the string are checked and recorded before the hole is filled.
    - name: Gate posts set to the gate specification
      note: Gate posts get the depth, footing size, and bracing the gate geometry requires, and the check is recorded separately.
    - name: Cure period held before loading
      note: The date and time posts were set are recorded, and no panel or gate is hung until the cure period has passed.
    - name: Changed ground recorded per hole
      note: Rock, water, fill, or buried material found in a hole is recorded with the post number and the decision made.
