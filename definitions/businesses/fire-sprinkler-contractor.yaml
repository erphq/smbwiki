article:
  operating_model: >
    A fire sprinkler contractor spends much of its week before pipe
    reaches the site: surveying hazards and water supply, producing
    hydraulic calculations, getting drawings approved by the authority,
    and releasing fabrication. Installation then runs around ceilings,
    structure, and other trades, and ends in flushing, pressure tests,
    and acceptance with the inspector present. Sprinkler hydraulic
    design, sprinkler fabrication coordination, and sprinkler testing
    and acceptance are the load-bearing skills, because an obstruction
    or a wrong hanger detail found at acceptance is rework in a finished
    ceiling. Service work adds inspections, impairment response, and
    emergency calls in occupied buildings. The tension is between
    approved drawings and the field conditions the drawings did not
    show.
  starting: >
    Most states license fire sprinkler contractors or the responsible
    designer and fitters, often through the fire marshal, and the
    authority having jurisdiction reviews drawings per job, so the
    license and a designer with recognized certification are the first
    requirements. Business registration, employer registration, the
    insurance that general contractors and building owners require, and
    accounts with a fire protection equipment distributor and a pipe
    fabricator follow. The minimum team is an owner-operator, an
    estimator who can read hazard classifications, a project manager,
    and a trade foreperson with an installer, with an office manager
    over intake and invoicing. The first records are the job request,
    the quote, the construction plan, the test report, the work order,
    and job photos, and the skills that must work on the first project
    are lead intake, quoting, sprinkler system survey, sprinkler
    hydraulic design, sprinkler pipe installation, and sprinkler
    testing and acceptance.
  economics: >
    Revenue is quoted installation projects plus recurring inspection,
    testing, maintenance, emergency service, impairment response, and
    monitoring coordination. Installation is priced per head and per
    foot of pipe against hazard class and building type; inspections
    are priced per system on an annual cycle and are the steadier
    stream. Gross margin depends on design accuracy and fabrication fit,
    so project gross margin, rework rate, and on-time completion decide
    profit, with quote win rate and booking rate on service agreements
    showing whether the recurring base is growing. Schedule variance and
    days sales outstanding matter because sprinkler work sits inside a
    general contractor's schedule and draw cycle. The business is
    labor-intensive with capital tied up in fabricated pipe between
    release and installation, and a callback in an occupied building is
    expensive because it involves an impairment.
