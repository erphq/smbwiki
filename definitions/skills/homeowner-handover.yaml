id: homeowner-handover
name: Homeowner handover
kind: skill
department: operations
summary: >-
  Closes inspection, punch work, operating instruction, keys, warranties,
  finish care, open commitments, and final acceptance with the buyer.
  Homeowner handover leaves a current work basis, a field record, and
  acceptance evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - closeout-package
steps:
  - name: Confirm the work basis
    note: >-
      Before homeowner handover, read the current scope and revisions, then
      verify approved plans, lot controls, selections, permits, trade scopes,
      and long-lead dates.
  - name: Set the field controls
    note: >-
      Translate homeowner handover into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During homeowner handover, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept homeowner handover, check the completed work against the
      approved plan, inspection record, owner selections, and turnover
      requirements, then close correction and issue the resulting record.
tension: >-
  Homeowner handover has to remain inside its acceptance basis while
  production moves. A missed dependency can idle several trades and move the
  promised completion date.
failure_modes:
  - name: Homeowner handover starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      homeowner handover is settled.
    signal: >-
      The homeowner handover work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Homeowner handover closes without evidence
    cost: >-
      A concealed condition or required result from homeowner handover cannot
      be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Homeowner handover is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Homeowner handover is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Homeowner handover starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Homeowner handover uses field evidence, production variance, defects,
      and closeout results to improve the next estimate, work package, and
      control point.
competencies:
  - name: Residential construction sequencing
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of homeowner handover.
  - name: Evidence control
    note: >-
      Acceptance checks for homeowner handover have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Homeowner handover can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting homeowner handover remain
    human.
questions:
  - Which unresolved condition can stop homeowner handover before work begins?
  - >-
    Which record proves homeowner handover was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The homeowner handover process closes a new home with its buyer: final
    inspection, punch work, an orientation walk that shows the owner how
    the systems operate, keys and access codes, warranty documents, finish
    care instructions, a list of any commitments still open with dates,
    and the buyer's final acceptance. It starts when the home has passed
    its final inspection and the punch list is being closed and ends when
    the buyer has signed acceptance and the closeout package is complete.
    The superintendent owns the walk and the punch work, and the builder's
    closing coordinator owns the package.
  why: >
    Handover is the last impression and the start of the warranty period.
    A buyer who takes possession with punch items undone, no idea how the
    HVAC filter or the water shutoff works, and no written list of what
    the builder still owes them calls the warranty line for everything
    and tells their friends. An open commitment with no date turns into a
    dispute, and a missing warranty document turns into the builder
    covering a manufacturer's defect. The process protects the buyer's
    move-in, the warranty cost, and the referral the builder's next sale
    depends on.
  how: >
    The superintendent reads the current scope and revisions and confirms
    the approved plans, lot controls, selections, permits, trade scopes,
    and any long-lead item still outstanding before scheduling the walk.
    The handover controls are then set: the pre-walk inspection, the punch
    list and its closure deadline, the orientation checklist by system,
    the key and code register, the warranty and finish care documents, the
    open commitments list, and the acceptance signature. During the walk
    the superintendent records each punch item with owner and date, the
    systems demonstrated, keys and codes issued, documents given, and any
    concern the buyer raises, and stops the acceptance if a safety or
    occupancy item is open. At acceptance the superintendent checks the
    home against the approved plan, inspection record, owner selections,
    and turnover requirements, closes correction, and the closing
    coordinator issues the closeout package with the signed acceptance.
  controls:
    - name: Punch list closed or dated
      note: Every punch item is either closed with a photo or carries an owner and a date on the open commitments list the buyer signs.
    - name: Orientation checklist signed by system
      note: Each system demonstrated, from shutoffs to filters to appliances, is ticked and the buyer initials the checklist.
    - name: Key and code register
      note: Every key, remote, and access code issued is recorded with the buyer's signature and the builder's retained copies are noted.
    - name: Warranty documents in the package
      note: Manufacturer warranties, the builder's warranty, and finish care instructions are listed and included before acceptance is signed.
    - name: Acceptance signature with open items visible
      note: The buyer signs acceptance on a form that lists every open commitment and its date, so nothing is owed by memory.
