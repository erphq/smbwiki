id: shipper-sales
name: Shipper sales
kind: skill
department: sales
summary: >
  Shipper sales develops freight demand the brokerage can price and
  operate. The work identifies the customer's decision process, recurring
  lanes or project need, commodity and service constraints, credit and
  payment expectations, incumbent problems, and the first load request.
inputs: []
outputs: [load-request]
steps:
  - name: Establish operating fit
    role: shipper-sales-representative
    note: >
      Freight type, geography, volume pattern, equipment, service level,
      shipper role, and brokerage capability are aligned before pursuing a
      quote.
  - name: Map the buying process
    role: shipper-sales-representative
    note: >
      Decision owner, routing guide, tender method, credit approval,
      pricing event, required documents, and performance review are known.
  - name: Qualify the lane and problem
    role: shipper-sales-representative
    note: >
      Origin, destination, timing, commodity, volume variability,
      appointment behavior, accessorial exposure, and current failure are
      specific enough for operations to evaluate.
  - name: Create the load request
    role: shipper-sales-representative
    produces: [load-request]
    note: >
      The first opportunity carries the actual movement requirement,
      customer promise, commercial owner, and next decision.
tension: >
  Pipeline growth competes with operating fit and credit quality. Broad
  pursuit fills the sales board; freight outside the brokerage's carrier,
  service, or payment capability creates losses after the customer says yes.
failure_modes:
  - name: Volume claim lacks shipment evidence
    cost: >
      Pricing and carrier development are built around freight that never
      enters the tender stream.
    signal: >
      Forecasted lanes have no sample history, calendar, award rule, or
      first shipment date.
  - name: Service promise precedes operations review
    cost: >
      Sales commits coverage, tracking, appointment, or recovery the
      operating team cannot deliver consistently.
    signal: >
      Customer-facing requirements appear only after the first load request.
  - name: Payment path remains unknown
    cost: >
      Loads move before credit, billing portal, document, and payment-term
      requirements are established.
    signal: >
      A pricing opportunity advances with no credit owner or payable route.
maturity:
  - level: run badly
    looks_like: >
      Sales collects lanes and contact details while operations discovers
      freight condition and customer rules after award.
  - level: run well
    looks_like: >
      Fit, buying process, lane facts, service expectations, credit, and
      first movement are qualified before the load request.
  - level: run excellently
    looks_like: >
      Win and loss reasons refine target accounts, actual tenders correct
      pipeline claims, and operations joins before material promises.
competencies:
  - name: Freight discovery
    note: >
      The seller can uncover timing, facility, commodity, equipment,
      accessorial, and communication details hidden behind a lane pair.
  - name: Commercial qualification
    note: >
      Customer urgency, decision authority, credit, volume evidence, and
      operating fit determine whether the opportunity deserves effort.
automation:
  now: >
    Account research, activity capture, lane history, credit workflow,
    qualification prompts, follow-up, and load-request creation.
  human: >
    Trust building, discovery, fit judgment, negotiation access, and
    deciding when attractive volume would be poor freight.
questions:
  - What operating promise still awaits operations review?
  - What evidence supports the volume and timing on the highest-value open lane?
article:
  what: >
    The shipper sales process is how a freight brokerage finds and
    qualifies freight it can actually price and move, from the first
    conversation with a shipper to the first load request the operations
    desk can act on. It covers whether the freight fits the brokerage's
    carriers and service, how the shipper decides and pays, what the
    lane really looks like, and what the incumbent is getting wrong. A
    shipper sales representative owns it in a freight brokerage, with
    operations joining before any service promise and credit signing off
    before any load moves.
  why: >
    It protects the brokerage from winning freight it cannot serve or
    collect on. A lane pursued on a volume claim with no tender history
    leaves carrier development and pricing built around loads that never
    arrive; a tracking or appointment promise made before operations
    reviews it becomes a service failure on the first shipment; a
    customer moved before credit and billing requirements are known
    becomes a receivable the brokerage cannot collect. Each of those
    losses arrives after the customer has already said yes.
  how: >
    The representative first establishes operating fit by aligning the
    freight type, geography, volume pattern, equipment, service level,
    and the shipper's role with what the brokerage's carrier base and
    service can deliver. The representative then maps the buying
    process, learning who decides, how the routing guide and tender
    work, how credit is approved, when pricing happens, what documents
    are required, and how performance is reviewed. The lane and the
    shipper's current problem are qualified next, with origin,
    destination, timing, commodity, volume variability, appointment
    behavior, accessorial exposure, and the incumbent's failure stated
    specifically enough for operations to evaluate. The first
    opportunity is then written as a load request that carries the
    actual movement requirement, the promise made to the customer, the
    commercial owner, and the next decision.
  controls:
    - name: Operating fit recorded before a quote
      note: Equipment, geography, and service level are matched to brokerage capability on the account record before any pricing effort starts.
    - name: Volume claim backed by evidence
      note: A forecasted lane carries sample shipment history, a calendar, an award rule, or a first shipment date before it counts in the pipeline.
    - name: Operations review before a service promise
      note: Coverage, tracking, appointment, and recovery commitments are reviewed by the operations desk before they are made to the shipper.
    - name: Credit and payment path before the first load
      note: A named credit owner, billing portal, document list, and payment terms are on file before the load request is released to operations.
    - name: Win and loss reasons captured
      note: Each closed opportunity records why it was won or lost so target accounts and qualification prompts improve over time.
