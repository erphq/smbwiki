id: formwork-control
name: Formwork control
kind: skill
department: operations
summary: >-
  Sets and braces forms to the required line, grade, dimensions, openings,
  release condition, pressure, and stripping sequence. Formwork control leaves
  a current work basis, a field record, and acceptance evidence that another
  operator can trace.
inputs:
  - construction-plan
outputs:
  - test-report
steps:
  - name: Confirm the work basis
    note: >-
      Before formwork control, read the current scope and revisions, then
      verify surveyed layout, excavation acceptance, form dimensions, embeds,
      reinforcement, mix information, access, and weather controls.
  - name: Set the field controls
    note: >-
      Translate formwork control into work limits, sequence, responsibilities,
      hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During formwork control, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept formwork control, check the completed work against specified
      geometry, cover, placement record, finish, curing, and required concrete
      test results, then close correction and issue the resulting record.
tension: >-
  Formwork control has to remain inside its acceptance basis while production
  moves. Concrete fixes its location and many concealed details at placement,
  so an unchecked condition becomes demolition or structural repair.
failure_modes:
  - name: Formwork control starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      formwork control is settled.
    signal: >-
      The formwork control work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Formwork control closes without evidence
    cost: >-
      A concealed condition or required result from formwork control cannot be
      verified without opening, repeat work, delay, or a disputed exception.
    signal: >-
      Formwork control is released while its required check, location record,
      test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Formwork control is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Formwork control starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Formwork control uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Concrete production control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of formwork control.
  - name: Evidence control
    note: >-
      Acceptance checks for formwork control have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Formwork control can use digital revisions, checklists, hold points, photo
    capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting formwork control remain
    human.
questions:
  - Which unresolved condition can stop formwork control before work begins?
  - >-
    Which record proves formwork control was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The formwork control process sets and braces the forms that give a
    footing, wall, slab edge, or column its line, grade, dimensions, and
    openings, holds them against the pressure of wet concrete, and strips
    them in a sequence the cured concrete can carry. It starts when the
    surveyed layout and excavation are accepted and the reinforcement,
    embeds, and mix information are known, and it ends when the placed and
    cured concrete is checked against the specified geometry and the
    concrete test results are on the test report. The concrete foreman
    owns it for a poured concrete contractor.
  why: >
    Concrete fixes its location and every concealed detail at the moment
    it is placed. A form that moves under pressure, an embed that shifts,
    a blockout in the wrong place, or a form stripped before the concrete
    can hold itself becomes demolition, structural repair, or a permanent
    offset every trade above has to absorb. The process protects the
    engineer's geometry and cover, the crew standing next to a form under
    load, and the test record that proves the pour meets strength before
    the next load goes on it.
  how: >
    The foreman reads the current scope and revisions and confirms
    surveyed layout, excavation acceptance, form dimensions, embeds,
    reinforcement, mix information, access, and weather controls before
    forms are set. The field controls are then set: form and brace design
    for the pour rate and height, the sequence of setting, checking,
    placing, and stripping, hold points for a pre-pour check of line,
    grade, dimensions, openings, embeds, and cover, the release agent and
    stripping condition, and the record the crew keeps by pour. During
    setting and placement the crew records form dimensions, embed
    locations, reinforcement condition, mix tickets, placement times, and
    any point where ground, weather, or a delivery changed the plan. At
    acceptance the foreman checks geometry, cover, placement record,
    finish, and curing against the plan, waits for the required concrete
    test results, closes correction, and issues the test report.
  controls:
    - name: Pre-pour hold point
      note: Line, grade, dimensions, openings, embeds, reinforcement, and cover are checked and signed before concrete is ordered, since nothing can be moved after placement.
    - name: Form pressure and brace check
      note: Bracing is checked against the planned pour rate and height, and the pour rate is held to what the form was built for.
    - name: Embed and blockout record
      note: Every embed and opening is located and photographed in the form before placement so a covered item can be found without coring.
    - name: Stripping only on recorded strength
      note: Forms and shores are stripped only after the concrete test results or the specified time confirm the concrete can carry itself.
    - name: Test report closes the pour
      note: Mix tickets, placement times, cylinder results, and the geometry check are recorded together on the test report before the next load is applied.
