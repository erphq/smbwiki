article:
  operating_model: >
    A siding contractor works from the outside in. The estimator prices
    an elevation from field dimensions and openings, the project
    manager confirms substrate readiness and the sheathing, windows,
    roof edges, and penetrations installed by others, and the crew
    under a trade foreperson installs the weather barrier, flashing,
    layout, cladding, trim, and sealant, then runs the water-shedding
    check before the quality report closes the job. Substrate readiness
    and weather barrier installation are the load-bearing skills,
    because the drainage plane is concealed as soon as the cladding
    goes on and is only proven by the absence of leaks years later. The
    tension is between the visible elevation the customer judges and
    the hidden layers that decide whether the wall performs.
  starting: >
    In most states siding work on homes requires a contractor license
    or home improvement registration, and federal renovator
    certification applies when removing painted material from housing
    built before the lead paint ban; some cities require a permit for
    re-siding. Around that sit the business registration, sales tax
    registration where materials are taxable, employer registration
    for the first crew, and general liability and workers compensation
    coverage that general contractor customers will require. Capital
    items are a truck and trailer, staging or lifts, cutting and
    fastening tools, and supply accounts with a siding distributor and
    a sheet metal fabricator for custom flashing. The minimum roles are
    an owner-operator who estimates, a trade foreperson, and
    installers, with the office manager handling purchasing and
    invoicing and a project manager added once several jobs run at
    once. The first records are the quote, the construction plan, the
    work order, job photos of the concealed layers, the quality report,
    and the customer invoice, and the skills that must exist from the
    first wall are quoting, substrate readiness, weather barrier
    installation, siding layout, siding installation, and the exterior
    water-shedding check.
  economics: >
    Revenue is installed cladding area with weather barrier, flashing,
    trim, accessories, removal, disposal, repair, and warranty work
    priced into an accepted scope. Material is bought per square and
    per length from the distributor, so gross margin lives in crew
    hours per square, waste from cutting and layout, and the rework
    caused by inherited sheathing defects that were not caught at
    readiness inspection. The metrics that decide profit are project
    gross margin, rework rate, on-time completion, and schedule
    variance, with quote win rate and booking rate showing whether
    pricing matches the local market and days sales outstanding showing
    how general contractors pay. The trade is labor intensive with
    modest equipment, weather dependent, and exposed to callbacks long
    after payment, which is why documented concealed work and the final
    water-shedding check are margin protection as much as quality
    control.
