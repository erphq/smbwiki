id: staff-scheduling
name: Staff scheduling
kind: skill
department: people
summary: >
  Staff scheduling commits qualified labor to expected demand before
  the work arrives. The schedule must cover opening, service, closeout,
  and legally required breaks while accounting for appointments,
  operating hours, and known absences.
inputs: []
outputs: [shift-schedule]
steps:
  - name: Set the demand shape
    note: >
      Appointments, operating hours, and recurring rushes establish when
      coverage is needed.
  - name: Set minimum qualified coverage
    note: >
      Each period needs the roles and licenses required to perform and
      supervise the work offered.
  - name: Assign and publish
    produces: [shift-schedule]
    note: >
      A shift becomes covered when the assigned person has seen and
      accepted it.
  - name: Control changes
    note: >
      Swaps, absences, overtime, and early releases update the same
      schedule used by the floor.
tension: >
  Coverage competes with labor cost. Thin staffing creates queues and
  unsafe shortcuts when demand arrives; excess staffing consumes margin
  during hours that cannot be recovered.
failure_modes:
  - name: Headcount without qualification
    cost: >
      The location is staffed but cannot deliver, supervise, or legally
      sign off the work on the book.
    signal: >
      A shift depends on one licensed or specially trained person with
      no overlap.
  - name: Schedule published too late
    cost: >
      Reliable staff lose the ability to plan and last-minute absences
      become harder to cover.
    signal: >
      Availability conflicts appear after assignments are posted.
  - name: Informal changes
    cost: >
      Payroll, managers, and workers hold different versions of who is
      expected.
    signal: >
      Shift swaps live in messages while the active schedule remains
      unchanged.
maturity:
  - level: run badly
    looks_like: >
      Last week's schedule is copied forward and the manager fills gaps
      by calling people on the day.
  - level: run well
    looks_like: >
      Demand and qualification requirements shape the roster, changes
      are confirmed, and actual attendance returns to the schedule.
  - level: run excellently
    looks_like: >
      The manager can see future coverage risk, labor commitment, and
      fragile single-person dependencies before publishing.
competencies:
  - name: Demand reading
    note: >
      The scheduler separates recurring demand shape from recent noise
      and one-time events.
  - name: Capability mapping
    note: >
      Availability alone leaves opening, supervision, specialized work,
      and safe closeout capability unclear.
automation:
  now: >
    Availability collection, rule checks, template shifts, conflict
    detection, notifications, and labor forecasts.
  human: >
    Choosing where experienced coverage matters most and handling the
    fairness consequences of unpopular shifts or reduced hours.
questions:
  - Which upcoming shift has no qualified backup?
  - Are schedule changes reflected before payroll and opening checks use them?
article:
  what: >
    The staff scheduling process commits the right people, in the right
    roles and with the right licenses, to the hours the business expects
    to be busy, before those hours arrive. It starts from the
    appointment book, operating hours, and known absences, and it ends
    with a published shift schedule that each assigned person has
    accepted and that payroll and the floor use as the same record.
    Every business in the catalog with more than one employee runs it,
    from a coffee shop or a dental clinic to a courier company, and it
    belongs to the manager who owns the floor or the clinic day.
  why: >
    It protects the service the business has promised and the labor cost
    that pays for it. A shift with headcount and no one licensed to sign
    off the work cannot open the book it has taken; a schedule posted at
    the last minute leaves reliable staff unable to plan and makes an
    absence impossible to cover; a swap agreed in a group chat leaves
    the manager, the worker, and payroll each expecting a different
    person. Thin coverage produces queues and unsafe shortcuts, and
    excess coverage consumes margin in hours that cannot be recovered.
  how: >
    The manager first sets the demand shape from appointments, operating
    hours, and recurring rushes so it is clear when coverage is needed.
    For each period the manager sets the minimum qualified coverage,
    meaning the roles and licenses required to perform and to supervise
    the work on offer, including opening, closeout, and legally required
    breaks. People are then assigned to shifts and the schedule is
    published, with a shift counted as covered only when the assigned
    person has seen and accepted it. From publication onward, swaps,
    absences, overtime, and early releases are made on that same
    schedule, so the floor, the workers, and payroll all read one
    version of who is expected.
  controls:
    - name: Qualification check per period
      note: Every period is checked for the licensed or trained roles it needs, and a period that depends on one such person is flagged.
    - name: Acceptance before a shift is covered
      note: A shift shows as covered only after the assigned person has acknowledged it in the scheduling record.
    - name: Publication deadline
      note: The schedule is published by a fixed lead time each cycle, and late publication is recorded as an exception the owner sees.
    - name: Single source for changes
      note: Swaps and absences are entered on the published schedule, never agreed only in messages, before they take effect.
    - name: Actual attendance reconciled to the schedule
      note: Time records are compared with the schedule each pay period so payroll and coverage history reflect who actually worked.
