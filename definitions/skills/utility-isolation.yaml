id: utility-isolation
name: Utility isolation
kind: skill
department: compliance
summary: >-
  Identifies every service, confirms owner and utility actions, disconnects or
  protects feeds, locks out energy, and verifies the dead condition. Utility
  isolation leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - daily-report
steps:
  - name: Confirm the work basis
    note: >-
      Before utility isolation, read the current scope and revisions, then
      verify completed engineering survey, utility shutdown,
      hazardous-material disposition, exclusion zones, removal sequence, and
      disposal routes.
  - name: Set the field controls
    note: >-
      Translate utility isolation into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During utility isolation, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept utility isolation, check the completed work against specified
      removals, stable remaining structure, protected services and finishes,
      segregated waste, clean limits, and documented changed conditions, then
      close correction and issue the resulting record.
tension: >-
  Utility isolation has to remain inside its acceptance basis while production
  moves. Unknown loads, materials, utilities, and hidden connections make an
  unplanned removal sequence dangerous and destructive.
failure_modes:
  - name: Utility isolation starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      utility isolation is settled.
    signal: >-
      The utility isolation work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Utility isolation closes without evidence
    cost: >-
      A concealed condition or required result from utility isolation cannot
      be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Utility isolation is released while its required check, location record,
      test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Utility isolation is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Utility isolation starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Utility isolation uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Demolition sequence and existing-condition judgment
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of utility isolation.
  - name: Evidence control
    note: >-
      Acceptance checks for utility isolation have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Utility isolation can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting utility isolation remain
    human.
questions:
  - Which unresolved condition can stop utility isolation before work begins?
  - >-
    Which record proves utility isolation was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The utility isolation process is what a demolition contractor does before
    the first wall comes down: every service into the structure is identified,
    the owner and each utility's disconnection action is confirmed, feeds are
    disconnected or protected, remaining energy is locked out, and the dead
    condition is tested and recorded. It starts when the engineering survey
    and removal sequence are complete and ends with a daily report that
    records each service as isolated and verified, which releases the crew to
    begin removal. The site superintendent owns it, and a licensed electrician
    or the utility performs the disconnection where the law requires.
  why: >
    A live gas line, an energized feeder, or a charged water main inside a
    building being demolished is the most direct way a demolition contractor
    kills someone or floods the neighbor. Unknown loads, hidden connections,
    and services that a drawing does not show turn a planned removal sequence
    into an emergency. Taking the utility's word without a test, or leaving a
    lockout unrecorded, means the next shift cannot tell whether the line is
    dead. The record of who isolated what and when is what an inspector or an
    investigator asks for first.
  how: >
    The superintendent confirms the work basis by reading the current scope
    and revisions and verifying that the engineering survey is complete,
    utility shutdowns are scheduled, hazardous material disposition is
    settled, exclusion zones are set, the removal sequence is approved, and
    disposal routes exist. Field controls are then set for the crew: a list of
    every service, the owner and utility action for each, the lockout and
    tagging method, who verifies the dead condition, the hold point before any
    removal near a service, and the daily report format. During isolation the
    operator records each disconnection, cap, lockout, and test result with
    location and photos, and stops when an unknown service or hidden
    connection is found. Acceptance checks that the specified services are
    isolated, the remaining structure is stable, protected services and
    finishes are intact, and changed conditions are documented, corrections
    are closed, and the daily report is issued.
  controls:
    - name: Service list reconciled to the survey
      note: Every service found in the engineering survey and on the site is listed with its owner and isolation method before any disconnection is scheduled.
    - name: Utility confirmation in writing
      note: Each utility's disconnection is confirmed by written notice from the utility, and the confirmation is filed with the daily report.
    - name: Dead condition tested and recorded
      note: Electrical, gas, and pressure lines are tested for the dead condition by a qualified person after disconnection, and the test result is written with the time.
    - name: Lockout applied and logged
      note: Every isolated energy source carries a lock and tag, and the log names who applied it and who is allowed to remove it.
    - name: Removal held until isolation is signed
      note: No removal work starts near a service until the superintendent signs the daily report showing that service isolated and verified.
