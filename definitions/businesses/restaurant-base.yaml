id: restaurant-base
name: Restaurant (base)
abstract: true
revenue_model:
  - id: dine-in
    note: table service, the core covers-per-night economics
  - id: takeout
    note: phone and walk-in orders
  - id: catering
    note: event orders, quoted per job
skills:
  - ref: menu-planning
    roles: [head-chef]
    documents: [menu, recipe-card]
    metrics: [food-cost-percentage]
    software: [restaurant-pos]
  - ref: food-prep
    roles: [line-cook, head-chef]
    documents: [prep-list]
    metrics: [ticket-time]
    software: [kitchen-display-system]
  - ref: order-taking
    roles: [server]
    documents: [order-ticket]
    software: [restaurant-pos]
  - ref: food-inventory
    roles: [head-chef]
    documents: [purchase-order, supplier-invoice]
    metrics: [food-cost-percentage, waste-percentage]
    software: [inventory-management]
  - ref: staff-scheduling
    roles: [general-manager]
    documents: [shift-schedule]
    metrics: [labor-cost-percentage]
    software: [workforce-management]
  - ref: accounts-payable
    roles: [general-manager]
    documents: [supplier-invoice, payment-record]
    software: [accounting]
org:
  - role: owner-operator
    reports:
      - role: general-manager
        reports:
          - role: server
      - role: head-chef
        reports:
          - role: line-cook
          - role: dishwasher
licenses:
  us:
    - ref: food-service-license
      requirement: commonly-applicable
      condition: Commonly required by the state or local health authority for a food establishment.
      as_of: "2026-07-29"
    - ref: food-handler-permit
      requirement: commonly-applicable
      condition: Commonly required for covered food employees; the credential and training rules vary by jurisdiction.
      as_of: "2026-07-29"
    - ref: liquor-license
      requirement: conditional
      condition: Required only when the business sells or serves alcoholic beverages under state or local rules.
      as_of: "2026-07-29"
  in:
    - ref: fssai-registration
      requirement: required
      condition: Every food business operator holds FSSAI registration or a licence; the tier follows annual turnover under the 2011 licensing regulations.
      as_of: "2026-07-31"
    - ref: gst-registration-india
      requirement: conditional
      condition: Required once aggregate annual turnover crosses the GST threshold for services; the threshold is lower in special category states.
      as_of: "2026-07-31"
    - ref: shops-and-establishments-registration
      requirement: commonly-applicable
      condition: Commonly required for a shop or commercial establishment under the operating state's Shops and Establishments Act.
      as_of: "2026-07-31"
  sg:
    - ref: acra-business-registration
      requirement: required
      condition: The entity or business name must be registered with ACRA before commencing business.
      as_of: "2026-07-31"
    - ref: sfa-food-shop-licence
      requirement: required
      condition: Required to operate a retail food outlet; the licence attaches to the premises and the operator.
      as_of: "2026-07-31"
    - ref: gst-registration-singapore
      requirement: conditional
      condition: Compulsory once taxable turnover exceeds one million Singapore dollars in a year.
      as_of: "2026-07-31"
supply_chain:
  buys_from: [food-distributor, restaurant-equipment-dealer]
  sells_to: [retail-consumer]
