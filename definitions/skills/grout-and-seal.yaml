id: grout-and-seal
name: Grout and seal
kind: skill
department: operations
summary: >-
  Prepares joints, mixes and places grout, shapes and cleans the surface,
  installs movement sealant, cures, and applies sealer where specified. Grout
  and seal leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - quality-report
steps:
  - name: Confirm the work basis
    note: >-
      Before grout and seal, read the current scope and revisions, then verify
      stable and flat substrate, cured work, approved tile and setting system,
      resolved movement joints, dry layout, and environmental control.
  - name: Set the field controls
    note: >-
      Translate grout and seal into work limits, sequence, responsibilities,
      hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During grout and seal, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept grout and seal, check the completed work against bond
      coverage, plane, joint alignment, movement accommodation, drainage,
      lippage, grout, sealant, and approved appearance, then close correction
      and issue the resulting record.
tension: >-
  Grout and seal has to remain inside its acceptance basis while production
  moves. A visually acceptable surface can conceal poor bond, trapped water,
  or missing movement capacity.
failure_modes:
  - name: Grout and seal starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for grout
      and seal is settled.
    signal: >-
      The grout and seal work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Grout and seal closes without evidence
    cost: >-
      A concealed condition or required result from grout and seal cannot be
      verified without opening, repeat work, delay, or a disputed exception.
    signal: >-
      Grout and seal is released while its required check, location record,
      test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Grout and seal is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Grout and seal starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Grout and seal uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Tile assembly layout and bond control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of grout and seal.
  - name: Evidence control
    note: >-
      Acceptance checks for grout and seal have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Grout and seal can use digital revisions, checklists, hold points, photo
    capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting grout and seal remain human.
questions:
  - Which unresolved condition can stop grout and seal before work begins?
  - >-
    Which record proves grout and seal was accepted before it was covered,
    loaded, energized, occupied, or handed over?
