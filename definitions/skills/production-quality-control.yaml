id: production-quality-control
name: Production quality control
kind: skill
department: quality
summary: >
  Production quality control establishes how work is checked, records
  observed results, contains nonconforming output, authorizes
  disposition, and releases accepted quantity. Specification,
  measurement, traceability, and decision authority stay connected.
inputs: [production-order, routing-sheet]
outputs: [quality-report]
steps:
  - name: Establish the inspection
    role: quality-inspector
    consumes: [production-order, routing-sheet]
    note: >
      Current revision, characteristics, method, equipment, sampling,
      tolerance, records, and release authority are confirmed.
  - name: Verify starting control
    role: quality-inspector
    note: >
      Material identity, measurement equipment, setup result, first
      article, and required approvals are acceptable before the run
      proceeds.
  - name: Inspect production
    role: machine-operator
    consumes: [routing-sheet]
    note: >
      Required in-process checks, observations, quantities, tool
      changes, and process exceptions are recorded where they occur.
  - name: Control nonconformance
    role: quality-inspector
    note: >
      Suspect quantity is identified and held while rework, repair,
      use-as-is, scrap, or supplier action receives authority.
  - name: Release accepted output
    role: quality-inspector
    produces: [quality-report]
    note: >
      Results, accepted quantity, traceability, deviations, disposition,
      signoff, and required customer evidence are complete.
tension: >
  Production flow competes with independent evidence of conformance.
  Excess inspection consumes capacity; weak inspection allows hidden
  defects, mixed status, and unsupported release.
failure_modes:
  - name: Inspection uses an obsolete requirement
    cost: >
      Accepted records support the wrong revision, tolerance, method, or
      customer condition.
    signal: >
      Inspection plan revision differs from the production order.
  - name: Suspect quantity is not physically controlled
    cost: >
      Nonconforming units mix with accepted output and can ship.
    signal: >
      System hold exists without identified container or location.
  - name: Measurement result lacks traceability
    cost: >
      The shop cannot show which lot, unit, instrument, method, or
      operator supports release.
    signal: >
      Quality report stores pass without observed values or identity.
maturity:
  - level: run badly
    looks_like: >
      Quality is checked at the end, and operators sort defects when
      the customer or final inspector finds them.
  - level: run well
    looks_like: >
      Requirement, first article, in-process check, containment,
      disposition, traceability, and release share one record.
  - level: run excellently
    looks_like: >
      Defect and process evidence changes methods, tooling, suppliers,
      maintenance, training, and design review before recurrence.
competencies:
  - name: Measurement and interpretation
    note: >
      The inspector selects a valid method and understands the
      uncertainty and limits of the observed result.
  - name: Nonconformance control
    note: >
      Staff protect identity and custody while the authorized technical
      and commercial disposition is made.
automation:
  now: >
    Inspection plans, instrument status, data capture, statistical
    alerts, holds, nonconformance routing, certificates, and release
    status.
  human: >
    Method suitability, ambiguous specification, visual acceptance,
    root cause, disposition authority, and customer deviation decisions.
questions:
  - Which accepted quantity cannot be traced to the required checks?
  - Which suspect material is not physically separated from saleable output?
article:
  what: >
    The production quality control process sets how a job's output will
    be checked before the run starts, records what was actually measured
    as it runs, physically holds anything suspect, gets an authorized
    decision on what happens to it, and releases only the accepted
    quantity with the evidence to support it. It starts from the
    production order and the routing sheet and ends with a quality
    report that ties results, traceability, deviations, disposition, and
    signoff to the shipped units. A quality inspector owns it in a
    machine shop, a commercial printer, or a sign shop, with machine
    operators recording in-process checks.
  why: >
    It protects the customer from receiving parts, prints, or signs that
    do not meet the specification, and the shop from a release it cannot
    defend. Inspection against an obsolete revision accepts the wrong
    part with a clean record. A hold that exists in the system but not
    on the floor lets nonconforming units mix with good ones and ship. A
    quality report that says pass without observed values, instrument,
    and operator cannot show what supports the release when the customer
    asks. Excess inspection consumes capacity; the process is where the
    right amount is decided.
  how: >
    The inspector establishes the inspection from the production order
    and the routing sheet: current revision, characteristics to check,
    method, equipment, sampling, tolerance, records, and who can
    release. Starting control is verified before the run proceeds:
    material identity, measurement equipment status, setup result, first
    article, and required approvals. During production the machine
    operator records the required in-process checks, observations,
    quantities, tool changes, and process exceptions where they occur on
    the routing sheet. When something is suspect, the inspector
    identifies the quantity, holds it in a marked container or location,
    and routes it for an authorized disposition of rework, repair,
    use-as-is, scrap, or supplier action. Accepted output is released
    with a quality report carrying results, accepted quantity,
    traceability, deviations, disposition, signoff, and any customer
    evidence.
  controls:
    - name: Inspection plan revision equals order revision
      note: The plan's revision is checked against the production order before first article, and a difference stops the setup until resolved.
    - name: First article before the run
      note: A first article is measured, recorded with values, and signed before production quantity is authorized at the work center.
    - name: Observed values on every check
      note: Each recorded check carries the measured value, instrument identity, operator, and time, and a pass mark without values is rejected.
    - name: Physical hold with identified location
      note: Suspect material is tagged and placed in a named container or area, and the system hold references that location.
    - name: Disposition by named authority
      note: Rework, repair, use-as-is, scrap, and supplier action are approved by a person with that authority, and the signoff is on the quality report.
