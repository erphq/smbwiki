id: vehicle-intake
name: Vehicle intake
kind: skill
department: operations
summary: >
  Vehicle intake establishes the condition and customer instruction
  that the shop will work from. The service advisor turns the driver's
  description into testable concerns, records the vehicle and contact
  details, and opens the repair order used by the bay and front desk.
inputs: [appointment-record]
outputs: [repair-order]
steps:
  - name: Confirm vehicle and authority
    role: service-advisor
    consumes: [appointment-record]
    note: >
      Plate, mileage, keys, contact route, and the person allowed to
      approve work belong on the visit before the vehicle moves.
  - name: Write the concerns
    role: service-advisor
    note: >
      The driver's own description preserves when, where, and under what
      conditions the symptom appears.
  - name: Record arrival condition
    role: service-advisor
    note: >
      Fuel level, warning lights, visible damage, and items left in the
      vehicle settle avoidable disputes at pickup.
  - name: Open the repair order
    role: service-advisor
    produces: [repair-order]
    note: >
      Each concern gets a separate line so diagnosis and authorization
      can close it separately.
tension: >
  Counter speed competes with a usable baseline. A rushed handoff gets
  the vehicle out of the lane; missing symptom detail or arrival damage
  follows the car through every later decision.
failure_modes:
  - name: Concern rewritten as a diagnosis
    cost: >
      The technician tests an assumption and may miss the condition the
      driver reported.
    signal: >
      The repair order names a failed part and omits the original
      symptom.
  - name: Approval contact unclear
    cost: >
      The bay waits while the shop searches for someone authorized to
      make a price or scope decision.
    signal: >
      The repair order has a phone number but no preferred route or
      approval authority.
  - name: Arrival condition omitted
    cost: >
      Existing damage or a warning light becomes a dispute when the
      vehicle is returned.
    signal: >
      The walkaround section is blank on vehicles already in a bay.
maturity:
  - level: run badly
    looks_like: >
      Keys and a phone number are handed to a technician, and the
      customer later repeats the complaint to whoever calls.
  - level: run well
    looks_like: >
      Every concern, contact instruction, mileage reading, and visible
      condition is recorded before the vehicle enters production.
  - level: run excellently
    looks_like: >
      Intake language supports a reproducible test, prior history is
      surfaced, and every downstream status call refers to the same
      concern line.
competencies:
  - name: Symptom interviewing
    note: >
      Drivers describe experiences; the advisor has to capture operating
      conditions without turning the conversation into a technical guess.
  - name: Condition observation
    note: >
      A consistent walkaround finds the details most likely to cause a
      disagreement later.
automation:
  now: >
    Appointment lookup, vehicle identification, digital walkarounds,
    history retrieval, contact preferences, and repair-order creation.
  human: >
    Listening for the actual symptom, recognizing safety implications,
    and deciding what must be documented in front of the customer.
questions:
  - Can a technician reproduce each concern from the intake wording alone?
  - Who can approve added work, and how should that person be reached?
article:
  what: >
    The vehicle intake process is the opening of a visit to an auto repair
    shop, run by the service advisor at the counter or in the lane: the
    vehicle and the person authorized to approve work are confirmed, the
    driver's description of each concern is written in testable terms, the
    arrival condition is recorded on a walkaround, and a repair order is
    opened with one line per concern. It starts when the vehicle arrives
    against an appointment record or as a walk-in and ends when the repair
    order is released to the bay with contact and approval instructions. The
    service advisor owns it and the shop manager sets the standard for what
    intake must capture.
  why: >
    Everything the shop does later is built on the intake. A concern rewritten
    as a diagnosis sends the technician to test an assumption and miss the
    condition the driver actually experienced. A phone number without an
    approval route leaves the bay waiting while the shop looks for someone who
    can say yes. A blank walkaround turns a scratch, a warning light, or a
    missing item into a dispute at pickup that the shop cannot win. The repair
    order is the record that every later status call, estimate, and quality
    check refers to.
  how: >
    The advisor confirms vehicle and authority from the appointment record,
    capturing plate, mileage, keys, the contact route, and the person allowed
    to approve work before the vehicle moves. The concerns are then written in
    the driver's own words, preserving when, where, and under what conditions
    each symptom appears, and the advisor asks the questions needed to make
    each concern reproducible without turning it into a guess at the cause.
    The arrival condition is recorded on the walkaround: fuel level, warning
    lights, visible damage, and items left in the vehicle, with photos where
    the shop uses them. The advisor opens the repair order with a separate
    line for each concern so diagnosis and authorization can close each one
    independently, and releases it to the bay with the approval contact and
    any time or cost limit the customer set.
  controls:
    - name: Approval authority named on the order
      note: The repair order records who can approve added work, how to reach them, and any limit they set, before the vehicle enters production.
    - name: Concern written as a symptom
      note: Each concern line records the driver's description with conditions, and a line that names a failed part without the symptom is rewritten.
    - name: Walkaround completed before the bay
      note: The arrival condition section, with fuel, warning lights, damage, and belongings, is completed and acknowledged by the customer before the vehicle is moved.
    - name: One line per concern
      note: Concerns are never combined on a single line, so each can be diagnosed, quoted, approved, and closed on its own.
    - name: Mileage and identity read from the vehicle
      note: Plate or VIN and mileage are read from the vehicle itself and recorded on the repair order, and a mismatch with the appointment record is resolved before release.
