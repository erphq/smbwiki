catalog_group: construction-property
extends: project-services-base
revenue_model:
  - id: cladding-material-trim-and-repair
    note: installed cladding area plus weather barrier, flashing, trim, accessories, removal, disposal, repair, and warranty work
summary: >-
  A siding contractor covers the exterior wall with weather barrier,
  flashings, trim, cladding, fasteners, joints, and sealant interfaces. Field
  dimensions and opening details decide the layout, while the completed
  surface must drain water and accommodate movement behind a consistent
  visible elevation.


  The crew inherits sheathing defects and depends on roofs, windows, doors,
  decks, utilities, and penetrations installed by others. Readiness inspection
  and photo records protect concealed drainage work. Cutting, fastening,
  clearances, transitions, and final water-shedding checks determine whether
  the finished wall performs beyond its appearance.
