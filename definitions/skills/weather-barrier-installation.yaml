id: weather-barrier-installation
name: Weather barrier installation
kind: skill
department: operations
summary: >-
  Maintains shingle laps, opening flashing, transitions, penetrations,
  terminations, drainage path, and repair of site damage. Weather barrier
  installation leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - quality-report
steps:
  - name: Confirm the work basis
    note: >-
      Before weather barrier installation, read the current scope and
      revisions, then verify accepted sheathing, dry substrate, complete
      openings, approved weather barrier, flashing details, material
      acclimation, and access.
  - name: Set the field controls
    note: >-
      Translate weather barrier installation into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During weather barrier installation, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept weather barrier installation, check the completed work against
      drainage continuity, fastening, clearances, joint layout, trim
      integration, appearance, and manufacturer requirements, then close
      correction and issue the resulting record.
tension: >-
  Weather barrier installation has to remain inside its acceptance basis while
  production moves. A finished elevation can look complete while hidden
  drainage and movement details are already set to fail.
failure_modes:
  - name: Weather barrier installation starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      weather barrier installation is settled.
    signal: >-
      The weather barrier installation work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Weather barrier installation closes without evidence
    cost: >-
      A concealed condition or required result from weather barrier
      installation cannot be verified without opening, repeat work, delay, or
      a disputed exception.
    signal: >-
      Weather barrier installation is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Weather barrier installation is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Weather barrier installation starts from a checked basis, follows a
      named sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Weather barrier installation uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Exterior cladding and water-shedding control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of weather barrier installation.
  - name: Evidence control
    note: >-
      Acceptance checks for weather barrier installation have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Weather barrier installation can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting weather barrier installation
    remain human.
questions:
  - >-
    Which unresolved condition can stop weather barrier installation before
    work begins?
  - >-
    Which record proves weather barrier installation was accepted before it
    was covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The weather barrier installation process is the siding contractor's
    installation of the water-resistive barrier and flashing that the siding
    will cover: sheets are lapped shingle fashion so water runs out, openings
    are flashed in the right order with the barrier, transitions to roofs,
    decks, and foundations are made continuous, penetrations are sealed,
    terminations are detailed, the drainage path behind the cladding is kept
    open, and damage from other trades is repaired. It starts when the
    substrate has been accepted as ready and ends with a quality report that
    releases the wall for siding. The siding foreman owns it and the installer
    who wraps each elevation is responsible for its laps.
  why: >
    The weather barrier, and how it is lapped and flashed, is what keeps water
    out of the wall once the siding lets it through, which every cladding
    does. A reverse lap at a window head, a barrier run over a flashing where
    it should run under, an unsealed penetration, or a torn sheet left for the
    siding crew leaves a water path that nobody sees until the sheathing rots.
    A finished elevation can look complete while these details are already set
    to fail, so the record made before the siding goes on is the only proof
    the contractor has.
  how: >
    The foreman confirms the work basis from the current scope and revisions,
    verifying accepted sheathing, a dry substrate, complete openings, the
    approved barrier product, flashing details, material acclimation, and
    access. Field controls follow: the lap and fastening pattern for the
    product, the flashing sequence at heads, jambs, and sills, transition and
    termination details, the order of elevations, who inspects before
    covering, and the hold point at each opening. During installation the
    operator records elevations completed, laps, flashing at each opening,
    penetrations sealed, transitions, repairs to site damage, and photographs
    each opening before trim, and stops when a substrate condition or a detail
    differs from the planned method. Acceptance checks drainage continuity,
    fastening, clearances, joint layout, trim integration, appearance, and
    manufacturer requirements, corrections are closed, and the quality report
    is issued.
  controls:
    - name: Laps checked for direction on every elevation
      note: Horizontal and vertical laps are checked for shingle-fashion direction and minimum overlap before an elevation is released.
    - name: Opening flashing photographed in sequence
      note: Each opening's sill, jamb, and head flashing is photographed with the barrier lapped over it, before the window trim or siding covers it.
    - name: Penetrations and terminations listed
      note: Every penetration, kick-out, and termination is listed on the record with its treatment, and an untreated item holds the wall.
    - name: Site damage repaired before covering
      note: Tears and punctures from other trades are inspected for on each elevation and repaired with the product's method before siding begins.
    - name: Manufacturer requirements confirmed
      note: Fastening, tape, and lap requirements for the specific barrier product are confirmed against the installation instructions and recorded on the quality report.
