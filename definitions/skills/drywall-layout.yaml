id: drywall-layout
name: Drywall layout
kind: skill
department: operations
summary: >-
  Plans board orientation, joint staggering, control joints, backing, edge
  support, openings, access panels, and cut sequence by room. Drywall layout
  leaves a current work basis, a field record, and acceptance evidence that
  another operator can trace.
inputs:
  - construction-plan
outputs:
  - punch-list
steps:
  - name: Confirm the work basis
    note: >-
      Before drywall layout, read the current scope and revisions, then verify
      dry and enclosed space, accepted framing and rough work, board type and
      thickness, backing, control joints, access panels, and finish level.
  - name: Set the field controls
    note: >-
      Translate drywall layout into work limits, sequence, responsibilities,
      hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During drywall layout, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept drywall layout, check the completed work against board
      orientation, fastening, joints, corners, finish level, surface
      tolerance, texture, protection, and punch closure, then close correction
      and issue the resulting record.
tension: >-
  Drywall layout has to remain inside its acceptance basis while production
  moves. Defects hidden during hanging or finishing reappear under paint and
  finished lighting when correction is most disruptive.
failure_modes:
  - name: Drywall layout starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      drywall layout is settled.
    signal: >-
      The drywall layout work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Drywall layout closes without evidence
    cost: >-
      A concealed condition or required result from drywall layout cannot be
      verified without opening, repeat work, delay, or a disputed exception.
    signal: >-
      Drywall layout is released while its required check, location record,
      test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Drywall layout is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Drywall layout starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Drywall layout uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Gypsum board finishing sequence
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of drywall layout.
  - name: Evidence control
    note: >-
      Acceptance checks for drywall layout have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Drywall layout can use digital revisions, checklists, hold points, photo
    capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting drywall layout remain human.
questions:
  - Which unresolved condition can stop drywall layout before work begins?
  - >-
    Which record proves drywall layout was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The drywall layout process is the planning pass that happens before any
    board is cut: the crew lead walks each room with the construction plan
    and decides board orientation, how joints stagger, where control joints
    and access panels land, which edges need backing, and in what order the
    room is cut and hung. It ends when the layout is marked, the material is
    counted against it, and the hanging crew has a sequence to follow. A
    drywall contractor's lead or foreman owns it.
  why: >
    A poorly planned room wastes board and creates joints where they will
    show. Butt joints lined up over a door frame crack, a control joint left
    out of a long corridor lets the finish split, and an access panel
    forgotten in layout is cut into a finished wall later at the
    contractor's cost. Layout is also where quantities become real; without
    it the crew orders by square footage and runs short on the last ceiling
    or leaves a pallet unused on site.
  how: >
    The lead reads the construction plan and revisions, then confirms the
    room is dry and enclosed, that framing and rough work are accepted, and
    that board type and thickness, backing, control joints, access panels,
    and finish level are known. From that basis the lead sets the field
    controls: the orientation and stagger for each wall and ceiling, the
    location of control joints and panels, the cut list and sequence, and
    the hold point where the layout is checked before hanging begins. The
    layout is marked and recorded with quantities and any concealed detail
    it depends on, and the lead stops when a wall or opening does not match
    the drawing. Acceptance checks the marked layout against orientation,
    joint, corner, and finish level requirements, and the punch list records
    what the hanging crew must watch for.
  controls:
    - name: Layout marked before cutting
      note: Orientation, stagger, control joints, and access panel locations are marked on the framing and recorded before the first cut.
    - name: Material count reconciled to layout
      note: Board quantities by type and thickness are counted against the layout so shortages surface before the crew is standing idle.
    - name: Control joint and panel review
      note: The lead checks every long run and every concealed valve or junction against the plan for a required joint or panel.
    - name: Changed-condition stop
      note: When framing spacing, openings, or backing differ from the plan the layout is revised and approved before hanging starts.
    - name: Layout handed over on the punch list
      note: The punch list records the layout decisions the hanging crew must follow and any location still unresolved.
