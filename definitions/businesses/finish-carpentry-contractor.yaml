revenue_model:
  - id: finish-carpentry-labor-and-millwork
    note: installed trim or millwork scope plus field measurement, material, fabrication coordination, finishing, protection, and punch work
summary: >-
  A finish carpentry contractor installs doors, trim, cabinets, panels,
  hardware, and other fitted woodwork after the building has accumulated
  framing, drywall, floor, and ceiling tolerances. Field measurement,
  scribing, reveals, joints, backing, moisture condition, and finish
  protection define the work.


  The result is judged at close range and has to operate as well as align.
  Material arrives finished or nearly finished, so damage and bad cuts are
  costly. The crew sequences room access, resolves out-of-square conditions,
  controls fillers and transitions, and protects completed work while other
  trades finish around it.
