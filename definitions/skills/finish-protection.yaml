id: finish-protection
name: Finish protection
kind: skill
department: operations
summary: >-
  Identifies vulnerable completed work, selects compatible coverings,
  maintains access and ventilation, records damage, and removes protection
  without residue. Finish protection leaves a current work basis, a field
  record, and acceptance evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - punch-list
steps:
  - name: Confirm the work basis
    note: >-
      Before finish protection, read the current scope and revisions, then
      verify stable conditioned space, verified field dimensions, dry
      material, approved profiles and samples, complete backing, and protected
      access.
  - name: Set the field controls
    note: >-
      Translate finish protection into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During finish protection, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept finish protection, check the completed work against fit,
      reveal, joint, operation, fastening, surface condition, alignment,
      hardware, and finish readiness, then close correction and issue the
      resulting record.
tension: >-
  Finish protection has to remain inside its acceptance basis while production
  moves. Finish carpentry absorbs accumulated framing, drywall, floor, and
  casework tolerances in the most visible work.
failure_modes:
  - name: Finish protection starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for finish
      protection is settled.
    signal: >-
      The finish protection work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Finish protection closes without evidence
    cost: >-
      A concealed condition or required result from finish protection cannot
      be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Finish protection is released while its required check, location record,
      test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Finish protection is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Finish protection starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Finish protection uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Field fitting and finish tolerance control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of finish protection.
  - name: Evidence control
    note: >-
      Acceptance checks for finish protection have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Finish protection can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting finish protection remain
    human.
questions:
  - Which unresolved condition can stop finish protection before work begins?
  - >-
    Which record proves finish protection was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The finish protection process covers the completed finish work that
    other trades will walk on, roll carts past, and spray around before
    the owner takes the space. It starts when a finish surface is complete
    and accepted while other work continues around it, and it ends when
    the protection comes off without residue, damage found underneath is
    recorded and assigned, and the surface is accepted for handover on the
    punch list. On a finish carpentry contractor's crew the foreman owns
    it, since the crew's own work is what gets damaged when it fails.
  why: >
    Finished stair treads, cabinetry, wood floors, and painted trim are
    the most expensive surfaces to repair and the last work anyone touches
    before the walkthrough. Without planned protection, a painter's
    ladder, a plumber's cart, or a wet boot marks a surface the finish
    carpenter then refinishes at their own cost, and the argument about
    who caused it has no evidence. Wrong coverings cause their own harm:
    tape that lifts finish, plastic that traps moisture in fresh wood, and
    board that blocks the ventilation a curing floor needs.
  how: >
    The foreman reads the current scope and revisions and confirms the
    space is conditioned, dimensions are settled, the material is dry, and
    access routes are known, so the protection covers real completed work
    and the traffic that will actually cross it. The protection plan is
    then set: which surfaces are vulnerable, which covering is compatible
    with each finish, where access and ventilation are kept open, who
    inspects the protection on which days, and where damage is recorded.
    During the period the crew records the date protection went down, any
    damage found on inspection with the trade present at the time, and any
    point where a changed condition such as a new trade or a wet area
    required a different covering. At removal the foreman checks the
    surface condition, fit, alignment, and finish readiness, closes any
    correction, and issues the punch list.
  controls:
    - name: Compatibility check per finish
      note: The covering, tape, and adhesive for each surface are confirmed compatible with that finish before they go down, with the manufacturer's guidance kept on file.
    - name: Dated photo record at cover and uncover
      note: Each protected area is photographed the day protection goes on and the day it comes off so damage underneath has a time window and a responsible trade.
    - name: Scheduled protection inspection
      note: A named person walks the protection on a set cadence and records tears, lifted edges, and trapped moisture before they become finish damage.
    - name: Ventilation and access kept open
      note: Protection is laid so curing finishes can breathe and required egress and trade access stay usable, and any blocked route is a stop.
    - name: Punch list for damage found at removal
      note: Every mark, dent, or residue found when protection comes off is listed with an owner and closed before handover.
