catalog_group: construction-property
extends: project-services-base
revenue_model:
  - id: paving-material-and-maintenance
    note: installed paving quantity plus base repair, mobilization, sealcoating, striping, drainage correction, and maintenance work
summary: >-
  A driveway paving contractor removes failed pavement, prepares subgrade,
  places aggregate base, lays asphalt, compacts the mat, seals surfaces, and
  marks small private drives or parking areas. Drainage, section thickness,
  edge support, access, weather, truck timing, and traffic closure determine
  the production plan.


  The finished surface can hide weak support and thin lifts. Proof rolling,
  moisture control, lift measurement, temperature, joint construction, roller
  pattern, and density evidence protect the work before cooling fixes the
  result. Release timing and owner access are managed so early traffic does
  not mark or displace new pavement.
