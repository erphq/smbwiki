id: food-inventory
name: Food inventory
kind: skill
department: supply
summary: >
  Food inventory controls perishable ingredients from count through
  order, receipt, storage, and use. The operator compares expected stock
  with physical stock, protects shelf life, and places purchase orders
  early enough for the next production period.
inputs: [supplier-invoice]
outputs: [purchase-order]
steps:
  - name: Count by storage area
    note: >
      Open containers, partial cases, prepared product, and goods in the
      wrong location are included in the same physical count.
  - name: Check use and shelf life
    consumes: [supplier-invoice]
    note: >
      Recent receipts, expected demand, lead time, and what will expire
      before use shape the order quantity.
  - name: Place the replenishment order
    produces: [purchase-order]
    note: >
      Unit, pack size, substitution rule, required date, and destination
      are explicit for each line.
  - name: Receive into rotation
    note: >
      Quantity, temperature, condition, date, and invoice difference are
      checked before new stock is stored behind older usable stock.
tension: >
  Product availability competes with freshness and cash. Extra stock
  protects service from a late supplier; excess perishables become waste
  before they can become sales.
failure_modes:
  - name: Pack-size error
    cost: >
      The operation orders or costs the wrong quantity because case,
      weight, and recipe records use conflicting units.
    signal: >
      Counts and orders use unit labels that differ from the supplier
      invoice.
  - name: New stock hides old stock
    cost: >
      Usable product expires in storage while later receipts are opened
      first.
    signal: >
      Multiple dates of the same item are found without a clear rotation
      order.
  - name: Receiving exception disappears
    cost: >
      The business pays for shortages, damage, or rejected temperature
      conditions.
    signal: >
      Supplier invoice quantity is posted before receipt condition is
      recorded.
maturity:
  - level: run badly
    looks_like: >
      Staff order from visual gaps and waste is discovered during
      cleaning or at the end of the period.
  - level: run well
    looks_like: >
      Counts, shelf life, demand, open orders, receipts, and invoice
      differences are reviewed on a repeatable cadence.
  - level: run excellently
    looks_like: >
      Variance points to specific items and storage areas, supplier
      reliability shapes safety stock, and waste changes future orders.
competencies:
  - name: Unit control
    note: >
      Recipe portions, count units, purchase packs, and invoice units
      must convert without guesswork.
  - name: Perishable judgment
    note: >
      The buyer understands how condition, remaining life, demand, and
      storage capacity affect the amount worth receiving.
automation:
  now: >
    Count sheets, unit conversions, reorder suggestions, purchase orders,
    expiry prompts, invoice comparison, and variance reporting.
  human: >
    Physical condition checks, substitution acceptance, demand
    interpretation, and decisions about short-dated or rejected goods.
questions:
  - Which ingredient variance remains unexplained after the last count?
  - What stock will expire before the current demand plan can use it?
article:
  what: >
    The food inventory process is the loop that keeps perishable
    ingredients in stock and in date: a physical count by walk-in,
    freezer, dry store, and line, a comparison against what the next
    production period needs and what will expire first, a purchase order
    placed early enough for the supplier's lead time, and a receipt that
    checks the delivery and rotates it behind older stock. It runs on a
    fixed cadence, daily for a pizzeria or food truck and weekly for a
    retail bakery's dry goods, and it belongs to the kitchen manager or
    the owner, with whoever receives the delivery closing the loop.
  why: >
    Food is the largest cost a restaurant, caterer, or coffee shop
    controls, and it spoils. Without a count and a rotation rule, staff
    order from the visual gap on the shelf, new cases go in front of old
    ones, usable product expires behind them, and the invoice is paid for
    a short or warm delivery nobody recorded. The process protects cash
    tied up in stock, the margin lost to waste, and the service that stops
    when an ingredient runs out mid-shift.
  how: >
    The kitchen manager counts each storage area in turn, including open
    containers, partial cases, prepared product, and anything found in the
    wrong location, on a count sheet in the same units the recipes use.
    The count is then compared with recent receipts on supplier invoices,
    expected demand for the coming period, supplier lead time, and what
    will expire before it can be used, and that comparison sets the order
    quantity per item. The purchase order states unit, pack size,
    substitution rule, required date, and destination for each line so
    the supplier and the receiver read the same thing. On delivery the
    receiver checks quantity, temperature, condition, and dates against
    the order and the supplier invoice, records any difference before the
    invoice is posted, and stores the new stock behind the older usable
    stock.
  controls:
    - name: Count sheet in recipe units
      note: Count, order, and invoice units are converted on the sheet so case, weight, and portion never get compared as if they were the same.
    - name: Expiry check before ordering
      note: Items that will expire before the demand plan can use them are flagged on the count and the order quantity is reduced.
    - name: Purchase order with pack size and substitution rule
      note: Every order line carries pack size, required date, and whether a substitute is acceptable, so a wrong delivery is the supplier's problem.
    - name: Receiving check before invoice posting
      note: Quantity, temperature, and condition are recorded at the door and any shortage or rejection is noted on the invoice before it is approved.
    - name: Rotation walk on the count
      note: The count includes a check that older dated stock sits in front, and mixed dates without a rotation order are corrected on the spot.
