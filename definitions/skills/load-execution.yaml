id: load-execution
name: Load execution
kind: skill
department: operations
summary: >
  Load execution carries a confirmed carrier commitment through dispatch,
  pickup, in-transit tracking, exception management, delivery, and
  document closeout. The brokerage maintains a current shared record
  while the freight is in another company's physical custody.
inputs: [rate-confirmation]
outputs: [bill-of-lading, proof-of-delivery]
steps:
  - name: Verify dispatch readiness
    role: tracking-coordinator
    consumes: [rate-confirmation]
    note: >
      Driver, truck, carrier contact, empty status, travel plan, pickup
      appointment, references, and tracking method are confirmed through
      trusted routes.
  - name: Confirm pickup
    role: tracking-coordinator
    produces: [bill-of-lading]
    note: >
      Arrival, loaded count and condition, bill of lading, seal or
      securement, departure, and any shipper exception enter the load record.
  - name: Track milestones and risk
    role: tracking-coordinator
    note: >
      Location, available hours, appointment feasibility, equipment
      condition, and driver contact are updated at the cadence the load needs.
  - name: Control exceptions
    role: freight-broker
    note: >
      Delay, breakdown, temperature, damage, shortage, refusal, or contact
      loss receives an owner, customer update, evidence, and recovery decision.
  - name: Confirm delivery and close
    role: tracking-coordinator
    produces: [proof-of-delivery]
    note: >
      Delivery time, receiver, signed proof, count, condition, exception,
      final charges, and document quality are reviewed before handoff to billing.
tension: >
  Loads per operator compete with early exception detection and customer
  communication. Low-touch tracking supports volume when the plan holds;
  stale milestones hide recoverable delays until the appointment or
  customer promise has already failed.
failure_modes:
  - name: Carrier identity changes after booking
    cost: >
      An unverified driver, truck, or contact gains control of pickup
      information or freight.
    signal: >
      Dispatch details arrive from a route absent from the rate
      confirmation and approved record.
  - name: Check call records status without feasibility
    cost: >
      The load appears moving while available time, distance, hours, or
      appointment constraints already make service failure likely.
    signal: >
      Updates record location and omit projected arrival or remaining risk.
  - name: Delivery proof hides exception
    cost: >
      Billing closes while shortage, damage, refusal, or late service
      evidence is lost.
    signal: >
      Proof of delivery has notation that never creates an owned exception.
maturity:
  - level: run badly
    looks_like: >
      The broker asks for location after the customer calls and documents
      are collected when billing needs them.
  - level: run well
    looks_like: >
      Trusted dispatch, pickup evidence, feasible milestones, owned
      exceptions, customer updates, and reviewed delivery proof share one load.
  - level: run excellently
    looks_like: >
      Risk determines tracking cadence, likely failures surface before
      promises break, and execution outcomes change carrier and facility data.
competencies:
  - name: Movement feasibility
    note: >
      The operator combines location, distance, hours, appointments,
      weather, equipment, and facility behavior into a current service view.
  - name: Exception command
    note: >
      Evidence, options, cost authority, carrier action, and customer
      communication must move together while the freight is still recoverable.
automation:
  now: >
    Location tracking, geofences, milestone prompts, projected arrival,
    document capture, exception alerts, and customer status messages.
  human: >
    Identity changes, driver and facility communication, recovery design,
    cost decisions, sensitive customer updates, and custody disputes.
questions:
  - Which active load is least likely to keep its next appointment?
  - What open delivery exception still lacks evidence or an owner?
article:
  what: >
    The load execution process is how a freight brokerage stays in
    control of a shipment it does not physically carry, from the rate
    confirmation with a carrier, through dispatch verification, pickup,
    in-transit tracking, exception handling, delivery, and document
    closeout. It begins when the carrier commitment is confirmed and
    ends when a signed proof of delivery has been reviewed and handed
    to billing with the bill of lading and any exception resolved. The
    tracking coordinator runs the load day to day; the freight broker
    owns exceptions and cost decisions.
  why: >
    It protects the customer's freight and the brokerage's promise
    while both are in another company's truck. Weak execution lets an
    unverified driver or dispatcher take control of pickup details,
    records a location without asking whether the appointment is still
    feasible, and closes billing on a proof of delivery whose notation
    hides a shortage or damage claim. Each of those becomes a service
    failure the customer hears about from the receiver first, or a
    claim the brokerage cannot defend.
  how: >
    The tracking coordinator verifies dispatch readiness from the rate
    confirmation: driver, truck, carrier contact, empty status, travel
    plan, pickup appointment, references, and tracking method, all
    confirmed through routes the approved record recognizes. At pickup,
    arrival, loaded count and condition, the bill of lading, seal or
    securement, departure, and any shipper exception enter the load
    record. In transit the coordinator updates location, available
    hours, appointment feasibility, equipment condition, and driver
    contact at the cadence the load needs. When delay, breakdown,
    temperature, damage, shortage, refusal, or contact loss appears,
    the freight broker takes it as an exception with an owner, a
    customer update, evidence, and a recovery decision. At delivery,
    time, receiver, signed proof, count, condition, exception, final
    charges, and document quality are reviewed before the proof of
    delivery goes to billing.
  controls:
    - name: Dispatch identity verified through the approved route
      note: Driver, truck, and contact details are accepted only from the carrier contact on the rate confirmation and are checked against carrier records.
    - name: Feasibility recorded with every check call
      note: Each tracking update records projected arrival against the appointment and remaining hours, so a load that cannot make it is visible early.
    - name: Exception opened on any notation
      note: Any shipper or receiver notation, temperature alarm, or contact loss creates an owned exception with evidence before the load can close.
    - name: Proof of delivery reviewed before billing
      note: Receiver, time, count, condition, and signature are checked against the bill of lading and the exception log before the document goes to billing.
    - name: Customer update on every risk change
      note: The customer is told when arrival risk or an exception changes, with the update time recorded in the load record.
