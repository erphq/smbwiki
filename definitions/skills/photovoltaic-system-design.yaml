id: photovoltaic-system-design
name: Photovoltaic system design
kind: skill
department: operations
summary: >-
  Selects array and inverter architecture, lays out modules, checks structural
  loading, sizes conductors and protection, and coordinates shutdown and
  labels. Photovoltaic system design leaves a current work basis, a field
  record, and acceptance evidence that another operator can trace.
inputs:
  - site-plan
outputs:
  - commissioning-record
steps:
  - name: Confirm the work basis
    note: >-
      Before photovoltaic system design, read the current scope and revisions,
      then verify verified roof or ground condition, energy use and shading
      data, approved electrical design, permit, utility route, equipment, and
      fall protection.
  - name: Set the field controls
    note: >-
      Translate photovoltaic system design into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During photovoltaic system design, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept photovoltaic system design, check the completed work against
      structural and electrical compliance, flashed attachments, labeled
      circuits, tested shutdown, documented production, inspection, and
      utility permission, then close correction and issue the resulting
      record.
tension: >-
  Photovoltaic system design has to remain inside its acceptance basis while
  production moves. Design, roof, electrical, permit, and utility decisions
  converge at installation, and one mismatch can delay permission to operate.
failure_modes:
  - name: Photovoltaic system design starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      photovoltaic system design is settled.
    signal: >-
      The photovoltaic system design work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Photovoltaic system design closes without evidence
    cost: >-
      A concealed condition or required result from photovoltaic system design
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Photovoltaic system design is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Photovoltaic system design is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Photovoltaic system design starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Photovoltaic system design uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Photovoltaic design and commissioning
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of photovoltaic system design.
  - name: Evidence control
    note: >-
      Acceptance checks for photovoltaic system design have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Photovoltaic system design can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting photovoltaic system design
    remain human.
questions:
  - >-
    Which unresolved condition can stop photovoltaic system design before work
    begins?
  - >-
    Which record proves photovoltaic system design was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The photovoltaic system design process is the engineering step
    between a signed solar contract and the crew going onto the roof.
    From the site plan, the energy use, and the shading data, the
    designer selects the array and inverter architecture, lays out
    modules on the available roof or ground area, checks the structural
    loading on the attachment points, sizes conductors and overcurrent
    protection, and coordinates rapid shutdown and the labels the
    inspector will look for. It ends with a design the permit, the
    utility, and the crew can build from and, after installation, a
    commissioning record proving the system matches it. The designer at
    a solar installation contractor owns it, with the licensed
    electrician signing the electrical basis.
  why: >
    It protects the permission to operate. Design, roof, electrical,
    permit, and utility decisions all converge at installation, and one
    mismatch between them, a conductor undersized for the string, an
    attachment on a rafter that cannot take the load, a shutdown device
    not where the label says, delays the utility's permission for weeks
    after the customer has paid. It also protects the roof and the
    house: a layout that ignores shading underproduces for the life of
    the system, and a flashing detail left to the crew's judgment is
    where the leak starts.
  how: >
    The designer confirms the work basis: current scope and revisions,
    the verified roof or ground condition, energy use and shading data,
    the approved electrical design, permit status, the utility
    interconnection route, equipment on hand, and fall protection. Field
    controls translate the design into module layout drawings, string
    tables, attachment spacing, conductor and protection schedules, the
    shutdown and labeling plan, hold points at structural attachment and
    before energizing, and the records the crew keeps. During
    installation the crew records attachment locations, flashing, string
    wiring, and any deviation, and stops when the roof or the electrical
    service differs from the design. Acceptance checks structural and
    electrical compliance, flashed attachments, labeled circuits, tested
    shutdown, documented production, inspection, and utility permission,
    then corrections are closed and the commissioning record is issued.
  controls:
    - name: Structural check signed per attachment plan
      note: Rafter size, spacing, and condition are verified against the attachment layout and the load calculation before the layout is released.
    - name: String and conductor schedule reviewed
      note: Module count per string, voltage and current limits, conductor sizes, and protection ratings are checked by the electrician against the inverter specification.
    - name: Shading data on the design
      note: The shading survey is attached to the layout and the production estimate is derived from it, so the customer's expectation matches the design.
    - name: Shutdown and labels as a hold point
      note: Rapid shutdown devices and every required label are installed and photographed before the system is energized for test.
    - name: Commissioning record before permission to operate
      note: Inspection result, shutdown test, measured production, and as-built drawings are filed together before the utility application is submitted.
