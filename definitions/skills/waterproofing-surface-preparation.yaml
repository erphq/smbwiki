id: waterproofing-surface-preparation
name: Waterproofing surface preparation
kind: skill
department: operations
summary: >-
  Removes weak material and contamination, repairs voids, profiles the
  substrate, dries it, and resolves corners, cracks, and penetrations.
  Waterproofing surface preparation leaves a current work basis, a field
  record, and acceptance evidence that another operator can trace.
inputs:
  - inspection-report
outputs:
  - test-report
steps:
  - name: Confirm the work basis
    note: >-
      Before waterproofing surface preparation, read the current scope and
      revisions, then verify identified moisture source, sound and dryable
      substrate, compatible system, prepared transitions, drainage route, and
      safe access.
  - name: Set the field controls
    note: >-
      Translate waterproofing surface preparation into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During waterproofing surface preparation, the operator records
      quantities, observations, decisions, and concealed details, and stops
      when the field condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept waterproofing surface preparation, check the completed work
      against continuous specified thickness, bonded transitions, sealed
      penetrations, protected terminations, drainage, cure, and required water
      test, then close correction and issue the resulting record.
tension: >-
  Waterproofing surface preparation has to remain inside its acceptance basis
  while production moves. Treating the visible leak without tracing pressure,
  path, termination, and drainage can move water into a new concealed route.
failure_modes:
  - name: Waterproofing surface preparation starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      waterproofing surface preparation is settled.
    signal: >-
      The waterproofing surface preparation work package still has an open
      drawing, access, material, predecessor, or approval dependency when
      labor is assigned.
  - name: Waterproofing surface preparation closes without evidence
    cost: >-
      A concealed condition or required result from waterproofing surface
      preparation cannot be verified without opening, repeat work, delay, or a
      disputed exception.
    signal: >-
      Waterproofing surface preparation is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Waterproofing surface preparation is driven by crew availability and
      visible completion; readiness, hold points, and acceptance evidence are
      resolved afterward.
  - level: run well
    looks_like: >-
      Waterproofing surface preparation starts from a checked basis, follows a
      named sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Waterproofing surface preparation uses field evidence, production
      variance, defects, and closeout results to improve the next estimate,
      work package, and control point.
competencies:
  - name: Building-envelope moisture diagnosis
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of waterproofing surface preparation.
  - name: Evidence control
    note: >-
      Acceptance checks for waterproofing surface preparation have to be
      captured while the relevant condition can still be observed and
      corrected.
automation:
  now: >-
    Waterproofing surface preparation can use digital revisions, checklists,
    hold points, photo capture, test fields, correction assignment, and
    closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting waterproofing surface
    preparation remain human.
questions:
  - >-
    Which unresolved condition can stop waterproofing surface preparation
    before work begins?
  - >-
    Which record proves waterproofing surface preparation was accepted before
    it was covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The waterproofing surface preparation process is the work a waterproofing
    contractor does to a concrete or masonry substrate before a membrane will
    bond to it: weak material and contamination are removed, voids and
    honeycomb are repaired, the surface is profiled to the membrane
    manufacturer's requirement, moisture is brought within limits, and
    corners, cracks, and penetrations are treated so the membrane can be
    continuous. It starts when the substrate is released to the contractor
    with an inspection report on its condition and ends when the prepared
    surface is accepted for membrane installation and the preparation is
    recorded toward the final test report. The foreman owns it and the
    manufacturer's representative is involved on warranted systems.
  why: >
    Membranes fail at the substrate more often than in the field of the sheet.
    Laitance, curing compound, oil, or dust break the bond; an unrepaired
    crack or cold joint moves and tears the membrane; a surface too rough or
    too smooth for the product prevents the specified thickness; and moisture
    in the concrete blisters a coating within days. Corners without a fillet
    and penetrations without a detail are the places water finds first.
    Preparation cannot be verified after the membrane is on, so the record has
    to be made while the surface can still be seen.
  how: >
    The foreman confirms the work basis by reading the current scope and
    revisions and verifying the identified moisture source, a sound and
    dryable substrate, a compatible system, prepared transitions, a drainage
    route, and safe access, starting from the inspection report on the
    substrate. Field controls are then set: the profile and moisture limits
    for the specified membrane, the repair materials and their cure times, the
    sequence of areas, the crack and penetration details, who tests moisture
    and who inspects, and the hold point before priming. During preparation
    the operator records areas cleaned, material removed, repairs with product
    and date, profile checks, moisture readings, and every crack, corner, and
    penetration treated, with photos, and stops when the substrate differs
    from the report. Acceptance checks that the surface will support
    continuous specified thickness, bonded transitions, sealed penetrations,
    protected terminations, drainage, and cure, corrections are closed, and
    the record is carried into the test report.
  controls:
    - name: Substrate defects reported before repair
      note: Cracks, voids, honeycomb, and contamination found during preparation are photographed and reported to the general contractor before repair removes the evidence.
    - name: Profile checked against the manufacturer requirement
      note: The surface profile is compared with the membrane manufacturer's stated requirement for each area and the result is recorded.
    - name: Moisture tested before priming
      note: Substrate moisture is tested by the method the membrane manufacturer specifies, and the reading and location are recorded before primer is applied.
    - name: Repair materials and cure recorded
      note: Every repair mortar, crack treatment, and fillet is logged with product, location, date, and cure time before the membrane is scheduled.
    - name: Prepared surface accepted at a hold point
      note: The foreman and, on warranted systems, the manufacturer's representative inspect and sign the prepared surface before membrane installation starts.
