id: elevator-diagnostics
name: Elevator diagnostics
kind: skill
department: operations
summary: >-
  Reproduces the complaint, reads fault history, isolates door, drive,
  control, leveling, safety, and communication circuits, and records the
  causal evidence. Elevator diagnostics leaves a current work basis, a field
  record, and acceptance evidence that another operator can trace.
inputs:
  - service-ticket
outputs:
  - test-report
steps:
  - name: Confirm the work basis
    note: >-
      Before elevator diagnostics, read the current scope and revisions, then
      verify identified unit, maintenance history, code status, safe access,
      outage coordination, parts, qualified staff, and rescue provisions.
  - name: Set the field controls
    note: >-
      Translate elevator diagnostics into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During elevator diagnostics, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept elevator diagnostics, check the completed work against safe
      operation, required clearances and protection, corrected defects,
      recorded tests, current log, and regulatory inspection status, then
      close correction and issue the resulting record.
tension: >-
  Elevator diagnostics has to remain inside its acceptance basis while
  production moves. An elevator can return to service while an intermittent
  control, door, braking, or leveling defect remains unresolved.
failure_modes:
  - name: Elevator diagnostics starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      elevator diagnostics is settled.
    signal: >-
      The elevator diagnostics work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Elevator diagnostics closes without evidence
    cost: >-
      A concealed condition or required result from elevator diagnostics
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Elevator diagnostics is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Elevator diagnostics is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Elevator diagnostics starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Elevator diagnostics uses field evidence, production variance, defects,
      and closeout results to improve the next estimate, work package, and
      control point.
competencies:
  - name: Vertical-transport diagnostics and code testing
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of elevator diagnostics.
  - name: Evidence control
    note: >-
      Acceptance checks for elevator diagnostics have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Elevator diagnostics can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting elevator diagnostics remain
    human.
questions:
  - >-
    Which unresolved condition can stop elevator diagnostics before work
    begins?
  - >-
    Which record proves elevator diagnostics was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The elevator diagnostics process is the fault-finding work on a unit
    with a complaint: the mechanic reproduces the reported behavior, reads
    the controller's fault history, isolates the door, drive, control,
    leveling, safety, and communication circuits one at a time, and records
    the causal evidence before any part is replaced. It starts from a
    service ticket and ends with a test report that names the cause and the
    corrective action. An elevator service contractor's route mechanic owns
    it, with a troubleshooter or adjuster called in for intermittent faults.
  why: >
    Elevator callbacks repeat when the mechanic resets the controller and
    leaves. The rider sees the same door stall the next week, the building
    loses confidence, and the contract is at risk. Parts replaced on a guess
    cost money and outage time without fixing the fault. Diagnostics done
    without the fault history and without reproducing the complaint miss
    intermittent conditions in braking, leveling, or door protection that
    can become a safety event. The recorded evidence is also what lets a
    second mechanic pick up the unit without starting over.
  how: >
    The mechanic reads the ticket and confirms the unit, its maintenance
    history, code status, safe access, the outage arrangement with the
    building, parts on the truck, staffing, and rescue provisions. Field
    controls set the order of isolation, where the unit must be locked out,
    what readings are taken at each circuit, and where the evidence is
    recorded. The mechanic reproduces the complaint, pulls the fault log,
    and works through the circuits, recording readings and observations and
    stopping when the unit's condition differs from the planned approach.
    The cause and the corrective action are written on the test report, and
    acceptance checks safe operation, protection, corrected defects,
    recorded tests, the current unit log, and inspection status before the
    unit returns to service.
  controls:
    - name: Complaint reproduced before isolation
      note: The mechanic records the conditions under which the reported fault was observed before touching any circuit.
    - name: Fault history captured
      note: The controller fault log is read and recorded on the ticket before any reset clears it from the unit.
    - name: Cause named on the report
      note: The test report states the causal finding and the evidence for it; a reset or adjustment without a finding stays open.
    - name: Lockout at each isolation step
      note: The unit is locked out and the rescue plan is in place before any safety, brake, or door circuit is opened.
    - name: Return to service on tested modes
      note: The affected operating modes are function-tested and recorded before the unit is released back to the building.
