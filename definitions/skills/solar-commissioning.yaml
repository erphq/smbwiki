id: solar-commissioning
name: Solar commissioning
kind: skill
department: quality
summary: >-
  Checks torque and polarity, insulation and grounding, inverter settings,
  monitoring, shutdown, labels, production, inspection items, and owner
  instruction. Solar commissioning leaves a current work basis, a field
  record, and acceptance evidence that another operator can trace.
inputs:
  - site-plan
outputs:
  - commissioning-record
steps:
  - name: Confirm the work basis
    note: >-
      Before solar commissioning, read the current scope and revisions, then
      verify verified roof or ground condition, energy use and shading data,
      approved electrical design, permit, utility route, equipment, and fall
      protection.
  - name: Set the field controls
    note: >-
      Translate solar commissioning into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During solar commissioning, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept solar commissioning, check the completed work against
      structural and electrical compliance, flashed attachments, labeled
      circuits, tested shutdown, documented production, inspection, and
      utility permission, then close correction and issue the resulting
      record.
tension: >-
  Solar commissioning has to remain inside its acceptance basis while
  production moves. Design, roof, electrical, permit, and utility decisions
  converge at installation, and one mismatch can delay permission to operate.
failure_modes:
  - name: Solar commissioning starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for solar
      commissioning is settled.
    signal: >-
      The solar commissioning work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Solar commissioning closes without evidence
    cost: >-
      A concealed condition or required result from solar commissioning cannot
      be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Solar commissioning is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Solar commissioning is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Solar commissioning starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Solar commissioning uses field evidence, production variance, defects,
      and closeout results to improve the next estimate, work package, and
      control point.
competencies:
  - name: Photovoltaic design and commissioning
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of solar commissioning.
  - name: Evidence control
    note: >-
      Acceptance checks for solar commissioning have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Solar commissioning can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting solar commissioning remain
    human.
questions:
  - >-
    Which unresolved condition can stop solar commissioning before work
    begins?
  - >-
    Which record proves solar commissioning was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The solar commissioning process is the final verification of an
    installed photovoltaic system before it is energized and handed to
    the owner, covering torque and polarity, insulation and grounding,
    inverter settings, monitoring, rapid shutdown, labels, measured
    production, the inspection items the jurisdiction and utility will
    check, and the owner's instruction. It starts when installation is
    complete against the site plan and ends with a commissioning record
    that supports permission to operate. A solar installation contractor
    owns it, usually through the licensed electrician or lead installer
    who signs the record.
  why: >
    It protects the owner, the utility, and the contractor's license. A
    reversed string, a loose lug, or an inverter left on the wrong grid
    profile can pass a visual inspection and still fail on the first
    sunny day, trip the utility's protection, or start a fire in the
    combiner. A missing label or an untested shutdown fails the
    inspection, and every failed inspection delays permission to
    operate, which delays the owner's savings and the contractor's final
    payment.
  how: >
    The commissioning lead reads the current scope and revisions, then
    confirms the verified roof or ground condition, energy use and
    shading data, the approved electrical design, the permit, the
    utility route, the installed equipment, and fall protection before
    starting. Those requirements are translated into a commissioning
    sequence with work limits, responsibilities, hold points before
    energizing, and the test forms the crew fills in. During
    commissioning the lead records torque values, polarity and
    insulation readings, grounding continuity, inverter settings,
    monitoring registration, shutdown test results, labels, and measured
    production, and stops if a reading or condition differs from the
    design. At acceptance the lead checks the system against structural
    and electrical compliance, flashed attachments, labeled circuits,
    tested shutdown, documented production, inspection status, and
    utility permission, closes corrections, and issues the commissioning
    record.
  controls:
    - name: Pre-energize hold point
      note: Polarity, insulation resistance, and grounding continuity are measured and recorded for every string before any disconnect is closed.
    - name: Torque and setting log
      note: Every terminal torque and every inverter grid setting is recorded against the design value with the tool and the technician named.
    - name: Rapid shutdown test witnessed
      note: The shutdown function is tested and the result recorded before labels are applied and the inspection is called.
    - name: Production check against the estimate
      note: Measured output is compared with the expected value for the irradiance at the time, and a shortfall is investigated before handover.
    - name: Commissioning record matched to the inspection list
      note: The record covers each jurisdiction and utility inspection item so the inspection and the permission-to-operate request are answered from it.
