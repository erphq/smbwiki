id: elevator-repair
name: Elevator repair
kind: skill
department: operations
summary: >-
  Controls shutdown and access, verifies replacement compatibility, performs
  the repair, restores guards and settings, and function-tests affected modes.
  Elevator repair leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - service-ticket
outputs:
  - test-report
steps:
  - name: Confirm the work basis
    note: >-
      Before elevator repair, read the current scope and revisions, then
      verify identified unit, maintenance history, code status, safe access,
      outage coordination, parts, qualified staff, and rescue provisions.
  - name: Set the field controls
    note: >-
      Translate elevator repair into work limits, sequence, responsibilities,
      hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During elevator repair, the operator records quantities, observations,
      decisions, and concealed details, and stops when the field condition
      changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept elevator repair, check the completed work against safe
      operation, required clearances and protection, corrected defects,
      recorded tests, current log, and regulatory inspection status, then
      close correction and issue the resulting record.
tension: >-
  Elevator repair has to remain inside its acceptance basis while production
  moves. An elevator can return to service while an intermittent control,
  door, braking, or leveling defect remains unresolved.
failure_modes:
  - name: Elevator repair starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      elevator repair is settled.
    signal: >-
      The elevator repair work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Elevator repair closes without evidence
    cost: >-
      A concealed condition or required result from elevator repair cannot be
      verified without opening, repeat work, delay, or a disputed exception.
    signal: >-
      Elevator repair is released while its required check, location record,
      test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Elevator repair is driven by crew availability and visible completion;
      readiness, hold points, and acceptance evidence are resolved afterward.
  - level: run well
    looks_like: >-
      Elevator repair starts from a checked basis, follows a named sequence,
      stops on changed conditions, and closes against recorded acceptance
      criteria.
  - level: run excellently
    looks_like: >-
      Elevator repair uses field evidence, production variance, defects, and
      closeout results to improve the next estimate, work package, and control
      point.
competencies:
  - name: Vertical-transport diagnostics and code testing
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of elevator repair.
  - name: Evidence control
    note: >-
      Acceptance checks for elevator repair have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Elevator repair can use digital revisions, checklists, hold points, photo
    capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting elevator repair remain
    human.
questions:
  - Which unresolved condition can stop elevator repair before work begins?
  - >-
    Which record proves elevator repair was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The elevator repair process is the planned replacement or correction of
    a known defective component on a unit: the mechanic controls the
    shutdown and access, verifies that the replacement part is compatible
    with the equipment, performs the repair, restores guards and settings,
    and function-tests every operating mode the repair touched. It starts
    from a service ticket with a diagnosed cause and ends with a test report
    and an updated unit log. An elevator service contractor's route mechanic
    or repair crew owns it under the service supervisor.
  why: >
    A repair done without controlling the shutdown puts the mechanic in the
    hoistway with a car that can move. A part that fits but is the wrong
    rating or revision fails again or introduces a new fault. Guards left
    off and settings left at defaults after a repair are the conditions
    inspectors and injury claims find. A repair that is never
    function-tested across the modes it affects, such as door operation
    after a drive change, returns the unit to the building with the fault
    moved somewhere else.
  how: >
    The mechanic reads the service ticket and the diagnosis, then confirms
    the unit, its maintenance history, code status, safe access, the outage
    arrangement, that the parts on hand are the right ones, staffing, and
    rescue provisions. Field controls set the lockout and access sequence,
    the hold point where part compatibility is verified against the
    equipment record, the order of the repair, and the records each step
    leaves. During the repair the mechanic records what was removed, what
    was installed with its part identity, settings restored, and any
    concealed condition, and stops when the unit differs from the ticket.
    Acceptance function-tests the affected modes, checks safe operation,
    guards and clearances, corrected defects, recorded tests, the unit log,
    and inspection status, and the test report is issued.
  controls:
    - name: Lockout and access controlled before work
      note: The unit is shut down, locked out, and access secured, and the rescue plan is confirmed before the repair begins.
    - name: Part compatibility verified on record
      note: The replacement part's identity is checked against the equipment record and written on the ticket before installation.
    - name: Guards and settings restored checklist
      note: Every guard removed and every setting changed is listed and checked off as restored before testing starts.
    - name: Affected modes function-tested
      note: Each operating mode the repair touched is tested and the result recorded before the unit is released.
    - name: Unit log updated with the repair
      note: The log records the defect, part, work, and test so the next mechanic and the inspector can see what was done.
