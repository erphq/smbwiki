id: cabinet-installation
name: Cabinet installation
kind: skill
department: operations
summary: >-
  Verifies layout and services, establishes level control, fastens to
  structure, joins cases, adjusts fronts, and protects completed surfaces.
  Cabinet installation leaves a current work basis, a field record, and
  acceptance evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - punch-list
steps:
  - name: Confirm the work basis
    note: >-
      Before cabinet installation, read the current scope and revisions, then
      verify stable conditioned space, verified field dimensions, dry
      material, approved profiles and samples, complete backing, and protected
      access.
  - name: Set the field controls
    note: >-
      Translate cabinet installation into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During cabinet installation, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept cabinet installation, check the completed work against fit,
      reveal, joint, operation, fastening, surface condition, alignment,
      hardware, and finish readiness, then close correction and issue the
      resulting record.
tension: >-
  Cabinet installation has to remain inside its acceptance basis while
  production moves. Finish carpentry absorbs accumulated framing, drywall,
  floor, and casework tolerances in the most visible work.
failure_modes:
  - name: Cabinet installation starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      cabinet installation is settled.
    signal: >-
      The cabinet installation work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Cabinet installation closes without evidence
    cost: >-
      A concealed condition or required result from cabinet installation
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Cabinet installation is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Cabinet installation is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Cabinet installation starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Cabinet installation uses field evidence, production variance, defects,
      and closeout results to improve the next estimate, work package, and
      control point.
competencies:
  - name: Field fitting and finish tolerance control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of cabinet installation.
  - name: Evidence control
    note: >-
      Acceptance checks for cabinet installation have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Cabinet installation can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting cabinet installation remain
    human.
questions:
  - >-
    Which unresolved condition can stop cabinet installation before work
    begins?
  - >-
    Which record proves cabinet installation was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The cabinet installation process is how a finish carpentry
    contractor sets and fastens kitchen, bath, and built-in casework so
    that it is level, plumb, tight to the structure, and ready for
    counters and finish. It starts when the space is conditioned, field
    dimensions are verified against the construction plan, and the
    cabinets are on site and dry, and it ends when the cases are hung
    and joined, fronts are adjusted, surfaces are protected, and a punch
    list records what remains. The finish carpentry lead owns it, with
    the general contractor responsible for the conditions the cabinets
    need.
  why: >
    Cabinets are where every earlier tolerance shows. Framing out of
    plumb, drywall out of flat, and a floor out of level all arrive at
    the most visible work in the house, and a cabinet run fastened to a
    bowed wall or set on the high point will never have straight reveals
    or doors that close. Cases hung into missing backing pull loose.
    Cabinets set in an unconditioned space move as the wood dries.
    Without the process, the crew shims by eye, the counter template is
    off, and the punch list becomes a dispute about whose tolerance the
    carpenter was supposed to absorb.
  how: >
    The lead reads the current construction plan and revisions and
    confirms that the space is stable and conditioned, that field
    dimensions have been verified, that the material is dry, that
    profiles and samples are approved, that backing is complete, and
    that access is protected. The field controls are then set: the level
    line and high point, the layout from the plan, the fastening
    schedule to structure, the sequence of uppers and bases, the method
    for joining cases, the reveal and scribe standard, and the
    protection for finished surfaces. During installation the crew
    records field dimensions, shim locations, fastener locations, and
    any service or backing that differs from the plan, and stops when a
    wall, floor, or opening is out of tolerance for the method. At
    acceptance the lead checks fit, reveal, joints, door and drawer
    operation, fastening, surface condition, alignment, hardware, and
    finish readiness, closes what can be closed, and issues the punch
    list.
  controls:
    - name: Field dimensions verified against the plan
      note: Walls, openings, and services are measured on site and compared to the plan before cabinets are ordered or set.
    - name: Level line established and recorded
      note: A level reference and the high point of the floor are marked and written down before the first base is set.
    - name: Fastening to structure confirmed
      note: Each fastener into a stud or backing is confirmed, and a case over missing backing is held until backing is added.
    - name: Reveals and operation checked per run
      note: Reveals, door and drawer alignment, and operation are checked at the end of each run before surfaces are protected.
    - name: Punch list issued with owner and date
      note: Remaining items are listed with a responsible party and a date before the lead leaves the job.
