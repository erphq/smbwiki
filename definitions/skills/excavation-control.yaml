id: excavation-control
name: Excavation control
kind: skill
department: operations
summary: >-
  Sets limits and depth, selects slope or support, controls access and spoil,
  manages water, verifies bearing, and records changed material. Excavation
  control leaves a current work basis, a field record, and acceptance evidence
  that another operator can trace.
inputs:
  - site-plan
outputs:
  - daily-report
steps:
  - name: Confirm the work basis
    note: >-
      Before excavation control, read the current scope and revisions, then
      verify survey control, utility information, permits, erosion controls,
      equipment access, haul route, soil direction, and weather plan.
  - name: Set the field controls
    note: >-
      Translate excavation control into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During excavation control, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept excavation control, check the completed work against specified
      limits, safe slopes and support, approved grades, drainage, compaction,
      stabilized access, and recorded quantities, then close correction and
      issue the resulting record.
tension: >-
  Excavation control has to remain inside its acceptance basis while
  production moves. Unverified utilities, unsuitable soils, water, or lost
  control can turn planned earthwork into damage and repeated handling.
failure_modes:
  - name: Excavation control starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      excavation control is settled.
    signal: >-
      The excavation control work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Excavation control closes without evidence
    cost: >-
      A concealed condition or required result from excavation control cannot
      be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Excavation control is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Excavation control is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Excavation control starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Excavation control uses field evidence, production variance, defects,
      and closeout results to improve the next estimate, work package, and
      control point.
competencies:
  - name: Earthwork control and site logistics
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of excavation control.
  - name: Evidence control
    note: >-
      Acceptance checks for excavation control have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Excavation control can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting excavation control remain
    human.
questions:
  - Which unresolved condition can stop excavation control before work begins?
  - >-
    Which record proves excavation control was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The excavation control process governs how a site preparation crew takes
    ground down to a designed limit: the foreman sets the limits and depth
    from the site plan, chooses slope or shoring, controls where equipment
    enters and spoil goes, manages water, verifies the bearing surface, and
    records any material that differs from the soil report. It starts when
    the site plan, utility locates, and permits are in hand and ends with
    the excavation accepted at grade and a daily report that records
    quantities and conditions. A site preparation contractor's foreman owns
    it under the project manager.
  why: >
    Excavation is where the unknowns in the ground become the contractor's
    cost. A utility strike from unverified locates stops the job and can
    injure the operator. An unsupported trench wall collapses on a worker.
    Unsuitable soil left under a footing becomes a settlement claim years
    later. Water left unmanaged turns the subgrade to mud and the crew
    handles the same material twice. Quantities left unrecorded cannot be
    billed for and cannot be defended when the owner disputes the
    changed-material claim.
  how: >
    The foreman reads the site plan and revisions and confirms survey
    control, utility information, permits, erosion controls, equipment
    access, the haul route, where soil is going, and the weather plan. Field
    controls set the excavation limits and target depths on the ground, the
    slope or support method for each depth, the entry and spoil locations,
    the dewatering approach, and the hold point where bearing is verified
    before the next trade proceeds. As the work runs the foreman records
    quantities moved, observations of the exposed material, decisions on
    support and water, and stops when the material or a utility differs from
    the plan. Acceptance checks limits, safe slopes or support, approved
    grades, drainage, compaction, stabilized access, and recorded
    quantities, and the daily report is issued.
  controls:
    - name: Utility locates verified before digging
      note: Locate marks and the ticket are checked in the field and recorded before the first bucket, with hand digging near marked lines.
    - name: Slope or support decided per depth
      note: The protective system for each excavation depth is chosen from the soil condition and recorded before workers enter.
    - name: Bearing verified at a hold point
      note: The exposed subgrade is inspected and, where required, tested before footings or fill proceed, and the result is on the report.
    - name: Changed material recorded the day found
      note: Soil that differs from the report is described, located, and photographed on the daily report before it is removed.
    - name: Daily report with quantities and conditions
      note: Each day closes with cut and haul quantities, water, weather, and any stop recorded for the project record.
