id: aggregate-base-placement
name: Aggregate base placement
kind: skill
department: operations
summary: >-
  Controls source, lift thickness, moisture, spreading, grade, edge
  confinement, compaction pattern, and density testing. Aggregate base
  placement leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - site-plan
outputs:
  - test-report
steps:
  - name: Confirm the work basis
    note: >-
      Before aggregate base placement, read the current scope and revisions,
      then verify approved limits and drainage, removed failed material,
      stable subgrade, confirmed section, available mix, weather window, and
      traffic control.
  - name: Set the field controls
    note: >-
      Translate aggregate base placement into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During aggregate base placement, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept aggregate base placement, check the completed work against
      specified thickness, density, grade, smoothness, drainage, joint
      quality, edge support, markings, and opening strength, then close
      correction and issue the resulting record.
tension: >-
  Aggregate base placement has to remain inside its acceptance basis while
  production moves. Surface appearance can hide weak subgrade, thin base, poor
  compaction, or trapped drainage that shortens pavement life.
failure_modes:
  - name: Aggregate base placement starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      aggregate base placement is settled.
    signal: >-
      The aggregate base placement work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Aggregate base placement closes without evidence
    cost: >-
      A concealed condition or required result from aggregate base placement
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Aggregate base placement is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Aggregate base placement is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Aggregate base placement starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Aggregate base placement uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Small-site pavement production
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of aggregate base placement.
  - name: Evidence control
    note: >-
      Acceptance checks for aggregate base placement have to be captured while
      the relevant condition can still be observed and corrected.
automation:
  now: >-
    Aggregate base placement can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting aggregate base placement
    remain human.
questions:
  - >-
    Which unresolved condition can stop aggregate base placement before work
    begins?
  - >-
    Which record proves aggregate base placement was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The aggregate base placement process is how a driveway paving
    contractor builds the compacted stone layer that carries the
    pavement above it. It starts when the site plan fixes the limits,
    section, and drainage for the driveway or lot, after failed material
    has been removed and the subgrade has been proofed, and it ends when
    the base has been placed in lifts, compacted to the specified
    density, and accepted on a test report that the asphalt crew can
    rely on. The paving foreman owns it, with the grade checker and the
    compaction operator working to his sequence.
  why: >
    Base is the layer nobody sees once the asphalt goes down, so a
    defect here is paid for years later as cracking, rutting, and
    pumping at the edges. Thin lifts placed on a wet subgrade, base
    placed dry and never brought to moisture, a roller pattern that
    misses the edges, and stone from an unapproved source all pass a
    visual check and fail in service. Without a work basis and a test
    report, the contractor cannot show the owner what was placed, cannot
    defend a warranty claim, and cannot tell the next crew what is under
    the surface.
  how: >
    Before placement the foreman reads the current site plan and
    revisions and confirms the approved limits and drainage, that failed
    material is out, that the subgrade is stable, that the section
    thickness is confirmed, that the aggregate source is available, that
    the weather window holds, and that traffic control is in place. He
    then sets the field controls: lift thickness, target moisture,
    spreading method, edge confinement, roller pattern, and the hold
    point for density testing, written where the crew can use them.
    During placement the crew records quantities delivered, lift depths,
    moisture adjustments, and any concealed condition, and stops if the
    subgrade or drainage differs from the plan. At acceptance the base
    is checked against thickness, density, grade, smoothness, and
    drainage, corrections are closed, and the test report is issued.
  controls:
    - name: Approved source and gradation ticket
      note: Every load carries a ticket from the approved pit, and a load from another source is rejected at the gate before it is spread.
    - name: Lift thickness check per lift
      note: Depth is measured against the specified maximum lift before compaction begins, and an overthick lift is bladed down before the roller runs.
    - name: Density test at the hold point
      note: A density test is taken at the agreed frequency and location, and the next lift or the asphalt does not go down until it passes.
    - name: Grade and drainage verification
      note: Finished base grade is shot against the plan and the flow path is confirmed before the surface is covered.
    - name: Test report issued before paving
      note: The test report with quantities, tests, and corrections is closed and filed before the asphalt crew is scheduled.
