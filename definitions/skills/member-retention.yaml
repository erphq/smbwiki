id: member-retention
name: Member retention
kind: skill
department: sales
summary: >
  Member retention watches for loss of use or service friction, resolves
  problems within the agreement, and processes cancellation requests to
  a confirmed end state. The work distinguishes a recoverable experience
  from a member's clear decision to leave.
inputs: [attendance-log, cancellation-request]
outputs: [cancellation-record]
steps:
  - name: Find meaningful risk
    role: membership-advisor
    consumes: [attendance-log]
    note: >
      Visit change, unresolved service issues, failed access, and account
      contact provide context beyond a low-use flag.
  - name: Resolve the service issue
    role: membership-advisor
    note: >
      The advisor owns a specific access, billing, class, equipment, or
      facility problem through closure.
  - name: Receive the cancellation
    role: membership-advisor
    consumes: [cancellation-request]
    note: >
      Request date, requested end, agreement terms, reason, and preferred
      confirmation route are recorded once.
  - name: Complete and confirm
    role: membership-advisor
    produces: [cancellation-record]
    note: >
      Billing end, access end, final amount, refund or credit, and
      confirmation use the same effective date.
tension: >
  Relationship recovery competes with respecting a clear exit decision.
  A useful intervention can save a member whose experience failed;
  obstructing cancellation turns a service problem into a trust problem.
failure_modes:
  - name: Low use treated as consent to contact
    cost: >
      Members receive generic pressure that ignores injury, travel,
      preference, or privacy.
    signal: >
      Outreach begins from attendance alone with no service context or
      contact rule.
  - name: Cancellation remains pending
    cost: >
      Charges and access continue beyond the expected end and create a
      dispute.
    signal: >
      Requests have intake dates but no owner, effective date, or
      confirmation.
  - name: Save offer hides the original failure
    cost: >
      A discount delays departure while the unresolved access, billing,
      cleanliness, class, or equipment issue persists.
    signal: >
      Retention notes record offer acceptance and omit issue closure.
maturity:
  - level: run badly
    looks_like: >
      Retention means calling inactive members and routing cancellation
      through a slow exception process.
  - level: run well
    looks_like: >
      Service issues have owners and cancellation requests close with
      aligned billing, access, and confirmation dates.
  - level: run excellently
    looks_like: >
      Reasons change operations, outreach reflects member context, and
      the business can explain both recovered relationships and clean
      exits.
competencies:
  - name: Service recovery
    note: >
      The advisor identifies the specific failed promise and coordinates
      the person who can correct it.
  - name: Boundary judgment
    note: >
      The operator recognizes the point where further persuasion harms
      the relationship and completes the requested exit.
automation:
  now: >
    Usage-change signals, service-case routing, cancellation intake,
    agreement-rule calculation, effective-date synchronization, and
    confirmation.
  human: >
    Sensitive outreach, complaint understanding, recovery decisions,
    exceptions, and recognition of an unambiguous decision to leave.
questions:
  - Which open cancellation request still lacks a confirmed end date?
  - What recurring service failure appears in recent cancellation reasons?
article:
  what: >
    The member retention process is how a gym notices a member whose use
    has dropped or whose experience has broken, fixes what can be fixed
    inside the agreement, and takes a cancellation request through to a
    confirmed end date when the member has decided to leave. It starts
    from the attendance log and the service desk, and it ends with either
    a resolved issue or a cancellation record that billing, access, and
    the member all agree on. A membership advisor owns it in a gym; in a
    small studio the owner does it between classes.
  why: >
    It protects two things that are easy to confuse: the recurring
    revenue of a member who could have been kept, and the reputation of
    the business with a member who has made up their mind. A gym that
    reads low attendance as permission to call pushes generic offers at
    people who are injured, travelling, or simply private. A gym that
    leaves a cancellation request pending keeps charging and keeps the
    door open past the date the member expected, and that dispute costs
    more than the lost dues. Between those sits the failure where a
    discount is accepted and the broken shower, the failed key fob, or
    the cancelled class is never fixed.
  how: >
    The membership advisor reviews the attendance log against service
    context: a visit drop paired with an open equipment complaint, a
    failed access event, or a billing note is a risk worth a contact,
    while a visit drop alone is not. Where a specific access, billing,
    class, equipment, or facility problem is found, the advisor owns it
    through closure and confirms with the member that it is fixed. When
    a cancellation request arrives, the advisor records the request
    date, the requested end, the governing agreement terms, the stated
    reason, and how the member wants confirmation, once. The advisor
    then completes the exit: billing end, access end, final amount, any
    refund or credit, and the written confirmation all carry the same
    effective date, and the cancellation record is filed against the
    account.
  controls:
    - name: Contact rule before outreach
      note: A member is contacted about low use only when the attendance log is paired with a service event, access failure, or account note that gives the call a reason.
    - name: Service issue has a named owner
      note: Every access, billing, class, equipment, or facility complaint raised in a retention contact is logged with one owner and stays open until the member confirms it is fixed.
    - name: Cancellation request logged on receipt
      note: Request date, requested end date, agreement terms, and reason are recorded the day the request arrives, so the pending queue shows age and owner.
    - name: One effective date across systems
      note: Billing end, access end, final charge, and the member's confirmation are checked against each other before the cancellation record is closed.
    - name: Reasons reviewed for patterns
      note: Cancellation reasons are read together on a regular cycle so a repeated facility or class failure reaches operations instead of staying in individual notes.
