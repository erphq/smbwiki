id: concrete-placement
name: Concrete placement
kind: skill
department: operations
summary: >-
  Coordinates mix arrival, testing, pump or chute access, lift sequence,
  consolidation, joints, weather response, and placement records. Concrete
  placement leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - test-report
steps:
  - name: Confirm the work basis
    note: >-
      Before concrete placement, read the current scope and revisions, then
      verify surveyed layout, excavation acceptance, form dimensions, embeds,
      reinforcement, mix information, access, and weather controls.
  - name: Set the field controls
    note: >-
      Translate concrete placement into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During concrete placement, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept concrete placement, check the completed work against specified
      geometry, cover, placement record, finish, curing, and required concrete
      test results, then close correction and issue the resulting record.
tension: >-
  Concrete placement has to remain inside its acceptance basis while
  production moves. Concrete fixes its location and many concealed details at
  placement, so an unchecked condition becomes demolition or structural
  repair.
failure_modes:
  - name: Concrete placement starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      concrete placement is settled.
    signal: >-
      The concrete placement work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Concrete placement closes without evidence
    cost: >-
      A concealed condition or required result from concrete placement cannot
      be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Concrete placement is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Concrete placement is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Concrete placement starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Concrete placement uses field evidence, production variance, defects,
      and closeout results to improve the next estimate, work package, and
      control point.
competencies:
  - name: Concrete production control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of concrete placement.
  - name: Evidence control
    note: >-
      Acceptance checks for concrete placement have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Concrete placement can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting concrete placement remain
    human.
questions:
  - Which unresolved condition can stop concrete placement before work begins?
  - >-
    Which record proves concrete placement was accepted before it was covered,
    loaded, energized, occupied, or handed over?
article:
  what: >
    The concrete placement process runs the pour itself: mix arrival
    timed to the crew, testing at the truck, pump or chute access
    confirmed, lifts placed in sequence, consolidation, joints located
    as planned, weather response ready, and a placement record that ties
    every load to where it went. It starts when the formwork,
    reinforcement, and embeds are accepted and ends when the last load
    is placed and recorded ahead of finishing and curing. A poured
    concrete contractor owns it through the foreman, with the
    superintendent releasing the pour.
  why: >
    It protects work that cannot be corrected once the concrete sets. A
    pour that starts before reinforcement or embeds are checked buries
    the mistake permanently. A load accepted without a slump or air test
    can be the one that fails the break. Poor consolidation leaves voids
    at the face; a cold joint from a late truck lands where the design
    never allowed one. Any of these becomes demolition or structural
    repair, and the placement record is the only way to show what was
    done.
  how: >
    The foreman confirms the work basis by reading the current scope and
    revisions on the construction plan and verifying surveyed layout,
    excavation acceptance, form dimensions, embeds, reinforcement, mix
    information, access, and weather controls. Field controls set the
    lift sequence, truck spacing, pump or chute positions, testing
    frequency, joint locations, weather response, hold points, and the
    placement records the crew keeps. During the pour the operator
    records each load, its test results, placement location,
    consolidation, joints, observations, decisions, and concealed
    details, and stops when a truck delay, rejected load, or weather
    change alters the planned method. Acceptance checks the completed
    work against specified geometry, cover, placement record, finish,
    curing, and required concrete test results, and the test report is
    issued once correction closes.
  controls:
    - name: Pre-pour inspection signed before release
      note: >
        Forms, reinforcement, cover, and embeds are inspected and
        signed off on the checklist before the first truck is
        called.
    - name: Load testing and rejection recorded
      note: >
        Slump, air, temperature, and cylinder samples are taken at
        the specified frequency, and any rejected load is logged
        with the reason.
    - name: Placement record by load and location
      note: >
        Each ticket is matched to the area and lift it was placed
        in, so a low test result can be traced to its location.
    - name: Cold-joint and weather response ready
      note: >
        A planned response for truck delay, rain, heat, or cold is
        set before the pour and its use is recorded.
