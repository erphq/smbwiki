id: interior-design-firm
name: Interior Design Firm
codes:
  naics: '541410'
catalog_group: construction-property
extends: professional-services-base
summary: >-
  An interior design firm converts occupant needs, measured space, codes,
  circulation, building systems, furniture, materials, budget, and schedule
  into a coordinated interior. Programming and space planning precede
  selections, drawings, specifications, procurement, installation, and
  correction of site conflicts.


  Design decisions have linked effects. A finish can change substrate, lead
  time, maintenance, fire performance, lighting, price, and installation
  sequence. The firm records approvals and revisions, coordinates consultants
  and vendors, reviews field conditions, and manages samples and substitutions
  so the installed result retains the accepted design intent.
