id: homeowner-handover
name: Homeowner handover
kind: skill
department: operations
summary: >-
  Closes inspection, punch work, operating instruction, keys, warranties,
  finish care, open commitments, and final acceptance with the buyer.
  Homeowner handover leaves a current work basis, a field record, and
  acceptance evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - closeout-package
steps:
  - name: Confirm the work basis
    note: >-
      Before homeowner handover, read the current scope and revisions, then
      verify approved plans, lot controls, selections, permits, trade scopes,
      and long-lead dates.
  - name: Set the field controls
    note: >-
      Translate homeowner handover into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During homeowner handover, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept homeowner handover, check the completed work against the
      approved plan, inspection record, owner selections, and turnover
      requirements, then close correction and issue the resulting record.
tension: >-
  Homeowner handover has to remain inside its acceptance basis while
  production moves. A missed dependency can idle several trades and move the
  promised completion date.
failure_modes:
  - name: Homeowner handover starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      homeowner handover is settled.
    signal: >-
      The homeowner handover work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Homeowner handover closes without evidence
    cost: >-
      A concealed condition or required result from homeowner handover cannot
      be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Homeowner handover is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Homeowner handover is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Homeowner handover starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Homeowner handover uses field evidence, production variance, defects,
      and closeout results to improve the next estimate, work package, and
      control point.
competencies:
  - name: Residential construction sequencing
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of homeowner handover.
  - name: Evidence control
    note: >-
      Acceptance checks for homeowner handover have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Homeowner handover can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting homeowner handover remain
    human.
questions:
  - Which unresolved condition can stop homeowner handover before work begins?
  - >-
    Which record proves homeowner handover was accepted before it was covered,
    loaded, energized, occupied, or handed over?
