id: tile-substrate-preparation
name: Tile substrate preparation
kind: skill
department: operations
summary: >-
  Measures flatness and slope, repairs cracks and voids, cleans contaminants,
  primes where required, and verifies cure before setting. Tile substrate
  preparation leaves a current work basis, a field record, and acceptance
  evidence that another operator can trace.
inputs:
  - construction-plan
outputs:
  - quality-report
steps:
  - name: Confirm the work basis
    note: >-
      Before tile substrate preparation, read the current scope and revisions,
      then verify stable and flat substrate, cured work, approved tile and
      setting system, resolved movement joints, dry layout, and environmental
      control.
  - name: Set the field controls
    note: >-
      Translate tile substrate preparation into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During tile substrate preparation, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept tile substrate preparation, check the completed work against
      bond coverage, plane, joint alignment, movement accommodation, drainage,
      lippage, grout, sealant, and approved appearance, then close correction
      and issue the resulting record.
tension: >-
  Tile substrate preparation has to remain inside its acceptance basis while
  production moves. A visually acceptable surface can conceal poor bond,
  trapped water, or missing movement capacity.
failure_modes:
  - name: Tile substrate preparation starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for tile
      substrate preparation is settled.
    signal: >-
      The tile substrate preparation work package still has an open drawing,
      access, material, predecessor, or approval dependency when labor is
      assigned.
  - name: Tile substrate preparation closes without evidence
    cost: >-
      A concealed condition or required result from tile substrate preparation
      cannot be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Tile substrate preparation is released while its required check,
      location record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Tile substrate preparation is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Tile substrate preparation starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Tile substrate preparation uses field evidence, production variance,
      defects, and closeout results to improve the next estimate, work
      package, and control point.
competencies:
  - name: Tile assembly layout and bond control
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of tile substrate preparation.
  - name: Evidence control
    note: >-
      Acceptance checks for tile substrate preparation have to be captured
      while the relevant condition can still be observed and corrected.
automation:
  now: >-
    Tile substrate preparation can use digital revisions, checklists, hold
    points, photo capture, test fields, correction assignment, and closeout
    status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting tile substrate preparation
    remain human.
questions:
  - >-
    Which unresolved condition can stop tile substrate preparation before work
    begins?
  - >-
    Which record proves tile substrate preparation was accepted before it was
    covered, loaded, energized, occupied, or handed over?
article:
  what: >
    The tile substrate preparation process is what a tile contractor does to a
    floor or wall before it will hold tile: flatness and slope are measured,
    cracks and voids are repaired, contaminants such as paint, curing
    compound, and old adhesive are removed, primer is applied where the
    setting system requires it, and cure of the substrate and any patching is
    verified. It starts when the space is turned over to the tile contractor
    and ends with a quality report that accepts the substrate for layout and
    setting. The lead setter or a preparation crew owns it, and the estimator
    is involved when the substrate condition changes the price.
  why: >
    Tile does not fix a substrate; it inherits it. A floor out of flatness
    tolerance produces lippage that no setter can hide. An unrepaired crack
    telegraphs through the tile, a contaminated slab breaks bond, an uncured
    patch shrinks under the mortar, and a shower floor with the wrong slope
    holds water at the far corner. Every one of these appears after the tile
    is set, when correction means removal. The preparation record is also the
    evidence that the contractor found and reported a substrate condition
    instead of setting over it.
  how: >
    The lead setter confirms the work basis from the current scope and
    revisions and verifies which conditions the substrate has to meet:
    stability and flatness, cured work, compatibility with the approved tile
    and setting system, resolved movement joints, the planned dry layout, and
    environmental control in the space. Field controls are then set: the
    flatness and slope tolerances for the tile size, the repair materials and
    their cure times, the sequence of areas, who measures and who repairs, and
    the hold point before priming. During preparation the operator records
    measurements, repairs, contaminants removed, primer applied, moisture and
    cure results, and any concealed condition found, and stops when the
    substrate differs from the plan. Acceptance checks that the substrate will
    support bond coverage, plane, joint alignment, movement accommodation,
    drainage, and lippage limits, corrections are closed, and the quality
    report releases the substrate to layout.
  controls:
    - name: Flatness and slope measured and recorded
      note: Straightedge and slope readings are taken across each area and written on the record before any repair, so the required correction is known.
    - name: Substrate condition reported before work
      note: Cracks, voids, contamination, and moisture found during preparation are reported to the general contractor or customer with photos before repair changes the evidence.
    - name: Repair material and cure logged
      note: Every patch, leveler, or crack treatment is recorded with product, area, date, and the cure time before setting is allowed.
    - name: Primer and compatibility confirmed
      note: The primer and the setting system are confirmed compatible with the substrate on the record before priming, and the primed areas are listed.
    - name: Substrate accepted before layout
      note: The prepared substrate is inspected against the tolerances and released on the quality report before the layout crew snaps a line.
