id: compaction-control
name: Compaction control
kind: skill
department: operations
summary: >-
  Confirms material and moisture, controls lift thickness and equipment
  passes, coordinates testing, maps failures, and retests corrected areas.
  Compaction control leaves a current work basis, a field record, and
  acceptance evidence that another operator can trace.
inputs:
  - site-plan
outputs:
  - daily-report
steps:
  - name: Confirm the work basis
    note: >-
      Before compaction control, read the current scope and revisions, then
      verify survey control, utility information, permits, erosion controls,
      equipment access, haul route, soil direction, and weather plan.
  - name: Set the field controls
    note: >-
      Translate compaction control into work limits, sequence,
      responsibilities, hold points, and records the crew can use.
  - name: Perform and record the work
    note: >-
      During compaction control, the operator records quantities,
      observations, decisions, and concealed details, and stops when the field
      condition changes the planned method.
  - name: Verify acceptance
    note: >-
      To accept compaction control, check the completed work against specified
      limits, safe slopes and support, approved grades, drainage, compaction,
      stabilized access, and recorded quantities, then close correction and
      issue the resulting record.
tension: >-
  Compaction control has to remain inside its acceptance basis while
  production moves. Unverified utilities, unsuitable soils, water, or lost
  control can turn planned earthwork into damage and repeated handling.
failure_modes:
  - name: Compaction control starts before readiness
    cost: >-
      The crew commits labor and material before a condition needed for
      compaction control is settled.
    signal: >-
      The compaction control work package still has an open drawing, access,
      material, predecessor, or approval dependency when labor is assigned.
  - name: Compaction control closes without evidence
    cost: >-
      A concealed condition or required result from compaction control cannot
      be verified without opening, repeat work, delay, or a disputed
      exception.
    signal: >-
      Compaction control is released while its required check, location
      record, test result, or correction status remains blank.
maturity:
  - level: run badly
    looks_like: >-
      Compaction control is driven by crew availability and visible
      completion; readiness, hold points, and acceptance evidence are resolved
      afterward.
  - level: run well
    looks_like: >-
      Compaction control starts from a checked basis, follows a named
      sequence, stops on changed conditions, and closes against recorded
      acceptance criteria.
  - level: run excellently
    looks_like: >-
      Compaction control uses field evidence, production variance, defects,
      and closeout results to improve the next estimate, work package, and
      control point.
competencies:
  - name: Earthwork control and site logistics
    note: >-
      The operator has to recognize which field conditions change the planned
      method, sequence, or acceptance of compaction control.
  - name: Evidence control
    note: >-
      Acceptance checks for compaction control have to be captured while the
      relevant condition can still be observed and corrected.
automation:
  now: >-
    Compaction control can use digital revisions, checklists, hold points,
    photo capture, test fields, correction assignment, and closeout status.
  human: >-
    Field interpretation, safe sequence, changed-condition response,
    workmanship, and responsibility for accepting compaction control remain
    human.
questions:
  - Which unresolved condition can stop compaction control before work begins?
  - >-
    Which record proves compaction control was accepted before it was covered,
    loaded, energized, occupied, or handed over?
